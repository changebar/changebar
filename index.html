<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

      </div>
      <p id="alert-message" class="text-xl font-semibold text-gray-800 mb-2">訊息</p>
    </div>
    <button id="alert-ok-btn" class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold transition-colors">確定 (Enter)</button>

</div>

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { 
  products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], 
  vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], 
  emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[]
};
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let isSaving = false;

const COLOR_NAMES = {
  '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色',
  '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色'
};

// 手機版側邊欄切換
window.toggleSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('hidden');
};

// 顯示 Alert (置中 + Enter 關閉)
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const btn = document.getElementById('alert-ok-btn');
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      btn.removeEventListener('click', handler);
      document.removeEventListener('keydown', keyHandler);
      r(); 
    };
    const keyHandler = (e) => { if (e.key === 'Enter') handler(); };
    btn.addEventListener('click', handler);
    document.addEventListener('keydown', keyHandler);
  });
}

// 開啟 Modal (置中 + 防呆 + Enter儲存/Esc關閉)
function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  // 重置防呆狀態
  isSaving = false;
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存 (Enter)';

  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    // 確保不會重複綁定
    saveBtn.onclick = null;
    saveBtn.onclick = async () => {
      if(isSaving) return; // 防呆：防止重複點擊
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { 
        await onSave(); 
      } catch(e) {
        // 錯誤已在 onSave 內部處理
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  const closeModal = () => {
    document.getElementById('modal-overlay').classList.add('hidden');
    editingId = null;
    isSaving = false;
    saveBtn.disabled = false;
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.onclick = null; // 清除事件
    document.removeEventListener('keydown', enterHandler);
    document.removeEventListener('keydown', escHandler);
  };
  
  // 定義 closeModal 為全域函數
  window.closeModal = closeModal;
  
  cancelBtn.onclick = closeModal;
  closeBtn.onclick = closeModal;
  
  // 快捷鍵處理
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', escHandler);
  
  if(!hideSave) {
    const enterHandler = (e) => {
      // 只有當焦點不在 textarea 或 input 時，Enter 才觸發儲存
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        saveBtn.click();
      }
    };
    document.addEventListener('keydown', enterHandler);
  }
}

// 登入登出
document.getElementById('login-btn').addEventListener('click', () => {
  sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => switchView('boss')); 
    }
  });
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
    if(window.innerWidth <= 768) toggleSidebar(); // 手機版點擊後自動收起
  });
});

// 載入所有資料
async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    expCats:'expense_categories', orders:'orders', purchases:'purchases', 
    warehouseInv:'warehouse_inventory', customerTags:'customer_tags'
  };
  await Promise.all(Object.keys(map).map(k => sb.from(map[k]).select('*').then(r => D[k] = r.data || [])));
}

// 切換視圖
function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

// 渲染視圖
function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}
// ==================== 老闆查閱（含員工代墊統計）====================
function renderBoss(c) {
  const [y, m] = bossMonth.split('-').map(Number);
  const monthOrders = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const rev = monthOrders.reduce((s,o)=>s+(o.total_amount||0),0);
  const monthPurchases = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const pur = monthPurchases.reduce((s,p)=>s+(p.total_amount||0),0);
  const monthExpenses = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const exp = monthExpenses.reduce((s,e)=>s+(e.amount||0),0);
  const monthSubs = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const sub = monthSubs.reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;
  const profitMargin = rev > 0 ? ((monthlyProfit / rev) * 100).toFixed(1) : 0;
  
  // 訂閱客戶計算
  const subTag = D.tags.find(t => t.name.includes('訂閱'));
  let subCustomerCount = 0;
  if(subTag) {
    const subTagIds = (D.customerTags || []).filter(ct => ct.tag_id === subTag.id).map(ct => ct.customer_id);
    subCustomerCount = new Set(subTagIds).size;
  }

  // 訂閱月營收換算
  let subMonthlyRevenue = 0;
  monthOrders.filter(o => o.is_subscription && o.subscription_days > 0).forEach(o => {
    const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
    subMonthlyRevenue += dailyRevenue * 30;
  });

  // 運費統計
  const companyShipping = monthOrders.reduce((s, o) => s + (o.absorbed_shipping_fee || 0), 0);
  const customerShipping = monthOrders.reduce((s, o) => s + (o.customer_paid_shipping || 0), 0);

  // 員工代墊未結帳統計
  const unreimbursedExpenses = D.expenses.filter(e => e.employee_id && !e.is_reimbursed);
  const unreimbursedTotal = unreimbursedExpenses.reduce((s, e) => s + (e.amount || 0), 0);
  const unreimbursedByEmp = {};
  unreimbursedExpenses.forEach(e => {
    const emp = D.emps.find(x => x.id === e.employee_id);
    if(emp) unreimbursedByEmp[emp.name] = (unreimbursedByEmp[emp.name] || 0) + (e.amount || 0);
  });

  // 即將到期訂閱
  const now = new Date();
  const thirtyDaysLater = new Date(now.getTime() + 30*24*60*60*1000);
  const expiringSubs = D.subs.filter(s => {
    if(!s.end_date || s.is_active===false) return false;
    const d = new Date(s.end_date);
    return d >= now && d <= thirtyDaysLater;
  }).sort((a,b) => new Date(a.end_date) - new Date(b.end_date));

  c.innerHTML = `
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <h1 class="text-3xl font-bold">👑 老闆查閱</h1>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow flex-1 md:flex-none">
        <button onclick="openDownloadModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold whitespace-nowrap btn-touch">📥 下載報表</button>
      </div>
    </div>
    
    ${expiringSubs.length > 0 ? `
    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-lg shadow mb-8">
      <h3 class="text-lg font-bold text-yellow-800 mb-2">️ 即將到期的系統訂閱（30天內）</h3>
      <ul class="list-disc list-inside text-yellow-700">
        ${expiringSubs.map(s => {
          const daysLeft = Math.ceil((new Date(s.end_date) - now) / (1000*60*60*24));
          return `<li><b>${s.name}</b> - ${s.provider || '-'} (剩餘 ${daysLeft} 天，到期：${s.end_date}, 金額：$${(s.amount||0).toLocaleString()})</li>`;
        }).join('')}
      </ul>
    </div>
    ` : '<div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg shadow mb-8"><p class="text-green-800 font-bold">✅ 目前無即將到期的系統訂閱</p></div>'}
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月業績</p>
        <p class="text-3xl font-bold mt-2">$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">訂單數：${monthOrders.length} 單</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月採購</p>
        <p class="text-3xl font-bold mt-2">$${pur.toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月開銷(含訂閱)</p>
        <p class="text-3xl font-bold mt-2">$${(exp+sub).toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月淨利</p>
        <p class="text-3xl font-bold mt-2">$${monthlyProfit.toLocaleString()}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">🔄 訂閱業務分析</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <span class="text-gray-600">訂閱客戶總數</span>
            <span class="text-2xl font-bold text-indigo-600">${subCustomerCount} 位</span>
          </div>
          <div class="flex justify-between items-center border-b pb-2">
            <span class="text-gray-600">本月訂閱訂單換算月營收</span>
            <span class="text-2xl font-bold text-indigo-600">$${Math.round(subMonthlyRevenue).toLocaleString()}</span>
          </div>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-orange-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">🚚 運費與員工代墊</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <span class="text-gray-600">公司吸收運費</span>
            <span class="text-xl font-bold text-red-600">$${companyShipping.toLocaleString()}</span>

function toggleAddr(sel) {
  const div = sel.closest('.border');
  const isCvs = sel.value === 'cvs_711' || sel.value === 'cvs_family';
  if(div.querySelector('.a-street')) div.querySelector('.a-street').style.display = isCvs ? 'none' : 'block';
  if(div.querySelector('.a-cvs')) div.querySelector('.a-cvs').style.display = isCvs ? 'grid' : 'none';
}

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const isSub = document.getElementById('c-is-sub').checked;
  const subDays = isSub ? parseInt(document.getElementById('c-sub-days').value) : null;
  
  const data = {
    type: document.getElementById('c-type').value, 
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value, 
    phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null,
    invoice_title: document.getElementById('c-title').value||null,
    tax_id: document.getElementById('c-tax').value||null,
    email: document.getElementById('c-email').value||null,
    is_subscription: isSub,
    subscription_days: subDays
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  
  try {
    let cid = id;
    if(id) {
      const {error} = await sb.from('customers').update(data).eq('id',id);
      if(error) throw error;
    } else {
      const {data:inserted, error} = await sb.from('customers').insert([data]).select().single();
      if(error) throw error;
      cid = inserted.id;
    }
    
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ 
        customer_id:cid, 
        address_type:d.querySelector('.a-type').value, 
        recipient_name:d.querySelector('.a-recv').value, 
        recipient_phone:d.querySelector('.a-phone').value, 
        street:d.querySelector('.a-addr')?.value||'', 
        cvs_store_name:d.querySelector('.a-cvsname')?.value||'', 
        store_name:d.querySelector('.a-cvsname')?.value||'', 
        cvs_store_address:d.querySelector('.a-cvsaddr')?.value||'', 
        is_default:d.querySelector('.a-def').checked 
      });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    
    showAlert('客戶已儲存！'); 
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

function delCust(id) {
  if(!confirm('確定刪除？')) return;
  sb.from('customer_addresses').delete().eq('customer_id',id).then(() => {
    return sb.from('customer_tags').delete().eq('customer_id',id);
  }).then(() => {
    return sb.from('customers').delete().eq('id',id);
  }).then(() => {
    loadAll().then(render);
  }).catch(e => showAlert('刪除失敗：'+e.message));
}

function delWin(id) {

function manageTags() {
  const html = `<div class="flex gap-2 mb-4"><input type="text" id="t-name" placeholder="標籤名稱" class="flex-1 px-3 py-2 border rounded"><select id="t-color" class="px-3 py-2 border rounded">${Object.entries(COLOR_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button onclick="addTag()" class="px-4 py-2 bg-blue-600 text-white rounded">新增</button></div><div class="space-y-2">${D.tags.map(t=>`<div class="flex justify-between p-2 border rounded items-center"><span class="tag-${t.color} px-2 py-1 rounded text-sm">${t.name}</span><button onclick="delTag('${t.id}')" class="text-red-600 text-sm">刪除</button></div>`).join('')}</div>`;

function addTag() { const n = document.getElementById('t-name').value.trim(); if(!n) return; sb.from('tags').insert([{name:n, color:document.getElementById('t-color').value, category:'customer'}]).then(() => { loadAll(); manageTags(); }).catch(e => showAlert('失敗：'+e.message)); }

function renderOrdTable() {
  const [y,m] = (document.getElementById('ord-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('ord-search')?.value||'').toLowerCase();
  const list = D.orders.filter(o => {
    const d = new Date(o.created_at);
    const matchMonth = d.getFullYear()===y && d.getMonth()+1===m;
    const cust = D.customers.find(c=>c.id===o.customer_id);
    const matchKw = !kw || (cust?.company_name||'').toLowerCase().includes(kw) || (cust?.contact_person||'').toLowerCase().includes(kw) || (o.invoice_no||'').toLowerCase().includes(kw);
    return matchMonth && matchKw;
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  
  document.getElementById('ord-tbody').innerHTML = list.map(o => {
    const c = D.customers.find(x=>x.id===o.customer_id);
    return `<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">${new Date(o.created_at).toLocaleDateString()}</td><td class="px-4 py-3">${c?.company_name||c?.contact_person||'-'}</td><td class="px-4 py-3 font-bold">$${(o.total_amount||0).toLocaleString()}</td><td class="px-4 py-3 text-sm">${o.invoice_no||'無'}</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewOrdDetail('${o.id}')" class="text-blue-600 text-sm hover:underline">詳情</button><button onclick="openOrdModal('${o.id}')" class="text-green-600 text-sm hover:underline">編輯</button><button onclick="delOrd('${o.id}')" class="text-red-600 text-sm hover:underline">刪除</button></td></tr>`;
  }).join('');
}

async function saveProd() {
  const id = document.getElementById('p-id').value;
  // 嚴格限定只傳送這 5 個欄位，避免 updated_at 錯誤
  const d = {
    sku: document.getElementById('p-sku').value, 
    name: document.getElementById('p-name').value, 
    type: document.getElementById('p-type').value, 
    sell_price: parseFloat(document.getElementById('p-sell').value)||0, 
    cost_price: parseFloat(document.getElementById('p-cost').value)||0
  };
  if(!d.sku||!d.name) return showAlert('SKU與名稱為必填！');
  try {
    if(id) {
      const {error} = await sb.from('products').update(d).eq('id', id);
      if(error) throw error;
    } else {
      const {error} = await sb.from('products').insert([{...d, current_stock:0}]);
      if(error) throw error;
    }
    showAlert('已儲存！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

  }).catch(e => showAlert('刪除失敗：'+e.message));
}

function showWhTab(whId) {
  document.querySelectorAll('.wh-tab').forEach(t => { 
    t.className = t.className.replace('bg-blue-600 text-white','bg-gray-200 text-gray-700'); 
    if(t.dataset.wh===whId) t.className = t.className.replace('bg-gray-200 text-gray-700','bg-blue-600 text-white'); 
  });
  
  const container = document.getElementById('inv-content');
  let rows = '';
  
  if(whId === 'all') {
    rows = D.products.map(p => {
      const totalQty = D.warehouseInv.filter(i=>i.product_id===p.id).reduce((sum, i) => sum + (i.quantity||0), 0);
      const maxSafe = Math.max(...D.warehouseInv.filter(i=>i.product_id===p.id).map(i=>i.safety_stock||0), 0);
      const low = totalQty < maxSafe && maxSafe > 0;
      
      const whDetails = D.warehouseInv.filter(i=>i.product_id===p.id).map(i => {
        const w = D.warehouses.find(wh=>wh.id===i.warehouse_id);
        return `<div class="text-xs text-gray-500">${w?.name||'未知'}: ${i.quantity}</div>`;
      }).join('');

      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold text-lg">${totalQty}</td><td class="px-4 py-3 text-xs">${whDetails || '無庫存記錄'}</td><td class="px-4 py-3">${low?'<span class="text-red-600 font-bold">低庫存</span>':totalQty>0?'<span class="text-green-600">正常</span>':'<span class="text-gray-400">無庫存</span>'}</td></tr>`;
    }).join('');
    
    container.innerHTML = `<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-blue-50 border-b"><h3 class="font-bold text-blue-800"> 全部庫存總覽 (跨倉庫加總)</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">總庫存</th><th class="px-4 py-3 text-left text-xs">倉庫分佈</th><th class="px-4 py-3 text-left text-xs">狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else {
    const wh = D.warehouses.find(w=>w.id===whId);
    const inv = D.warehouseInv.filter(i=>i.warehouse_id===whId);
    
    rows = D.products.map(p => {
      const wInv = inv.find(i=>i.product_id===p.id);
      const qty = wInv?.quantity || 0;
      const safe = wInv?.safety_stock || 0;
      const low = qty < safe && safe > 0;
      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold">${qty}</td><td class="px-4 py-3"><input type="number" class="inv-safe w-20 px-2 py-1 border rounded" value="${safe}" data-pid="${p.id}" data-wid="${whId}"></td><td class="px-4 py-3">${low?'<span class="text-red-600 font-bold">低庫存</span>':qty>0?'<span class="text-green-600">正常</span>':'<span class="text-gray-400">無庫存</span>'}</td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="${qty}" data-pid="${p.id}" data-wid="${whId}"><button onclick="saveInvItem(this)" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs">儲存</button></td></tr>`;
    }).join('');
    
    container.innerHTML = `<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold">${wh?.name||''} - 庫存明細與盤點</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">低庫存設定</th><th class="px-4 py-3 text-left text-xs">狀態</th><th class="px-4 py-3 text-left text-xs">盤點調整</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
}

function saveInvItem(btn) {
  const tr = btn.closest('tr');
  const pid = tr.querySelector('.inv-qty').dataset.pid;
  const wid = tr.querySelector('.inv-qty').dataset.wid;
  const qty = parseInt(tr.querySelector('.inv-qty').value)||0;
  const safe = parseInt(tr.querySelector('.inv-safe').value)||0;
  
  const existing = D.warehouseInv.find(i=>i.warehouse_id===wid && i.product_id===pid);
  const data = {quantity:qty, safety_stock:safe};
  
  let promise;
  if(existing) {
    promise = sb.from('warehouse_inventory').update(data).eq('id', existing.id);
  } else {

function calcPur() {
  const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.pu-price').value)||0;
    const qty = parseInt(r.querySelector('.pu-qty').value)||0;
    subtotal += price * qty;
  });
  
  if(isInvoiceMode) {
    const tax = Math.round(subtotal * 0.05); // 最後總金額才四捨五入
    document.getElementById('pu-subtotal').textContent = subtotal.toLocaleString();
    document.getElementById('pu-tax').textContent = tax.toLocaleString();
    document.getElementById('pu-total').textContent = tax.toLocaleString();
  } else {
    document.getElementById('pu-total').textContent = subtotal.toLocaleString();
  }
}

async function savePur() {
  const editId = document.getElementById('pu-edit-id')?.value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const bankId = document.getElementById('pu-bank').value;
  
  const items = []; 
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value)||0;
    const p = parseFloat(r.querySelector('.pu-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); subtotal+=p*q; }
  });
  if(!items.length) return showAlert('請加入採購商品！');
  
  let d = { vendor_id: vendorId, bank_account_id: bankId||null, is_invoice_purchase: isInvoiceMode };
  
  if(isInvoiceMode) {
    d.total_amount = Math.round(subtotal * 0.05);
    d.invoice_amount = d.total_amount;
  } else {
    d.total_amount = subtotal;
    d.invoice_amount = subtotal;
    d.invoice_no = document.getElementById('pu-inv-no')?.value||null;
    d.has_invoice = document.getElementById('pu-has-inv')?.checked||false;
    d.warehouse_id = document.getElementById('pu-wh')?.value||null;
  }
  
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      const {error} = await sb.from('purchases').update(d).eq('id', editId);
      if(error) throw error;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:editId})));
    } else {
      d.purchase_no = 'PUR-'+Date.now();
      d.status = 'completed';
      const {data:r, error} = await sb.from('purchases').insert([d]).select().single();
      if(error) throw error;
      const purId = r.id;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:purId})));
      
      // 一般採購自動入庫
      if(!isInvoiceMode && d.warehouse_id) {
        for(const i of items) {
          const existing = D.warehouseInv.find(w=>w.warehouse_id===d.warehouse_id && w.product_id===i.product_id);
          if(existing) {
            await sb.from('warehouse_inventory').update({quantity: (existing.quantity||0) + i.quantity}).eq('id', existing.id);
          } else {
            await sb.from('warehouse_inventory').insert([{warehouse_id:d.warehouse_id, product_id:i.product_id, quantity:i.quantity, safety_stock:0}]);
          }
          const p = D.products.find(x=>x.id===i.product_id);
          if(p) await sb.from('products').update({current_stock: (p.current_stock||0) + i.quantity}).eq('id', i.product_id);
        }
      }
    }
    
    if(bankId) {
      const b = D.banks.find(x=>x.id===bankId);
      if(b) await sb.from('bank_accounts').update({balance: (b.balance||0) - d.total_amount}).eq('id', bankId);
    }
    
    showAlert(isInvoiceMode?'購買發票已記錄！':'採購已入庫！'); 
    closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

}

function renderExpTable() {
  const [y,m] = (document.getElementById('exp-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('exp-search')?.value||'').toLowerCase();
  const list = D.expenses.filter(e => {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const cat = D.expCats.find(c=>c.id===e.category_id);
    return d.getFullYear()===y && d.getMonth()+1===m && (!kw || (cat?.name||'').toLowerCase().includes(kw) || (e.description||'').toLowerCase().includes(kw));
  }).sort((a,b)=>new Date(b.payment_date)-new Date(a.payment_date));
  
  document.getElementById('exp-tbody').innerHTML = list.map(e=>{
    const cat=D.expCats.find(c=>c.id===e.category_id);
    const emp = D.emps.find(x=>x.id===e.employee_id);
    const statusHtml = e.is_reimbursed 
      ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">已結帳</span>' 
      : '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">待結帳</span>';
    return `<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">${e.payment_date}</td><td class="px-4 py-3">${cat?.name||'-'}</td><td class="px-4 py-3 font-bold text-red-600">$${(e.amount||0).toLocaleString()}</td><td class="px-4 py-3 text-sm">${e.description||'-'}</td><td class="px-4 py-3">${emp?.name||'-'}</td><td class="px-4 py-3">${statusHtml}</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openExpModal('${e.id}')" class="text-green-600 text-sm hover:underline">編輯</button><button onclick="delExp('${e.id}')" class="text-red-600 text-sm hover:underline">刪除</button></td></tr>`;
  }).join('');
}

async function saveExp() {
  const id = document.getElementById('e-id').value;
  const empId = document.getElementById('e-emp').value || null;
  const isReimbursed = document.getElementById('e-reimbursed').checked;
  const d = {
    category_id:document.getElementById('e-cat').value, 
    amount:parseFloat(document.getElementById('e-amt').value)||0, 
    description:document.getElementById('e-desc').value, 
    payment_date:document.getElementById('e-date').value,
    employee_id: empId,
    is_reimbursed: isReimbursed,
    reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null
  };
  try {
    if(id) await sb.from('expenses').update(d).eq('id',id); 
    else await sb.from('expenses').insert([d]);
    showAlert('已記錄！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

function delExp(id) { if(!confirm('確定刪除?')) return; sb.from('expenses').delete().eq('id',id).then(() => { loadAll().then(render); }).catch(e => showAlert('失敗：'+e.message)); }
