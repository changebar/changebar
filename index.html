// ==================== 全域資料變數 ====================
let D = { products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[] };
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let bossDateRange = { start: bossMonth, end: bossMonth };
let isSaving = false;

const COLOR_NAMES = { '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色', '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色' };
const PRODUCT_TYPE_MAP = { 'finished': '成品', 'semi': '半成品', 'gift_box': '禮盒', 'outer_box': '外箱子' };

// ==================== 輔助函式 ====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    setTimeout(() => overlay.classList.add('hidden'), 300);
  } else {
    overlay.classList.remove('hidden');
    void overlay.offsetWidth;
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
}

function showAlert(msg) { 
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-content');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');
  
  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
  modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden';
  
  title.textContent = '訊息';
  body.innerHTML = '<div class="p-6"><div class="flex flex-col items-center justify-center"><div class="text-center text-lg text-gray-800">' + msg + '</div></div></div>';
  
  footer.innerHTML = '';
  const confirmBtn = document.createElement('button');
  confirmBtn.id = 'alert-ok-btn';
  confirmBtn.className = 'w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors cursor-pointer btn-touch';
  confirmBtn.textContent = '確定 (Enter)';
  
  confirmBtn.onclick = function() {
    closeModal();
    document.removeEventListener('keydown', handleAlertKey);
  };
  
  function handleAlertKey(e) {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleAlertKey);
    } else if(e.key === 'Escape') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleAlertKey);
    }
  }
  
  footer.appendChild(confirmBtn);
  overlay.classList.remove('hidden');
  modal.classList.remove('hidden');
  
  setTimeout(function() { 
    confirmBtn.focus();
    document.addEventListener('keydown', handleAlertKey);
  }, 100);
}

window.closeModal = function() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-content');
  if(overlay) overlay.classList.add('hidden');
  if(modal) modal.classList.add('hidden');
  editingId = null;
  isSaving = false;
};

function openModal(title, html, onSave, hideSave) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-content');
  const titleEl = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');
  
  if(!overlay || !modal || !titleEl || !body) {
    console.error('找不到必要的 modal 元素');
    return;
  }
  
  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
  modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto';
  
  titleEl.textContent = title;
  body.innerHTML = html;
  const closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) {
    closeBtn.onclick = function() {
      window.closeModal();
    };
  }
  
  if(footer) {
    footer.innerHTML = '';
    
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-gray-300 rounded-lg hover:bg-gray-400 font-semibold transition-colors btn-touch cursor-pointer';
    cancelBtn.style.zIndex = '100';
    cancelBtn.textContent = '取消 (Esc)';
    cancelBtn.onclick = function() {
      closeModal();
    };
    
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-lg btn-touch cursor-pointer';
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.disabled = false;
    saveBtn.style.zIndex = '100';
    
    if(hideSave) {
      saveBtn.classList.add('hidden');
    } else {
      saveBtn.classList.remove('hidden');
      saveBtn.onclick = function() {
        if(isSaving) return;
        isSaving = true;
        saveBtn.disabled = true;
        saveBtn.textContent = '儲存中...';
        onSave().then(function() {
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
          closeModal();
        }).catch(function(e) {
          console.error('Save error:', e || 'Unknown error');
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
        });
      };
    }
    
    footer.appendChild(cancelBtn);
    footer.appendChild(saveBtn);
  }
  
  overlay.classList.remove('hidden');
  modal.classList.remove('hidden');
  
  function handleModalKey(e) {
    if(e.key === 'Escape') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleModalKey);
    } else if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      const saveBtn = document.getElementById('modal-save-btn');
      if(saveBtn && !saveBtn.disabled) {
        saveBtn.click();
      }
    }
  }
  
  document.addEventListener('keydown', handleModalKey);
  
  setTimeout(function() {
    const firstInput = modal.querySelector('input, select, textarea');
    if(firstInput) firstInput.focus();
  }, 100);
}

// ==================== DOM 載入後綁定事件 ====================
document.addEventListener('DOMContentLoaded', function() {
  // 側邊欄按鈕
  const menuBtn = document.getElementById('menu-toggle-btn');
  const closeBtn = document.getElementById('sidebar-close-btn');
  const overlay = document.getElementById('sidebar-overlay');
  if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
  if (closeBtn) closeBtn.addEventListener('click', toggleSidebar);
  if (overlay) overlay.addEventListener('click', toggleSidebar);
  
  // 導航連結
  const navLinks = document.querySelectorAll('nav a');
  for(let i=0; i<navLinks.length; i++) {
    navLinks[i].addEventListener('click', function(e) {
      e.preventDefault();
      switchView(this.dataset.view);
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 1024 && sidebar && sidebar.classList.contains('open')) {
        toggleSidebar();
      }
    });
  }

  // 記住信箱
  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }

  // Enter 鍵登入
  document.getElementById('password').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') document.getElementById('login-btn').click();
  });

  // 登出
  document.getElementById('logout-btn').addEventListener('click', function() {
    if(window.sb) {
      window.sb.auth.signOut().then(function() { location.reload(); });
    } else {
      location.reload();
    }
  });

  // ====== 登入按鈕事件 ======
  document.getElementById('login-btn').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if(remember) localStorage.setItem('rememberedEmail', email);
    else localStorage.removeItem('rememberedEmail');

    if(!window.sb) {
      showAlert('Supabase 未連接，請檢查網路或設定。');
      return;
    }

    window.sb.auth.signInWithPassword({ email: email, password: password })
      .then(function(res) {
        if (res.error) {
          showAlert('登入失敗：' + res.error.message);
        } else {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('main-system').classList.remove('hidden');
          if (typeof loadAll === 'function') {
            loadAll().then(function() { switchView('boss'); });
          } else {
            console.log('loadAll 不存在，直接切換視圖');
            switchView('boss');
          }
        }
      })
      .catch(function(err) {
        showAlert('登入發生錯誤：' + err.message);
      });
  });
});

// ==================== 切換視圖與排序 ====================
function switchView(view) {
  currentView = view;
  const c = document.getElementById('main-content');
  if (view === 'boss') renderBoss(c);
  else if (view === 'crm') renderCRM(c);
  else if (view === 'orders') renderOrders(c);
  else if (view === 'products') renderProducts(c);
  else if (view === 'warehouses') renderWarehouses(c);
  else if (view === 'inventory') renderInventory(c);
  else if (view === 'purchases') renderPurchases(c);
  else if (view === 'vendors') renderVendors(c);
  else if (view === 'finance') renderFinance(c);
  else if (view === 'banks') renderBanks(c);
  else if (view === 'settings') renderSettings(c);
  else {
    c.innerHTML = '<div class="p-8 text-center text-gray-500">功能開發中</div>';
  }
  document.querySelectorAll('nav a').forEach(el => el.classList.remove('nav-active'));
  const activeLink = document.querySelector(`nav a[data-view="${view}"]`);
  if(activeLink) activeLink.classList.add('nav-active');
}

function sortTable(tbodyId, colIndex) {
  const tbody = document.getElementById(tbodyId);
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a, b) {
    const aText = a.cells[colIndex] ? a.cells[colIndex].textContent || '' : '';
    const bText = b.cells[colIndex] ? b.cells[colIndex].textContent || '' : '';
    return aText.localeCompare(bText, 'zh-TW');
  });
  for(let i=0; i<rows.length; i++) tbody.appendChild(rows[i]);
}

function render() {
    switchView(currentView);
}

async function loadAll() {
    try {
        const [
            productsRes, windowsRes, customersRes, tagsRes, warehousesRes, bomRes,
            vendorsRes, channelsRes, paymentsRes, expensesRes, subsRes, banksRes,
            empsRes, expCatsRes, ordersRes, purchasesRes, warehouseInvRes, customerTagsRes
        ] = await Promise.all([
            sb.from('products').select('*'),
            sb.from('contact_windows').select('*'),
            sb.from('customers').select('*'),
            sb.from('tags').select('*'),
            sb.from('warehouses').select('*'),
            sb.from('bom_list').select('*'),
            sb.from('vendors').select('*'),
            sb.from('sales_channels').select('*'),
            sb.from('payment_methods').select('*'),
            sb.from('expenses').select('*'),
            sb.from('system_subscriptions').select('*'),
            sb.from('bank_accounts').select('*'),
            sb.from('employees').select('*'),
            sb.from('expense_categories').select('*'),
            sb.from('orders').select('*'),
            sb.from('purchases').select('*'),
            sb.from('warehouse_inventory').select('*'),
            sb.from('customer_tags').select('*')
        ]);

        D.products = productsRes.data || [];
        D.windows = windowsRes.data || [];
        D.customers = customersRes.data || [];
        D.tags = tagsRes.data || [];
        D.warehouses = warehousesRes.data || [];
        D.bom = bomRes.data || [];
        D.vendors = vendorsRes.data || [];
        D.channels = channelsRes.data || [];
        D.payments = paymentsRes.data || [];
        D.expenses = expensesRes.data || [];
        D.subs = subsRes.data || [];
        D.banks = banksRes.data || [];
        D.emps = empsRes.data || [];
        D.expCats = expCatsRes.data || [];
        D.orders = ordersRes.data || [];
        D.purchases = purchasesRes.data || [];
        D.warehouseInv = warehouseInvRes.data || [];
        D.customerTags = customerTagsRes.data || [];

        console.log('✅ 所有資料載入完成');
    } catch (error) {
        console.error('❌ 載入資料失敗：', error);
        showAlert('載入資料失敗，請檢查網路或重新登入。');
    }
}

// ==================== 老闆查閱 ====================
function renderBoss(c) {
  const startY = parseInt(bossDateRange.start.split('-')[0]);
  const startM = parseInt(bossDateRange.start.split('-')[1]);
  const endY = parseInt(bossDateRange.end.split('-')[0]);
  const endM = parseInt(bossDateRange.end.split('-')[1]);
  
  const monthOrders = D.orders.filter(function(o) {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  
  let rev = 0;
  for(let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount||0;
  
  const monthPurchases = D.purchases.filter(function(p) {
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let pur = 0;
  for(let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount||0;
  
  const monthExpenses = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let exp = 0;
  for(let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount||0;
  
  const monthSubs = D.subs.filter(function(s) {
    if(!s.start_date) return false;
    const d = new Date(s.start_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let sub = 0;
  for(let i=0; i<monthSubs.length; i++) sub += monthSubs[i].amount||0;
  
  let totalCash = 0;
  for(let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance||0;
  
  const monthlyProfit = rev - pur - exp - sub;
  
  const unreimbursedExpenses = D.expenses.filter(function(e) { return e.employee_id && !e.is_reimbursed; });
  const unreimbursedByEmp = {};
  for(let i=0; i<unreimbursedExpenses.length; i++) {
    const e = unreimbursedExpenses[i];
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += e.amount || 0;
      unreimbursedByEmp[emp.name].items.push(e);
    }
  }
  
  const inventoryByType = {};
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    let totalQty = 0;
    const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity||0;
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({ type: p.type, name: p.name, sku: p.sku, quantity: totalQty, cost: p.cost_price || 0, value: totalQty * (p.cost_price || 0) });
    }
  }
  
  const inventoryAssets = { finished: { count: 0, value: 0 }, semi: { count: 0, value: 0 }, gift_box: { count: 0, value: 0 }, outer_box: { count: 0, value: 0 } };
  let allItems = [];
  for(const type in inventoryByType) { allItems = allItems.concat(inventoryByType[type]); }
  for(let i=0; i<allItems.length; i++) {
    const item = allItems[i];
    if(inventoryAssets[item.type]) {
      inventoryAssets[item.type].count += item.quantity;
      inventoryAssets[item.type].value += item.value;
    }
  }
  let totalInventoryValue = 0;
  for(const type in inventoryAssets) { totalInventoryValue += inventoryAssets[type].value; }
  
  const channelStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const ch = D.channels.find(function(x) { return x.id===o.sales_channel_id; });
    if(ch) {
      if(!channelStats[ch.name]) channelStats[ch.name] = {count:0, amount:0, commission:0};
      channelStats[ch.name].count++;
      channelStats[ch.name].amount += o.total_amount||0;
      channelStats[ch.name].commission += o.channel_commission||0;
    }
  }
  
  const paymentStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const pm = D.payments.find(function(x) { return x.id===o.payment_method_id; });
    if(pm) {
      if(!paymentStats[pm.name]) paymentStats[pm.name] = {count:0, amount:0, commission:0};
      paymentStats[pm.name].count++;
      paymentStats[pm.name].amount += o.total_amount||0;
      paymentStats[pm.name].commission += o.payment_commission||0;
    }
  }
  
  let companyShipping = 0;
  let customerShipping = 0;
  for(let i=0; i<monthOrders.length; i++) {
    companyShipping += monthOrders[i].absorbed_shipping_fee || 0;
    customerShipping += monthOrders[i].customer_paid_shipping || 0;
  }
  let totalChannelCommission = 0;
  for(const ch in channelStats) totalChannelCommission += channelStats[ch].commission;
  let totalPaymentCommission = 0;
  for(const pm in paymentStats) totalPaymentCommission += paymentStats[pm].commission;
  const totalShippingCost = companyShipping;
  const totalOrderExpenses = totalChannelCommission + totalPaymentCommission + totalShippingCost;
  
  const subTag = D.tags.find(function(t) { return t.name.indexOf('訂閱') !== -1; });
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(function(ct) { return ct.tag_id === subTag.id; }).map(function(ct) { return ct.customer_id; });
    const uniqueIds = [];
    for(let i=0; i<subTagIds.length; i++) { if(uniqueIds.indexOf(subTagIds[i]) === -1) uniqueIds.push(subTagIds[i]); }
    subCustomerCount = uniqueIds.length;
  }
  let subMonthlyRevenue = 0;
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    if(o.is_subscription && o.subscription_days > 0) {
      const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
      subMonthlyRevenue += dailyRevenue * 30;
    }
  }
  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  let channelStatsHtml = '';
  for(const name in channelStats) {
    const stat = channelStats[name];
    channelStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!channelStatsHtml) channelStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let paymentStatsHtml = '';
  for(const name in paymentStats) {
    const stat = paymentStats[name];
    paymentStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!paymentStatsHtml) paymentStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let unreimbursedHtml = '';
  for(const name in unreimbursedByEmp) {
    const data = unreimbursedByEmp[name];
    let itemsHtml = '';
    for(let i=0; i<data.items.length; i++) {
      const e = data.items[i];
      itemsHtml += '<div class="flex justify-between"><span>'+(e.description || '無描述')+' ('+e.payment_date+')</span><span>'+(e.amount||0).toLocaleString()+'</span></div>';
    }
    unreimbursedHtml += '<div class="border rounded-lg p-4"><div class="flex justify-between items-center mb-2"><span class="font-bold text-lg">'+name+'</span><span class="text-2xl font-bold text-orange-600">'+data.total.toLocaleString()+'</span></div><div class="text-sm text-gray-600 space-y-1">'+itemsHtml+'</div></div>';
  }
  if(!unreimbursedHtml) unreimbursedHtml = '<p class="text-gray-500">目前無待結帳代墊款項</p>';
  
  let inventoryDetailHtml = '';
  for(const type in inventoryByType) {
    const items = inventoryByType[type];
    let rowsHtml = '';
    for(let i=0; i<items.length; i++) {
      const item = items[i];
      rowsHtml += '<tr class="border-t"><td class="px-3 py-2">'+item.name+'</td><td class="px-3 py-2">'+(item.sku || '-')+'</td><td class="px-3 py-2 font-bold">'+item.quantity+'</td><td class="px-3 py-2">'+item.cost.toLocaleString()+'</td><td class="px-3 py-2 text-green-600 font-bold">'+item.value.toLocaleString()+'</td></tr>';
    }
    const typeName = PRODUCT_TYPE_MAP[type] || type;
    inventoryDetailHtml += '<div class="border rounded-lg p-3"><h5 class="font-bold text-sm mb-2">'+typeName+'</h5><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left text-xs">產品名稱</th><th class="px-3 py-2 text-left text-xs">SKU</th><th class="px-3 py-2 text-left text-xs">數量</th><th class="px-3 py-2 text-left text-xs">成本</th><th class="px-3 py-2 text-left text-xs">總價值</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
  }
  
  let banksHtml = '';
  for(let i=0; i<D.banks.length; i++) {
    const b = D.banks[i];
    banksHtml += '<div class="flex justify-between items-center p-3 bg-gray-50 rounded"><span class="font-medium">'+b.account_name+'</span><span class="font-bold text-green-600">'+(b.balance||0).toLocaleString()+'</span></div>';
  }

  c.innerHTML = '<div class="content-card">' +
    '<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">' +
    '<div><h1 class="text-3xl font-bold">👑 老闆查閱</h1><p class="text-sm text-gray-600 mt-1">查看期間：'+bossDateRange.start+' ~ '+bossDateRange.end+'</p></div>' +
    '<div class="flex flex-wrap gap-2 w-full md:w-auto">' +
    '<input type="month" value="'+bossDateRange.start+'" onchange="bossDateRange.start=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<span class="flex items-center text-gray-500">至</span>' +
    '<input type="month" value="'+bossDateRange.end+'" onchange="bossDateRange.end=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<button onclick="downloadBossReport()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold btn-touch">📥 下載 Excel</button>' +
    '</div></div>' +
    '<div class="card-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">' +
    '<div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white"><p class="text-sm opacity-90">期間業績</p><p class="text-3xl font-bold mt-2">'+rev.toLocaleString()+'</p><p class="text-xs mt-2 opacity-75">訂單數：'+monthOrderCount+' 單</p></div>' +
    '<div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white"><p class="text-sm opacity-90">期間採購</p><p class="text-3xl font-bold mt-2">'+pur.toLocaleString()+'</p></div>' +
    '<div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white"><p class="text-sm opacity-90">期間開銷(含訂閱)</p><p class="text-3xl font-bold mt-2">'+(exp+sub).toLocaleString()+'</p></div>' +
    '<div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white"><p class="text-sm opacity-90">期間淨利</p><p class="text-3xl font-bold mt-2">'+monthlyProfit.toLocaleString()+'</p></div>' +
    '</div>' +
    '<div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-orange-500"><h3 class="text-lg font-bold mb-4 text-gray-800">💰 員工代墊款明細 (待結帳)</h3><div class="space-y-4">'+unreimbursedHtml+'</div></div>' +
    '<div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-red-500"><h3 class="text-lg font-bold mb-4 text-gray-800">📊 期間出貨支出明細</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div><h4 class="font-bold text-sm text-gray-600 mb-2">銷售通路抽成</h4><div class="space-y-1 text-sm">'+channelStatsHtml+'</div><div class="border-t mt-2 pt-2 font-bold">合計：'+totalChannelCommission.toLocaleString()+'</div></div><div><h4 class="font-bold text-sm text-gray-600 mb-2">付款方式手續費</h4><div class="space-y-1 text-sm">'+paymentStatsHtml+'</div><div class="border-t mt-2 pt-2 font-bold">合計：'+totalPaymentCommission.toLocaleString()+'</div></div><div><h4 class="font-bold text-sm text-gray-600 mb-2">運費支付</h4><div class="space-y-1 text-sm"><div class="flex justify-between"><span>公司吸收</span><span class="font-bold text-red-600">'+companyShipping.toLocaleString()+'</span></div><div class="flex justify-between"><span>客戶自付</span><span class="font-bold text-green-600">'+customerShipping.toLocaleString()+'</span></div></div><div class="border-t mt-2 pt-2 font-bold">公司支出：'+totalShippingCost.toLocaleString()+'</div></div></div><div class="mt-4 p-4 bg-red-50 rounded-lg"><div class="flex justify-between items-center"><span class="font-bold text-lg">期間出貨總支出</span><span class="text-2xl font-bold text-red-600">'+totalOrderExpenses.toLocaleString()+'</span></div></div></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"><div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500"><h3 class="text-lg font-bold mb-4 text-gray-800">📊 營運指標</h3><div class="space-y-4"><div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">累積客戶總數</span><span class="text-2xl font-bold text-indigo-600">'+totalCustomers+' 位</span></div><div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">期間訂單數</span><span class="text-2xl font-bold text-indigo-600">'+monthOrderCount+' 單</span></div><div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">訂閱客戶數</span><span class="text-2xl font-bold text-indigo-600">'+subCustomerCount+' 位</span></div><div class="flex justify-between items-center"><span class="text-gray-600">訂閱換算月營收</span><span class="text-2xl font-bold text-indigo-600">'+Math.round(subMonthlyRevenue).toLocaleString()+'</span></div></div></div><div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-orange-500"><h3 class="text-lg font-bold mb-4 text-gray-800">🏦 公司總資金</h3><p class="text-4xl font-bold text-orange-600 mb-6">現金總額：'+totalCash.toLocaleString()+'</p><div class="space-y-2">'+banksHtml+'</div></div></div>' +
    '<div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500"><h3 class="text-lg font-bold mb-4 text-gray-800">📦 庫存資產總覽</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"><div class="p-4 bg-blue-50 rounded-lg"><p class="text-sm text-gray-600">成品</p><p class="text-2xl font-bold text-blue-600">'+inventoryAssets.finished.count+' 件</p><p class="text-sm text-gray-500">價值：'+inventoryAssets.finished.value.toLocaleString()+'</p></div><div class="p-4 bg-purple-50 rounded-lg"><p class="text-sm text-gray-600">半成品</p><p class="text-2xl font-bold text-purple-600">'+inventoryAssets.semi.count+' 件</p><p class="text-sm text-gray-500">價值：'+inventoryAssets.semi.value.toLocaleString()+'</p></div><div class="p-4 bg-pink-50 rounded-lg"><p class="text-sm text-gray-600">禮盒</p><p class="text-2xl font-bold text-pink-600">'+inventoryAssets.gift_box.count+' 件</p><p class="text-sm text-gray-500">價值：'+inventoryAssets.gift_box.value.toLocaleString()+'</p></div><div class="p-4 bg-gray-50 rounded-lg"><p class="text-sm text-gray-600">外箱子</p><p class="text-2xl font-bold text-gray-600">'+inventoryAssets.outer_box.count+' 件</p><p class="text-sm text-gray-500">價值：'+inventoryAssets.outer_box.value.toLocaleString()+'</p></div></div>' +
    (inventoryDetailHtml ? '<div class="mt-4 border-t pt-4"><h4 class="font-bold mb-3">庫存明細</h4><div class="space-y-3">'+inventoryDetailHtml+'</div></div>' : '') +
    '<div class="mt-4 p-4 bg-indigo-100 rounded-lg"><div class="flex justify-between items-center"><span class="font-bold text-lg">庫存總價值</span><span class="text-3xl font-bold text-indigo-600">'+totalInventoryValue.toLocaleString()+'</span></div></div></div></div>';
}

function downloadBossReport() {
  const wb = XLSX.utils.book_new();
  const orderData = D.orders.map(function(o) {
    const c = D.customers.find(function(x) { return x.id===o.customer_id; });
    return {'日期': new Date(o.created_at).toLocaleDateString(), '訂單編號': o.order_no, '客戶': c ? c.company_name || c.contact_person : '-', '總金額': o.total_amount || 0};
  });
  const ws1 = XLSX.utils.json_to_sheet(orderData);
  XLSX.utils.book_append_sheet(wb, ws1, '訂單出貨');
  XLSX.writeFile(wb, '老闆查閱報表_'+new Date().toISOString().split('T')[0]+'.xlsx');
  showAlert('Excel 報表已下載！');
}

  renderCustTable();

function renderCustTable() {
  const kw = (document.getElementById('cust-search') ? document.getElementById('cust-search').value || '' : '').toLowerCase();
  const list = D.customers.filter(function(c) {
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().indexOf(kw) !== -1;
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; });
    let tagMatch = false;
    for(let i=0; i<custTags.length; i++) {
      const ct = custTags[i];
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      if(tag && tag.name.toLowerCase().indexOf(kw) !== -1) { tagMatch = true; break; }
    }
    return basicMatch || tagMatch;
  });
  let html = '';

function renderPurTable() {
  const searchText = (document.getElementById('pur-search')?.value || '').toLowerCase();
  const startDate = document.getElementById('pur-start-date')?.value || '';
  const endDate = document.getElementById('pur-end-date')?.value || '';

  let list = D.purchases.filter(function(p) {
    const vendor = D.vendors.find(v => v.id === p.vendor_id);
    const vendorName = vendor?.name || '';
    const purchaseDate = p.created_at.split('T')[0];
    const matchSearch = !searchText || vendorName.toLowerCase().includes(searchText);
    const matchStartDate = !startDate || purchaseDate >= startDate;
    const matchEndDate = !endDate || purchaseDate <= endDate;
    return matchSearch && matchStartDate && matchEndDate;
  }).sort(function(a, b) {
    const vendorA = D.vendors.find(v => v.id === a.vendor_id)?.name || '';
    const vendorB = D.vendors.find(v => v.id === b.vendor_id)?.name || '';
    return vendorA.localeCompare(vendorB, 'zh-TW');
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const p = list[i];
    const v = D.vendors.find(function(x) { return x.id === p.vendor_id; });
    const typeLabel = p.is_invoice_purchase ? '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">購買發票</span>' : '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">一般採購</span>';

    const items = p.items || [];
    const itemsText = items.map(function(item) {
      const prod = D.products.find(x => x.id === item.product_id);
      return (prod?.name || '?') + ' x' + item.quantity;
    }).join(', ');

    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + new Date(p.created_at).toLocaleDateString() + '</td><td class="px-4 py-3">' + (v?.name || '-') + '</td><td class="px-4 py-3">' + typeLabel + '</td><td class="px-4 py-3 text-sm text-gray-600">' + (itemsText || '-') + '</td><td class="px-4 py-3 font-bold">' + (p.total_amount || 0).toLocaleString() + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewPurchaseDetail(\'' + p.id + '\')" class="text-blue-600 hover:text-blue-800 btn-touch">詳情</button><button onclick="openPurModal(false, \'' + p.id + '\')" class="text-green-600 hover:text-green-800 btn-touch">編輯</button><button onclick="delPur(\'' + p.id + '\')" class="text-red-600 hover:text-red-800 btn-touch">刪除</button></td></tr>';
  }

  const tbody = document.getElementById('pur-tbody');
  if(tbody) {
    tbody.innerHTML = html;
  }
}

// ==================== 採購編輯彈窗 ====================
async function openPurModal(isInvoicePurchase, editId) {
  editingId = editId || null;
  const existingData = editId ? D.purchases.find(function(x) { return x.id === editId; }) : null;
  let vendorOptions = '';
  for(let i=0; i<D.vendors.length; i++) {
    const v = D.vendors[i];
    vendorOptions += '<option value="' + v.id + '" ' + (existingData && existingData.vendor_id === v.id ? 'selected' : '') + '>' + v.name + '</option>';
  }
  let whOptions = '';
  const activeWh = D.warehouses.filter(function(w) { return w.is_active; });
  for(let i=0; i<activeWh.length; i++) {
    const w = activeWh[i];
    whOptions += '<option value="' + w.id + '" ' + (existingData && existingData.warehouse_id === w.id ? 'selected' : '') + '>' + w.name + '</option>';
  }
  const html = '<input type="hidden" id="pu-invoice-mode" value="' + (isInvoicePurchase ? 'true' : 'false') + '"><input type="hidden" id="pu-edit-id" value="' + (editId || '') + '"><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded input-field">' + vendorOptions + '</select></div>' + (!isInvoicePurchase ? '<div><label class="block text-sm font-bold mb-2">入庫倉庫</label><select id="pu-wh" class="w-full px-3 py-2 border rounded input-field">' + whOptions + '</select></div>' : '') + '</div><div class="mb-4"><label class="block text-sm font-bold mb-2">採購商品明細</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm btn-touch">+ 新增商品</button></div><div class="bg-gray-50 p-4 rounded mb-4"><div class="text-xl font-bold">採購總金額：<span id="pu-total">0</span></div></div>';
  openModal(isInvoicePurchase ? '購買發票' : '一般採購入庫', html, savePur);
  if(editId && existingData) {
    const itemsResp = await sb.from('purchase_items').select('*').eq('purchase_id', editId);
    const items = itemsResp.data || [];
    if(items.length > 0) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const p = D.products.find(function(x) { return x.id === item.product_id; });
        addPurItem(p, item.quantity, item.unit_price);
      }
    }
  } else {
    addPurItem();
  }
  calcPur();
}

function addPurItem(prod, qty, price) {
  const box = document.getElementById('pu-items');
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded flex-wrap';
  let prodOptions = '<option value="">選擇商品</option>';
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    prodOptions += '<option value="' + p.id + '" data-cost="' + (p.cost_price || 0) + '" ' + (prod && prod.id === p.id ? 'selected' : '') + '>' + p.name + '</option>';
  }
  div.innerHTML = '<div class="flex-1 min-w-[150px]"><select class="pu-prod w-full px-3 py-2 border rounded input-field" onchange="if(this.value){this.closest(\'div.flex\').querySelector(\'.pu-price\').value=this.options[this.selectedIndex].dataset.cost;}calcPur()">' + prodOptions + '</select></div><div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded input-field" value="' + (qty || 1) + '" min="1" oninput="calcPur()"></div><div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded input-field" value="' + (price || 0) + '" step="0.01" oninput="calcPur()"></div><button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch">X</button>';
  box.appendChild(div);
}

function calcPur() {
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const price = parseFloat(r.querySelector('.pu-price').value) || 0;
    const qty = parseInt(r.querySelector('.pu-qty').value) || 0;
    subtotal += price * qty;
  }
  document.getElementById('pu-total').textContent = subtotal.toLocaleString();
}

async function savePur() {
  let editId = document.getElementById('pu-edit-id').value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const items = [];
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value) || 0;
    const p = parseFloat(r.querySelector('.pu-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      subtotal += p * q;
    }
  }
  if(!items.length) return showAlert('請加入採購商品！');
  const d = { vendor_id: vendorId, is_invoice_purchase: isInvoiceMode, total_amount: subtotal, warehouse_id: document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : null };
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      await sb.from('purchases').update(d).eq('id', editId);
    } else {
      d.purchase_no = 'PUR-' + Date.now();
      d.status = 'completed';
      const r = await sb.from('purchases').insert([d]).select().single();
      editId = r.data.id;
    }
    await sb.from('purchase_items').insert(items.map(function(i) { return Object.assign({}, i, {purchase_id: editId}); }));
    if(!isInvoiceMode && d.warehouse_id) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const existing = D.warehouseInv.find(function(w) { return w.warehouse_id === d.warehouse_id && w.product_id === item.product_id; });
        if(existing) await sb.from('warehouse_inventory').update({quantity: (existing.quantity || 0) + item.quantity}).eq('id', existing.id);
        else await sb.from('warehouse_inventory').insert([{warehouse_id: d.warehouse_id, product_id: item.product_id, quantity: item.quantity, safety_stock: 0}]);
        const prod = D.products.find(function(x) { return x.id === item.product_id; });
        if(prod) await sb.from('products').update({current_stock: (prod.current_stock || 0) + item.quantity}).eq('id', item.product_id);
      }
    }
    showAlert('採購已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delPur(id) {
  if(!confirm('確定刪除?')) return;
  try {
    await sb.from('purchase_items').delete().eq('purchase_id', id);
    await sb.from('purchases').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

  const today = new Date().toISOString().split('T')[0];
  const html = '<input type="hidden" id="s-id" value="' + (id || '') + '"><div class="mb-4"><label class="block text-sm font-bold mb-2">名稱 *</label><input type="text" id="s-name" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.name : '') + '"></div><div class="mb-4"><label class="block text-sm font-bold mb-2">供應商</label><input type="text" id="s-provider" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.provider : '') + '"></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">開始日期</label><input type="date" id="s-start" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.start_date : today) + '"></div><div><label class="block text-sm font-bold mb-2">結束日期</label><input type="date" id="s-end" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.end_date : '') + '"></div><div><label class="block text-sm font-bold mb-2">總金額</label><input type="number" id="s-amt" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.amount : '') + '"></div></div><div class="bg-blue-50 p-3 rounded"><span class="text-sm text-gray-600">每月攤提費用：</span><span id="s-monthly" class="text-lg font-bold text-blue-600">0</span></div>';
  openModal(id ? '編輯訂閱' : '新增訂閱', html, saveSub);
  calcMonthlySub();
  document.getElementById('s-start')?.addEventListener('change', calcMonthlySub);
  document.getElementById('s-end')?.addEventListener('change', calcMonthlySub);
  document.getElementById('s-amt')?.addEventListener('input', calcMonthlySub);
}

function calcMonthlySub() {
  const start = document.getElementById('s-start')?.value;
  const end = document.getElementById('s-end')?.value;
  const amount = parseFloat(document.getElementById('s-amt')?.value) || 0;
  const monthlyEl = document.getElementById('s-monthly');
  if(!monthlyEl) return;
  if(!start || !end || amount <= 0) {
    monthlyEl.textContent = '0';
    return;
  }
  const startDate = new Date(start);
  const endDate = new Date(end);
  const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
  if(diffMonths <= 0) {
    monthlyEl.textContent = '0 (日期無效)';
    return;
  }
  const monthly = amount / diffMonths;
  monthlyEl.textContent = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

async function saveSub() {
  const id = document.getElementById('s-id').value;
  const d = { 
    name: document.getElementById('s-name').value, 
    provider: document.getElementById('s-provider').value, 
    amount: parseFloat(document.getElementById('s-amt').value) || 0, 
    start_date: document.getElementById('s-start').value || null,
    end_date: document.getElementById('s-end').value || null
  };
  if(!d.name) return showAlert('名稱必填！');
  try {
    if(id) await sb.from('system_subscriptions').update(d).eq('id', id);
    else await sb.from('system_subscriptions').insert([d]);
    showAlert('已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) { showAlert('失敗：' + e.message); }
}

async function delSub(id) {
  if(!confirm('確定刪除?')) return;
  try { await sb.from('system_subscriptions').delete().eq('id', id); await loadAll(); render(); } catch(e) { showAlert('失敗：' + e.message); }
}

// ==================== 其他輔助函數 ====================
function renderExpTable() {
  const monthVal = document.getElementById('exp-month').value;
  const kw = (document.getElementById('exp-search') ? document.getElementById('exp-search').value || '' : '').toLowerCase();
  const list = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const matchMonth = (y + '-' + m) === monthVal;
    const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
    const matchKw = !kw || (cat && cat.name.toLowerCase().indexOf(kw) !== -1) || (e.description && e.description.toLowerCase().indexOf(kw) !== -1);
    return matchMonth && matchKw;
  }).sort(function(a,b) { return new Date(b.payment_date) - new Date(a.payment_date); });
  let html = '';
  for(let i=0; i<list.length; i++) {
    const e = list[i];
    const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    const statusHtml = e.is_reimbursed ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">已結帳</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">待結帳</span>';
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + e.payment_date + '</td><td class="px-4 py-3">' + (cat ? cat.name : '-') + '</td><td class="px-4 py-3 font-bold text-red-600">' + (e.amount || 0).toLocaleString() + '</td><td class="px-4 py-3 text-sm">' + (e.description || '-') + '</td><td class="px-4 py-3">' + (emp ? emp.name : '-') + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openExpModal(\'' + e.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delExp(\'' + e.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('exp-tbody').innerHTML = html;
}
