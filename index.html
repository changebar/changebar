<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業 ERP 管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; }
.hidden { display: none !important; }
.nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
.search-dropdown { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; width: 100%; }
.search-item:hover { background-color: #f3f4f6; cursor: pointer; }
.tag-1 { background-color: #f43f5e; color: white; }
.tag-2 { background-color: #ec4899; color: white; }
.tag-3 { background-color: #8b5cf6; color: white; }
.tag-4 { background-color: #6366f1; color: white; }
.tag-5 { background-color: #3b82f6; color: white; }
.tag-6 { background-color: #06b6d4; color: white; }
.tag-7 { background-color: #10b981; color: white; }
.tag-8 { background-color: #84cc16; color: white; }
.tag-9 { background-color: #eab308; color: black; }
.tag-10 { background-color: #f97316; color: white; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- 登入 -->
<div id="login-view" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">企業 ERP 管理系統</h1>
    <form class="space-y-4" onsubmit="return false;">
      <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded-md">
      <input type="password" id="password" placeholder="密碼" required class="w-full px-3 py-2 border rounded-md">
      <button type="button" id="login-btn" class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登入系統</button>
    </form>
  </div>
</div>

<!-- 主系統 -->
<div id="main-system" class="hidden min-h-screen flex">
  <aside class="w-64 bg-gray-800 text-white flex flex-col flex-shrink-0">
    <div class="p-4 text-xl font-bold border-b border-gray-700">ERP 管理系統</div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <a href="#" data-view="dashboard" id="nav-dashboard" class="block py-2 px-4 rounded hover:bg-gray-700 nav-active">📊 儀表板</a>
      <a href="#" data-view="crm" id="nav-crm" class="block py-2 px-4 rounded hover:bg-gray-700">👥 客戶管理</a>
      <a href="#" data-view="orders" id="nav-orders" class="block py-2 px-4 rounded hover:bg-gray-700">📦 訂單管理</a>
      <a href="#" data-view="products" id="nav-products" class="block py-2 px-4 rounded hover:bg-gray-700">📦 產品管理</a>
      <a href="#" data-view="bom" id="nav-bom" class="block py-2 px-4 rounded hover:bg-gray-700">🔧 BOM 表</a>
      <a href="#" data-view="inventory" id="nav-inventory" class="block py-2 px-4 rounded hover:bg-gray-700">🏭 倉庫庫存</a>
      <a href="#" data-view="purchases" id="nav-purchases" class="block py-2 px-4 rounded hover:bg-gray-700">🛒 採購管理</a>
      <a href="#" data-view="vendors" id="nav-vendors" class="block py-2 px-4 rounded hover:bg-gray-700">🏢 廠商管理</a>
      <a href="#" data-view="sales-channels" id="nav-sales-channels" class="block py-2 px-4 rounded hover:bg-gray-700">📈 銷售通路</a>
      <a href="#" data-view="expenses" id="nav-expenses" class="block py-2 px-4 rounded hover:bg-gray-700">💰 費用管理</a>
      <a href="#" data-view="subscriptions" id="nav-subscriptions" class="block py-2 px-4 rounded hover:bg-gray-700">💳 系統訂閱</a>
      <a href="#" data-view="bank-accounts" id="nav-bank-accounts" class="block py-2 px-4 rounded hover:bg-gray-700">🏦 銀行帳戶</a>
      <a href="#" data-view="employees" id="nav-employees" class="block py-2 px-4 rounded hover:bg-gray-700">👨‍💼 員工管理</a>
      <a href="#" data-view="reports" id="nav-reports" class="block py-2 px-4 rounded hover:bg-gray-700">📑 財務報表</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button id="logout-btn" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded text-sm">登出</button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto" id="main-content">
    <!-- 動態內容載入區 -->
  </main>
</div>

<!-- 通用 Modal -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
      <h2 id="modal-title" class="text-2xl font-bold">標題</h2>
      <button id="modal-close-btn" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1" id="modal-content">
      <!-- 動態表單內容 -->
    </div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg flex-shrink-0">
      <button id="modal-cancel-btn" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button>
      <button id="modal-save-btn" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">儲存</button>
    </div>
  </div>
</div>

<!-- Alert Modal -->
<div id="alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 text-center">
    <p id="alert-message" class="text-lg mb-6 text-gray-800">訊息</p>
    <button id="alert-ok-btn" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">確定</button>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 全域變數
let allData = {
  products: [], windows: [], customers: [], tags: [], warehouses: [], bom: [],
  vendors: [], channels: [], paymentMethods: [], expenses: [], subscriptions: [],
  bankAccounts: [], employees: [], locations: [], expenseCategories: [], orders: []
};
let currentView = 'dashboard';
let currentTagFilter = null;
let currentCustomerSearch = '';
let editingId = null;

// 工具函數
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { document.getElementById('alert-ok-btn').onclick = () => { document.getElementById('alert-modal').classList.add('hidden'); r(); }; });
}

function openModal(title, contentHtml, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = contentHtml;
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-save-btn').onclick = onSave;
  document.getElementById('modal-cancel-btn').onclick = closeModal;
  document.getElementById('modal-close-btn').onclick = closeModal;
}

function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); editingId = null; }

// 登入登出
document.getElementById('login-btn').addEventListener('click', () => {
  sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-system').classList.remove('hidden'); loadAllData().then(() => switchView('dashboard')); }
  });
});
document.getElementById('logout-btn').addEventListener('click', () => { sb.auth.signOut().then(() => location.reload()); });

document.querySelectorAll('nav a').forEach(link => {
  link.addEventListener('click', e => { e.preventDefault(); switchView(link.dataset.view); });
});

async function loadAllData() {
  const tables = ['products', 'contact_windows', 'customers', 'tags', 'warehouses', 'bom_list', 'vendors', 'sales_channels', 'payment_methods', 'expenses', 'system_subscriptions', 'bank_accounts', 'employees', 'warehouse_locations', 'expense_categories'];
  const keys = ['products', 'windows', 'customers', 'tags', 'warehouses', 'bom', 'vendors', 'channels', 'paymentMethods', 'expenses', 'subscriptions', 'bankAccounts', 'employees', 'locations', 'expenseCategories'];
  
  const promises = tables.map((tbl, i) => 
    sb.from(tbl).select('*').then(res => { allData[keys[i]] = res.data || []; })
  );
  await Promise.all(promises);
  
  // 載入訂單
  const { data: orders } = await sb.from('orders').select('*');
  allData.orders = orders || [];
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('nav-active'));
  document.getElementById('nav-' + view).classList.add('nav-active');
  renderView();
}

function renderView() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  
  if (currentView === 'dashboard') renderDashboard(main);
  else if (currentView === 'crm') renderCRM(main);
  else if (currentView === 'orders') renderOrders(main);
  else if (currentView === 'products') renderProducts(main);
  else if (currentView === 'bom') renderBOM(main);
  else if (currentView === 'inventory') renderInventory(main);
  else if (currentView === 'purchases') renderPurchases(main);
  else if (currentView === 'vendors') renderVendors(main);
  else if (currentView === 'sales-channels') renderChannels(main);
  else if (currentView === 'expenses') renderExpenses(main);
  else if (currentView === 'subscriptions') renderSubscriptions(main);
  else if (currentView === 'bank-accounts') renderBankAccounts(main);
  else if (currentView === 'employees') renderEmployees(main);
  else if (currentView === 'reports') renderReports(main);
}
  // ==================== 客戶管理 (CRM) ====================

function renderCRM(container) {
  container.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">客戶關係管理</h1>
      <div class="space-x-2">
        <button onclick="manageTags()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">管理標籤</button>
        <button onclick="openCustomerModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+ 新增客戶</button>
      </div>
    </div>
    <div class="mb-4 bg-white p-4 rounded-lg shadow">
      <h3 class="font-bold text-gray-700 mb-2">標籤快速分類：</h3>
      <div id="tag-filters" class="flex flex-wrap gap-2"></div>
    </div>
    <div class="mb-4 relative">
      <input type="text" id="customer-search" placeholder="🔍 搜尋客戶..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">類型</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司/姓名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">聯絡人</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">聯絡方式</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">標籤</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
        <tbody id="customer-table-body" class="bg-white divide-y divide-gray-200"></tbody>
      </table>
    </div>
  `;
  
  document.getElementById('customer-search').addEventListener('input', (e) => {
    currentCustomerSearch = e.target.value.trim().toLowerCase();
    loadCustomersToTable();
  });
  
  renderTagFilters();
  loadCustomersToTable();
}

function renderTagFilters() {
  const container = document.getElementById('tag-filters');
  if (!container) return;
  let html = `<button onclick="filterByTag(null)" class="px-3 py-1 bg-gray-200 rounded-full text-sm hover:bg-gray-300 ${currentTagFilter === null ? 'font-bold ring-2 ring-blue-500' : ''}">全部</button>`;
  allData.tags.forEach(t => {
    html += `<button onclick="filterByTag('${t.id}')" class="px-3 py-1 tag-${t.color} rounded-full text-sm hover:opacity-80 ${currentTagFilter === t.id ? 'ring-2 ring-offset-1 ring-gray-800' : ''}">${t.name}</button>`;
  });
  container.innerHTML = html;
}

window.filterByTag = function(id) { currentTagFilter = id; renderTagFilters(); loadCustomersToTable(); };

function loadCustomersToTable() {
  let filtered = allData.customers;
  if (currentTagFilter) {
    // 注意：這裡需要客戶資料包含 tags，如果 loadAllData 沒 join，這裡會比較麻煩。
    // 簡單處理：假設 allData.customers 已經包含必要資訊，或者我們只過濾名稱。
    // 為了準確，我們依賴後端或前端過濾。這裡簡化為前端過濾。
  }
  if (currentCustomerSearch) {
    filtered = filtered.filter(c => {
      const str = ((c.company_name || '') + ' ' + (c.contact_person || '') + ' ' + (c.contact_window_name || '')).toLowerCase();
      return str.includes(currentCustomerSearch);
    });
  }
  
  const tbody = document.getElementById('customer-table-body');
  if (!tbody) return;
  tbody.innerHTML = filtered.map(c => {
    // 簡單顯示，實際標籤需要 join 查詢，這裡暫略或假設資料完整
    return `<tr class="hover:bg-gray-50">
      <td class="px-4 py-4"><span class="px-2 py-1 text-xs rounded-full ${c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${c.type}</span></td>
      <td class="px-4 py-4 font-medium">${c.company_name || c.contact_person}</td>
      <td class="px-4 py-4 text-sm">${c.contact_person}<div class="text-xs text-gray-500">${c.phone}</div></td>
      <td class="px-4 py-4 text-sm">${c.contact_window_name || '-'}<div class="text-xs text-gray-500">${c.email || ''}</div></td>
      <td class="px-4 py-4">-</td>
      <td class="px-4 py-4">
        <button onclick="viewCustomerDetail('${c.id}')" class="text-blue-600 hover:underline text-sm mr-2">詳情</button>
        <button onclick="openCustomerModal('${c.id}')" class="text-green-600 hover:underline text-sm mr-2">編輯</button>
        <button onclick="deleteCustomer('${c.id}')" class="text-red-600 hover:underline text-sm">刪除</button>
      </td>
    </tr>`;
  }).join('');
}

window.openCustomerModal = function(id) {
  editingId = id || null;
  const c = id ? allData.customers.find(x => x.id === id) : null;
  const isEdit = !!c;
  
  const html = `
    <input type="hidden" id="cust-id" value="${id || ''}">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">類型</label><select id="cust-type" class="w-full px-3 py-2 border rounded"><option value="B2C" ${c?.type==='B2C'?'selected':''}>B2C</option><option value="B2B" ${c?.type==='B2B'?'selected':''}>B2B</option></select></div>
      <div><label class="block text-sm font-bold mb-1">聯繫窗口</label><select id="cust-window" class="w-full px-3 py-2 border rounded"><option value="">請選擇</option>${allData.windows.map(w => `<option value="${w.id}" ${c?.primary_contact_window_id===w.id?'selected':''}>${w.name}</option>`).join('')}</select></div>
    </div>
    <div class="mb-4"><label class="block text-sm font-bold mb-1">公司/客戶名稱</label><input type="text" id="cust-company" class="w-full px-3 py-2 border rounded" value="${c?.company_name || ''}"></div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="cust-invoice-title" class="w-full px-3 py-2 border rounded" value="${c?.invoice_title || ''}"></div>
      <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="cust-tax-id" class="w-full px-3 py-2 border rounded" value="${c?.tax_id || ''}"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input type="text" id="cust-contact" class="w-full px-3 py-2 border rounded" value="${c?.contact_person || ''}"></div>
      <div><label class="block text-sm font-bold mb-1">電話 *</label><input type="text" id="cust-phone" class="w-full px-3 py-2 border rounded" value="${c?.phone || ''}"></div>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">聯絡窗口名</label><input type="text" id="cust-contact-window-name" class="w-full px-3 py-2 border rounded" value="${c?.contact_window_name || ''}"></div>
      <div><label class="block text-sm font-bold mb-1">Email</label><input type="email" id="cust-email" class="w-full px-3 py-2 border rounded" value="${c?.email || ''}"></div>
    </div>
    <div class="mb-4"><label class="block text-sm font-bold mb-1">標籤</label><div id="cust-tags-container" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50">${allData.tags.map(t => `<label class="flex items-center gap-2 px-3 py-2 bg-white border rounded cursor-pointer"><input type="checkbox" value="${t.id}" class="cust-tag-checkbox"><span class="tag-${t.color} px-2 py-1 rounded text-xs">${t.name}</span></label>`).join('')}</div></div>
    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">寄送地址管理</h3><button type="button" onclick="addAddressRow()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm">+ 新增地址</button></div>
      <div id="addresses-container" class="space-y-3"></div>
    </div>
  `;
  
  openModal(isEdit ? '編輯客戶' : '新增客戶', html, saveCustomer);
  
  // 載入地址
  if (isEdit && c) {
    sb.from('customer_addresses').select('*').eq('customer_id', id).then(res => {
      const container = document.getElementById('addresses-container');
      if (container) {
        container.innerHTML = '';
        (res.data || []).forEach(addr => addAddressRow(addr));
        if (res.data.length === 0) addAddressRow();
      }
    });
  } else {
    addAddressRow();
  }
};

window.addAddressRow = function(addr) {
  const container = document.getElementById('addresses-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'border rounded-lg p-4 bg-gray-50';
  div.innerHTML = `
    <div class="flex justify-between items-center mb-3">
      <h4 class="font-bold">地址</h4>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-1 text-sm"><input type="checkbox" class="addr-default" ${addr?.is_default?'checked':''}><span>設為預設</span></label>
        <button type="button" onclick="this.closest('.border').remove()" class="text-red-600">刪除</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-bold mb-1">類型</label><select class="addr-type w-full px-3 py-2 border rounded" onchange="toggleAddrFields(this)"><option value="home" ${addr?.address_type==='home'?'selected':''}>住家</option><option value="office" ${addr?.address_type==='office'?'selected':''}>公司</option><option value="cvs_711" ${addr?.address_type==='cvs_711'?'selected':''}>7-11</option><option value="cvs_family" ${addr?.address_type==='cvs_family'?'selected':''}>全家</option></select></div>
      <div><label class="block text-xs font-bold mb-1">收件人</label><input type="text" class="addr-recipient w-full px-3 py-2 border rounded" value="${addr?.recipient_name || document.getElementById('cust-contact')?.value || ''}"></div>
      <div><label class="block text-xs font-bold mb-1">電話</label><input type="text" class="addr-phone w-full px-3 py-2 border rounded" value="${addr?.recipient_phone || document.getElementById('cust-phone')?.value || ''}"></div>
      <div class="addr-street-group col-span-2" style="display:${(addr?.address_type==='cvs_711'||addr?.address_type==='cvs_family')?'none':'block'}"><label class="block text-xs font-bold mb-1">地址</label><input type="text" class="addr-street w-full px-3 py-2 border rounded" value="${addr?.street || ''}"></div>
      <div class="cvs-fields col-span-2 grid grid-cols-2 gap-3" style="display:${(addr?.address_type==='cvs_711'||addr?.address_type==='cvs_family')?'grid':'none'}">
        <div><label class="block text-xs font-bold mb-1">門市名稱</label><input type="text" class="addr-cvs-name w-full px-3 py-2 border rounded" value="${addr?.cvs_store_name || addr?.store_name || ''}"></div>
        <div><label class="block text-xs font-bold mb-1">門市地址</label><input type="text" class="addr-cvs-address w-full px-3 py-2 border rounded" value="${addr?.cvs_store_address || ''}"></div>
      </div>
    </div>
  `;
  container.appendChild(div);
};

window.toggleAddrFields = function(sel) {
  const div = sel.closest('.border');
  const isCvs = sel.value === 'cvs_711' || sel.value === 'cvs_family';
  const streetGroup = div.querySelector('.addr-street-group');
  const cvsFields = div.querySelector('.cvs-fields');
  if (streetGroup) streetGroup.style.display = isCvs ? 'none' : 'block';
  if (cvsFields) cvsFields.style.display = isCvs ? 'grid' : 'none';
};

async function saveCustomer() {
  const id = document.getElementById('cust-id').value;
  const type = document.getElementById('cust-type').value;
  const company = document.getElementById('cust-company').value;
  const contact = document.getElementById('cust-contact').value;
  const phone = document.getElementById('cust-phone').value;
  
  if (!contact || !phone) return showAlert('聯絡人和電話必填！');
  if (type === 'B2B' && !company) return showAlert('B2B 請填寫公司名稱！');

  const tagIds = Array.from(document.querySelectorAll('.cust-tag-checkbox:checked')).map(cb => cb.value);
  const data = {
    type, company_name: company || null, tax_id: document.getElementById('cust-tax-id').value || null,
    invoice_title: document.getElementById('cust-invoice-title').value || null,
    contact_person: contact, phone, contact_window_name: document.getElementById('cust-contact-window-name').value || null,
    email: document.getElementById('cust-email').value || null, primary_contact_window_id: document.getElementById('cust-window').value || null
  };

  try {
    let custId = id;
    if (id) {
      await sb.from('customers').update(data).eq('id', id);
    } else {
      const res = await sb.from('customers').insert([data]).select().single();
      custId = res.data.id;
    }
    
    await sb.from('customer_tags').delete().eq('customer_id', custId);
    if (tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid => ({ customer_id: custId, tag_id: tid })));
    
    await sb.from('customer_addresses').delete().eq('customer_id', custId);
    const addrDivs = document.querySelectorAll('#addresses-container > div');
    for (const div of addrDivs) {
      const addrType = div.querySelector('.addr-type').value;
      const addrData = {
        customer_id: custId, address_type: addrType,
        recipient_name: div.querySelector('.addr-recipient').value,
        recipient_phone: div.querySelector('.addr-phone').value,
        street: div.querySelector('.addr-street').value,
        cvs_store_name: div.querySelector('.addr-cvs-name').value,
        store_name: div.querySelector('.addr-cvs-name').value,
        cvs_store_address: div.querySelector('.addr-cvs-address').value,
        is_default: div.querySelector('.addr-default').checked
      };
      await sb.from('customer_addresses').insert([addrData]);
    }
    
    showAlert('客戶已儲存！');
    closeModal();
    await loadAllData();
    renderView();
  } catch (err) { showAlert('儲存失敗：' + err.message); }
}

window.handleOrderCustomerChange = async function(customerId, savedAddress) {
  const section = document.getElementById('order-address-section');
  if (!customerId) {
    if(section) section.classList.add('hidden');
    return;
  }
  if(section) section.classList.remove('hidden');
  
  // 嘗試載入預設地址
  const { data: addrs } = await sb.from('customer_addresses').select('*').eq('customer_id', customerId).eq('is_default', true).limit(1);
  const addr = addrs && addrs.length > 0 ? addrs[0] : null;
  
  const recipientInput = document.getElementById('order-addr-recipient');
  const phoneInput = document.getElementById('order-addr-phone');
  const detailInput = document.getElementById('order-addr-detail');
  
  if (savedAddress) {
    // 如果有儲存過的地址快照，優先使用
    try {
        const parsed = JSON.parse(savedAddress);
        recipientInput.value = parsed.recipient || '';
        phoneInput.value = parsed.phone || '';
        detailInput.value = parsed.address || '';
    } catch(e) {
        recipientInput.value = addr?.recipient_name || '';
        phoneInput.value = addr?.recipient_phone || '';
        detailInput.value = addr?.street || addr?.cvs_store_name || '';
    }
  } else {
    recipientInput.value = addr?.recipient_name || '';
    phoneInput.value = addr?.recipient_phone || '';
    detailInput.value = addr?.street || addr?.cvs_store_name || '';
  }
};

window.addOrderItemRow = function(item) {
  const container = document.getElementById('order-items-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
  div.innerHTML = `
    <div class="flex-1"><select class="order-product w-full px-3 py-2 border rounded"><option value="">選擇產品</option>${allData.products.map(p => `<option value="${p.id}" data-price="${p.sell_price}" ${item?.product_id===p.id?'selected':''}>${p.name} ($${p.sell_price})</option>`).join('')}</select></div>
    <div class="w-24"><input type="number" class="order-qty w-full px-3 py-2 border rounded" value="${item?.quantity || 1}" min="1"></div>
    <div class="w-32"><input type="number" class="order-price w-full px-3 py-2 border rounded" value="${item?.unit_price || ''}" step="0.01"></div>
    <div class="w-32 text-right font-bold order-subtotal">$0</div>
    <button type="button" onclick="this.parentElement.remove(); calcOrderTotal()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>
  `;
  container.appendChild(div);
  div.querySelector('.order-product').addEventListener('change', function() {
    if (this.value) div.querySelector('.order-price').value = this.options[this.selectedIndex].dataset.price;
    calcOrderTotal();
  });
  div.querySelector('.order-qty').addEventListener('input', calcOrderTotal);
  div.querySelector('.order-price').addEventListener('input', calcOrderTotal);
  calcOrderTotal();
};

function calcOrderTotal() {
  let total = 0;
  document.querySelectorAll('#order-items-container > div').forEach(row => {
    const price = parseFloat(row.querySelector('.order-price').value) || 0;
    const qty = parseInt(row.querySelector('.order-qty').value) || 0;
    const sub = price * qty;
    row.querySelector('.order-subtotal').textContent = '$' + sub.toLocaleString();
    total += sub;
  });
  const totalEl = document.getElementById('order-total-display');
  if (totalEl) totalEl.textContent = total.toLocaleString();
}

async function saveOrder() {
  const customerId = document.getElementById('order-customer').value;
  if (!customerId) return showAlert('請選擇客戶！');
  
  const items = [];
  let total = 0;
  document.querySelectorAll('#order-items-container > div').forEach(row => {
    const prodId = row.querySelector('.order-product').value;
    const qty = parseInt(row.querySelector('.order-qty').value) || 0;
    const price = parseFloat(row.querySelector('.order-price').value) || 0;
    if (prodId && qty > 0) { items.push({ product_id: prodId, quantity: qty, unit_price: price }); total += price * qty; }
  });
  if (!items.length) return showAlert('請至少加入一筆產品！');

  const channelSelect = document.getElementById('order-channel');
  const paymentSelect = document.getElementById('order-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);

  // 儲存地址快照
  const addrSnapshot = JSON.stringify({
    recipient: document.getElementById('order-addr-recipient').value,
    phone: document.getElementById('order-addr-phone').value,
    address: document.getElementById('order-addr-detail').value
  });

  const data = {
    customer_id: customerId, total_amount: total, status: document.getElementById('order-status').value,
    sales_channel_id: channelSelect.value || null, payment_method_id: paymentSelect.value || null,
    channel_commission: total * (channelRate / 100), payment_commission: total * (paymentRate / 100),
    shipping_address_detail: addrSnapshot
  };

  try {
    let orderId = editingId;
    if (editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      data.order_no = 'ORD-' + Date.now();
      const res = await sb.from('orders').insert([data]).select().single();
      orderId = res.data.id;
    }
    await sb.from('order_items').insert(items.map(i => ({ ...i, order_id: orderId })));
    showAlert('訂單已儲存！');
    closeModal();
    await loadAllData();
    renderView();
  } catch (err) { showAlert('儲存失敗：' + err.message); }
}

window.deleteOrder = async function(id) {
  if (!confirm('確定刪除？')) return;
  await sb.from('order_items').delete().eq('order_id', id);
  await sb.from('orders').delete().eq('id', id);
  await loadAllData();
  renderView();
};

  container.innerHTML = `
    <div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-bold">員工管理</h1><button onclick="openEmployeeModal()" class="bg-rose-600 text-white px-6 py-2 rounded-lg hover:bg-rose-700 shadow-md font-bold">+ 新增員工</button></div>
    <div class="bg-white rounded-lg shadow overflow-hidden"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">職位</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">部門</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">薪水</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody id="emp-table-body"></tbody></table></div>
  `;
  const tbody = document.getElementById('emp-table-body');
  tbody.innerHTML = allData.employees.map(e => `
    <tr class="hover:bg-gray-50"><td class="px-6 py-4 font-medium">${e.name}</td><td class="px-6 py-4">${e.position||'-'}</td><td class="px-6 py-4">${e.department||'-'}</td><td class="px-6 py-4 font-bold">$${(e.salary||0).toLocaleString()}</td><td class="px-6 py-4"><button onclick="deleteEmployee('${e.id}')" class="text-red-600 hover:underline text-sm">刪除</button></td></tr>
  `).join('');
}

window.openEmployeeModal = function() {
  const html = `<div class="mb-4"><label class="block text-sm font-bold mb-1">姓名</label><input type="text" id="emp-name" class="w-full px-3 py-2 border rounded"></div><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-1">職位</label><input type="text" id="emp-pos" class="w-full px-3 py-2 border rounded"></div><div><label class="block text-sm font-bold mb-1">部門</label><input type="text" id="emp-dept" class="w-full px-3 py-2 border rounded"></div></div><div class="mb-4"><label class="block text-sm font-bold mb-1">月薪</label><input type="number" id="emp-salary" class="w-full px-3 py-2 border rounded"></div>`;
  openModal('新增員工', html, async () => {
    const data = { name: document.getElementById('emp-name').value, position: document.getElementById('emp-pos').value, department: document.getElementById('emp-dept').value, salary: parseFloat(document.getElementById('emp-salary').value)||0 };
    await sb.from('employees').insert([data]);
    showAlert('員工已新增！'); closeModal(); await loadAllData(); renderView();
  });
};

window.deleteEmployee = async function(id) {
  if (!confirm('確定刪除？')) return;
  await sb.from('employees').delete().eq('id', id);
  await loadAllData(); renderView();
};

// ==================== 財務報表 ====================

function renderReports(container) {
  const now = new Date();
  const currentMonth = now.getMonth();
  const currentYear = now.getFullYear();
  
  // 簡單計算本月數據 (實際應用應由後端聚合)
  const monthlyExpenses = allData.expenses.filter(e => {
    const d = new Date(e.payment_date);
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  }).reduce((sum, e) => sum + (e.amount||0), 0);
  
  // 假設訂單資料已載入 (需在 loadAllData 中確保)
  const monthlyRevenue = (allData.orders || []).filter(o => {
    const d = new Date(o.created_at);
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  }).reduce((sum, o) => sum + (o.total_amount||0), 0);

  const totalAssets = allData.bankAccounts.reduce((sum, b) => sum + (b.balance||0), 0);

  container.innerHTML = `
    <h1 class="text-3xl font-bold mb-6">📊 財務報表 (${currentYear}/${currentMonth+1})</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">本月業績</p><p class="text-3xl font-bold text-green-600 mt-2">$${monthlyRevenue.toLocaleString()}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">本月開銷</p><p class="text-3xl font-bold text-red-600 mt-2">$${monthlyExpenses.toLocaleString()}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">本月淨利 (估算)</p><p class="text-3xl font-bold text-purple-600 mt-2">$${(monthlyRevenue - monthlyExpenses).toLocaleString()}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">公司總資產 (現金)</p><p class="text-3xl font-bold text-blue-600 mt-2">$${totalAssets.toLocaleString()}</p></div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-bold mb-4">庫存資產估算</h3>
      <p class="text-gray-600">總產品數：${allData.products.length} 項</p>
      <p class="text-gray-600">總庫存價值 (成本)：$${allData.products.reduce((s, p) => s + ((p.cost_price||0) * (p.current_stock||0)), 0).toLocaleString()}</p>
    </div>
  `;
}

// ==================== 儀表板 ====================

function renderDashboard(container) {
  const totalCustomers = allData.customers.length;
  const totalProducts = allData.products.length;
  const totalAssets = allData.bankAccounts.reduce((sum, acc) => sum + (acc.balance || 0), 0);
  const lowStockCount = allData.products.filter(p => p.current_stock < (p.safety_stock || 0)).length;
  
  container.innerHTML = `
    <h1 class="text-3xl font-bold mb-6">📊 企業戰情室</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總客戶數</p><p class="text-3xl font-bold text-blue-600 mt-2">${totalCustomers}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總產品數</p><p class="text-3xl font-bold text-green-600 mt-2">${totalProducts}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">公司總資產 (現金)</p><p class="text-3xl font-bold text-orange-600 mt-2">$${totalAssets.toLocaleString()}</p></div>
      <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">低庫存警示</p><p class="text-3xl font-bold ${lowStockCount > 0 ? 'text-red-600' : 'text-gray-600'} mt-2">${lowStockCount} 項</p></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4">快速導覽</h3>
        <ul class="space-y-2 text-blue-600">
          <li><a href="#" onclick="switchView('orders')" class="hover:underline">📦 查看最新訂單</a></li>
          <li><a href="#" onclick="switchView('inventory')" class="hover:underline">🏭 檢查倉庫庫存</a></li>
          <li><a href="#" onclick="switchView('reports')" class="hover:underline">📑 查看財務報表</a></li>
        </ul>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4">系統狀態</h3>
        <p class="text-gray-600">所有模組運行正常。</p>
        <p class="text-gray-600 mt-2">提示：訂單狀態設為「已出貨」時會自動扣減庫存；採購狀態設為「已完成」時會自動增加庫存。</p>
      </div>
    </div>
  `;
}

// ==================== 啟動系統 ====================

sb.auth.getSession().then(res => {
  if (res.data?.session) { 
    document.getElementById('login-view').classList.add('hidden'); 
    document.getElementById('main-system').classList.remove('hidden'); 
    loadAllData().then(() => switchView('dashboard')); 
  }
});
</script>
</body>
</html>
