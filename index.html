<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老闆退休管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; }
.hidden { display: none !important; }
.nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
.search-dropdown { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; width: 100%; }
.search-item:hover { background-color: #f3f4f6; cursor: pointer; }
.tag-1 { background-color: #f43f5e; color: white; }
.tag-2 { background-color: #ec4899; color: white; }
.tag-3 { background-color: #8b5cf6; color: white; }
.tag-4 { background-color: #6366f1; color: white; }
.tag-5 { background-color: #3b82f6; color: white; }
.tag-6 { background-color: #06b6d4; color: white; }
.tag-7 { background-color: #10b981; color: white; }
.tag-8 { background-color: #84cc16; color: white; }
.tag-9 { background-color: #eab308; color: black; }
.tag-10 { background-color: #f97316; color: white; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- 登入頁面 -->
<div id="login-view" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">企業戰情室登入</h1>
    <form class="space-y-4" onsubmit="return false;">
      <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded-md">
      <input type="password" id="password" placeholder="密碼" required class="w-full px-3 py-2 border rounded-md">
      <button type="button" id="login-btn" class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登入系統</button>
    </form>
  </div>
</div>

<!-- 主系統 -->
<div id="main-system" class="hidden min-h-screen flex">
  <aside class="w-64 bg-gray-800 text-white flex flex-col flex-shrink-0">
    <div class="p-4 text-xl font-bold border-b border-gray-700">退休管理系統</div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" data-view="dashboard" id="nav-dashboard" class="block py-2 px-4 rounded hover:bg-gray-700 nav-active">儀表板</a>
      <a href="#" data-view="crm" id="nav-crm" class="block py-2 px-4 rounded hover:bg-gray-700">客戶管理</a>
      <a href="#" data-view="orders" id="nav-orders" class="block py-2 px-4 rounded hover:bg-gray-700">訂單管理</a>
      <a href="#" data-view="inventory" id="nav-inventory" class="block py-2 px-4 rounded hover:bg-gray-700">倉庫庫存</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button id="logout-btn" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded text-sm">登出</button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <div id="view-dashboard">
      <h1 class="text-3xl font-bold mb-6">老闆，早安！戰情總覽：</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總客戶數</p><p id="stat-customers" class="text-3xl font-bold text-blue-600 mt-2">0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總訂單數</p><p id="stat-orders" class="text-3xl font-bold text-green-600 mt-2">0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總營收</p><p id="stat-revenue" class="text-3xl font-bold text-purple-600 mt-2">$0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">公司吸收運費成本</p><p id="stat-shipping-cost" class="text-3xl font-bold text-orange-600 mt-2">$0</p></div>
      </div>
    </div>

    <div id="view-crm" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">客戶關係管理</h1>
        <div class="space-x-2">
          <button id="btn-open-window-modal" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">管理聯繫窗口</button>
          <button id="btn-open-tag-modal" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">管理標籤</button>
          <button id="btn-open-customer-modal" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+ 新增客戶</button>
        </div>
      </div>
      <div class="mb-4 bg-white p-4 rounded-lg shadow">
        <h3 class="font-bold text-gray-700 mb-2">標籤快速分類：</h3>
        <div id="tag-filters" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="mb-4 relative">
        <input type="text" id="customer-search" placeholder="搜尋客戶姓名、公司、電話..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown mt-2 hidden"></div>
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">類型</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司/姓名 (電話)</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">統編</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">標籤</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
          <tbody id="customer-table-body" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <div id="view-orders" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">訂單管理</h1>
        <button id="btn-open-order-modal" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 shadow-md font-bold">+ 新增訂單</button>
      </div>
      <div class="mb-4 relative">
        <input type="text" id="order-search" placeholder="搜尋訂單 (客戶名稱、發票號碼)..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">訂單日期</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">客戶</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">總金額</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">發票</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
          <tbody id="order-table-body" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <div id="view-inventory" class="hidden">
      <h1 class="text-3xl font-bold mb-6">倉庫庫存管理</h1>
      <div id="warehouse-inventory-container" class="space-y-6"></div>
    </div>
  </main>
</div>

<!-- 客戶 Modal (保持不變) -->
<div id="customer-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
      <h2 id="customer-modal-title" class="text-2xl font-bold">新增客戶</h2>
      <button id="btn-close-customer-modal" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1">
      <form id="customer-form" onsubmit="return false;" class="space-y-4">
        <input type="hidden" id="cust-id">
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">類型</label><select id="cust-type" class="w-full px-3 py-2 border rounded"><option value="B2C">B2C</option><option value="B2B">B2B</option></select></div>
          <div><label class="block text-sm font-bold mb-1">聯繫窗口</label><select id="cust-window" class="w-full px-3 py-2 border rounded"></select></div>
        </div>
        <div><label class="block text-sm font-bold mb-1">公司/客戶名稱 <span id="company-required" class="text-red-500 hidden">*</span></label><input type="text" id="cust-company" class="w-full px-3 py-2 border rounded"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="cust-tax-id" class="w-full px-3 py-2 border rounded"></div>
          <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="cust-invoice-title" class="w-full px-3 py-2 border rounded"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input type="text" id="cust-contact" required class="w-full px-3 py-2 border rounded"></div>
          <div><label class="block text-sm font-bold mb-1">電話 *</label><input type="text" id="cust-phone" required class="w-full px-3 py-2 border rounded"></div>
        </div>
        <div><label class="block text-sm font-bold mb-1">標籤</label><div id="customer-tags-container" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50"></div></div>
        <div class="border-t pt-4">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-lg">寄送地址管理</h3>
            <button type="button" id="btn-add-address" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">+ 新增地址</button>
          </div>
          <div id="customer-addresses-container" class="space-y-3"></div>
        </div>
      </form>
    </div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg flex-shrink-0">
      <button type="button" id="btn-cancel-customer" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button>
      <button type="button" id="btn-save-customer" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">儲存</button>
    </div>
  </div>
</div>

<!-- 訂單 Modal (核心升級) -->
<div id="order-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
      <h2 id="order-modal-title" class="text-2xl font-bold">新增訂單</h2>
      <button id="btn-close-order-modal" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1">
      <form id="order-form" onsubmit="return false;" class="space-y-6">
        <input type="hidden" id="order-id">
        
        <!-- 1. 客戶 -->
        <div>
          <label class="block text-sm font-bold mb-2">1. 選擇客戶 *</label>
          <div class="relative">
            <input type="text" id="order-customer-search" placeholder="搜尋客戶..." class="w-full px-4 py-2 border rounded" autocomplete="off">
            <div id="order-customer-dropdown" class="search-dropdown mt-1 hidden"></div>
            <input type="hidden" id="selected-customer-id">
          </div>
          <p id="selected-customer-display" class="mt-2 text-sm text-blue-600 hidden"></p>
        </div>

        <!-- 2. 發票與稅金 -->
        <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
          <h3 class="font-bold mb-3">發票與稅金資訊</h3>
          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-bold mb-1">需要發票 *</label>
              <select id="order-need-invoice" class="w-full px-3 py-2 border rounded">
                <option value="no">不需要</option>
                <option value="yes">需要</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">稅金處理</label>
              <select id="order-tax-handling" class="w-full px-3 py-2 border rounded">
                <option value="tax_included">含稅價 (反推未稅)</option>
                <option value="tax_excluded">稅外加 (+5%)</option>
                <option value="no_invoice">不開發票 (無稅)</option>
              </select>
            </div>
            <div id="invoice-type-group">
              <label class="block text-sm font-bold mb-1">發票類型</label>
              <select id="order-invoice-type" class="w-full px-3 py-2 border rounded">
                <option value="3">三聯式</option>
                <option value="2">二聯式</option>
              </select>
            </div>
            <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="order-invoice-title" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="order-tax-id" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-sm font-bold mb-1">發票號碼</label><input type="text" id="order-invoice-no" class="w-full px-3 py-2 border rounded"></div>
          </div>
        </div>

        <!-- 3. 地址 -->
        <div>
          <label class="block text-sm font-bold mb-2">2. 寄送地址 *</label>
          <div class="flex gap-2 mb-2">
            <select id="shipping-address-select" class="flex-1 px-4 py-2 border rounded">
              <option value="">請先選擇客戶...</option>
            </select>
            <button type="button" id="btn-enable-temp-address" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">手動輸入</button>
          </div>
          <div id="temp-address-section" class="hidden grid grid-cols-2 gap-4 p-4 bg-gray-50 rounded border">
            <div><label class="block text-xs font-bold mb-1">收件人</label><input type="text" id="temp-recipient" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-xs font-bold mb-1">電話</label><input type="text" id="temp-phone" class="w-full px-3 py-2 border rounded"></div>
            <div class="col-span-2"><label class="block text-xs font-bold mb-1">地址</label><input type="text" id="temp-address" class="w-full px-3 py-2 border rounded"></div>
          </div>
        </div>

        <!-- 4. 產品 -->
        <div>
          <label class="block text-sm font-bold mb-2">3. 產品明細</label>
          <div id="order-items-container" class="space-y-3"></div>
          <button type="button" id="btn-add-order-item" class="mt-3 px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">+ 新增產品</button>
        </div>

        <!-- 5. 運費 (新邏輯) -->
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
          <h3 class="font-bold mb-3">運費與成本</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold mb-1">運費金額 (公司實際支出)</label>
              <input type="number" id="shipping-amount" class="w-full px-3 py-2 border rounded" value="0" min="0" placeholder="例如: 100">
            </div>
            <div>
              <label class="block text-sm font-bold mb-1">運費支付方式</label>
              <select id="shipping-type" class="w-full px-3 py-2 border rounded">
                <option value="customer_pay">客人自付 (加在總價，公司成本 0)</option>
                <option value="company_absorb">公司吸收/免運 (不加總價，記為公司成本)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 6. 總計 -->
        <div class="bg-gray-50 p-4 rounded-lg border-2 border-purple-200">
          <div class="flex justify-between items-start">
            <div class="space-y-2">
              <div class="text-sm text-gray-600">商品小計：<span id="display-subtotal" class="font-bold">$0</span></div>
              <div class="text-sm text-gray-600" id="display-tax-row">稅金：<span id="display-tax" class="font-bold">$0</span></div>
              <div class="text-sm text-gray-600 hidden" id="display-shipping-info"></div>
              <div class="text-3xl font-bold text-purple-600 mt-4">訂單總金額：<span id="order-total-amount">$0</span></div>
              <div class="text-xs text-gray-500" id="order-tax-info"></div>
            </div>
            <div class="w-1/2"><label class="block text-sm font-bold mb-1">備註</label><textarea id="order-notes" class="w-full px-3 py-2 border rounded" rows="3"></textarea></div>
          </div>
        </div>
      </form>
    </div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg flex-shrink-0">
      <button type="button" id="btn-cancel-order" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button>
      <button type="button" id="btn-save-order" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">儲存訂單</button>
    </div>
  </div>
</div>

<!-- 其他 Modal (標籤、窗口、詳情、Alert) 保持不變，為節省空間省略，請確保你有這些 HTML 結構 -->
<div id="tag-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[80vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0"><h2 class="text-2xl font-bold">管理標籤</h2><button id="btn-close-tag-modal" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button></div>
    <div class="p-6 overflow-y-auto flex-1">
      <div class="flex gap-2 mb-4"><input type="text" id="new-tag-name" placeholder="新標籤名稱" class="flex-1 px-3 py-2 border rounded"><select id="new-tag-color" class="px-3 py-2 border rounded"><option value="1">紅色</option><option value="2">粉色</option><option value="3">紫色</option><option value="4">靛藍</option><option value="5">藍色</option><option value="6">青色</option><option value="7">綠色</option><option value="8">黃綠</option><option value="9">黃色</option><option value="10">橘色</option></select><button id="btn-add-tag" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">新增</button></div>
      <div id="tag-list-container" class="space-y-2"></div>
    </div>
    <div class="p-4 border-t flex justify-end bg-gray-50 rounded-b-lg flex-shrink-0"><button id="btn-cancel-tag" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button></div>
  </div>
</div>

<div id="window-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[80vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0"><h2 class="text-2xl font-bold">管理聯繫窗口</h2><button id="btn-close-window-modal" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button></div>
    <div class="p-6 overflow-y-auto flex-1">
      <div class="flex gap-2 mb-4"><input type="text" id="new-window-name" placeholder="窗口姓名" class="flex-1 px-3 py-2 border rounded"><select id="new-window-role" class="px-3 py-2 border rounded"><option value="sales">業務</option><option value="support">客服</option><option value="manager">經理</option></select><button id="btn-add-window" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">新增</button></div>
      <div id="window-list-container" class="space-y-2"></div>
    </div>
    <div class="p-4 border-t flex justify-end bg-gray-50 rounded-b-lg flex-shrink-0"><button id="btn-cancel-window" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button></div>
  </div>
</div>

<div id="customer-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0"><h2 class="text-2xl font-bold">客戶詳細資料</h2><button id="btn-close-detail-modal" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button></div>
    <div class="p-6 overflow-y-auto flex-1" id="customer-detail-content"></div>
    <div class="p-4 border-t flex justify-end bg-gray-50 rounded-b-lg flex-shrink-0"><button id="btn-cancel-detail" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button></div>
  </div>
</div>

<div id="custom-alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 text-center">
    <p id="custom-alert-message" class="text-lg mb-6 text-gray-800">訊息內容</p>
    <div class="flex justify-center space-x-4">
      <button id="custom-alert-ok-btn" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">確定</button>
      <button id="custom-alert-cancel-btn" class="hidden px-6 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">取消</button>
    </div>
  </div>
</div>

<script>

// 自訂 Alert/Confirm
function showAlert(message) {
  return new Promise(function(resolve) {
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-cancel-btn').classList.add('hidden');
    document.getElementById('custom-alert-modal').classList.remove('hidden');
    document.getElementById('custom-alert-ok-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve();
    };
  });
}

function showConfirm(message) {
  return new Promise(function(resolve) {
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-cancel-btn').classList.remove('hidden');
    document.getElementById('custom-alert-modal').classList.remove('hidden');
    document.getElementById('custom-alert-ok-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve(true);
    };
    document.getElementById('custom-alert-cancel-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve(false);
    };
  });
}

function loadDashboardData() {
  sb.from('customers').select('*', { count: 'exact', head: true }).then(function(r) { document.getElementById('stat-customers').textContent = r.count || 0; });

    var c = result.data;

    document.getElementById('cust-id').value = c.id;
    document.getElementById('cust-type').value = c.type;
    document.getElementById('company-required').classList.toggle('hidden', c.type === 'B2C');
    document.getElementById('cust-company').value = c.company_name || '';
    document.getElementById('cust-tax-id').value = c.tax_id || '';
    document.getElementById('cust-invoice-title').value = c.invoice_title || c.company_name || '';
    document.getElementById('cust-contact').value = c.contact_person;
    document.getElementById('cust-phone').value = c.phone;

}

document.getElementById('btn-save-customer').addEventListener('click', function() {
  var id = document.getElementById('cust-id').value;
  var type = document.getElementById('cust-type').value;
  var company = document.getElementById('cust-company').value;
  if (type === 'B2B' && !company) { showAlert('B2B 請填寫公司名稱！'); return; }
  if (!document.getElementById('cust-contact').value || !document.getElementById('cust-phone').value) { showAlert('聯絡人和電話必填！'); return; }

  var tagIds = Array.from(document.querySelectorAll('.cust-tag-checkbox:checked')).map(function(cb) { return cb.value; });
  var customerData = { type: type, company_name: company || null, tax_id: document.getElementById('cust-tax-id').value || null, invoice_title: document.getElementById('cust-invoice-title').value || null, contact_person: document.getElementById('cust-contact').value, phone: document.getElementById('cust-phone').value, primary_contact_window_id: document.getElementById('cust-window').value || null };

  var savePromise = id ? sb.from('customers').update(customerData).eq('id', id) : sb.from('customers').insert([customerData]).select().single();
  
  savePromise.then(function(result) {
    var customerId = id || result.data.id;
    return sb.from('customer_tags').delete().eq('customer_id', customerId).then(function() {
      if (tagIds.length) return sb.from('customer_tags').insert(tagIds.map(function(tid) { return { customer_id: customerId, tag_id: tid }; }));
    });
  }).then(function() {
    return sb.from('customer_addresses').delete().eq('customer_id', document.getElementById('cust-id').value);
  }).then(function() {
    var addressDivs = document.querySelectorAll('#customer-addresses-container > div');
    var promises = [];
    for (var i = 0; i < addressDivs.length; i++) {
      var div = addressDivs[i];
      promises.push(sb.from('customer_addresses').insert([{ customer_id: document.getElementById('cust-id').value, address_type: div.querySelector('.addr-type').value, address_name: div.querySelector('.addr-name').value, recipient_name: div.querySelector('.addr-recipient').value, recipient_phone: div.querySelector('.addr-phone').value, city: div.querySelector('.addr-city').value, district: div.querySelector('.addr-district').value, street: div.querySelector('.addr-street').value, cvs_store_name: div.querySelector('.addr-cvs-name').value, cvs_store_code: div.querySelector('.addr-cvs-code').value, is_default: div.querySelector('.addr-default').checked }]));

});

function loadCustomers() {
  var query = sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id)');
  if (currentTagFilter) query = query.eq('customer_tags.tag_id', currentTagFilter);
  query.order('created_at', { ascending: false }).then(function(result) {
    allCustomers = result.data || [];
    var tbody = document.getElementById('customer-table-body');
    tbody.innerHTML = '';
    if (!allCustomers.length) { tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">尚無客戶</td></tr>'; return; }
    allCustomers.forEach(function(c) {
      var tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';
      var tags = '';
      if (c.customer_tags) {
        c.customer_tags.forEach(function(ct) {
          var tag = allTags.find(function(t) { return t.id === ct.tag_id; });
          if (tag) tags += '<span class="tag-' + tag.color + ' px-2 py-1 rounded text-xs mr-1">' + tag.name + '</span>';
        });
      }
      tr.innerHTML = '<td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full ' + (c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800') + '">' + c.type + '</span></td><td class="px-6 py-4"><div class="font-medium">' + (c.company_name || c.contact_person) + '</div><div class="text-xs text-gray-500">' + c.phone + '</div></td><td class="px-6 py-4 text-sm">' + (c.tax_id || '-') + '</td><td class="px-6 py-4">' + tags + '</td><td class="px-6 py-4"><button class="btn-view-detail text-blue-600 hover:underline text-sm mr-2" data-id="' + c.id + '">詳情</button><button class="btn-edit-customer text-green-600 hover:underline text-sm mr-2" data-id="' + c.id + '">編輯</button><button class="btn-delete-customer text-red-600 hover:underline text-sm" data-id="' + c.id + '">刪除</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('.btn-view-detail').forEach(function(btn) { btn.addEventListener('click', function() { viewCustomerDetail(this.getAttribute('data-id')); }); });
    tbody.querySelectorAll('.btn-edit-customer').forEach(function(btn) { btn.addEventListener('click', function() { openCustomerModal(this.getAttribute('data-id')); }); });
    tbody.querySelectorAll('.btn-delete-customer').forEach(function(btn) { btn.addEventListener('click', function() { deleteCustomer(this.getAttribute('data-id')); }); });
  });
}

function viewCustomerDetail(id) {
  sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id), customer_addresses(*)').eq('id', id).single().then(function(result) {
    var c = result.data;

function deleteCustomer(id) {
  showConfirm('確定刪除此客戶？').then(function(ok) {
    if (!ok) return;
    sb.from('customer_tags').delete().eq('customer_id', id).then(function() { return sb.from('customer_addresses').delete().eq('customer_id', id); }).then(function() { return sb.from('orders').select('id').eq('customer_id', id); }).then(function(result) {
      var orders = result.data || [];
      var promises = [];
      orders.forEach(function(o) { promises.push(sb.from('orders').update({ customer_id: null }).eq('id', o.id)); });
      return Promise.all(promises);
    }).then(function() { return sb.from('customers').delete().eq('id', id); }).then(function() { showAlert('客戶已刪除'); loadCustomers(); }).catch(function(err) { showAlert('刪除失敗：' + err.message); });
  });
}

function toggleInvoiceFields() {
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  var fields = ['order-invoice-title', 'order-tax-id', 'order-invoice-no'];
  fields.forEach(function(id) { document.getElementById(id).disabled = !needInvoice; });
  
  // 控制發票類型顯示
  var invoiceTypeGroup = document.getElementById('invoice-type-group');
  if (needInvoice) {
    invoiceTypeGroup.classList.remove('hidden');
    document.getElementById('order-invoice-type').disabled = false;
    // 自動帶入
    var customerId = document.getElementById('selected-customer-id').value;
    var customer = allCustomers.find(function(c) { return c.id === customerId; });
    if (customer) {
      document.getElementById('order-invoice-title').value = customer.invoice_title || customer.company_name || '';
      document.getElementById('order-tax-id').value = customer.tax_id || '';
    }
  } else {
    invoiceTypeGroup.classList.add('hidden');
    document.getElementById('order-invoice-type').disabled = true;
    document.getElementById('order-tax-handling').value = 'no_invoice';
    document.getElementById('order-invoice-title').value = '';
    document.getElementById('order-tax-id').value = '';
    document.getElementById('order-invoice-no').value = '';
  }
  calculateOrderFinalTotal();
}

  document.getElementById('selected-customer-display').classList.add('hidden');
  document.getElementById('order-items-container').innerHTML = '';
  document.getElementById('temp-address-section').classList.add('hidden');
  document.getElementById('shipping-address-select').innerHTML = '<option value="">請先選擇客戶...</option>';
  currentCustomerTags = [];
  currentCustomerType = 'B2C';
  if (orderId) loadOrderForEdit(orderId);
  else addOrderItemRow();
  document.getElementById('order-modal').classList.remove('hidden');
  toggleInvoiceFields(); // 初始化發票狀態
}
function closeOrderModal() { document.getElementById('order-modal').classList.add('hidden'); editingOrderId = null; originalOrderItems = []; }

// 訂單客戶搜尋
var orderSearchTimer2;
document.getElementById('order-customer-search').addEventListener('input', function(e) {
  clearTimeout(orderSearchTimer2);
  var kw = e.target.value.trim();
  var dd = document.getElementById('order-customer-dropdown');
  if (!kw) { dd.classList.add('hidden'); return; }
  orderSearchTimer2 = setTimeout(function() {
    var filtered = allCustomers.filter(function(c) {
      return (c.contact_person && c.contact_person.indexOf(kw) !== -1) || (c.company_name && c.company_name.indexOf(kw) !== -1) || (c.phone && c.phone.indexOf(kw) !== -1);
    });
    var html = '';
    if (filtered.length === 0) { html = '<div class="p-3 text-gray-500">無結果</div>'; }
    else {
      filtered.forEach(function(c) {
        var tagsJson = c.customer_tags ? JSON.stringify(c.customer_tags.map(function(ct) { return ct.tag_id; })) : '[]';
        html += '<div class="search-item p-3 border-b" data-id="' + c.id + '" data-name="' + (c.company_name || c.contact_person) + '" data-tax="' + (c.tax_id || '') + '" data-invoice="' + (c.invoice_title || '') + '" data-tags="' + tagsJson + '" data-type="' + c.type + '">' + (c.company_name || c.contact_person) + ' - ' + c.contact_person + ' (' + c.phone + ')</div>';
      });

      });

});

function selectOrderCustomer(id, name, taxId, invoiceTitle, tagsJson, type) {
  document.getElementById('order-customer-dropdown').classList.add('hidden');
  document.getElementById('order-customer-search').value = name;
  document.getElementById('selected-customer-id').value = id;
  document.getElementById('selected-customer-display').textContent = '已選擇：' + name;
  document.getElementById('selected-customer-display').classList.remove('hidden');
  currentCustomerTags = JSON.parse(tagsJson);
  currentCustomerType = type;
  
  // 載入地址
  sb.from('customer_addresses').select('*').eq('customer_id', id).then(function(result) {
    var addresses = result.data || [];
    var addrSelect = document.getElementById('shipping-address-select');
    addrSelect.innerHTML = '<option value="">-- 選擇地址 --</option>';
    var hasDefault = false;
    addresses.forEach(function(a) {
      var text = (a.address_type || '') + ' - ' + (a.address_name || a.street || a.cvs_store_name || '') + ' (' + a.recipient_name + ')';
      var selected = a.is_default ? 'selected' : '';
      if(a.is_default) hasDefault = true;
      addrSelect.innerHTML += '<option value="' + a.id + '" ' + selected + '>' + text + (a.is_default ? ' [預設]' : '') + '</option>';
    });
    if(!hasDefault && addresses.length > 0) {
        addrSelect.value = addresses[0].id; // 如果沒有預設，選第一個
    }
  });
  
  toggleInvoiceFields();
  calculateOrderFinalTotal();
}

function addOrderItemRow(productData) {
  var container = document.getElementById('order-items-container');
  var id = 'row-' + Date.now();
  var options = '<option value="">選擇產品...</option>';
  allProducts.forEach(function(p) {
    options += '<option value="' + p.id + '" data-price="' + p.sell_price + '" ' + (productData && productData.product_id === p.id ? 'selected' : '') + '>' + p.name + ' - $' + p.sell_price + ' (庫存: ' + p.current_stock + ')</option>';
  });
  var div = document.createElement('div');
  div.id = id;
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
  div.innerHTML = '<div class="flex-1"><label class="block text-xs font-bold mb-1">產品</label><select class="order-product w-full px-3 py-2 border rounded">' + options + '</select></div><div class="w-24"><label class="block text-xs font-bold mb-1">數量</label><input type="number" class="order-qty w-full px-3 py-2 border rounded" value="' + (productData ? productData.quantity : 1) + '" min="1"></div><div class="w-32"><label class="block text-xs font-bold mb-1">單價</label><input type="number" class="order-price w-full px-3 py-2 border rounded" value="' + (productData ? productData.unit_price : '') + '" step="0.01"></div><div class="w-32"><label class="block text-xs font-bold mb-1">小計</label><div class="order-subtotal px-3 py-2 font-bold">$0</div></div><button type="button" class="btn-remove-item px-3 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200">X</button>';
  container.appendChild(div);
  
  div.querySelector('.order-product').addEventListener('change', function() {
    var select = this;
    var priceInput = div.querySelector('.order-price');
    if (select.value) priceInput.value = select.options[select.selectedIndex].dataset.price;
    calculateOrderFinalTotal();
  });
  div.querySelector('.order-qty').addEventListener('input', calculateOrderFinalTotal);
  div.querySelector('.order-price').addEventListener('input', calculateOrderFinalTotal);
  div.querySelector('.btn-remove-item').addEventListener('click', function() { div.remove(); calculateOrderFinalTotal(); });
  
  if (productData && productData.unit_price) { div.querySelector('.order-price').value = productData.unit_price; }
  calculateOrderFinalTotal();
}

// 核心計算邏輯 (含稅反推、運費成本)
function calculateOrderFinalTotal() {
  var subtotal = 0;
  var rows = document.querySelectorAll('#order-items-container > div');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var price = parseFloat(row.querySelector('.order-price').value) || 0;
    var qty = parseInt(row.querySelector('.order-qty').value) || 0;
    row.querySelector('.order-subtotal').textContent = '$' + (price * qty).toLocaleString();
    subtotal += price * qty;
  }
  document.getElementById('display-subtotal').textContent = '$' + Math.round(subtotal).toLocaleString();
  
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  var taxType = document.getElementById('order-tax-handling').value;
  var tax = 0;
  var taxInfo = '';

  if (!needInvoice) {
    taxType = 'no_invoice';
    tax = 0;
    taxInfo = '不開發票，無稅金';
    document.getElementById('display-tax-row').classList.add('hidden');
  } else {
    document.getElementById('display-tax-row').classList.remove('hidden');
    if (taxType === 'tax_excluded') {
      tax = subtotal * 0.05;
      taxInfo = '稅外加：商品 $' + Math.round(subtotal) + ' + 5% 稅金 $' + Math.round(tax) + ' = 總計 $' + Math.round(subtotal + tax);
    } else if (taxType === 'tax_included') {
      var preTax = subtotal / 1.05;
      tax = subtotal - preTax;
      taxInfo = '含稅價：總計 $' + Math.round(subtotal) + ' (其中未稅 $' + Math.round(preTax) + ', 稅金 $' + Math.round(tax) + ')';
    }
  }
  document.getElementById('display-tax').textContent = '$' + Math.round(tax).toLocaleString();
  document.getElementById('order-tax-info').textContent = taxInfo;

  // 運費計算
  var shippingAmount = parseFloat(document.getElementById('shipping-amount').value) || 0;
  var shippingType = document.getElementById('shipping-type').value;
  var finalTotal = subtotal + tax;
  var absorbedShipping = 0;

  var shippingDisplay = document.getElementById('display-shipping-info');
  if (shippingAmount > 0) {
    shippingDisplay.classList.remove('hidden');
    if (shippingType === 'customer_pay') {
      finalTotal += shippingAmount;
      absorbedShipping = 0;
      shippingDisplay.innerHTML = '<span class="text-gray-600">運費 (客人自付)：</span><span class="font-bold text-gray-800">$' + Math.round(shippingAmount).toLocaleString() + '</span>';
    } else {
      absorbedShipping = shippingAmount;
      shippingDisplay.innerHTML = '<span class="text-orange-600">運費 (公司吸收/成本)：</span><span class="font-bold text-orange-600">$' + Math.round(shippingAmount).toLocaleString() + '</span>';
    }
  } else {
    shippingDisplay.classList.add('hidden');
  }

  document.getElementById('order-total-amount').textContent = '$' + Math.round(finalTotal).toLocaleString();
  
  // 儲存供 submit 使用
  window._calcTax = tax;
  window._calcShipping = shippingAmount;
  window._calcAbsorbed = absorbedShipping;
  window._calcTotal = finalTotal;
}

document.getElementById('btn-save-order').addEventListener('click', function() {
  var customerId = document.getElementById('selected-customer-id').value;
  if (!customerId) { showAlert('請選擇客戶！'); return; }
  var items = [];
  var rows = document.querySelectorAll('#order-items-container > div');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var prodId = row.querySelector('.order-product').value;
    var qty = parseInt(row.querySelector('.order-qty').value) || 0;
    var price = parseFloat(row.querySelector('.order-price').value) || 0;
    if (prodId && qty > 0) { items.push({ product_id: prodId, quantity: qty, unit_price: price }); }
  }
  if (!items.length) { showAlert('請至少加入一筆產品！'); return; }
  
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  var taxType = document.getElementById('order-tax-handling').value;
  
  var orderData = {
    customer_id: customerId,
    total_amount: window._calcTotal || 0,
    notes: document.getElementById('order-notes').value,
    status: 'confirmed',
    invoice_title: needInvoice ? document.getElementById('order-invoice-title').value : null,
    invoice_tax_id: needInvoice ? document.getElementById('order-tax-id').value : null,
    invoice_type: needInvoice ? document.getElementById('order-invoice-type').value : null,
    invoice_no: needInvoice ? document.getElementById('order-invoice-no').value : null,
    tax_handling: needInvoice ? taxType : 'no_invoice',
    tax_amount: window._calcTax || 0,
    shipping_fee: window._calcShipping || 0,
    absorbed_shipping_fee: window._calcAbsorbed || 0
  };

  var savePromise;
  if (editingOrderId) {
    var restorePromises = [];
    for (var i = 0; i < originalOrderItems.length; i++) {
      var item = originalOrderItems[i];
      restorePromises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(result) {
        if (result.data) return sb.from('products').update({ current_stock: result.data.current_stock + item.quantity }).eq('id', item.product_id);
      }));
    }
    savePromise = Promise.all(restorePromises).then(function() { return sb.from('order_items').delete().eq('order_id', editingOrderId); }).then(function() { return sb.from('orders').update(orderData).eq('id', editingOrderId); });
  } else {
    orderData.order_no = 'ORD-' + new Date().getFullYear() + '-' + Math.floor(Math.random()*10000).toString().padStart(4,'0');
    savePromise = sb.from('orders').insert([orderData]).select().single();
  }

  savePromise.then(function(result) {
    var orderId = editingOrderId || result.data.id;
    return sb.from('order_items').insert(items.map(function(item) { return { order_id: orderId, product_id: item.product_id, quantity: item.quantity, unit_price: item.unit_price }; })).then(function() {
      var stockPromises = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        stockPromises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(result) {
          if (result.data) return sb.from('products').update({ current_stock: result.data.current_stock - item.quantity }).eq('id', item.product_id);
        }));
      }
      return Promise.all(stockPromises);
    });
  }).then(function() { showAlert('訂單已儲存！'); closeOrderModal(); loadOrders(); loadDashboardData(); }).catch(function(err) { showAlert('儲存失敗：' + err.message); });
});

function loadOrders(searchKw) {
  if (!searchKw) searchKw = '';
  sb.from('orders').select('*, customers(company_name, contact_person)').order('created_at', { ascending: false }).then(function(result) {
    var data = result.data || [];
    var tbody = document.getElementById('order-table-body');
    tbody.innerHTML = '';
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">尚無訂單</td></tr>'; return; }
    var filteredData = data;
    if (searchKw) {
      filteredData = data.filter(function(o) {
        var customerName = (o.customers && (o.customers.company_name || o.customers.contact_person) || '').toLowerCase();
        var invoiceNo = (o.invoice_no || '').toLowerCase();
        return customerName.indexOf(searchKw) !== -1 || invoiceNo.indexOf(searchKw) !== -1;
      });
    }
    filteredData.forEach(function(o) {
      var tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';
      var dateObj = new Date(o.created_at);
      var dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0') + ' ' + String(dateObj.getHours()).padStart(2,'0') + ':' + String(dateObj.getMinutes()).padStart(2,'0');
      tr.innerHTML = '<td class="px-6 py-4 font-bold text-gray-700">' + dateStr + '</td><td class="px-6 py-4">' + (o.customers ? (o.customers.company_name || o.customers.contact_person) : '已刪除客戶') + '</td><td class="px-6 py-4">$' + Math.round(o.total_amount).toLocaleString() + '</td><td class="px-6 py-4 text-sm">' + (o.invoice_no ? (o.invoice_type === '3' ? '三聯' : '二聯') : '無') + '</td><td class="px-6 py-4"><button class="btn-edit-order text-blue-600 hover:underline text-sm mr-2" data-id="' + o.id + '">編輯</button><button class="btn-delete-order text-red-600 hover:underline text-sm" data-id="' + o.id + '">刪除</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('.btn-edit-order').forEach(function(btn) { btn.addEventListener('click', function() { openOrderModal(this.getAttribute('data-id')); }); });
    tbody.querySelectorAll('.btn-delete-order').forEach(function(btn) { btn.addEventListener('click', function() { deleteOrder(this.getAttribute('data-id')); }); });
  });
}

function loadOrderForEdit(id) {
  sb.from('orders').select('*, order_items(*), customers(*)').eq('id', id).single().then(function(result) {
    var order = result.data;
    if (!order) return;
    originalOrderItems = order.order_items || [];
    var c = order.customers;
    if (c) {
      var tagsJson = c.customer_tags ? JSON.stringify(c.customer_tags.map(function(ct) { return ct.tag_id; })) : '[]';
      selectOrderCustomer(c.id, c.company_name || c.contact_person, c.tax_id, c.invoice_title, tagsJson, c.type);
    }
    document.getElementById('order-notes').value = order.notes || '';
    document.getElementById('order-need-invoice').value = order.invoice_no ? 'yes' : 'no';
    document.getElementById('order-invoice-title').value = order.invoice_title || '';
    document.getElementById('order-tax-id').value = order.invoice_tax_id || '';
    document.getElementById('order-invoice-type').value = order.invoice_type || '3';
    document.getElementById('order-invoice-no').value = order.invoice_no || '';
    document.getElementById('order-tax-handling').value = order.tax_handling || 'tax_included';
    document.getElementById('shipping-amount').value = order.shipping_fee || 0;
    document.getElementById('shipping-type').value = order.absorbed_shipping_fee > 0 ? 'company_absorb' : (order.shipping_fee > 0 ? 'customer_pay' : 'customer_pay');
    toggleInvoiceFields();
    document.getElementById('order-items-container').innerHTML = '';
    if (order.order_items) { order.order_items.forEach(function(item) { addOrderItemRow(item); }); }
  });
}

function deleteOrder(id) {
  showConfirm('確定刪除此訂單？庫存會回補。').then(function(ok) {
    if (!ok) return;
    sb.from('invoices').delete().eq('related_order_id', id).then(function() { return sb.from('order_items').select('*').eq('order_id', id); }).then(function(result) {
      var items = result.data || [];
      var promises = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        promises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(prodResult) {
          if (prodResult.data) return sb.from('products').update({ current_stock: prodResult.data.current_stock + item.quantity }).eq('id', item.product_id);
        }));
      }
      return Promise.all(promises);
    }).then(function() { return sb.from('order_items').delete().eq('order_id', id); }).then(function() { return sb.from('orders').delete().eq('id', id); }).then(function() { showAlert('訂單已刪除！'); loadOrders(); loadDashboardData(); }).catch(function(err) { showAlert('刪除失敗：' + err.message); });
  });
}

function loadWarehouseInventory() {
  var container = document.getElementById('warehouse-inventory-container');
  container.innerHTML = '';
  var promises = [];
  for (var i = 0; i < allWarehouses.length; i++) {
    var warehouse = allWarehouses[i];
    promises.push(sb.from('product_inventory').select('*, products(name, sku, safety_stock)').eq('warehouse_id', warehouse.id).then(function(result) {
      var inventory = result.data || [];
      var div = document.createElement('div');
      div.className = 'bg-white rounded-lg shadow p-6';
      var html = '<h3 class="text-xl font-bold mb-4">' + warehouse.name + '</h3><table class="min-w-full"><thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left">產品</th><th class="px-4 py-2 text-left">SKU</th><th class="px-4 py-2 text-left">庫存</th><th class="px-4 py-2 text-left">狀態</th></tr></thead><tbody>';
      if (inventory.length) {
        inventory.forEach(function(inv) {
          var status = inv.quantity < (inv.products ? inv.products.safety_stock : inv.safety_stock) ? '<span class="text-red-600 font-bold">低庫存</span>' : '<span class="text-green-600">正常</span>';
          html += '<tr class="border-t"><td class="px-4 py-2">' + (inv.products ? inv.products.name : '') + '</td><td class="px-4 py-2 text-sm text-gray-600">' + (inv.products ? inv.products.sku : '') + '</td><td class="px-4 py-2 font-bold">' + inv.quantity + '</td><td class="px-4 py-2">' + status + '</td></tr>';
        });
      } else { html += '<tr><td colspan="4" class="px-4 py-2 text-center text-gray-500">無資料</td></tr>'; }
      html += '</tbody></table>';
      div.innerHTML = html;
      container.appendChild(div);
    }));
  }
  Promise.all(promises);
}
