<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>養芯健康 ERP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .hidden { display: none !important; }
  .nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="login-view" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">🏥 養芯健康</h1>
    <div class="space-y-4">
      <input type="email" id="email" placeholder="Email" class="w-full px-4 py-3 border rounded-lg">
      <input type="password" id="password" placeholder="密碼" class="w-full px-4 py-3 border rounded-lg">
      <button id="login-btn" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold">登入系統</button>
    </div>
  </div>
</div>

<div id="main-system" class="hidden min-h-screen flex">
  <aside class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="p-6 text-2xl font-bold text-center bg-gradient-to-r from-blue-600 to-purple-600">養芯健康</div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="#" data-view="boss" class="block py-3 px-4 rounded-lg hover:bg-gray-700 nav-active">👑 老闆查閱</a>
      <a href="#" data-view="crm" class="block py-3 px-4 rounded-lg hover:bg-gray-700">👥 客戶管理</a>
      <a href="#" data-view="orders" class="block py-3 px-4 rounded-lg hover:bg-gray-700">📦 訂單出貨</a>
      <a href="#" data-view="products" class="block py-3 px-4 rounded-lg hover:bg-gray-700">🏭 商品與BOM</a>
      <a href="#" data-view="warehouses" class="block py-3 px-4 rounded-lg hover:bg-gray-700">🏢 倉庫管理</a>
      <a href="#" data-view="inventory" class="block py-3 px-4 rounded-lg hover:bg-gray-700">📊 庫存盤點</a>
      <a href="#" data-view="purchases" class="block py-3 px-4 rounded-lg hover:bg-gray-700">🛒 採購入庫</a>
      <a href="#" data-view="vendors" class="block py-3 px-4 rounded-lg hover:bg-gray-700">🏢 廠商管理</a>
      <a href="#" data-view="finance" class="block py-3 px-4 rounded-lg hover:bg-gray-700">💰 收支與訂閱</a>
      <a href="#" data-view="banks" class="block py-3 px-4 rounded-lg hover:bg-gray-700">🏦 銀行帳戶</a>
      <a href="#" data-view="settings" class="block py-3 px-4 rounded-lg hover:bg-gray-700">⚙️ 通路與員工</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button id="logout-btn" class="w-full py-2 bg-red-600 rounded-lg">登出</button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto" id="main-content"></main>
</div>

<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center">
      <h2 id="modal-title" class="text-2xl font-bold">標題</h2>
      <button id="modal-close-btn" class="text-3xl">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1" id="modal-content"></div>
    <div class="p-4 border-t flex justify-end space-x-3">
      <button id="modal-cancel-btn" class="px-6 py-2 bg-gray-300 rounded-lg">取消</button>
      <button id="modal-save-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold">儲存</button>
    </div>
  </div>
</div>

<div id="alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-8 text-center">
    <p id="alert-message" class="text-xl mb-4">訊息</p>
    <button id="alert-ok-btn" class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg font-bold">確定</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[] };
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);

// 顯示 Alert
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
}

document.getElementById('alert-ok-btn').onclick = () => {
  document.getElementById('alert-modal').classList.add('hidden');
};

// 開啟 Modal
function openModal(title, html, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  
  if(onSave) {
    document.getElementById('modal-save-btn').onclick = onSave;
  } else {
    document.getElementById('modal-save-btn').classList.add('hidden');
  }
}

// 關閉 Modal
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-save-btn').classList.remove('hidden');
  editingId = null;
}

document.getElementById('modal-close-btn').onclick = closeModal;
document.getElementById('modal-cancel-btn').onclick = closeModal;

// 登入
document.getElementById('login-btn').onclick = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  sb.auth.signInWithPassword({ email, password }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => render());
    }
  });
};

// 登出
document.getElementById('logout-btn').onclick = () => sb.auth.signOut().then(() => location.reload());

// 導航
document.querySelectorAll('nav a').forEach(a => {
  a.onclick = (e) => { 
    e.preventDefault(); 
    currentView = a.dataset.view;
    document.querySelectorAll('nav a').forEach(x => x.classList.remove('nav-active'));
    a.classList.add('nav-active');
    render();
  };
});

// 載入資料
async function loadAll() {
  const tables = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    expCats:'expense_categories', orders:'orders', purchases:'purchases', 
    warehouseInv:'warehouse_inventory', customerTags:'customer_tags'
  };
  
  for(let key in tables) {
    const {data} = await sb.from(tables[key]).select('*');
    D[key] = data || [];
  }
}

// 渲染視圖
function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  
  if(currentView === 'boss') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">👑 老闆查閱</h1><div class="grid grid-cols-1 md:grid-cols-4 gap-6"><div class="bg-green-500 text-white p-6 rounded-lg"><p class="text-sm">本月業績</p><p class="text-3xl font-bold">$0</p></div><div class="bg-blue-500 text-white p-6 rounded-lg"><p class="text-sm">本月採購</p><p class="text-3xl font-bold">$0</p></div><div class="bg-red-500 text-white p-6 rounded-lg"><p class="text-sm">本月開銷</p><p class="text-3xl font-bold">$0</p></div><div class="bg-purple-500 text-white p-6 rounded-lg"><p class="text-sm">本月淨利</p><p class="text-3xl font-bold">$0</p></div></div>`;
  }
  else if(currentView === 'crm') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">👥 客戶管理</h1><p class="text-gray-600">客戶管理功能</p>`;
  }
  else if(currentView === 'orders') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">📦 訂單出貨</h1><p class="text-gray-600">訂單出貨功能</p>`;
  }
  else if(currentView === 'products') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">🏭 商品與BOM</h1><p class="text-gray-600">商品管理功能</p>`;
  }
  else if(currentView === 'warehouses') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">🏢 倉庫管理</h1><p class="text-gray-600">倉庫管理功能</p>`;
  }
  else if(currentView === 'inventory') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">📊 庫存盤點</h1><p class="text-gray-600">庫存盤點功能</p>`;
  }
  else if(currentView === 'purchases') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">🛒 採購入庫</h1><p class="text-gray-600">採購管理功能</p>`;
  }
  else if(currentView === 'vendors') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">🏢 廠商管理</h1><p class="text-gray-600">廠商管理功能</p>`;
  }
  else if(currentView === 'finance') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">💰 收支與訂閱</h1><p class="text-gray-600">財務管理功能</p>`;
  }
  else if(currentView === 'banks') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">🏦 銀行帳戶</h1><p class="text-gray-600">銀行帳戶管理功能</p>`;
  }
  else if(currentView === 'settings') {
    m.innerHTML = `<h1 class="text-3xl font-bold mb-6">⚙️ 通路與員工</h1><p class="text-gray-600">系統設定功能</p>`;
  }
}

// 系統啟動
sb.auth.getSession().then(r => { 
  if(r.data?.session) { 
    document.getElementById('login-view').classList.add('hidden'); 
    document.getElementById('main-system').classList.remove('hidden'); 
    loadAll().then(() => render());
  } 
});
</script>
</body>
</html>
