<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { 
  products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], 
  vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], 
  emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[]
};
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let isSaving = false;

const COLOR_NAMES = {
  '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色',
  '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色'
};

// 手機版側邊欄切換
window.toggleSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('hidden');
};

// 顯示 Alert
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const btn = document.getElementById('alert-ok-btn');
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      btn.removeEventListener('click', handler);
      document.removeEventListener('keydown', keyHandler);
      r(); 
    };
    const keyHandler = (e) => { if (e.key === 'Enter') handler(); };
    btn.addEventListener('click', handler);
    document.addEventListener('keydown', keyHandler);
  });
}

// 全域 closeModal 函數
window.closeModal = function() {
  document.getElementById('modal-overlay').classList.add('hidden');
  editingId = null;
  isSaving = false;
  const saveBtn = document.getElementById('modal-save-btn');
  if(saveBtn) {
    saveBtn.disabled = false;
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.onclick = null;
  }
  if(window.enterHandler) document.removeEventListener('keydown', window.enterHandler);
  if(window.escHandler) document.removeEventListener('keydown', window.escHandler);
};

// 開啟 Modal
function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  isSaving = false;
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存 (Enter)';

  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { 
        await onSave(); 
      } catch(e) {
        // 錯誤已在 onSave 內部處理
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  cancelBtn.onclick = window.closeModal;
  closeBtn.onclick = window.closeModal;
  
  window.escHandler = (e) => { if (e.key === 'Escape') window.closeModal(); };
  document.addEventListener('keydown', window.escHandler);
  
  if(!hideSave) {
    window.enterHandler = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        saveBtn.click();
      }
    };
    document.addEventListener('keydown', window.enterHandler);
  }
}

// 登入功能
document.getElementById('login-btn').addEventListener('click', () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  
  if(remember) {
    localStorage.setItem('rememberedEmail', email);
  } else {
    localStorage.removeItem('rememberedEmail');
  }
  
  sb.auth.signInWithPassword({ email: email, password: password }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => switchView('boss')); 
    }
  });
});

// 記住帳號功能
window.addEventListener('load', () => {
  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }
});

// Enter鍵登入
document.getElementById('password').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') {
    document.getElementById('login-btn').click();
  }
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
    if(window.innerWidth <= 768) toggleSidebar();
  });
});

// 載入所有資料
async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    expCats:'expense_categories', orders:'orders', purchases:'purchases', 
    warehouseInv:'warehouse_inventory', customerTags:'customer_tags'
  };
  await Promise.all(Object.keys(map).map(k => sb.from(map[k]).select('*').then(r => D[k] = r.data || [])));
}

// 切換視圖
function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

// 渲染視圖
function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}

// ==================== 老闆查閱（完整功能：累積數據/訂閱換算/代墊統計）====================
function renderBoss(c) {
  const [y, m] = bossMonth.split('-').map(Number);
  const monthOrders = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const rev = monthOrders.reduce((s,o)=>s+(o.total_amount||0),0);
  const monthPurchases = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const pur = monthPurchases.reduce((s,p)=>s+(p.total_amount||0),0);
  const monthExpenses = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const exp = monthExpenses.reduce((s,e)=>s+(e.amount||0),0);
  const monthSubs = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const sub = monthSubs.reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;
  const profitMargin = rev > 0 ? ((monthlyProfit / rev) * 100).toFixed(1) : 0;
  
  const subTag = D.tags.find(t => t.name.includes('訂閱'));
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(ct => ct.tag_id === subTag.id).map(ct => ct.customer_id);
    subCustomerCount = new Set(subTagIds).size;
  }

  let subMonthlyRevenue = 0;
  monthOrders.filter(o => o.is_subscription && o.subscription_days > 0).forEach(o => {
    const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
    subMonthlyRevenue += dailyRevenue * 30;
  });

  const companyShipping = monthOrders.reduce((s, o) => s + (o.absorbed_shipping_fee || 0), 0);
  const customerShipping = monthOrders.reduce((s, o) => s + (o.customer_paid_shipping || 0), 0);

  const unreimbursedExpenses = D.expenses.filter(e => e.employee_id && !e.is_reimbursed);
  const unreimbursedTotal = unreimbursedExpenses.reduce((s, e) => s + (e.amount || 0), 0);
  const unreimbursedByEmp = {};
  unreimbursedExpenses.forEach(e => {
    const emp = D.emps.find(x => x.id === e.employee_id);
    if(emp) unreimbursedByEmp[emp.name] = (unreimbursedByEmp[emp.name] || 0) + (e.amount || 0);
  });

  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  c.innerHTML = `
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <h1 class="text-3xl font-bold">👑 老闆查閱</h1>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow flex-1 md:flex-none">
        <button onclick="alert('報表下載功能開發中')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold whitespace-nowrap btn-touch">📥 下載報表</button>
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月業績</p>
        <p class="text-3xl font-bold mt-2">NT$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">訂單數：${monthOrderCount} 單</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月採購</p>
        <p class="text-3xl font-bold mt-2">NT$${pur.toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月開銷(含訂閱)</p>
        <p class="text-3xl font-bold mt-2">NT$${(exp+sub).toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月淨利</p>
        <p class="text-3xl font-bold mt-2">NT$${monthlyProfit.toLocaleString()}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">📊 營運指標</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">累積客戶總數</span><span class="text-2xl font-bold text-indigo-600">${totalCustomers} 位</span></div>
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">本月訂單數</span><span class="text-2xl font-bold text-indigo-600">${monthOrderCount} 單</span></div>
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">訂閱客戶數</span><span class="text-2xl font-bold text-indigo-600">${subCustomerCount} 位</span></div>
          <div class="flex justify-between items-center"><span class="text-gray-600">訂閱換算月營收</span><span class="text-2xl font-bold text-indigo-600">NT$${Math.round(subMonthlyRevenue).toLocaleString()}</span></div>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-orange-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">🚚 運費與員工代墊</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">公司吸收運費</span><span class="text-xl font-bold text-red-600">NT$${companyShipping.toLocaleString()}</span></div>

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value, 
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value, 
    phone: document.getElementById('c-phone').value
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  
  try {
    let cid = id;
    if(id) {
      await sb.from('customers').update(data).eq('id',id);
    } else {
      const {data:inserted} = await sb.from('customers').insert([data]).select().single();
      cid = inserted.id;
    }
    
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr').value, is_default:d.querySelector('.a-def').checked });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    
    showAlert('客戶已儲存！'); 
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delCust(id) {
  if(!confirm('確定刪除？')) return;
  await sb.from('customer_addresses').delete().eq('customer_id',id);
  await sb.from('customer_tags').delete().eq('customer_id',id);
  await sb.from('customers').delete().eq('id',id);
  await loadAll(); render();
}

function toggleInv() { const v = document.getElementById('o-inv-type').value; document.getElementById('o-inv-fmt-box').style.display = v==='no'?'none':'block'; calcOrd(); }

function addOrdItem() {

  div.innerHTML = `<div class="flex-1 min-w-[150px]"><select class="o-prod w-full px-3 py-2 border rounded" onchange="if(this.value){this.parentElement.parentElement.querySelector('.o-price').value=this.options[this.selectedIndex].dataset.price;}calcOrd()"><option value="">選擇產品</option>${D.products.map(p=>`<option value="${p.id}" data-price="${p.sell_price}" data-cost="${p.cost_price}">${p.name} (NT$${p.sell_price})</option>`).join('')}</select></div><div class="w-20"><input type="number" class="o-qty w-full px-3 py-2 border rounded" value="1" min="1" oninput="calcOrd()"></div><div class="w-28"><input type="number" class="o-price w-full px-3 py-2 border rounded" value="0" step="0.01" oninput="calcOrd()"></div><button type="button" onclick="this.parentElement.remove();calcOrd()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>`;

function calcOrd() {
  let sub = 0, totalCost = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.o-price').value)||0;
    const qty = parseInt(r.querySelector('.o-qty').value)||0;
    const prodSelect = r.querySelector('.o-prod');
    const prod = D.products.find(p=>p.id===prodSelect.value);
    sub += price * qty;
    if(prod) totalCost += (prod.cost_price||0) * qty;
  });
  document.getElementById('o-subtotal').textContent = sub.toLocaleString();
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0, invInfo = '';
  if(invType==='tax') { tax = Math.round(sub * 0.05); invInfo = `稅外加：商品 NT$${sub.toLocaleString()} + 5% 稅金 NT$${tax.toLocaleString()} = 客人需付 NT$${(sub+tax).toLocaleString()}`; document.getElementById('o-tax-row').style.display = 'block'; } 
  else if(invType==='has') { tax = 0; invInfo = `有發票：訂單價格即為含稅價 NT$${sub.toLocaleString()}`; document.getElementById('o-tax-row').style.display = 'block'; } 
  else { document.getElementById('o-tax-row').style.display = 'none'; }
  document.getElementById('o-tax').textContent = tax.toLocaleString();
  document.getElementById('o-inv-info').textContent = invInfo;
  const shipDisplay = shipType==='pay' ? ship : 0;
  document.getElementById('o-ship-display').textContent = shipDisplay.toLocaleString();
  document.getElementById('o-ship-row').style.display = ship > 0 ? 'block' : 'none';
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);
  const totalCommission = (sub * (channelRate / 100)) + (sub * (paymentRate / 100));
  document.getElementById('o-commission').textContent = totalCommission.toLocaleString();
  document.getElementById('o-commission-row').style.display = totalCommission > 0 ? 'block' : 'none';
  const total = sub + tax + shipDisplay;
  document.getElementById('o-total').textContent = total.toLocaleString();
  const profit = total - totalCost - (shipType==='free'?ship:0) - totalCommission;
  const margin = total > 0 ? ((profit/total)*100).toFixed(1) : 0;
  document.getElementById('o-profit').textContent = profit.toLocaleString();
  document.getElementById('o-margin').textContent = margin;
}

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  if(!cid) return showAlert('請選擇客戶！');
  
  const items = []; 
  let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value)||0;
    const p = parseFloat(r.querySelector('.o-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); sub+=p*q; }
  });
  if(!items.length) return showAlert('請加入產品！');
  
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0; if(invType==='tax') tax = Math.round(sub*0.05);
  const shipCharge = shipType==='pay'?ship:0;
  const total = sub + tax + shipCharge;
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);
  const isSub = document.getElementById('o-is-sub').checked;
  const subDays = isSub ? parseInt(document.getElementById('o-sub-days').value) : null;

  const data = {
    customer_id:cid, total_amount:total, status:'shipped', order_no: editingId ? D.orders.find(x=>x.id===editingId)?.order_no : 'ORD-'+Date.now(),
    invoice_title:document.getElementById('o-inv-title').value||null, invoice_tax_id:document.getElementById('o-inv-tax').value||null,
    invoice_type:document.getElementById('o-inv-fmt').value, invoice_no:document.getElementById('o-inv-no').value||null,
    tax_handling:invType, tax_amount:tax, shipping_fee:ship, 
    absorbed_shipping_fee: shipType==='free' ? ship : 0,
    customer_paid_shipping: shipType==='pay' ? ship : 0,
    bank_account_id:document.getElementById('o-bank').value||null,
    sales_channel_id:document.getElementById('o-channel').value||null,
    payment_method_id:document.getElementById('o-payment').value||null,
    channel_commission:sub*(channelRate/100), payment_commission:sub*(paymentRate/100),
    is_subscription: isSub, subscription_days: subDays,
    shipping_address_detail:JSON.stringify({recv:document.getElementById('o-recv').value, phone:document.getElementById('o-phone').value, addr:document.getElementById('o-addr').value})
  };
  
  try {
    if(editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const {data:r, error} = await sb.from('orders').insert([data]).select().single();
      if(error) throw error;
      editingId = r.id;
    }
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:editingId})));
    
    for(const i of items) {
      const p = D.products.find(x=>x.id===i.product_id);
      if(p) await sb.from('products').update({current_stock: (p.current_stock||0) - i.quantity}).eq('id', i.product_id);
    }
    
    showAlert('出貨單已儲存！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delOrd(id) { 
  if(!confirm('確定刪除？')) return; 
  try {
    await sb.from('order_items').delete().eq('order_id',id);
    await sb.from('orders').delete().eq('id',id);
    await loadAll();
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  } 
}

  const id = document.getElementById('p-id').value;

    sku: document.getElementById('p-sku').value, 
    name: document.getElementById('p-name').value, 
    type: document.getElementById('p-type').value, 
    sell_price: parseFloat(document.getElementById('p-sell').value)||0, 
    cost_price: parseFloat(document.getElementById('p-cost').value)||0

      if(error) throw error;
    }
    showAlert('已儲存！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delProd(id) {

  try {
    await sb.from('bom_list').delete().or(`parent_product_id.eq.${id},child_product_id.eq.${id}`);
    await sb.from('warehouse_inventory').delete().eq('product_id', id);
    await sb.from('products').delete().eq('id', id);
    await loadAll();

async function saveWarehouse() {
  const name = document.getElementById('wh-name').value.trim();

  const data = { name: name, location: document.getElementById('wh-loc').value, is_active: document.getElementById('wh-active').value === 'true' };

    showAlert('倉庫已儲存！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delWarehouse(id) {

    await loadAll();
    render();

function renderInventory(c) {
  let tabsHtml = `<button onclick="showWhTab('all')" class="wh-tab px-4 py-2 rounded-lg bg-gray-200 text-gray-700" data-wh="all">📦 全部庫存總覽</button>`;
  tabsHtml += D.warehouses.filter(w=>w.is_active).map((w)=>`<button onclick="showWhTab('${w.id}')" class="wh-tab px-4 py-2 rounded-lg bg-gray-200 text-gray-700" data-wh="${w.id}">${w.name}</button>`).join('');
  
  c.innerHTML = `<h1 class="text-3xl font-bold mb-6">📊 庫存盤點</h1><div class="flex gap-2 mb-4 flex-wrap overflow-x-auto pb-2">${tabsHtml}</div><div id="inv-content"></div>`;
  showWhTab('all');
}

function showWhTab(whId) {
  document.querySelectorAll('.wh-tab').forEach(t => { 
    t.className = t.className.replace('bg-blue-600 text-white','bg-gray-200 text-gray-700'); 
    if(t.dataset.wh===whId) t.className = t.className.replace('bg-gray-200 text-gray-700','bg-blue-600 text-white'); 
  });
  
  const container = document.getElementById('inv-content');
  let rows = '';
  
  if(whId === 'all') {
    rows = D.products.map(p => {
      const totalQty = D.warehouseInv.filter(i=>i.product_id===p.id).reduce((sum, i) => sum + (i.quantity||0), 0);
      const maxSafe = Math.max(...D.warehouseInv.filter(i=>i.product_id===p.id).map(i=>i.safety_stock||0), 0);
      const low = totalQty < maxSafe && maxSafe > 0;
      
      const whDetails = D.warehouseInv.filter(i=>i.product_id===p.id).map(i => {
        const w = D.warehouses.find(wh=>wh.id===i.warehouse_id);
        return `<div class="text-xs text-gray-500">${w?.name||'未知'}: ${i.quantity}</div>`;
      }).join('');

      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold text-lg">${totalQty}</td><td class="px-4 py-3 text-xs">${whDetails || '無庫存記錄'}</td><td class="px-4 py-3">${low?'<span class="text-red-600 font-bold">低庫存</span>':totalQty>0?'<span class="text-green-600">正常</span>':'<span class="text-gray-400">無庫存</span>'}</td></tr>`;
    }).join('');
    
    container.innerHTML = `<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-blue-50 border-b"><h3 class="font-bold text-blue-800">📦 全部庫存總覽 (跨倉庫加總)</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">總庫存</th><th class="px-4 py-3 text-left text-xs">倉庫分佈</th><th class="px-4 py-3 text-left text-xs">狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else {
    const wh = D.warehouses.find(w=>w.id===whId);
    const inv = D.warehouseInv.filter(i=>i.warehouse_id===whId);
    
    rows = D.products.map(p => {
      const wInv = inv.find(i=>i.product_id===p.id);
      const qty = wInv?.quantity || 0;
      const safe = wInv?.safety_stock || 0;
      const low = qty < safe && safe > 0;
      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold">${qty}</td><td class="px-4 py-3"><input type="number" class="inv-safe w-20 px-2 py-1 border rounded" value="${safe}" data-pid="${p.id}" data-wid="${whId}"></td><td class="px-4 py-3">${low?'<span class="text-red-600 font-bold">低庫存</span>':qty>0?'<span class="text-green-600">正常</span>':'<span class="text-gray-400">無庫存</span>'}</td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="${qty}" data-pid="${p.id}" data-wid="${whId}"><button onclick="saveInvItem(this, '${p.id}', '${whId}')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs">儲存</button></td></tr>`;
    }).join('');
    
    container.innerHTML = `<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold">${wh?.name||''} - 庫存明細與盤點</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">低庫存設定</th><th class="px-4 py-3 text-left text-xs">狀態</th><th class="px-4 py-3 text-left text-xs">盤點調整</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
}

function saveInvItem(btn, pid, wid) {
  const tr = btn.closest('tr');
  const qty = parseInt(tr.querySelector('.inv-qty').value)||0;
  const safe = parseInt(tr.querySelector('.inv-safe').value)||0;
  const existing = D.warehouseInv.find(i=>i.warehouse_id===wid && i.product_id===pid);
  const data = {quantity:qty, safety_stock:safe};
  let promise = existing ? sb.from('warehouse_inventory').update(data).eq('id', existing.id) : sb.from('warehouse_inventory').insert([{warehouse_id:wid, product_id:pid, ...data}]);
  promise.then(() => { loadAll().then(() => { showWhTab(wid); showAlert('庫存已更新！'); }); }).catch(e => showAlert('失敗：'+e.message));
}

function renderPurTable() {
  const [y,m] = (document.getElementById('pur-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('pur-search')?.value||'').toLowerCase();
  const list = D.purchases.filter(p => {
    const d = new Date(p.created_at);
    const v = D.vendors.find(x=>x.id===p.vendor_id);
    return d.getFullYear()===y && d.getMonth()+1===m && (!kw || (v?.name||'').toLowerCase().includes(kw));
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  
  const totalAmount = list.reduce((sum, p) => sum + (p.total_amount||0), 0);
  if(document.getElementById('pur-total-display')) {
    document.getElementById('pur-total-display').textContent = totalAmount.toLocaleString();
  }
  
  document.getElementById('pur-tbody').innerHTML = list.map(p=>{
    const v=D.vendors.find(x=>x.id===p.vendor_id);
    const typeLabel = p.is_invoice_purchase ? '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">購買發票</span>' : '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">一般採購</span>';

function calcPur() {
  const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.pu-price').value)||0;
    const qty = parseInt(r.querySelector('.pu-qty').value)||0;
    subtotal += price * qty;
  });
  
  if(isInvoiceMode) {
    const tax = Math.round(subtotal * 0.05);
    if(document.getElementById('pu-subtotal')) document.getElementById('pu-subtotal').textContent = subtotal.toLocaleString();
    if(document.getElementById('pu-tax')) document.getElementById('pu-tax').textContent = tax.toLocaleString();
    if(document.getElementById('pu-total')) document.getElementById('pu-total').textContent = tax.toLocaleString();
  } else {
    if(document.getElementById('pu-total')) document.getElementById('pu-total').textContent = subtotal.toLocaleString();
  }
}

async function savePur() {
  const editId = document.getElementById('pu-edit-id')?.value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const bankId = document.getElementById('pu-bank').value;
  
  const items = []; 
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value)||0;
    const p = parseFloat(r.querySelector('.pu-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); subtotal+=p*q; }
  });
  if(!items.length) return showAlert('請加入採購商品！');
  
  let d = { vendor_id: vendorId, bank_account_id: bankId||null, is_invoice_purchase: isInvoiceMode };
  
  if(isInvoiceMode) {
    d.total_amount = Math.round(subtotal * 0.05);
    d.invoice_amount = d.total_amount;
  } else {
    d.total_amount = subtotal;
    d.invoice_amount = subtotal;
    d.invoice_no = document.getElementById('pu-inv-no')?.value||null;
    d.has_invoice = document.getElementById('pu-has-inv')?.checked||false;
    d.warehouse_id = document.getElementById('pu-wh')?.value||null;
  }
  
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      const {error} = await sb.from('purchases').update(d).eq('id', editId);
      if(error) throw error;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:editId})));
    } else {
      d.purchase_no = 'PUR-'+Date.now();
      d.status = 'completed';
      const {data:r, error} = await sb.from('purchases').insert([d]).select().single();
      if(error) throw error;
      const purId = r.id;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:purId})));
      
      if(!isInvoiceMode && d.warehouse_id) {
        for(const i of items) {
          const existing = D.warehouseInv.find(w=>w.warehouse_id===d.warehouse_id && w.product_id===i.product_id);
          if(existing) {
            await sb.from('warehouse_inventory').update({quantity: (existing.quantity||0) + i.quantity}).eq('id', existing.id);
          } else {
            await sb.from('warehouse_inventory').insert([{warehouse_id:d.warehouse_id, product_id:i.product_id, quantity:i.quantity, safety_stock:0}]);
          }
          const p = D.products.find(x=>x.id===i.product_id);
          if(p) await sb.from('products').update({current_stock: (p.current_stock||0) + i.quantity}).eq('id', i.product_id);
        }
      }
    }
    
    if(bankId) {
      const b = D.banks.find(x=>x.id===bankId);
      if(b) await sb.from('bank_accounts').update({balance: (b.balance||0) - d.total_amount}).eq('id', bankId);
    }
    
    showAlert(isInvoiceMode?'購買發票已記錄！':'採購已入庫！'); 
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delPur(id) { 
  if(!confirm('確定刪除?')) return; 
  try {
    await sb.from('purchase_items').delete().eq('purchase_id',id);
    await sb.from('purchases').delete().eq('id',id); 
    await loadAll();
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

async function saveExp() {
  const id = document.getElementById('e-id').value;
  const empId = document.getElementById('e-emp').value || null;
  const isReimbursed = document.getElementById('e-reimbursed').checked;
  const bankId = document.getElementById('e-bank').value || null;
  const amount = parseFloat(document.getElementById('e-amt').value)||0;
  
  if(!bankId && amount > 0) {
    return showAlert('請選擇出帳銀行帳戶！');
  }
  
  const d = {
    category_id:document.getElementById('e-cat').value, 
    amount: amount,
    description:document.getElementById('e-desc').value, 
    payment_date:document.getElementById('e-date').value,
    employee_id: empId,
    is_reimbursed: isReimbursed,
    reimbursement_bank_id: bankId,
    reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null
  };
  
  try {
    if(id) {
      await sb.from('expenses').update(d).eq('id',id);
      showAlert('已更新！'); 
    } else {
      const {data: newExp, error} = await sb.from('expenses').insert([d]).select().single();
      if(error) throw error;
      
      if(bankId && amount > 0) {
        const {data: bank} = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
        if(bank) {
          await sb.from('bank_accounts').update({
            balance: (bank.balance || 0) - amount
          }).eq('id', bankId);
        }
      }
      showAlert('已記錄並扣款！'); 
    }
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

async function delSub(id) { if(!confirm('確定刪除?'))return; try { await sb.from('system_subscriptions').delete().eq('id',id); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); } }

// ==================== 銀行帳戶 ====================
function renderBanks(c) {
  c.innerHTML = `<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"><h1 class="text-3xl font-bold"> 銀行帳戶</h1><button onclick="openBankModal()" class="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold btn-touch">+ 新增帳戶</button></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${D.banks.map(b=>`<div class="bg-white p-6 rounded-lg shadow"><h3 class="font-bold text-lg mb-2">${b.account_name}</h3><p class="text-gray-500 text-sm mb-4">${b.bank_name} - ${b.account_number}</p><p class="text-3xl font-bold text-green-600 mb-4">NT$${(b.balance||0).toLocaleString()}</p><div class="flex gap-2"><button onclick="adjBank('${b.id}')" class="flex-1 bg-blue-500 text-white py-2 rounded text-sm hover:bg-blue-600 btn-touch">手動調整</button><button onclick="delBank('${b.id}')" class="flex-1 bg-red-500 text-white py-2 rounded text-sm hover:bg-red-600 btn-touch">刪除</button></div></div>`).join('')}</div>`;
}

function openBankModal(id) {
  editingId=id||null; const b=id?D.banks.find(x=>x.id===id):null;
  const html = `<input type="hidden" id="b-id" value="${id||''}"><div class="mb-4"><label class="block text-sm font-bold mb-1">帳戶名稱 *</label><input type="text" id="b-name" class="w-full px-3 py-2 border rounded" value="${b?.account_name||''}"></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-1">銀行</label><input type="text" id="b-bank" class="w-full px-3 py-2 border rounded" value="${b?.bank_name||''}"></div><div><label class="block text-sm font-bold mb-1">帳號</label><input type="text" id="b-no" class="w-full px-3 py-2 border rounded" value="${b?.account_number||''}"></div></div><div class="mb-4"><label class="block text-sm font-bold mb-1">餘額</label><input type="number" id="b-bal" class="w-full px-3 py-2 border rounded" value="${b?.balance||0}"></div>`;
  openModal(id?'編輯帳戶':'新增帳戶', html, saveBank);
}

async function saveBank() {
  const id = document.getElementById('b-id').value;
  const d = {account_name:document.getElementById('b-name').value, bank_name:document.getElementById('b-bank').value, account_number:document.getElementById('b-no').value, balance:parseFloat(document.getElementById('b-bal').value)||0};
  if(!d.account_name) return showAlert('帳戶名稱必填！');
  try { if(id) await sb.from('bank_accounts').update(d).eq('id',id); else await sb.from('bank_accounts').insert([d]); showAlert('已儲存！'); window.closeModal(); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); }
}

function adjBank(id) {
  const b = D.banks.find(x=>x.id===id);
  const html = `<p class="mb-4">帳戶：<b>${b.account_name}</b> (目前：NT$${(b.balance||0).toLocaleString()})</p><div class="mb-4"><label class="block text-sm font-bold mb-1">調整後正確餘額</label><input type="number" id="adj-bal" class="w-full px-3 py-2 border rounded" value="${b.balance||0}"></div>`;
  openModal('手動調整餘額', html, async()=>{
    try { const newBalance = parseFloat(document.getElementById('adj-bal').value)||0; await sb.from('bank_accounts').update({balance: newBalance}).eq('id', id); showAlert('已更新！'); window.closeModal(); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); }
  });
}
async function delBank(id) { if(!confirm('確定刪除此銀行帳戶？')) return; try { const {data: expenses} = await sb.from('expenses').select('id').eq('reimbursement_bank_id', id).limit(1); if(expenses && expenses.length > 0) return showAlert('無法刪除：此銀行帳戶正被收支記錄使用。'); const {error} = await sb.from('bank_accounts').delete().eq('id', id); if(error) throw error; await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); } }

  c.innerHTML = `

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold">銷售通路 (抽成)</h3><button onclick="openChModal()" class="bg-pink-600 text-white px-3 py-1 rounded text-sm btn-touch">+ 新增</button></div>
        <div class="overflow-x-auto"><table class="min-w-full"><thead><tr><th class="text-left py-2 text-xs">名稱</th><th class="text-left py-2 text-xs">抽成%</th><th class="text-left py-2 text-xs">操作</th></tr></thead><tbody>${D.channels.map(ch=>`<tr class="border-t"><td class="py-2">${ch.name}</td><td class="py-2">${ch.commission_rate}%</td><td class="py-2 whitespace-nowrap"><button onclick="openChModal('${ch.id}')" class="text-green-600 text-xs mr-2">編輯</button><button onclick="delCh('${ch.id}')" class="text-red-600 text-xs">刪除</button></td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold">付款方式 (手續費)</h3><button onclick="openPmModal()" class="bg-orange-600 text-white px-3 py-1 rounded text-sm btn-touch">+ 新增</button></div>
        <div class="overflow-x-auto"><table class="min-w-full"><thead><tr><th class="text-left py-2 text-xs">名稱</th><th class="text-left py-2 text-xs">費率%</th><th class="text-left py-2 text-xs">操作</th></tr></thead><tbody>${D.payments.map(p=>`<tr class="border-t"><td class="py-2">${p.name}</td><td class="py-2">${p.commission_rate}%</td><td class="py-2 whitespace-nowrap"><button onclick="openPmModal('${p.id}')" class="text-green-600 text-xs mr-2">編輯</button><button onclick="delPm('${p.id}')" class="text-red-600 text-xs">刪除</button></td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4"><h3 class="text-lg font-bold">員工管理</h3><button onclick="openEmpModal()" class="bg-rose-600 text-white px-4 py-2 rounded btn-touch">+ 新增員工</button></div>
      <div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">薪水</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">支付銀行</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody id="emp-tbody" class="bg-white divide-y divide-gray-200"></tbody></table></div>
    </div>
  `;
  document.getElementById('emp-tbody').innerHTML = D.emps.map(e=>{const b=D.banks.find(x=>x.id===e.bank_account_id);return `<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">${e.name}</td><td class="px-4 py-3 font-bold">NT$${(e.salary||0).toLocaleString()}</td><td class="px-4 py-3">${b?.account_name||'-'}</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openEmpModal('${e.id}')" class="text-green-600 text-sm hover:underline">編輯</button><button onclick="delEmp('${e.id}')" class="text-red-600 text-sm hover:underline">刪除</button></td></tr>`;}).join('');
}

  editingId=id||null; const e=id?D.emps.find(x=>x.id===id):null;

  openModal(id?'編輯員工':'新增員工', html, async()=>{

sb.auth.getSession().then(r => { 
  if(r.data?.session) { 
    document.getElementById('login-view').classList.add('hidden');

    loadAll().then(()=>switchView('boss')); 
  }
