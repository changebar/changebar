// ==================== 全域資料變數 ====================
let D = { products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[] };
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let bossDateRange = { start: bossMonth, end: bossMonth };
let isSaving = false;

const COLOR_NAMES = { '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色', '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色' };
const PRODUCT_TYPE_MAP = { 'finished': '成品', 'semi': '半成品', 'gift_box': '禮盒', 'outer_box': '外箱子' };

// ==================== 輔助函式 ====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar) return;

  if (window.innerWidth <= 1024) {
    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      sidebar.classList.remove('open');
      if (overlay) {
        overlay.classList.remove('show');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }
    } else {
      if (overlay) {
        overlay.classList.remove('hidden');
        void overlay.offsetWidth;
        overlay.classList.add('show');
      }
      sidebar.classList.add('open');
    }
  } else {
    sidebar.classList.toggle('collapsed');
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('sidebarCollapsed', isCollapsed ? 'true' : 'false');
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth > 1024 && sidebar) {
    const saved = localStorage.getItem('sidebarCollapsed');
    if (saved === 'true') {
      sidebar.classList.add('collapsed');
    } else {
      sidebar.classList.remove('collapsed');
    }
  }
  const toggleBtn = document.getElementById('sidebar-toggle-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleSidebar();
    });
  }
  const expandBtn = document.getElementById('sidebar-expand-btn');
  if (expandBtn) {
    expandBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleSidebar();
    });
  }
  const closeBtn = document.getElementById('sidebar-close-btn');

      }
    });

  if (overlay) {
    overlay.addEventListener('click', function() {

    });
  }
  const menuBtn = document.getElementById('menu-toggle-btn');

});

function showAlert(msg) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');

  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
  if (modal) modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden flex flex-col';

  title.textContent = '訊息';
  body.innerHTML = '<div class="p-6"><div class="flex flex-col items-center justify-center"><div class="text-center text-lg text-gray-800">' + msg + '</div></div></div>';

  footer.innerHTML = '';
  const confirmBtn = document.createElement('button');
  confirmBtn.id = 'alert-ok-btn';
  confirmBtn.className = 'w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors cursor-pointer btn-touch';
  confirmBtn.textContent = '確定 (Enter)';

  confirmBtn.onclick = function() {
    closeModal();
    document.removeEventListener('keydown', handleAlertKey);
  };

  function handleAlertKey(e) {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleAlertKey);
    } else if(e.key === 'Escape') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleAlertKey);
    }
  }

  footer.appendChild(confirmBtn);
  overlay.classList.remove('hidden');
  if (modal) modal.classList.remove('hidden');

  setTimeout(function() {
    confirmBtn.focus();
    document.addEventListener('keydown', handleAlertKey);
  }, 100);
}

window.closeModal = function() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  if(overlay) overlay.classList.add('hidden');
  if(modal) {
    modal.classList.remove('hidden');
    modal.classList.remove('modal-fullscreen');
  }
  editingId = null;
  isSaving = false;
};

function openModal(title, html, onSave, hideSave) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  const titleEl = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');

  if(!overlay || !modal || !titleEl || !body) {
    console.error('找不到必要的 modal 元素');
    return;
  }

  modal.classList.remove('modal-fullscreen');
  const fullscreenBtn = document.getElementById('modal-fullscreen-btn');
  if (fullscreenBtn) fullscreenBtn.textContent = '⛶';

  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-3 md:p-4';
  modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col transform transition-all modal-content';

  titleEl.textContent = title;
  body.innerHTML = html;

  if (fullscreenBtn) {
    fullscreenBtn.onclick = function() {
      const isFull = modal.classList.toggle('modal-fullscreen');
      fullscreenBtn.textContent = isFull ? '⤢' : '⛶';
      if (isFull) {
        body.style.overflowY = 'auto';
        body.style.flex = '1';
      } else {
        body.style.overflowY = '';
        body.style.flex = '';
      }
    };
  }

  const closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) {
    closeBtn.onclick = function() {
      window.closeModal();
    };
  }

  if(footer) {
    footer.innerHTML = '';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-gray-300 rounded-lg hover:bg-gray-400 font-semibold transition-colors btn-touch cursor-pointer';
    cancelBtn.style.zIndex = '100';
    cancelBtn.textContent = '取消 (Esc)';
    cancelBtn.onclick = function() {
      closeModal();
    };

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-lg btn-touch cursor-pointer';
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.disabled = false;
    saveBtn.style.zIndex = '100';
    saveBtn.id = 'modal-save-btn';

    if(hideSave) {
      saveBtn.classList.add('hidden');
    } else {
      saveBtn.classList.remove('hidden');
      saveBtn.onclick = function() {
        if(isSaving) return;
        isSaving = true;
        saveBtn.disabled = true;
        saveBtn.textContent = '儲存中...';
        onSave().then(function() {
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
          closeModal();
        }).catch(function(e) {
          console.error('Save error:', e || 'Unknown error');
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
        });
      };
    }

    footer.appendChild(cancelBtn);
    footer.appendChild(saveBtn);
  }

  overlay.classList.remove('hidden');
  modal.classList.remove('hidden');

  function handleModalKey(e) {
    if(e.key === 'Escape') {
      e.preventDefault();
      closeModal();
      document.removeEventListener('keydown', handleModalKey);
    } else if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      const saveBtn = document.getElementById('modal-save-btn');
      if(saveBtn && !saveBtn.disabled) {
        saveBtn.click();
      }
    }
  }

  document.addEventListener('keydown', handleModalKey);

  setTimeout(function() {
    const firstInput = modal.querySelector('input, select, textarea');
    if(firstInput) firstInput.focus();
  }, 100);
}

// ==================== DOM 載入後綁定事件 ====================
document.addEventListener('DOMContentLoaded', function() {
  const navLinks = document.querySelectorAll('nav a');
  for(let i=0; i<navLinks.length; i++) {
    navLinks[i].addEventListener('click', function(e) {
      e.preventDefault();
      switchView(this.dataset.view);
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 1024 && sidebar && sidebar.classList.contains('open')) {
        toggleSidebar();
      }
    });
  }

  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }

  document.getElementById('password').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', function() {
    if(window.sb) {
      window.sb.auth.signOut().then(function() { location.reload(); });
    } else {
      location.reload();
    }
  });

  document.getElementById('login-btn').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if(remember) localStorage.setItem('rememberedEmail', email);
    else localStorage.removeItem('rememberedEmail');

    if(!window.sb) {
      showAlert('Supabase 未連接，請檢查網路或設定。');
      return;
    }

    window.sb.auth.signInWithPassword({ email: email, password: password })
      .then(function(res) {
        if (res.error) {
          showAlert('登入失敗：' + res.error.message);
        } else {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('main-system').classList.remove('hidden');
          if (typeof loadAll === 'function') {
            loadAll().then(function() { switchView('boss'); });
          } else {
            console.log('loadAll 不存在，直接切換視圖');
            switchView('boss');
          }
        }
      })
      .catch(function(err) {
        showAlert('登入發生錯誤：' + err.message);
      });
  });
});

// ==================== 切換視圖與排序 ====================
function switchView(view) {
  currentView = view;
  const c = document.getElementById('main-content');
  if (view === 'boss') renderBoss(c);
  else if (view === 'crm') renderCRM(c);
  else if (view === 'orders') renderOrders(c);
  else if (view === 'products') renderProducts(c);
  else if (view === 'warehouses') renderWarehouses(c);
  else if (view === 'inventory') renderInventory(c);
  else if (view === 'purchases') renderPurchases(c);
  else if (view === 'vendors') renderVendors(c);
  else if (view === 'finance') renderFinance(c);
  else if (view === 'banks') renderBanks(c);
  else if (view === 'settings') renderSettings(c);
  else {
    c.innerHTML = '<div class="p-8 text-center text-gray-500">功能開發中</div>';
  }
  document.querySelectorAll('nav a').forEach(el => el.classList.remove('nav-active'));
  const activeLink = document.querySelector(`nav a[data-view="${view}"]`);
  if(activeLink) activeLink.classList.add('nav-active');
}

function sortTable(tbodyId, colIndex) {
  const tbody = document.getElementById(tbodyId);
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a, b) {
    const aText = a.cells[colIndex] ? a.cells[colIndex].textContent || '' : '';
    const bText = b.cells[colIndex] ? b.cells[colIndex].textContent || '' : '';
    return aText.localeCompare(bText, 'zh-TW');
  });
  for(let i=0; i<rows.length; i++) tbody.appendChild(rows[i]);
}

function render() {
    switchView(currentView);
}

// ==================== 老闆查閱 ====================
function renderBoss(c) {
  const startY = parseInt(bossDateRange.start.split('-')[0]);
  const startM = parseInt(bossDateRange.start.split('-')[1]);
  const endY = parseInt(bossDateRange.end.split('-')[0]);
  const endM = parseInt(bossDateRange.end.split('-')[1]);
  
  const monthOrders = D.orders.filter(function(o) {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  
  let rev = 0;
  for(let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount||0;
  
  const monthPurchases = D.purchases.filter(function(p) {
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let pur = 0;
  for(let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount||0;
  
  const monthExpenses = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let exp = 0;
  for(let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount||0;
  
  const monthSubs = D.subs.filter(function(s) {
    if(!s.start_date) return false;
    const d = new Date(s.start_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let sub = 0;
  for(let i=0; i<monthSubs.length; i++) sub += monthSubs[i].amount||0;
  
  let totalCash = 0;
  for(let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance||0;
  
  const monthlyProfit = rev - pur - exp - sub;
  
  const unreimbursedExpenses = D.expenses.filter(function(e) { return e.employee_id && !e.is_reimbursed; });
  const unreimbursedByEmp = {};
  for(let i=0; i<unreimbursedExpenses.length; i++) {
    const e = unreimbursedExpenses[i];
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += e.amount || 0;
      unreimbursedByEmp[emp.name].items.push(e);
    }
  }
  
  const inventoryByType = {};
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    let totalQty = 0;
    const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity||0;
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({ type: p.type, name: p.name, sku: p.sku, quantity: totalQty, cost: p.cost_price || 0, value: totalQty * (p.cost_price || 0) });
    }
  }
  
  const inventoryAssets = { finished: { count: 0, value: 0 }, semi: { count: 0, value: 0 }, gift_box: { count: 0, value: 0 }, outer_box: { count: 0, value: 0 } };
  let allItems = [];
  for(const type in inventoryByType) { allItems = allItems.concat(inventoryByType[type]); }
  for(let i=0; i<allItems.length; i++) {
    const item = allItems[i];
    if(inventoryAssets[item.type]) {
      inventoryAssets[item.type].count += item.quantity;
      inventoryAssets[item.type].value += item.value;
    }
  }
  let totalInventoryValue = 0;
  for(const type in inventoryAssets) { totalInventoryValue += inventoryAssets[type].value; }
  
  const channelStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const ch = D.channels.find(function(x) { return x.id===o.sales_channel_id; });
    if(ch) {
      if(!channelStats[ch.name]) channelStats[ch.name] = {count:0, amount:0, commission:0};
      channelStats[ch.name].count++;
      channelStats[ch.name].amount += o.total_amount||0;
      channelStats[ch.name].commission += o.channel_commission||0;
    }
  }
  
  const paymentStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const pm = D.payments.find(function(x) { return x.id===o.payment_method_id; });
    if(pm) {
      if(!paymentStats[pm.name]) paymentStats[pm.name] = {count:0, amount:0, commission:0};
      paymentStats[pm.name].count++;
      paymentStats[pm.name].amount += o.total_amount||0;
      paymentStats[pm.name].commission += o.payment_commission||0;
    }
  }
  
  let companyShipping = 0;
  let customerShipping = 0;
  for(let i=0; i<monthOrders.length; i++) {
    companyShipping += monthOrders[i].absorbed_shipping_fee || 0;
    customerShipping += monthOrders[i].customer_paid_shipping || 0;
  }
  let totalChannelCommission = 0;
  for(const ch in channelStats) totalChannelCommission += channelStats[ch].commission;
  let totalPaymentCommission = 0;
  for(const pm in paymentStats) totalPaymentCommission += paymentStats[pm].commission;
  const totalShippingCost = companyShipping;
  const totalOrderExpenses = totalChannelCommission + totalPaymentCommission + totalShippingCost;
  
  const subTag = D.tags.find(function(t) { return t.name.indexOf('訂閱') !== -1; });
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(function(ct) { return ct.tag_id === subTag.id; }).map(function(ct) { return ct.customer_id; });
    const uniqueIds = [];
    for(let i=0; i<subTagIds.length; i++) { if(uniqueIds.indexOf(subTagIds[i]) === -1) uniqueIds.push(subTagIds[i]); }
    subCustomerCount = uniqueIds.length;
  }
  let subMonthlyRevenue = 0;
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    if(o.is_subscription && o.subscription_days > 0) {
      const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
      subMonthlyRevenue += dailyRevenue * 30;
    }
  }
  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  let channelStatsHtml = '';
  for(const name in channelStats) {
    const stat = channelStats[name];
    channelStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!channelStatsHtml) channelStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let paymentStatsHtml = '';
  for(const name in paymentStats) {
    const stat = paymentStats[name];
    paymentStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!paymentStatsHtml) paymentStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let unreimbursedHtml = '';
  for(const name in unreimbursedByEmp) {
    const data = unreimbursedByEmp[name];
    let itemsHtml = '';
    for(let i=0; i<data.items.length; i++) {
      const e = data.items[i];
      itemsHtml += '<div class="flex justify-between"><span>'+(e.description || '無描述')+' ('+e.payment_date+')</span><span>'+(e.amount||0).toLocaleString()+'</span></div>';
    }
    unreimbursedHtml += '<div class="border rounded-lg p-4"><div class="flex justify-between items-center mb-2"><span class="font-bold text-lg">'+name+'</span><span class="text-2xl font-bold text-orange-600">'+data.total.toLocaleString()+'</span></div><div class="text-sm text-gray-600 space-y-1">'+itemsHtml+'</div></div>';
  }
  if(!unreimbursedHtml) unreimbursedHtml = '<p class="text-gray-500">目前無待結帳代墊款項</p>';
  
  let inventoryDetailHtml = '';
  for(const type in inventoryByType) {
    const items = inventoryByType[type];
    let rowsHtml = '';
    for(let i=0; i<items.length; i++) {
      const item = items[i];
      rowsHtml += '<tr class="border-t"><td class="px-3 py-2">'+item.name+'</td><td class="px-3 py-2">'+(item.sku || '-')+'</td><td class="px-3 py-2 font-bold">'+item.quantity+'</td><td class="px-3 py-2">'+item.cost.toLocaleString()+'</td><td class="px-3 py-2 text-green-600 font-bold">'+item.value.toLocaleString()+'</td></tr>';
    }
    const typeName = PRODUCT_TYPE_MAP[type] || type;
    inventoryDetailHtml += '<div class="border rounded-lg p-3"><h5 class="font-bold text-sm mb-2">'+typeName+'</h5><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left text-xs">產品名稱</th><th class="px-3 py-2 text-left text-xs">SKU</th><th class="px-3 py-2 text-left text-xs">數量</th><th class="px-3 py-2 text-left text-xs">成本</th><th class="px-3 py-2 text-left text-xs">總價值</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
  }
  
  let banksHtml = '';
  for(let i=0; i<D.banks.length; i++) {
    const b = D.banks[i];
    banksHtml += '<div class="flex justify-between items-center p-3 bg-gray-50 rounded"><span class="font-medium">'+b.account_name+'</span><span class="font-bold text-green-600">'+(b.balance||0).toLocaleString()+'</span></div>';

    '<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">' +
    '<div><h1 class="text-3xl font-bold">👑 老闆查閱</h1><p class="text-sm text-gray-600 mt-1">查看期間：'+bossDateRange.start+' ~ '+bossDateRange.end+'</p></div>' +
    '<div class="flex flex-wrap gap-2 w-full md:w-auto">' +
    '<input type="month" value="'+bossDateRange.start+'" onchange="bossDateRange.start=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<span class="flex items-center text-gray-500">至</span>' +
    '<input type="month" value="'+bossDateRange.end+'" onchange="bossDateRange.end=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<button onclick="downloadBossReport()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold btn-touch">📥 下載 Excel</button>' +
    '</div></div>' +

function renderCustTable() {
  const kw = (document.getElementById('cust-search')?.value || '').toLowerCase();
  const list = D.customers.filter(function(c) {
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().indexOf(kw) !== -1;
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; });
    let tagMatch = false;
    for(let i=0; i<custTags.length; i++) {
      const ct = custTags[i];
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      if(tag && tag.name.toLowerCase().indexOf(kw) !== -1) { tagMatch = true; break; }
    }
    return basicMatch || tagMatch;
  });
  let html = '';
  for(let i=0; i<list.length; i++) {
    const c = list[i];
    const win = D.windows.find(function(w) { return w.id===c.primary_contact_window_id; });
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; }).map(function(ct) {
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
    }).join('');
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full '+(c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800')+'">'+c.type+'</span></td><td class="px-4 py-3 font-medium">'+(c.company_name||c.contact_person)+'</td><td class="px-4 py-3 text-sm">'+c.contact_person+'<br><span class="text-gray-500">'+c.phone+'</span></td><td class="px-4 py-3 text-sm">'+(c.invoice_title||'-')+'<br><span class="text-gray-500">'+(c.tax_id||'-')+'</span></td><td class="px-4 py-3 text-sm">'+(win ? win.name : '-')+'</td><td class="px-4 py-3">'+(custTags || '<span class="text-gray-400">無</span>')+'</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewCustDetail(\''+c.id+'\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button><button onclick="openCustModal(\''+c.id+'\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delCust(\''+c.id+'\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';

function syncAddrContact() {
  const contact = document.getElementById('c-contact') ? document.getElementById('c-contact').value || '' : '';
  const phone = document.getElementById('c-phone') ? document.getElementById('c-phone').value || '' : '';
  const recvInputs = document.querySelectorAll('#addr-box .a-recv');
  const phoneInputs = document.querySelectorAll('#addr-box .a-phone');
  for(let i=0; i<recvInputs.length; i++) { if(!recvInputs[i].dataset.userEdited) recvInputs[i].value = contact; }
  for(let i=0; i<phoneInputs.length; i++) { if(!phoneInputs[i].dataset.userEdited) phoneInputs[i].value = phone; }
}

function addAddr(addrData, isDefault) {
  const box = document.getElementById('addr-box');
  const contact = document.getElementById('c-contact') ? document.getElementById('c-contact').value || '' : '';
  const phone = document.getElementById('c-phone') ? document.getElementById('c-phone').value || '' : '';
  const div = document.createElement('div');
  div.className = 'border rounded-lg p-4 bg-gray-50';
  const recipientName = addrData ? addrData.recipient_name : contact;
  const recipientPhone = addrData ? addrData.recipient_phone : phone;
  const addressType = addrData ? addrData.address_type : 'home';

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = { type: document.getElementById('c-type').value, company_name: document.getElementById('c-comp').value||null, contact_person: document.getElementById('c-contact').value, phone: document.getElementById('c-phone').value, contact_window_name: document.getElementById('c-winname').value||null, primary_contact_window_id: document.getElementById('c-win').value||null, invoice_title: document.getElementById('c-title').value||null, tax_id: document.getElementById('c-tax').value||null, email: document.getElementById('c-email').value||null };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  try {
    let cid = id;
    if(id) await sb.from('customers').update(data).eq('id',id);
    else { const inserted = await sb.from('customers').insert([data]).select().single(); cid = inserted.data.id; }
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = [];
    const checkboxes = document.querySelectorAll('.c-tag-cb:checked');
    for(let i=0; i<checkboxes.length; i++) tagIds.push(checkboxes[i].value);
    if(tagIds.length) { const tagInserts = []; for(let i=0; i<tagIds.length; i++) tagInserts.push({customer_id:cid, tag_id:tagIds[i]}); await sb.from('customer_tags').insert(tagInserts); }
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    const addrDivs = document.querySelectorAll('#addr-box > div');
    for(let i=0; i<addrDivs.length; i++) { const d = addrDivs[i]; addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr').value, is_default:d.querySelector('.a-def').checked }); }
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    showAlert('客戶已儲存！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

}

function renderOrdTable() {
  const searchInput = document.getElementById('ord-search');
  const startDateInput = document.getElementById('ord-start-date');
  const endDateInput = document.getElementById('ord-end-date');

  const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
  const startDate = startDateInput ? startDateInput.value : '';
  const endDate = endDateInput ? endDateInput.value : '';

  let list = D.orders.slice();

  if(searchTerm) {
    list = list.filter(function(o) {
      const c = D.customers.find(function(x) { return x.id === o.customer_id; });
      const customerName = c ? (c.company_name || c.contact_person || '').toLowerCase() : '';
      const customerPhone = c ? (c.phone || '').toLowerCase() : '';
      return customerName.indexOf(searchTerm) !== -1 ||
             customerPhone.indexOf(searchTerm) !== -1;
    });
  }

  if(startDate) {
    list = list.filter(function(o) {
      const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
      return orderDate >= startDate;
    });
  }
  if(endDate) {
    list = list.filter(function(o) {
      const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
      return orderDate <= endDate;
    });
  }

  if(window.ordSortField) {
    list.sort(function(a, b) {
      let aVal = a[window.ordSortField];
      let bVal = b[window.ordSortField];
      if(window.ordSortField === 'created_at') {
        aVal = new Date(aVal);
        bVal = new Date(bVal);
      }
      if(aVal < bVal) return window.ordSortAsc ? -1 : 1;
      if(aVal > bVal) return window.ordSortAsc ? 1 : -1;
      return 0;
    });
  } else {
    list.sort(function(a, b) {
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }

  let html = '';
  let totalAmount = 0;
  let totalMargin = 0;
  let count = 0;

  for(let i=0; i<list.length; i++) {
    const o = list[i];
    const c = D.customers.find(function(x) { return x.id === o.customer_id; });
    const emp = o.shipping_advance_employee_id ? D.emps.find(function(x) { return x.id === o.shipping_advance_employee_id; }) : null;
    const bank = D.banks.find(function(x) { return x.id === o.bank_account_id; });

    totalAmount += o.total_amount || 0;
    if(o.gross_profit_margin !== undefined) { totalMargin += o.gross_profit_margin || 0; count++; }

    let marginHtml = '<span class="text-gray-400">-</span>';
    if(o.gross_profit_margin !== undefined && o.gross_profit_margin !== null) {
      const color = o.gross_profit_margin >= 0 ? 'text-green-600' : 'text-red-600';
      marginHtml = '<span class="'+color+' font-bold">'+o.gross_profit_margin.toFixed(1)+'%</span>';
    }

    let advanceHtml = '<span class="text-gray-400">-</span>';
    if(o.shipping_advance_amount > 0 && emp) {
      advanceHtml = '<div class="text-xs text-center"><div class="text-orange-600">'+emp.name+'</div><div class="font-bold">'+o.shipping_advance_amount.toLocaleString()+'</div></div>';
    }

    html += '<tr class="hover:bg-gray-50">' +
      '<td class="px-4 py-3 text-center whitespace-nowrap">' + new Date(o.created_at).toLocaleDateString() + '</td>' +
      '<td class="px-4 py-3 text-center">' + (c ? c.company_name || c.contact_person : '-') + '</td>' +
      '<td class="px-4 py-3 text-center">' + (bank ? bank.account_name : '-') + '</td>' +
      '<td class="px-4 py-3 text-center">' + advanceHtml + '</td>' +
      '<td class="px-4 py-3 text-center font-bold">' + (o.total_amount || 0).toLocaleString() + '</td>' +
      '<td class="px-4 py-3 text-center">' + marginHtml + '</td>' +
      '<td class="px-4 py-3 whitespace-nowrap space-x-2 text-center">' +
        '<button onclick="viewOrdDetail(\'' + o.id + '\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button>' +
        '<button onclick="openOrdModal(\'' + o.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button>' +
        '<button onclick="delOrd(\'' + o.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button>' +
      '</td>' +
    '</tr>';
  }

  const avgMargin = count > 0 ? (totalMargin / count).toFixed(1) : 0;
  html += '<tr class="bg-gray-100 font-bold">' +
    '<td class="px-4 py-3 text-center" colspan="3">總計 ('+list.length+' 單)</td>' +
    '<td class="px-4 py-3 text-center text-lg">'+totalAmount.toLocaleString()+'</td>' +
    '<td class="px-4 py-3 text-center text-lg">'+avgMargin+'%</td>' +
    '<td class="px-4 py-3 text-center" colspan="2">平均毛利率</td>' +
  '</tr>';

  const tbody = document.getElementById('ord-tbody');
  if(tbody) {
    tbody.innerHTML = html;
  }
}

function sortOrders(field) {
  if(window.ordSortField === field) {
    window.ordSortAsc = !window.ordSortAsc;
  } else {
    window.ordSortField = field;
    window.ordSortAsc = true;
  }
  renderOrdTable();
}

function clearOrdFilters() {
  const searchInput = document.getElementById('ord-search');
  const startDateInput = document.getElementById('ord-start-date');
  const endDateInput = document.getElementById('ord-end-date');

  if(searchInput) searchInput.value = '';
  if(startDateInput) startDateInput.value = '';
  if(endDateInput) endDateInput.value = '';

  window.ordSortField = null;
  window.ordSortAsc = true;
  renderOrdTable();
}

function searchCustomerInOrder() {
  const kw = document.getElementById('o-cust-search').value.toLowerCase();
  const select = document.getElementById('o-cust');
  const options = select.querySelectorAll('option');
  for(let i=0; i<options.length; i++) {
    const opt = options[i];
    const text = (opt.dataset.name || '').toLowerCase() + ' ' + (opt.dataset.phone || '').toLowerCase();
    opt.style.display = text.indexOf(kw) !== -1 ? 'block' : 'none';
  }
}

function fillCustomerData() {
  const custId = document.getElementById('o-cust').value;
  if(!custId) return;
  const cust = D.customers.find(function(c) { return c.id === custId; });
  if(!cust) return;

  document.getElementById('o-recv-name').value = cust.contact_person || '';
  document.getElementById('o-recv-phone').value = cust.phone || '';
  document.getElementById('o-invoice-title').value = cust.invoice_title || '';
  document.getElementById('o-invoice-tax').value = cust.tax_id || '';

  loadCustomerDefaultAddress(custId);
}

async function loadCustomerDefaultAddress(custId) {
  const resp = await sb.from('customer_addresses').select('*').eq('customer_id', custId).eq('is_default', true).limit(1);
  if(resp.data && resp.data.length > 0) {
    const addr = resp.data[0];
    document.getElementById('o-recv-addr').value = addr.street || addr.cvs_store_name || '';
  }
}

function addOrdItem(typeFilter, prod, qty, price) {
  const box = document.getElementById('o-items');
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded flex-wrap';

  const typeMap = { 'finished': '成品', 'gift_box': '禮盒', 'outer_box': '外箱' };
  const typeColor = { 'finished': 'bg-blue-100 text-blue-700', 'gift_box': 'bg-pink-100 text-pink-700', 'outer_box': 'bg-gray-200 text-gray-700' };

  let prodOptions = '<option value="">選擇'+(typeMap[typeFilter]||'')+'產品</option>';
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    if(p.type === typeFilter) {
      prodOptions += '<option value="' + p.id + '" data-price="' + (p.sell_price || 0) + '" data-cost="' + (p.cost_price || 0) + '" data-type="' + p.type + '" ' + (prod && prod.id === p.id ? 'selected' : '') + '>' + p.name + ' - 售價:' + (p.sell_price || 0) + '</option>';
    }
  }

  div.innerHTML = '<div class="flex-1 min-w-[150px]"><span class="inline-block px-2 py-1 rounded text-xs font-bold '+typeColor[typeFilter]+' mb-1">'+(typeMap[typeFilter]||'')+'</span><select class="o-prod w-full px-3 py-2 border rounded input-field" onchange="autoFillPrice(this); calcOrd()">' + prodOptions + '</select></div><div class="w-20"><input type="number" class="o-qty w-full px-3 py-2 border rounded input-field" value="' + (qty || 1) + '" min="1" oninput="calcOrd()"></div><div class="w-28"><input type="number" class="o-price w-full px-3 py-2 border rounded input-field" value="' + (price !== undefined ? price : 0) + '" step="0.01" oninput="calcOrd()"></div><button type="button" onclick="this.parentElement.remove(); calcOrd()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch">X</button>';
  box.appendChild(div);
  if(price !== undefined && price > 0) {
    setTimeout(calcOrd, 50);
  }
}

function autoFillPrice(select) {
  const option = select.options[select.selectedIndex];
  const price = option.dataset.price || 0;
  const row = select.closest('div.flex');
  const priceInput = row.querySelector('.o-price');
  if(price && (!priceInput.value || priceInput.value === '0')) {
    priceInput.value = price;
    calcOrd();
  }
}
function calcOrd() {
  let productSubtotal = 0;
  let totalCost = 0;
  const rows = document.querySelectorAll('#o-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const select = r.querySelector('.o-prod');
    if(!select || !select.value) continue;
    const option = select.options[select.selectedIndex];
    const costPrice = parseFloat(option.dataset.cost) || 0;
    const price = parseFloat(r.querySelector('.o-price').value) || 0;
    const qty = parseInt(r.querySelector('.o-qty').value) || 0;
    productSubtotal += price * qty;
    totalCost += costPrice * qty;
  }

  const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
  const shipPayer = document.getElementById('o-ship-payer').value;
  let finalShipping = 0;
  if(shipPayer === 'customer') finalShipping = shippingFee;

  const invType = document.getElementById('o-invoice-type').value;
  let taxAmount = 0;
  if(invType === 'tax_plus') taxAmount = productSubtotal * 0.05;

  const couponAmount = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
  const pointsAmount = parseFloat(document.getElementById('o-points-amount').value) || 0;
  const totalDiscount = couponAmount + pointsAmount;

  let amountAfterDiscount = productSubtotal + finalShipping + taxAmount - totalDiscount;
  if(amountAfterDiscount < 0) amountAfterDiscount = 0;

  const chSelect = document.getElementById('o-channel');
  const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
  const pmSelect = document.getElementById('o-payment');
  const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;

  const chCommission = amountAfterDiscount * (chRate / 100);
  const pmCommission = amountAfterDiscount * (pmRate / 100);
  const companyShippingCost = shipPayer === 'company' ? shippingFee : 0;

  const grossProfit = amountAfterDiscount - totalCost - chCommission - pmCommission - companyShippingCost;
  const margin = amountAfterDiscount > 0 ? (grossProfit / amountAfterDiscount) * 100 : 0;

  document.getElementById('o-total').textContent = Math.round(amountAfterDiscount).toLocaleString();
  document.getElementById('o-cost').textContent = totalCost.toLocaleString();
  document.getElementById('o-tax').textContent = Math.round(taxAmount).toLocaleString();
  document.getElementById('o-coupon-display').textContent = Math.round(couponAmount).toLocaleString();
  document.getElementById('o-points-display').textContent = Math.round(pointsAmount).toLocaleString();
  document.getElementById('o-ch-commission').textContent = Math.round(chCommission).toLocaleString();
  document.getElementById('o-pm-commission').textContent = Math.round(pmCommission).toLocaleString();
  document.getElementById('o-margin').textContent = margin.toFixed(1) + '%';
  document.getElementById('o-margin').className = margin >= 0 ? 'text-green-600' : 'text-red-600';
}

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  const wid = document.getElementById('o-warehouse').value;
  const bankId = document.getElementById('o-bank').value;
  if(!cid) return showAlert('請選擇客戶！');
  if(!wid) return showAlert('請選擇出貨倉庫！');
  if(!bankId) return showAlert('請選擇入款銀行！');

  const items = [];
  let productSubtotal = 0;
  let totalCost = 0;
  const rows = document.querySelectorAll('#o-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const select = r.querySelector('.o-prod');
    if(!select || !select.value) continue;
    const option = select.options[select.selectedIndex];
    const pid = option.value;
    const costPrice = parseFloat(option.dataset.cost) || 0;
    const q = parseInt(r.querySelector('.o-qty').value) || 0;
    const p = parseFloat(r.querySelector('.o-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      productSubtotal += p * q;
      totalCost += costPrice * q;
    }
  }
  if(!items.length) return showAlert('請加入產品！');

  const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
  const shipPayer = document.getElementById('o-ship-payer').value;
  const finalShipping = shipPayer === 'customer' ? shippingFee : 0;
  const invType = document.getElementById('o-invoice-type').value;
  const taxAmount = invType === 'tax_plus' ? productSubtotal * 0.05 : 0;
  const couponAmount = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
  const pointsAmount = parseFloat(document.getElementById('o-points-amount').value) || 0;
  const totalDiscount = couponAmount + pointsAmount;

  let totalAmountRaw = productSubtotal + finalShipping + taxAmount - totalDiscount;
  if(totalAmountRaw < 0) totalAmountRaw = 0;
  const totalAmount = Math.round(totalAmountRaw);

  const chSelect = document.getElementById('o-channel');
  const chId = chSelect.value || null;
  const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
  const pmSelect = document.getElementById('o-payment');
  const pmId = pmSelect.value || null;
  const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;

  const chCommission = totalAmount * (chRate / 100);
  const pmCommission = totalAmount * (pmRate / 100);
  const companyShippingCost = shipPayer === 'company' ? shippingFee : 0;
  const grossProfit = totalAmount - totalCost - chCommission - pmCommission - companyShippingCost;
  const margin = totalAmount > 0 ? (grossProfit / totalAmount) * 100 : 0;
  const hasAdvance = document.getElementById('o-has-advance').checked;
  const advanceEmpId = hasAdvance ? (document.getElementById('o-advance-emp').value || null) : null;
  const advanceAmount = 0;
  const advanceStatus = 'pending';
  const advanceBankId = null;

  const isSubscriptionOrder = document.getElementById('o-is-subscription').checked;
  const subscriptionDays = parseInt(document.getElementById('o-subscription-days').value) || 30;

  const data = {
    customer_id: cid, warehouse_id: wid, bank_account_id: bankId,
    total_amount: totalAmount, gross_profit_margin: margin,
    status: 'shipped', order_no: editingId ? D.orders.find(function(x) { return x.id === editingId; }).order_no : 'ORD-' + Date.now(),
    invoice_type: invType, invoice_no: document.getElementById('o-invoice-no').value || null,
    invoice_title: document.getElementById('o-invoice-title').value, invoice_tax_id: document.getElementById('o-invoice-tax').value,
    shipping_fee: shippingFee, absorbed_shipping_fee: companyShippingCost, customer_paid_shipping: finalShipping,
    sales_channel_id: chId, payment_method_id: pmId,
    shipping_recv_name: document.getElementById('o-recv-name').value,
    shipping_recv_phone: document.getElementById('o-recv-phone').value,
    shipping_address: document.getElementById('o-recv-addr').value,
    shipping_advance_employee_id: advanceEmpId,
    is_subscription_order: isSubscriptionOrder,
    subscription_days: subscriptionDays,
    coupon_amount: couponAmount,
    points_amount: pointsAmount,
    shipping_advance_amount: advanceAmount,
    shipping_advance_reimbursed: advanceStatus === 'reimbursed',
    shipping_advance_bank_id: advanceBankId,
    shipping_advance_reimbursed_date: advanceStatus === 'reimbursed' ? new Date().toISOString().split('T')[0] : null
  };

  try {
    if(editingId) {
      const oldOrderResp = await sb.from('orders').select('*').eq('id', editingId).single();
      const oldOrder = oldOrderResp.data;

      if(oldOrder) {
        const oldBankId = oldOrder.bank_account_id;
        const bankChanged = (oldBankId !== bankId);
        if(bankChanged && oldOrder.bank_account_id && oldOrder.total_amount) {
          const oldBank = D.banks.find(function(b) { return b.id === oldOrder.bank_account_id; });
          if(oldBank) {
            await sb.from('bank_accounts').update({
              balance: (oldBank.balance || 0) - oldOrder.total_amount
            }).eq('id', oldOrder.bank_account_id);
          }
        }

        const oldItemsResp = await sb.from('order_items').select('*').eq('order_id', editingId);
        const oldItems = oldItemsResp.data || [];

        for(let i=0; i<oldItems.length; i++) {
          const oldItem = oldItems[i];
          const oldProduct = D.products.find(function(p) { return p.id === oldItem.product_id; });
          if(!oldProduct) continue;

          if(oldProduct.type === 'finished' || oldProduct.type === 'gift_box' || oldProduct.type === 'outer_box') {
            const existingInv = await sb.from('warehouse_inventory')
              .select('id, quantity')
              .eq('warehouse_id', oldOrder.warehouse_id)
              .eq('product_id', oldProduct.id)
              .single();

            if(existingInv.data) {
              await sb.from('warehouse_inventory').update({
                quantity: (existingInv.data.quantity || 0) + oldItem.quantity
              }).eq('id', existingInv.data.id);
            } else {
              await sb.from('warehouse_inventory').insert([{
                warehouse_id: oldOrder.warehouse_id,
                product_id: oldProduct.id,
                quantity: oldItem.quantity,
                safety_stock: 0
              }]);
            }
          }

          const oldBomItems = D.bom.filter(function(b) { return b.parent_product_id === oldProduct.id; });
          if(oldBomItems.length > 0) {
            for(let j=0; j<oldBomItems.length; j++) {
              const oldBom = oldBomItems[j];
              const restoreQty = oldBom.quantity * oldItem.quantity;

              const materialInv = await sb.from('warehouse_inventory')
                .select('id, quantity, warehouse_id')
                .eq('product_id', oldBom.child_product_id);

              if(materialInv.data && materialInv.data.length > 0) {
                let targetInv = materialInv.data.find(function(inv) {
                  return inv.warehouse_id === oldOrder.warehouse_id;
                });
                if(!targetInv) targetInv = materialInv.data[0];

                await sb.from('warehouse_inventory').update({
                  quantity: (targetInv.quantity || 0) + restoreQty
                }).eq('id', targetInv.id);
              } else {
                await sb.from('warehouse_inventory').insert([{
                  warehouse_id: oldOrder.warehouse_id,
                  product_id: oldBom.child_product_id,
                  quantity: restoreQty,
                  safety_stock: 0
                }]);
              }
            }
          }
        }

        await sb.from('expenses').delete().eq('related_order_id', editingId);
      }

      const oldBankId = oldOrder.bank_account_id;
      const newBankId = bankId;

      if(oldBankId !== newBankId) {
        const newBank = D.banks.find(function(b) { return b.id === newBankId; });
        if(newBank) {
          await sb.from('bank_accounts').update({
            balance: (newBank.balance || 0) + totalAmount
          }).eq('id', newBankId);
        }
      }

      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const r = await sb.from('orders').insert([data]).select().single();
      editingId = r.data.id;

      const bank = D.banks.find(function(b) { return b.id === bankId; });
      if(bank) {
        await sb.from('bank_accounts').update({
          balance: (bank.balance || 0) + totalAmount
        }).eq('id', bankId);
      }
    }

    await sb.from('order_items').insert(items.map(function(i) {
      return Object.assign({}, i, {order_id: editingId});
    }));

    for(let i=0; i<items.length; i++) {
      const item = items[i];
      const product = D.products.find(function(p) { return p.id === item.product_id; });
      if(!product) continue;

      if(product.type === 'finished' || product.type === 'gift_box' || product.type === 'outer_box') {
        const existingInv = await sb.from('warehouse_inventory')
          .select('id, quantity')
          .eq('warehouse_id', wid)
          .eq('product_id', product.id)
          .single();

        if(existingInv.data) {
          await sb.from('warehouse_inventory').update({
            quantity: (existingInv.data.quantity || 0) - item.quantity
          }).eq('id', existingInv.data.id);
        } else {
          await sb.from('warehouse_inventory').insert([{
            warehouse_id: wid,
            product_id: product.id,
            quantity: -item.quantity,
            safety_stock: 0
          }]);
        }
      }

      const bomItems = D.bom.filter(function(b) { return b.parent_product_id === product.id; });
      if(bomItems.length > 0) {
        for(let j=0; j<bomItems.length; j++) {
          const bom = bomItems[j];
          const requiredQty = bom.quantity * item.quantity;

          const materialInv = await sb.from('warehouse_inventory')
            .select('id, quantity, warehouse_id')
            .eq('product_id', bom.child_product_id);

          if(materialInv.data && materialInv.data.length > 0) {
            let targetInv = materialInv.data.find(function(inv) {
              return inv.warehouse_id === wid;
            });
            if(!targetInv) targetInv = materialInv.data[0];

            await sb.from('warehouse_inventory').update({
              quantity: (targetInv.quantity || 0) - requiredQty
            }).eq('id', targetInv.id);
          } else {
            await sb.from('warehouse_inventory').insert([{
              warehouse_id: wid,
              product_id: bom.child_product_id,
              quantity: -requiredQty,
              safety_stock: 0
            }]);
          }
        }
      }
    }

    if(hasAdvance && advanceEmpId && advanceAmount > 0) {
      await sb.from('expenses').insert([{
        category_id: (D.expCats.find(function(c) { return c.name === '運費'; }) || {}).id,
        amount: advanceAmount,
        description: '訂單 '+data.order_no+' 運費代墊',
        payment_date: new Date().toISOString().split('T')[0],
        employee_id: advanceEmpId,
        is_reimbursed: advanceStatus === 'reimbursed',
        reimbursement_bank_id: advanceBankId,
        reimbursed_date: advanceStatus === 'reimbursed' ? new Date().toISOString().split('T')[0] : null,
        related_order_id: editingId
      }]);
    }

    showAlert('出貨單已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
    console.error('saveOrd error:', e);
  }
}

async function delOrd(id) {
  if(!confirm('確定刪除？')) return;
  try {
    const orderResp = await sb.from('orders').select('*').eq('id', id).single();
    const o = orderResp.data;

    if(!o) {
      showAlert('找不到訂單！');
      return;
    }

    if(o.bank_account_id && o.total_amount) {
      const bank = D.banks.find(function(b) { return b.id === o.bank_account_id; });
      if(bank) {
        await sb.from('bank_accounts').update({
          balance: (bank.balance || 0) - o.total_amount
        }).eq('id', o.bank_account_id);
      }
    }

    const itemsResp = await sb.from('order_items').select('*').eq('order_id', id);
    const items = itemsResp.data || [];

    for(let i=0; i<items.length; i++) {
      const item = items[i];
      const product = D.products.find(function(p) { return p.id === item.product_id; });
      if(!product) continue;

      if(product.type === 'finished' || product.type === 'gift_box' || product.type === 'outer_box') {
        const existingInv = await sb.from('warehouse_inventory')
          .select('id, quantity')
          .eq('warehouse_id', o.warehouse_id)
          .eq('product_id', product.id)
          .single();

        if(existingInv.data) {
          await sb.from('warehouse_inventory').update({
            quantity: (existingInv.data.quantity || 0) + item.quantity
          }).eq('id', existingInv.data.id);
        } else {
          await sb.from('warehouse_inventory').insert([{
            warehouse_id: o.warehouse_id,
            product_id: product.id,
            quantity: item.quantity,
            safety_stock: 0
          }]);
        }
      }

      const bomItems = D.bom.filter(function(b) { return b.parent_product_id === product.id; });
      if(bomItems.length > 0) {
        for(let j=0; j<bomItems.length; j++) {
          const bom = bomItems[j];
          const restoreQty = bom.quantity * item.quantity;

          const materialInv = await sb.from('warehouse_inventory')
            .select('id, quantity, warehouse_id')
            .eq('product_id', bom.child_product_id);

          if(materialInv.data && materialInv.data.length > 0) {
            let targetInv = materialInv.data.find(function(inv) {
              return inv.warehouse_id === o.warehouse_id;
            });
            if(!targetInv) targetInv = materialInv.data[0];

            await sb.from('warehouse_inventory').update({
              quantity: (targetInv.quantity || 0) + restoreQty
            }).eq('id', targetInv.id);
          } else {
            await sb.from('warehouse_inventory').insert([{
              warehouse_id: o.warehouse_id,
              product_id: bom.child_product_id,
              quantity: restoreQty,
              safety_stock: 0
            }]);
          }
        }
      }
    }

    await sb.from('expenses').delete().eq('related_order_id', id);
    await sb.from('order_items').delete().eq('order_id', id);
    await sb.from('orders').delete().eq('id', id);

    showAlert('訂單已刪除！');
    await loadAll();
    render();
  } catch(e) {
    showAlert('刪除失敗：' + e.message);
    console.error('delOrd error:', e);
  }
}

}

function showWhTab(whId) {
  const tabs = document.querySelectorAll('.wh-tab');
  for(let i=0; i<tabs.length; i++) {
    const t = tabs[i];
    t.className = t.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-700');
    if(t.dataset.wh === whId) t.className = t.className.replace('bg-gray-200 text-gray-700', 'bg-blue-600 text-white');
  }
  const container = document.getElementById('inv-content');
  let rows = '';

  if(whId === 'all') {
    for(let i=0; i<D.products.length; i++) {
      const p = D.products[i];
      let totalQty = 0;
      const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
      for(let j=0; j<invs.length; j++) { totalQty += invs[j].quantity || 0; }

      const initialStock = p.initial_stock || 0;
      const variance = initialStock > 0 ? ((totalQty - initialStock) / initialStock * 100) : 0;
      const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
      const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';

      rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + p.name + '</td><td class="px-4 py-3">' + (p.sku || '-') + '</td><td class="px-4 py-3 font-bold text-lg">' + totalQty + '</td><td class="px-4 py-3">' + initialStock + '</td><td class="px-4 py-3 ' + varianceClass + ' font-bold">' + varianceText + '</td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">初始庫存</th><th class="px-4 py-3 text-left text-xs">誤差率</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  } else {
    const wh = D.warehouses.find(function(w) { return w.id === whId; });
    const inv = D.warehouseInv.filter(function(i) { return i.warehouse_id === whId; });
    for(let i=0; i<D.products.length; i++) {
      const p = D.products[i];
      const wInv = inv.find(function(x) { return x.product_id === p.id; });
      const qty = wInv ? wInv.quantity : 0;

      const initialStock = p.initial_stock || 0;
      const variance = initialStock > 0 ? ((qty - initialStock) / initialStock * 100) : 0;
      const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
      const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';

      rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + p.name + '</td><td class="px-4 py-3 font-bold">' + qty + '</td><td class="px-4 py-3">' + initialStock + '</td><td class="px-4 py-3 ' + varianceClass + ' font-bold">' + varianceText + '</td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="' + qty + '"><button onclick="saveInvItem(this, \'' + p.id + '\', \'' + whId + '\')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs btn-touch">儲存</button></td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold">' + (wh ? wh.name : '') + ' - 庫存明細</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">初始庫存</th><th class="px-4 py-3 text-left text-xs">誤差率</th><th class="px-4 py-3 text-left text-xs">盤點調整</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
}

function saveInvItem(btn, pid, wid) {

able></div></div>';

function renderPurTable() {
  const searchText = (document.getElementById('pur-search')?.value || '').toLowerCase();
  const startDate = document.getElementById('pur-start-date')?.value || '';
  const endDate = document.getElementById('pur-end-date')?.value || '';

  let list = D.purchases.filter(function(p) {
    const vendor = D.vendors.find(v => v.id === p.vendor_id);
    const vendorName = vendor?.name || '';
    const purchaseDate = p.created_at ? p.created_at.split('T')[0] : '';
    const matchSearch = !searchText || vendorName.toLowerCase().includes(searchText);
    const matchStartDate = !startDate || purchaseDate >= startDate;
    const matchEndDate = !endDate || purchaseDate <= endDate;
    return matchSearch && matchStartDate && matchEndDate;
  }).sort(function(a, b) {
    const vendorA = D.vendors.find(v => v.id === a.vendor_id)?.name || '';
    const vendorB = D.vendors.find(v => v.id === b.vendor_id)?.name || '';
    return vendorA.localeCompare(vendorB, 'zh-TW');
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const p = list[i];
    const v = D.vendors.find(function(x) { return x.id === p.vendor_id; });
    const typeLabel = p.is_invoice_purchase ?
      '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">購買發票</span>' :
      '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">一般採購</span>';

    const items = p.items || [];
    const itemsText = items.map(function(item) {
      const prod = D.products.find(x => x.id === item.product_id);
      return (prod?.name || '?') + ' x' + item.quantity;
    }).join(', ');

    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + (p.created_at ? new Date(p.created_at).toLocaleDateString() : '-') + '</td><td class="px-4 py-3">' + (v?.name || '-') + '</td><td class="px-4 py-3">' + typeLabel + '</td><td class="px-4 py-3 text-sm text-gray-600">' + (itemsText || '-') + '</td><td class="px-4 py-3 font-bold">' + (p.total_amount || 0).toLocaleString() + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewPurchaseDetail(\'' + p.id + '\')" class="text-blue-600 hover:text-blue-800 btn-touch">詳情</button><button onclick="openPurModal(' + (p.is_invoice_purchase ? 'true' : 'false') + ', \'' + p.id + '\')" class="text-green-600 hover:text-green-800 btn-touch">編輯</button><button onclick="delPur(\'' + p.id + '\')" class="text-red-600 hover:text-red-800 btn-touch">刪除</button></td></tr>';
  }

  const tbody = document.getElementById('pur-tbody');
  if(tbody) {
    tbody.innerHTML = html;
  }
}

async function openPurModal(isInvoicePurchase, editId) {
  editingId = editId || null;
  const existingData = editId ? D.purchases.find(function(x) { return x.id === editId; }) : null;
  let vendorOptions = '';
  for(let i=0; i<D.vendors.length; i++) {
    const v = D.vendors[i];
    vendorOptions += '<option value="' + v.id + '" ' + (existingData && existingData.vendor_id === v.id ? 'selected' : '') + '>' + v.name + '</option>';
  }
  let whOptions = '';
  const activeWh = D.warehouses.filter(function(w) { return w.is_active; });
  for(let i=0; i<activeWh.length; i++) {
    const w = activeWh[i];
    whOptions += '<option value="' + w.id + '" ' + (existingData && existingData.warehouse_id === w.id ? 'selected' : '') + '>' + w.name + '</option>';
  }
  const html = '<input type="hidden" id="pu-invoice-mode" value="' + (isInvoicePurchase ? 'true' : 'false') + '"><input type="hidden" id="pu-edit-id" value="' + (editId || '') + '"><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded input-field">' + vendorOptions + '</select></div>' + (!isInvoicePurchase ? '<div><label class="block text-sm font-bold mb-2">入庫倉庫</label><select id="pu-wh" class="w-full px-3 py-2 border rounded input-field">' + whOptions + '</select></div>' : '') + '</div><div class="mb-4"><label class="block text-sm font-bold mb-2">採購商品明細</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm btn-touch">+ 新增商品</button></div><div class="bg-gray-50 p-4 rounded mb-4"><div class="grid grid-cols-2 gap-4"><div><span class="text-sm text-gray-600">成本小計：</span><span id="pu-cost" class="font-bold">0</span></div><div><span class="text-sm text-gray-600">稅金 (5%)：</span><span id="pu-tax" class="font-bold text-orange-600">0</span></div><div class="col-span-2"><span class="text-sm text-gray-600">' + (isInvoicePurchase ? '稅金總額 (保存時四捨五入)' : '含稅總金額') + '：</span><span id="pu-total" class="text-xl font-bold text-blue-600">0</span></div></div></div>';
  openModal(isInvoicePurchase ? '購買發票' : '一般採購入庫', html, savePur);
  if(editId && existingData) {
    const itemsResp = await sb.from('purchase_items').select('*').eq('purchase_id', editId);
    const items = itemsResp.data || [];
    if(items.length > 0) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const p = D.products.find(function(x) { return x.id === item.product_id; });
        addPurItem(p, item.quantity, item.unit_price);
      }
    }
  } else {
    addPurItem();
  }
  calcPur();
}

function addPurItem(prod, qty, price) {
  const box = document.getElementById('pu-items');
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded flex-wrap';
  let prodOptions = '<option value="">選擇商品</option>';
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    prodOptions += '<option value="' + p.id + '" data-cost="' + (p.cost_price || 0) + '" ' + (prod && prod.id === p.id ? 'selected' : '') + '>' + p.name + '</option>';
  }
  div.innerHTML = '<div class="flex-1 min-w-[150px]"><select class="pu-prod w-full px-3 py-2 border rounded input-field" onchange="if(this.value){this.closest(\'div.flex\').querySelector(\'.pu-price\').value=this.options[this.selectedIndex].dataset.cost;}calcPur()">' + prodOptions + '</select></div><div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded input-field" value="' + (qty || 1) + '" min="1" oninput="calcPur()"></div><div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded input-field" value="' + (price || 0) + '" step="0.01" oninput="calcPur()"></div><button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch">X</button>';
  box.appendChild(div);
}

function calcPur() {
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const price = parseFloat(r.querySelector('.pu-price').value) || 0;
    const qty = parseInt(r.querySelector('.pu-qty').value) || 0;
    subtotal += price * qty;
  }
  const tax = subtotal * 0.05;
  const total = subtotal + tax;
  document.getElementById('pu-cost').textContent = subtotal.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  document.getElementById('pu-tax').textContent = tax.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  document.getElementById('pu-total').textContent = total.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
}

async function savePur() {
  let editId = document.getElementById('pu-edit-id').value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const items = [];
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value) || 0;
    const p = parseFloat(r.querySelector('.pu-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      subtotal += p * q;
    }
  }
  if(!items.length) return showAlert('請加入採購商品！');

  let totalAmount;
  if (isInvoiceMode) {
    totalAmount = Math.round(subtotal * 0.05);
  } else {
    totalAmount = Math.round(subtotal);
  }

  const d = {
    vendor_id: vendorId,
    is_invoice_purchase: isInvoiceMode,
    total_amount: totalAmount,
    warehouse_id: document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : null
  };
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      await sb.from('purchases').update(d).eq('id', editId);
    } else {
      d.purchase_no = 'PUR-' + Date.now();
      d.status = 'completed';
      const r = await sb.from('purchases').insert([d]).select().single();
      editId = r.data.id;
    }
    await sb.from('purchase_items').insert(items.map(function(i) { return Object.assign({}, i, {purchase_id: editId}); }));
    if(!isInvoiceMode && d.warehouse_id) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const existing = D.warehouseInv.find(function(w) { return w.warehouse_id === d.warehouse_id && w.product_id === item.product_id; });
        if(existing) await sb.from('warehouse_inventory').update({quantity: (existing.quantity || 0) + item.quantity}).eq('id', existing.id);
        else await sb.from('warehouse_inventory').insert([{warehouse_id: d.warehouse_id, product_id: item.product_id, quantity: item.quantity, safety_stock: 0}]);
        const prod = D.products.find(function(x) { return x.id === item.product_id; });
        if(prod) await sb.from('products').update({current_stock: (prod.current_stock || 0) + item.quantity}).eq('id', item.product_id);
      }
    }
    showAlert('採購已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delPur(id) {
  if(!confirm('確定刪除?')) return;
  try {
    await sb.from('purchase_items').delete().eq('purchase_id', id);
    await sb.from('purchases').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

function renderVendors(c) {
  const sortedVendors = [...D.vendors].sort(function(a, b) {
    const statusA = a.cooperation_status || 'normal';
    const statusB = b.cooperation_status || 'normal';
    if (statusA === 'normal' && statusB === 'paused') return -1;
    if (statusA === 'paused' && statusB === 'normal') return 1;

async function saveExp() {
  const id = document.getElementById('e-id').value;
  const empId = document.getElementById('e-emp').value || null;
  const isCompanyPay = !empId;
  const isReimbursed = isCompanyPay ? true : document.getElementById('e-reimbursed').checked;
  const bankId = document.getElementById('e-bank').value || null;
  const amount = parseFloat(document.getElementById('e-amt').value) || 0;
  const paymentDate = document.getElementById('e-date').value;
  if (!bankId && amount > 0) return showAlert('請選擇出帳銀行帳戶！');
  if (!paymentDate) return showAlert('請選擇日期！');

  const d = {
    category_id: document.getElementById('e-cat').value,
    amount: amount,
    description: document.getElementById('e-desc').value,
    payment_date: paymentDate,
    employee_id: empId,
    is_reimbursed: isReimbursed,
    reimbursement_bank_id: bankId,
    reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null
  };
  try {
    if(id) {
      await sb.from('expenses').update(d).eq('id', id);
      showAlert('已更新！');
    } else {
      const newExp = await sb.from('expenses').insert([d]).select().single();
      if(newExp.error) throw newExp.error;
      if(bankId && amount > 0) {
        const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
        if(bank.data) {
          await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) - amount }).eq('id', bankId);
        }
      }
      showAlert('已記錄並扣款！');
    }
    window.closeModal();
    await loadAll();
    if (currentView === 'finance') {
      renderFinance(document.getElementById('main-content'));
    } else {
      render();
    }
  } catch(e) {
    showAlert('失敗：' + e.message);
    console.error('saveExp error:', e);
  }
}

async function delExp(id) {
  if(!confirm('確定刪除?')) return;
  try {
    const e = D.expenses.find(function(x) { return x.id === id; });
    if(e && e.reimbursement_bank_id && e.amount > 0 && e.is_reimbursed) {
      const bank = await sb.from('bank_accounts').select('balance').eq('id', e.reimbursement_bank_id).single();
      if(bank.data) {
        await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) + e.amount }).eq('id', e.reimbursement_bank_id);
      }
    }
    await sb.from('expenses').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

  openModal(id ? '編輯訂閱' : '新增訂閱', html, saveSub);
  calcMonthlySub();
  document.getElementById('s-start')?.addEventListener('change', calcMonthlySub);
  document.getElementById('s-end')?.addEventListener('change', calcMonthlySub);
  document.getElementById('s-amt')?.addEventListener('input', calcMonthlySub);

function calcMonthlySub() {
  const start = document.getElementById('s-start')?.value;
  const end = document.getElementById('s-end')?.value;
  const amount = parseFloat(document.getElementById('s-amt')?.value) || 0;
  const monthlyEl = document.getElementById('s-monthly');
  if(!monthlyEl) return;
  if(!start || !end || amount <= 0) {
    monthlyEl.textContent = '0';
    return;
  }
  const startDate = new Date(start);
  const endDate = new Date(end);
  const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
  if(diffMonths <= 0) {
    monthlyEl.textContent = '0 (日期無效)';
    return;
  }
  const monthly = amount / diffMonths;
  monthlyEl.textContent = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

function renderBanks(c) {
  c.innerHTML = '<div class="content-card"><div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"><h1 class="text-3xl font-bold">🏦 銀行帳戶</h1><button onclick="openBankModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold btn-touch">+ 新增帳戶</button></div><div class="bg-white rounded-lg shadow overflow-hidden table-container"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase sortable-header" onclick="sortTable(\'bank-tbody\', 0)">帳戶名稱 <span class="sort-icon"></span></th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">銀行名稱</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">帳號</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase sortable-header" onclick="sortTable(\'bank-tbody\', 3)">餘額 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">狀態</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody id="bank-tbody" class="bg-white divide-y divide-gray-200"></tbody></table></div></div>';
  let html = '';
  for(let i=0; i<D.banks.length; i++) {
    const b = D.banks[i];
    const statusHtml = b.is_active ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">啟用</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-800">停用</span>';
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + b.account_name + '</td><td class="px-4 py-3">' + (b.bank_name || '-') + '</td><td class="px-4 py-3">' + (b.account_number || '-') + '</td><td class="px-4 py-3 font-bold text-green-600">' + (b.balance || 0).toLocaleString() + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openBankModal(\'' + b.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delBank(\'' + b.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('bank-tbody').innerHTML = html;
}

async function openBankModal(id) {
  editingId = id || null;
  const b = id ? D.banks.find(function(x) { return x.id === id; }) : null;
  const html = '<input type="hidden" id="b-id" value="' + (id || '') + '"><div class="mb-4"><label class="block text-sm font-bold mb-2">帳戶名稱 *</label><input type="text" id="b-name" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.account_name : '') + '"></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">銀行名稱</label><input type="text" id="b-bank" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.bank_name : '') + '"></div><div><label class="block text-sm font-bold mb-2">帳號</label><input type="text" id="b-number" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.account_number : '') + '"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">餘額</label><input type="number" id="b-balance" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.balance : 0) + '"></div><div><label class="block text-sm font-bold mb-2">狀態</label><select id="b-active" class="w-full px-3 py-2 border rounded input-field"><option value="true" ' + (b && b.is_active !== false ? 'selected' : '') + '>啟用</option><option value="false" ' + (b && b.is_active === false ? 'selected' : '') + '>停用</option></select></div></div>';
  openModal(id ? '編輯帳戶' : '新增帳戶', html, saveBank);
}

async function saveBank() {
  const id = document.getElementById('b-id').value;
  const d = { account_name: document.getElementById('b-name').value, bank_name: document.getElementById('b-bank').value, account_number: document.getElementById('b-number').value, balance: parseFloat(document.getElementById('b-balance').value) || 0, is_active: document.getElementById('b-active').value === 'true' };
  if(!d.account_name) return showAlert('帳戶名稱必填！');
  try {
    if(id) await sb.from('bank_accounts').update(d).eq('id', id);
    else await sb.from('bank_accounts').insert([d]);
    showAlert('已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delBank(id) {
  if(!confirm('確定刪除?')) return;
  try { await sb.from('bank_accounts').delete().eq('id', id); await loadAll(); render(); } catch(e) { showAlert('失敗：' + e.message); }
}
