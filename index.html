<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老闆退休管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
        .search-dropdown { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; width: 100%; }
        .search-item:hover { background-color: #f3f4f6; cursor: pointer; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 登入頁面 -->
    <div id="login-view" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🏢 企業戰情室登入</h1>
            <form class="space-y-4" onsubmit="return false;">
                <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded-md">
                <input type="password" id="password" placeholder="密碼" required class="w-full px-3 py-2 border rounded-md">
                <button type="button" id="login-btn" class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登入系統</button>
            </form>
        </div>
    </div>

    <!-- 主系統 -->
    <div id="main-system" class="hidden min-h-screen flex">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-xl font-bold border-b border-gray-700">📊 退休管理系統</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="switchView('dashboard')" id="nav-dashboard" class="block py-2 px-4 rounded hover:bg-gray-700 nav-active">🏠 儀表板</a>
                <a href="#" onclick="switchView('crm')" id="nav-crm" class="block py-2 px-4 rounded hover:bg-gray-700">👥 客戶管理</a>
                <a href="#" onclick="switchView('orders')" id="nav-orders" class="block py-2 px-4 rounded hover:bg-gray-700">📦 訂單與庫存</a>
                <a href="#" onclick="switchView('finance')" id="nav-finance" class="block py-2 px-4 rounded hover:bg-gray-700">💰 財務發票</a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <button id="logout-btn" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded text-sm">登出</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <!-- 儀表板 -->
            <div id="view-dashboard">
                <h1 class="text-3xl font-bold mb-6">老闆，早安！戰情總覽：</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總客戶數</p><p id="stat-customers" class="text-3xl font-bold text-blue-600 mt-2">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總訂單數</p><p id="stat-orders" class="text-3xl font-bold text-green-600 mt-2">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總營收</p><p id="stat-revenue" class="text-3xl font-bold text-purple-600 mt-2">$0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">庫存警報</p><p id="stat-alerts" class="text-3xl font-bold text-red-600 mt-2">0</p></div>
                </div>
            </div>

            <!-- 客戶管理 -->
            <div id="view-crm" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold">👥 客戶關係管理</h1>
                    <button onclick="openNewCustomerModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+ 新增客戶</button>
                </div>
                <div class="mb-6 relative">
                    <input type="text" id="customer-search" placeholder="🔍 搜尋客戶姓名、公司、電話..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
                    <div id="search-dropdown" class="search-dropdown mt-2 hidden"></div>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">類型</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司/姓名</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">統編</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">聯絡人</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">負責窗口</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
                        <tbody id="customer-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- 訂單與庫存 -->
            <div id="view-orders" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold">📦 訂單管理與出貨追蹤</h1>
                    <button onclick="openNewOrderModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 shadow-md font-bold">+ 新增訂單</button>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">訂單編號</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">客戶</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">金額</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">狀態</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">負責窗口</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
                        <tbody id="order-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- 財務 -->
            <div id="view-finance" class="hidden">
                <h1 class="text-3xl font-bold mb-6">💰 財務與發票</h1>
                <p class="text-gray-500">開發中...</p>
            </div>
        </main>
    </div>

    <!-- 新增/編輯客戶 Modal -->
    <div id="customer-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 id="customer-modal-title" class="text-2xl font-bold text-gray-800">📝 新增客戶</h2>
                <button onclick="closeCustomerModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <form id="customer-form" onsubmit="return false;" class="space-y-4">
                <input type="hidden" id="cust-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">客戶類型 <span class="text-red-500">*</span></label>
                        <select id="cust-type" class="w-full px-3 py-2 border rounded-md" onchange="toggleCompanyField()">
                            <option value="B2C">B2C (個人消費者)</option>
                            <option value="B2B">B2B (企業客戶)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">負責窗口</label>
                        <select id="cust-window" class="w-full px-3 py-2 border rounded-md">
                            <option value="">請選擇...</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">公司名稱 <span id="company-required" class="text-red-500 hidden">*</span></label>
                    <input type="text" id="cust-company" class="w-full px-3 py-2 border rounded-md" placeholder="個人客戶可留空">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">統一編號</label>
                        <input type="text" id="cust-tax-id" class="w-full px-3 py-2 border rounded-md" placeholder="B2B 必填">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">发票抬头</label>
                        <input type="text" id="cust-invoice-title" class="w-full px-3 py-2 border rounded-md" placeholder="預設同公司名稱">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">聯絡人姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="cust-contact" class="w-full px-3 py-2 border rounded-md" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">電話 <span class="text-red-500">*</span></label>
                        <input type="text" id="cust-phone" class="w-full px-3 py-2 border rounded-md" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email</label>
                    <input type="email" id="cust-email" class="w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">地址</label>
                    <input type="text" id="cust-address" class="w-full px-3 py-2 border rounded-md" placeholder="主要地址">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">標籤（用逗號分隔）</label>
                    <input type="text" id="cust-tags" class="w-full px-3 py-2 border rounded-md" placeholder="例如：VIP, 價格敏感, 月結">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeCustomerModal()" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">取消</button>
                    <button type="button" onclick="saveCustomer()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-bold">💾 儲存客戶</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 新增/編輯訂單 Modal -->
    <div id="order-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 id="order-modal-title" class="text-2xl font-bold text-gray-800">📝 新增訂單</h2>
                <button onclick="closeOrderModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            
            <form id="order-form" onsubmit="return false;" class="space-y-6">
                <input type="hidden" id="order-id">
                
                <!-- 客戶選擇 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">1. 選擇客戶 <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="text" id="order-customer-search" placeholder="輸入姓名、公司或電話搜尋..." class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" autocomplete="off">
                        <div id="order-customer-dropdown" class="search-dropdown mt-1 hidden"></div>
                        <input type="hidden" id="selected-customer-id">
                        <input type="hidden" id="selected-customer-name">
                    </div>
                    <p id="selected-customer-display" class="mt-2 text-sm text-blue-600 font-medium hidden"></p>
                </div>

                <!-- 發票資訊 -->
                <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                    <h3 class="font-bold text-gray-800 mb-3">📄 發票資訊</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">是否需要發票</label>
                            <select id="order-need-invoice" class="w-full px-3 py-2 border rounded-md" onchange="toggleInvoiceFields()">
                                <option value="no">不需要發票</option>
                                <option value="yes">需要發票</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">價格類型</label>
                            <select id="order-price-type" class="w-full px-3 py-2 border rounded-md">
                                <option value="untax">未稅價</option>
                                <option value="tax">含稅價 (+5%)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">发票抬头</label>
                            <input type="text" id="order-invoice-title" class="w-full px-3 py-2 border rounded-md" placeholder="預設同客戶">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">統一編號</label>
                            <input type="text" id="order-tax-id" class="w-full px-3 py-2 border rounded-md" placeholder="預設同客戶">
                        </div>
                    </div>
                </div>

                <!-- 寄送地址 -->
                <div id="address-section" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-2">2. 選擇寄送地址 <span class="text-red-500">*</span></label>
                    <select id="shipping-address-select" class="w-full px-4 py-2 border rounded-md bg-white">
                        <option value="">請先選擇客戶...</option>
                    </select>
                </div>

                <!-- 負責窗口 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">3. 負責業務/窗口 <span class="text-red-500">*</span></label>
                    <select id="contact-window-select" class="w-full px-4 py-2 border rounded-md bg-white">
                        <option value="">載入中...</option>
                    </select>
                </div>

                <!-- 產品明細 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">4. 訂單產品明細</label>
                    <div id="order-items-container" class="space-y-3">
                        <!-- 動態產品列 -->
                    </div>
                    <button type="button" onclick="addOrderItemRow()" class="mt-3 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 text-sm font-medium">+ 新增一筆產品</button>
                </div>

                <!-- 總金額與備註 -->
                <div class="grid grid-cols-2 gap-6 bg-gray-50 p-4 rounded-lg">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">訂單總金額</label>
                        <div class="text-3xl font-bold text-purple-600" id="order-total-amount">$0</div>
                        <p class="text-xs text-gray-500 mt-1" id="order-tax-info"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">訂單備註</label>
                        <textarea id="order-notes" class="w-full px-3 py-2 border rounded-md" rows="2" placeholder="例如：請小心輕放、假日不送貨..."></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeOrderModal()" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">取消</button>
                    <button type="button" onclick="submitOrder()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-bold shadow-md">💾 儲存訂單</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 客戶詳情 Modal -->
    <div id="customer-detail-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">📋 客戶詳情</h2><button onclick="document.getElementById('customer-detail-modal').classList.add('hidden')" class="text-2xl">&times;</button></div>
            <div id="customer-detail-content"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let allWindows = [];
        let allCustomers = [];
        let editingOrderId = null;
        let originalOrderItems = []; // 用於編輯時回補庫存

        // 登入與登出
        document.getElementById('login-btn').addEventListener('click', async () => {
            const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
            if (error) alert('登入失敗：' + error.message);
            else { document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-system').classList.remove('hidden'); loadDashboardData(); loadWindows(); }
        });
        document.getElementById('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

        // 視圖切換
        function switchView(viewName) {
            ['dashboard', 'crm', 'orders', 'finance'].forEach(v => {
                document.getElementById('view-' + v).classList.add('hidden');
                document.getElementById('nav-' + v).classList.remove('nav-active');
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.getElementById('nav-' + viewName).classList.add('nav-active');
            if (viewName === 'crm') loadCustomers();
            if (viewName === 'orders') loadOrders();
        }

        // 載入儀表板
        async function loadDashboardData() {
            const { count: c1 } = await sb.from('customers').select('*', { count: 'exact', head: true }); document.getElementById('stat-customers').textContent = c1 || 0;
            const { data: orders, count: c2 } = await sb.from('orders').select('total_amount', { count: 'exact' }); document.getElementById('stat-orders').textContent = c2 || 0;
            document.getElementById('stat-revenue').textContent = '$' + (orders ? orders.reduce((s, o) => s + (o.total_amount || 0), 0) : 0).toLocaleString();
            const { data: prods } = await sb.from('products').select('current_stock, safety_stock'); document.getElementById('stat-alerts').textContent = prods ? prods.filter(p => p.current_stock < p.safety_stock).length : 0;
        }

        // 載入聯絡窗口
        async function loadWindows() {
            const { data } = await sb.from('contact_windows').select('*').eq('is_active', true);
            allWindows = data || [];
        }

        // ==========================================
        // 👥 客戶管理功能
        // ==========================================

        function toggleCompanyField() {
            const type = document.getElementById('cust-type').value;
            const required = document.getElementById('company-required');
            if (type === 'B2B') {
                required.classList.remove('hidden');
            } else {
                required.classList.add('hidden');
            }
        }

        function openNewCustomerModal() {
            document.getElementById('customer-modal-title').textContent = '📝 新增客戶';
            document.getElementById('customer-form').reset();
            document.getElementById('cust-id').value = '';
            document.getElementById('cust-type').value = 'B2C';
            toggleCompanyField();
            
            // 填充窗口下拉
            const winSelect = document.getElementById('cust-window');
            winSelect.innerHTML = '<option value="">請選擇...</option>' + allWindows.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            
            document.getElementById('customer-modal').classList.remove('hidden');
        }

        function closeCustomerModal() {
            document.getElementById('customer-modal').classList.add('hidden');
        }

        async function saveCustomer() {
            const id = document.getElementById('cust-id').value;
            const type = document.getElementById('cust-type').value;
            const company = document.getElementById('cust-company').value;
            const taxId = document.getElementById('cust-tax-id').value;
            const contact = document.getElementById('cust-contact').value;
            const phone = document.getElementById('cust-phone').value;
            const windowId = document.getElementById('cust-window').value || null;
            
            if (!contact || !phone) return alert('聯絡人和電話為必填！');
            if (type === 'B2B' && !company) return alert('B2B 客戶請填寫公司名稱！');

            const tagsStr = document.getElementById('cust-tags').value;
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

            const customerData = {
                type,
                company_name: company || null,
                tax_id: taxId || null,
                contact_person: contact,
                phone,
                email: document.getElementById('cust-email').value || null,
                address: document.getElementById('cust-address').value || null,
                primary_contact_window_id: windowId,
                tags: tags.length > 0 ? tags : []
            };

            try {
                if (id) {
                    // 編輯
                    await sb.from('customers').update(customerData).eq('id', id);
                    alert('✅ 客戶資料已更新！');
                } else {
                    // 新增
                    await sb.from('customers').insert([customerData]);
                    alert('✅ 客戶新增成功！');
                }
                closeCustomerModal();
                loadCustomers();
            } catch (err) {
                alert('儲存失敗：' + err.message);
            }
        }

        async function loadCustomers() {
            const { data } = await sb.from('customers').select('*, contact_windows(name)').order('created_at', { ascending: false });
            allCustomers = data || [];
            
            if (!allCustomers.length) {

        function addOrderItemRow(productData = null) {
            const container = document.getElementById('order-items-container');

            const productOptions = allProducts.map(p => `<option value="${p.id}" data-price="${p.sell_price}" ${productData && productData.product_id === p.id ? 'selected' : ''}>${p.name} (SKU: ${p.sku}) - 庫存: ${p.current_stock}</option>`).join('');

            const row = document.createElement('div');
            row.className = 'flex space-x-2 items-end bg-gray-50 p-3 rounded-md';
            row.id = rowId;
            row.innerHTML = `
                <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">產品</label>
                    <select class="order-product w-full px-3 py-2 border rounded-md bg-white" onchange="calculateOrderTotal()">
                        <option value="">選擇產品...</option>${productOptions}
                    </select>
                </div>
                <div class="w-24">
                    <label class="block text-xs text-gray-500 mb-1">數量</label>
                    <input type="number" class="order-qty w-full px-3 py-2 border rounded-md" value="${initialQty}" min="1" onchange="calculateOrderTotal()" oninput="calculateOrderTotal()">
                </div>
                <div class="w-32">
                    <label class="block text-xs text-gray-500 mb-1">單價 (可調整)</label>
                    <input type="number" class="order-price w-full px-3 py-2 border rounded-md" value="${initialPrice}" step="0.01" onchange="calculateOrderTotal()" oninput="calculateOrderTotal()">
                </div>
                <div class="w-32">
                    <label class="block text-xs text-gray-500 mb-1">小計</label>
                    <div class="order-subtotal px-3 py-2 font-bold text-gray-800">$${initialPrice && initialQty ? (initialPrice * initialQty).toLocaleString() : '0'}</div>
                </div>
                <button type="button" onclick="document.getElementById('${rowId}').remove(); calculateOrderTotal();" class="px-3 py-2 bg-red-100 text-red-600 rounded-md hover:bg-red-200 mb-0.5">刪除</button>
            `;
            container.appendChild(row);
            calculateOrderTotal();
        }

        function calculateOrderTotal() {
            let total = 0;
            let itemCount = 0;
            
            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const prodSelect = row.querySelector('.order-product');
                const qtyInput = row.querySelector('.order-qty');
                const priceInput = row.querySelector('.order-price');
                const subtotalDiv = row.querySelector('.order-subtotal');

                if (prodSelect.value && qtyInput.value > 0 && priceInput.value) {
                    const price = parseFloat(priceInput.value || 0);
                    const qty = parseInt(qtyInput.value || 0);
                    const sub = price * qty;
                    subtotalDiv.textContent = '$' + sub.toLocaleString();
                    total += sub;
                    itemCount++;
                } else {
                    subtotalDiv.textContent = '$0';
                }
            });

            document.getElementById('order-total-amount').textContent = '$' + total.toLocaleString();
            
            const priceType = document.getElementById('order-price-type')?.value || 'untax';
            const needInvoice = document.getElementById('order-need-invoice')?.value === 'yes';
            
            if (needInvoice && priceType === 'tax') {
                const taxAmount = total * 0.05;
                document.getElementById('order-tax-info').textContent = `含稅價 (5%): $${taxAmount.toFixed(0)} | 未稅價: $${(total - taxAmount).toFixed(0)}`;
            } else if (needInvoice) {
                document.getElementById('order-tax-info').textContent = '未稅價 (開發票時需加 5%)';
            } else {
                document.getElementById('order-tax-info').textContent = '不開發票';
            }
        }

        async function submitOrder() {
            const customerId = document.getElementById('selected-customer-id').value;
            const addressId = document.getElementById('shipping-address-select').value;
            const windowId = document.getElementById('contact-window-select').value;
            const notes = document.getElementById('order-notes').value;
            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const priceType = document.getElementById('order-price-type').value;
            const invoiceTitle = document.getElementById('order-invoice-title').value;
            const taxId = document.getElementById('order-tax-id').value;

            if (!customerId) return alert('請先選擇客戶！');
            if (!addressId) return alert('請選擇寄送地址！');
            if (!windowId) return alert('請選擇負責窗口！');

            // 收集產品明細
            const items = [];
            let totalAmount = 0;

            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const prodSelect = row.querySelector('.order-product');
                const qtyInput = row.querySelector('.order-qty');
                const priceInput = row.querySelector('.order-price');
                
                if (prodSelect.value && qtyInput.value > 0 && priceInput.value) {
                    const price = parseFloat(priceInput.value);
                    const qty = parseInt(qtyInput.value);
                    items.push({ product_id: prodSelect.value, quantity: qty, unit_price: price });
                    totalAmount += price * qty;
                }
            });

            if (items.length === 0) return alert('請至少加入一筆產品！');

            try {
                if (editingOrderId) {
                    // ========== 編輯訂單 ==========
                    // 1. 先回補原庫存
                    for (const item of originalOrderItems) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
                        
                        // 刪除原庫存流水
                        await sb.from('inventory_logs').delete().eq('reference_id', editingOrderId).eq('product_id', item.product_id);
                    }

                    // 2. 更新訂單主檔
                    await sb.from('orders').update({
                        customer_id: customerId,
                        shipping_address_id: addressId,
                        contact_window_id: windowId,
                        total_amount: totalAmount,
                        notes,
                        status: 'confirmed'
                    }).eq('id', editingOrderId);

                    // 3. 刪除原明細
                    await sb.from('order_items').delete().eq('order_id', editingOrderId);

                    // 4. 插入新明細
                    const orderItemsToInsert = items.map(item => ({
                        order_id: editingOrderId,
                        product_id: item.product_id,
                        quantity: item.quantity,
                        unit_price: item.unit_price
                    }));
                    await sb.from('order_items').insert(orderItemsToInsert);

                    // 5. 扣減新庫存
                    for (const item of items) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        await sb.from('products').update({ current_stock: prod.current_stock - item.quantity }).eq('id', item.product_id);
                        
                        await sb.from('inventory_logs').insert({
                            product_id: item.product_id,
                            type: 'out',
                            quantity: -item.quantity,
                            reference_id: editingOrderId,
                            note: `訂單編輯後扣減`
                        });
                    }

                    // 6. 處理發票
                    if (needInvoice) {
                        // 檢查是否已有發票
                        const { data: existingInvoice } = await sb.from('invoices').select('id').eq('related_order_id', editingOrderId).eq('type', 'sales').single();
                        
                        const invoiceData = {
                            type: 'sales',
                            related_order_id: editingOrderId,
                            amount: totalAmount,
                            tax_amount: priceType === 'tax' ? totalAmount * 0.05 / 1.05 : totalAmount * 0.05,
                            status: 'unpaid',
                            invoice_no: existingInvoice?.invoice_no || null,
                            due_date: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                        };

                        if (existingInvoice) {
                            await sb.from('invoices').update(invoiceData).eq('id', existingInvoice.id);
                        } else {
                            await sb.from('invoices').insert([invoiceData]);
                        }
                    }

                    alert('✅ 訂單已更新！庫存已自動調整。');

                } else {
                    // ========== 新增訂單 ==========
                    const orderNo = 'ORD-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');

                    const { data: newOrder, error: orderError } = await sb
                        .from('orders')
                        .insert({
                            order_no: orderNo,
                            customer_id: customerId,
                            shipping_address_id: addressId,
                            contact_window_id: windowId,
                            total_amount: totalAmount,
                            notes,
                            status: 'confirmed'
                        })
                        .select()
                        .single();

                    if (orderError) throw orderError;

                    const orderItemsToInsert = items.map(item => ({
                        order_id: newOrder.id,
                        product_id: item.product_id,
                        quantity: item.quantity,
                        unit_price: item.unit_price
                    }));
                    await sb.from('order_items').insert(orderItemsToInsert);

                    // 扣減庫存
                    for (const item of items) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        await sb.from('products').update({ current_stock: prod.current_stock - item.quantity }).eq('id', item.product_id);
                        
                        await sb.from('inventory_logs').insert({
                            product_id: item.product_id,
                            type: 'out',
                            quantity: -item.quantity,
                            reference_id: newOrder.id,
                            note: `訂單 ${orderNo} 出貨扣減`
                        });
                    }

                    // 建立發票
                    if (needInvoice) {
                        await sb.from('invoices').insert([{
                            type: 'sales',
                            related_order_id: newOrder.id,
                            amount: totalAmount,
                            tax_amount: priceType === 'tax' ? totalAmount * 0.05 / 1.05 : totalAmount * 0.05,
                            status: 'unpaid',
                            due_date: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                        }]);
                    }

                    alert(`🎉 開單成功！訂單編號：${orderNo}\n系統已自動扣減庫存並記錄流水。`);
                }

                closeOrderModal();
                loadOrders();
                loadDashboardData();

            } catch (err) {
                console.error(err);
                alert('操作失敗：' + err.message);
            }
        }

        }

        async function deleteOrder(id, orderNo) {
            if (!confirm(`確定要刪除訂單 ${orderNo} 嗎？\n刪除後庫存會自動回補。`)) return;

            try {
                // 1. 載入訂單明細
                const { data: items } = await sb.from('order_items').select('*').eq('order_id', id);
                
                // 2. 回補庫存
                if (items) {
                    for (const item of items) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
                        
                        // 記錄庫存流水
                        await sb.from('inventory_logs').insert({
                            product_id: item.product_id,
                            type: 'adjust',
                            quantity: item.quantity,
                            reference_id: id,
                            note: `訂單 ${orderNo} 刪除，庫存回補`
                        });
                    }
                }

                // 3. 刪除明細
                await sb.from('order_items').delete().eq('order_id', id);
                
                // 4. 刪除相關發票
                await sb.from('invoices').delete().eq('related_order_id', id).eq('type', 'sales');
                
                // 5. 刪除訂單
                await sb.from('orders').delete().eq('id', id);

                alert('✅ 訂單已刪除，庫存已回補。');
                loadOrders();
                loadDashboardData();

            } catch (err) {
                alert('刪除失敗：' + err.message);
            }
        }

        // 初始化
        (async () => { 
            const { data: { session } } = await sb.auth.getSession(); 
            if (session) { 
                document.getElementById('login-view').classList.add('hidden'); 
                document.getElementById('main-system').classList.remove('hidden'); 
                loadDashboardData(); 
                loadWindows();
            } 
        })();
    </script>
</body>
