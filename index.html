<!-- 通用 Modal (防呆 + 快捷鍵) -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 全域變數
let D = { 
  products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], 
  vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], 
  emps:[], locs:[], expCats:[], orders:[], purchases:[], warehouseLocs:[] 
};
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let isSaving = false; // 防呆機制

// 顏色對應
const COLOR_NAMES = {
  '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色',
  '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色'
};

// 工具函數
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      document.getElementById('alert-ok-btn').removeEventListener('click', handler);
      r(); 
    };
    document.getElementById('alert-ok-btn').addEventListener('click', handler);
    // Enter 鍵關閉
    const keyHandler = (e) => {
      if (e.key === 'Enter') {
        handler();
        document.removeEventListener('keydown', keyHandler);
      }
    };
    document.addEventListener('keydown', keyHandler);
  });
}

function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return; // 防呆：防止重複點擊
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try {
        await onSave();
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  const closeModal = () => {
    document.getElementById('modal-overlay').classList.add('hidden');
    editingId = null;
    isSaving = false;
    if(saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存 (Enter)';
    }
  };
  
  cancelBtn.onclick = closeModal;
  closeBtn.onclick = closeModal;
  
  // ESC 鍵關閉
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      closeModal();
      document.removeEventListener('keydown', escHandler);
    }
  };
  document.addEventListener('keydown', escHandler);
  
  // Enter 鍵儲存（如果不是在 input 中）
  if(!hideSave) {
    const enterHandler = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('input')) {
        e.preventDefault();
        saveBtn.click();
        document.removeEventListener('keydown', enterHandler);
      }
    };
    document.addEventListener('keydown', enterHandler);
  }
}

function closeModal() { 
  document.getElementById('modal-overlay').classList.add('hidden'); 
  editingId = null; 
  isSaving = false;
}

// 登入登出
document.getElementById('login-btn').addEventListener('click', () => {
  sb.auth.signInWithPassword({ 
    email: document.getElementById('email').value, 
    password: document.getElementById('password').value 
  }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => switchView('boss')); 
    }
  });
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

// 導航
document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
  });
});

// 載入所有資料
async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    locs:'warehouse_locations', expCats:'expense_categories', 
    orders:'orders', purchases:'purchases'
  };
  await Promise.all(Object.keys(map).map(k => 
    sb.from(map[k]).select('*').then(r => D[k] = r.data || [])
  ));
}

// 切換視圖
function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => 
    a.classList.toggle('nav-active', a.dataset.view === v)
  );
  render();
}

// 渲染視圖
function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}
  // ==================== 老板查阅（专业仪表板）====================
function renderBoss(c) {
  const [y, m] = bossMonth.split('-').map(Number);
  const rev = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,o)=>s+(o.total_amount||0),0);
  const pur = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,p)=>s+(p.total_amount||0),0);
  const exp = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,e)=>s+(e.amount||0),0);
  const sub = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;
  const profitMargin = rev > 0 ? ((monthlyProfit / rev) * 100).toFixed(1) : 0;
  
  // 即将到期的订阅（下个月）
  const nextMonth = m === 12 ? 1 : m + 1;
  const nextYear = m === 12 ? y + 1 : y;
  const expiringSubs = D.subs.filter(s => {
    if(!s.end_date) return false;
    const d = new Date(s.end_date);
    return d.getFullYear() === nextYear && d.getMonth() + 1 === nextMonth;
  });
  
  c.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">👑 老板查阅</h1>
      <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow">
    </div>
    
    <!-- 核心指标 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月业绩</p>
        <p class="text-3xl font-bold mt-2">$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">订单数：${D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 单</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月采购</p>
        <p class="text-3xl font-bold mt-2">$${pur.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">采购单：${D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 单</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月开销(含订阅)</p>
        <p class="text-3xl font-bold mt-2">$${(exp+sub).toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">费用笔数：${D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 笔</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月净利</p>
        <p class="text-3xl font-bold mt-2">$${monthlyProfit.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">利润率：${profitMargin}%</p>
      </div>
    </div>
    
    <!-- 资金状态 -->
    <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
      <h3 class="text-lg font-bold mb-4 text-gray-800">🏦 公司总资金状态</h3>
      <p class="text-4xl font-bold text-orange-600 mb-6">现金总额：$${totalCash.toLocaleString()}</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${D.banks.map(b=>`<div class="p-4 bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg border"><p class="font-bold text-lg">${b.account_name}</p><p class="text-gray-500 text-sm">${b.bank_name} - ${b.account_number}</p><p class="text-2xl font-bold text-green-600 mt-2">$${(b.balance||0).toLocaleString()}</p></div>`).join('')}
      </div>
    </div>
    
    <!-- 即将到期提醒 -->
    ${expiringSubs.length > 0 ? `
    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-lg shadow mb-8">
      <h3 class="text-lg font-bold text-yellow-800 mb-2">⚠️ 下个月即将到期的订阅</h3>
      <ul class="list-disc list-inside text-yellow-700">
        ${expiringSubs.map(s => `<li><b>${s.name}</b> - ${s.provider || '-'} (到期：${s.end_date}, 金额：$${(s.amount||0).toLocaleString()})</li>`).join('')}
      </ul>
    </div>
    ` : ''}
    
    <!-- 营运指标 -->
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h3 class="text-lg font-bold mb-4 text-gray-800">📊 营运指标</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
        <div class="p-4 bg-blue-50 rounded-lg"><p class="text-3xl font-bold text-blue-600">${D.customers.length}</p><p class="text-gray-500 mt-2">总客户数</p></div>
        <div class="p-4 bg-green-50 rounded-lg"><p class="text-3xl font-bold text-green-600">${D.products.length}</p><p class="text-gray-500 mt-2">总产品数</p></div>
        <div class="p-4 bg-purple-50 rounded-lg"><p class="text-3xl font-bold text-purple-600">${D.orders.filter(o=>o.status==='shipped').length}</p><p class="text-gray-500 mt-2">累计出货单</p></div>
        <div class="p-4 bg-red-50 rounded-lg"><p class="text-3xl font-bold text-red-600">${D.products.filter(p=>p.current_stock<(p.safety_stock||0)).length}</p><p class="text-gray-500 mt-2">低库存警示</p></div>
      </div>
    </div>
  `;
}

        <button onclick="manageTags()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">管理标签</button>
        <button onclick="openCustModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700">+ 新增客户</button>

    <div class="bg-white rounded-lg shadow overflow-hidden"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">类型</th><th class="px-4 py-3 text-left text-xs">公司/姓名</th><th class="px-4 py-3 text-left text-xs">联络人/电话</th><th class="px-4 py-3 text-left text-xs">抬头/统编</th><th class="px-4 py-3 text-left text-xs">标签</th><th class="px-4 py-3 text-left text-xs">操作</th></tr></thead><tbody id="cust-tbody"></tbody></table></div>
  `;

}

function renderCustTable() {
  const kw = (document.getElementById('cust-search')?.value || '').toLowerCase();
  const list = D.customers.filter(c => ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().includes(kw));
  document.getElementById('cust-tbody').innerHTML = list.map(c => `
    <tr class="hover:bg-gray-50 border-b">
      <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded-full ${c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${c.type}</span></td>
      <td class="px-4 py-3 font-medium">${c.company_name||c.contact_person}</td>
      <td class="px-4 py-3 text-sm">${c.contact_person}<br><span class="text-gray-500">${c.phone}</span></td>
      <td class="px-4 py-3 text-sm">${c.invoice_title||'-'}<br><span class="text-gray-500">${c.tax_id||'-'}</span></td>
      <td class="px-4 py-3">-</td>
      <td class="px-4 py-3 space-x-2">
        <button onclick="viewCustDetail('${c.id}')" class="text-blue-600 text-sm hover:underline">详情</button>
        <button onclick="openCustModal('${c.id}')" class="text-green-600 text-sm hover:underline">编辑</button>
        <button onclick="delCust('${c.id}')" class="text-red-600 text-sm hover:underline">删除</button>
      </td>
    </tr>`).join('');
}

window.openCustModal = async function(id) {
  editingId = id || null;
  const c = id ? D.customers.find(x=>x.id===id) : null;
  
  // 载入客户标签
  let custTagIds = [];
  if(id) {
    const {data:ct} = await sb.from('customer_tags').select('tag_id').eq('customer_id', id);
    custTagIds = (ct||[]).map(x=>x.tag_id);
  }

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value, company_name: document.getElementById('c-comp').value||null,
    tax_id: document.getElementById('c-tax').value||null, invoice_title: document.getElementById('c-title').value||null,
    contact_person: document.getElementById('c-contact').value, phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null, email: document.getElementById('c-email').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null
  };
  if(!data.contact_person || !data.phone) return showAlert('联络人和电话必填！');
  try {
    let cid = id;
    if(id) await sb.from('customers').update(data).eq('id',id);
    else { const r = await sb.from('customers').insert([data]).select().single(); cid = r.data.id; }
    
    // 更新标签
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    
    // 更新地址
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr').value, cvs_store_name:d.querySelector('.a-cvsname').value, store_name:d.querySelector('.a-cvsname').value, cvs_store_address:d.querySelector('.a-cvsaddr').value, is_default:d.querySelector('.a-def').checked });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    showAlert('客户已储存！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失败：'+e.message); }
}

function renderOrdTable() {
  const [y,m] = (document.getElementById('ord-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('ord-search')?.value||'').toLowerCase();
  const list = D.orders.filter(o => {
    const d = new Date(o.created_at);
    const matchMonth = d.getFullYear()===y && d.getMonth()+1===m;
    const cust = D.customers.find(c=>c.id===o.customer_id);
    const matchKw = !kw || (cust?.company_name||'').toLowerCase().includes(kw) || (cust?.contact_person||'').toLowerCase().includes(kw) || (o.invoice_no||'').toLowerCase().includes(kw);
    return matchMonth && matchKw;
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  
  document.getElementById('ord-tbody').innerHTML = list.map(o => {
    const c = D.customers.find(x=>x.id===o.customer_id);
    return `<tr class="hover:bg-gray-50 border-b"><td class="px-4 py-3">${new Date(o.created_at).toLocaleDateString()}</td><td class="px-4 py-3">${c?.company_name||c?.contact_person||'-'}</td><td class="px-4 py-3 font-bold">$${(o.total_amount||0).toLocaleString()}</td><td class="px-4 py-3 text-sm">${o.invoice_no||'无'}</td><td class="px-4 py-3"><button onclick="delOrd('${o.id}')" class="text-red-600 text-sm">删除</button></td></tr>`;
  }).join('');
}

window.calcOrd = function() {
  let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    sub += (parseFloat(r.querySelector('.o-price').value)||0) * (parseInt(r.querySelector('.o-qty').value)||0);
  });
  document.getElementById('o-subtotal').textContent = sub.toLocaleString();
  
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  
  let tax = 0;
  let invInfo = '';
  if(invType==='tax') {
    tax = sub * 0.05;
    invInfo = `税外加：商品 $${sub.toLocaleString()} + 5% 税金 $${tax.toLocaleString()} = 客人需付 $${(sub+tax).toLocaleString()}`;
    document.getElementById('o-tax-row').style.display = 'block';
  } else if(invType==='has') {
    const preTax = sub / 1.05;
    tax = sub - preTax;
    invInfo = `含税价：总计 $${sub.toLocaleString()} (其中未税 $${preTax.toLocaleString()}, 税金 $${tax.toLocaleString()})`;
    document.getElementById('o-tax-row').style.display = 'block';
  } else {
    document.getElementById('o-tax-row').style.display = 'none';
  }
  document.getElementById('o-tax').textContent = Math.round(tax).toLocaleString();
  document.getElementById('o-inv-info').textContent = invInfo;
  
  const shipDisplay = shipType==='pay' ? ship : 0;
  document.getElementById('o-ship-display').textContent = shipDisplay.toLocaleString();
  document.getElementById('o-ship-row').style.display = ship > 0 ? 'block' : 'none';
  
  const total = sub + tax + shipDisplay;
  document.getElementById('o-total').textContent = total.toLocaleString();
};

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  if(!cid) return showAlert('请选择客户！');
  const items = []; let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value)||0;
    const p = parseFloat(r.querySelector('.o-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); sub+=p*q; }
  });
  if(!items.length) return showAlert('请加入产品！');
  
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0; 
  if(invType==='tax') tax = sub*0.05;
  else if(invType==='has') tax = sub - (sub/1.05);
  
  const shipCharge = shipType==='pay'?ship:0;
  const total = sub + tax + shipCharge;

  const data = {
    customer_id:cid, total_amount:total, status:'shipped', order_no:'ORD-'+Date.now(),
    invoice_title:document.getElementById('o-inv-title').value||null, invoice_tax_id:document.getElementById('o-inv-tax').value||null,
    invoice_type:document.getElementById('o-inv-fmt').value, invoice_no:document.getElementById('o-inv-no').value||null,
    tax_handling:invType, tax_amount:tax, shipping_fee:ship, absorbed_shipping_fee:shipType==='free'?ship:0,
    shipping_address_detail:JSON.stringify({recv:document.getElementById('o-recv').value, phone:document.getElementById('o-phone').value, addr:document.getElementById('o-addr').value})
  };

  try {
    const r = await sb.from('orders').insert([data]).select().single();
    const oid = r.data.id;
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:oid})));
    
    // 手动扣库存
    for(const i of items) {
      const p = D.products.find(x=>x.id===i.product_id);
      if(p) await sb.from('products').update({current_stock: (p.current_stock||0) - i.quantity}).eq('id', i.product_id);
    }
    
    showAlert('出货单已储存，库存已扣减！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失败：'+e.message); }
}

  await loadAll(); render();
};
