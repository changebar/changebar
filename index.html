  #modal-content { overflow-y: auto !important; overflow-x: visible !important; }

// ==================== 輔助函式 ====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar) return;
  if (window.innerWidth <= 1024) {
    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      sidebar.classList.remove('open');
      if (overlay) { overlay.classList.remove('show'); setTimeout(() => { overlay.style.display = 'none'; }, 300); }
    } else {
      if (overlay) { overlay.style.display = 'block'; setTimeout(() => { overlay.classList.add('show'); }, 10); }
      sidebar.classList.add('open');
    }
  } else {
    sidebar.classList.toggle('collapsed');
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('sidebarCollapsed', isCollapsed ? 'true' : 'false');
  }
}

function closeSidebarMobile() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (window.innerWidth <= 1024 && sidebar) {
    sidebar.classList.remove('open');
    if (overlay) { overlay.classList.remove('show'); setTimeout(() => { overlay.style.display = 'none'; }, 300); }
  }
}

function showAlert(msg) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');
  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
  if (modal) modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden flex flex-col';
  title.textContent = '訊息';
  body.innerHTML = '<div class="p-6"><div class="flex flex-col items-center justify-center"><div class="text-center text-lg text-gray-800">' + msg + '</div></div></div>';
  footer.innerHTML = '';
  const confirmBtn = document.createElement('button');
  confirmBtn.id = 'alert-ok-btn';
  confirmBtn.className = 'w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors cursor-pointer btn-touch';
  confirmBtn.textContent = '確定 (Enter)';
  confirmBtn.onclick = function() { closeModal(); document.removeEventListener('keydown', handleAlertKey); };
  function handleAlertKey(e) {
    if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeModal(); document.removeEventListener('keydown', handleAlertKey); }
    else if(e.key === 'Escape') { e.preventDefault(); closeModal(); document.removeEventListener('keydown', handleAlertKey); }
  }
  footer.appendChild(confirmBtn);
  overlay.classList.remove('hidden');
  if (modal) modal.classList.remove('hidden');
  setTimeout(function() { confirmBtn.focus(); document.addEventListener('keydown', handleAlertKey); }, 100);
}

window.closeModal = function() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  if(overlay) overlay.classList.add('hidden');
  if(modal) { modal.classList.remove('hidden'); modal.classList.remove('modal-fullscreen'); }
  editingId = null;
  isSaving = false;
};

function openModal(title, html, onSave, hideSave) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-container');
  const titleEl = document.getElementById('modal-title');
  const body = document.getElementById('modal-content');
  const footer = document.getElementById('modal-buttons');
  if(!overlay || !modal || !titleEl || !body) { console.error('找不到必要的 modal 元素'); return; }
  modal.classList.remove('modal-fullscreen');
  const fullscreenBtn = document.getElementById('modal-fullscreen-btn');
  if (fullscreenBtn) fullscreenBtn.textContent = '⛶';
  overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-3 md:p-4';
  modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col transform transition-all modal-content';
  modal.style.overflow = 'visible !important';
  titleEl.textContent = title;
  body.innerHTML = html;
  body.style.overflowY = 'auto';
  body.style.overflowX = 'visible';
  if (fullscreenBtn) {
    fullscreenBtn.onclick = function() {
      const isFull = modal.classList.toggle('modal-fullscreen');
      fullscreenBtn.textContent = isFull ? '⤢' : '⛶';
      if (isFull) { body.style.overflowY = 'auto'; body.style.flex = '1'; }
      else { body.style.overflowY = ''; body.style.flex = ''; }
    };
  }
  const closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) closeBtn.onclick = function() { window.closeModal(); };
  if(footer) {
    footer.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-gray-300 rounded-lg hover:bg-gray-400 font-semibold transition-colors btn-touch cursor-pointer';
    cancelBtn.style.zIndex = '100';
    cancelBtn.textContent = '取消 (Esc)';
    cancelBtn.onclick = function() { closeModal(); };
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-lg btn-touch cursor-pointer';
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.disabled = false;
    saveBtn.style.zIndex = '100';
    saveBtn.id = 'modal-save-btn';
    if(hideSave) { saveBtn.classList.add('hidden'); }
    else {
      saveBtn.classList.remove('hidden');
      saveBtn.onclick = function() {
        if(isSaving) return;
        isSaving = true;
        saveBtn.disabled = true;
        saveBtn.textContent = '儲存中...';
        onSave().then(function() {
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
          closeModal();
        }).catch(function(e) {
          console.error('Save error:', e || 'Unknown error');
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = '儲存 (Enter)';
        });
      };
    }
    footer.appendChild(cancelBtn);
    footer.appendChild(saveBtn);
  }
  overlay.classList.remove('hidden');
  modal.classList.remove('hidden');
  function handleModalKey(e) {
    if(e.key === 'Escape') { e.preventDefault(); closeModal(); document.removeEventListener('keydown', handleModalKey); }
    else if(e.key === 'Enter') {
      if (e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        const saveBtn = document.getElementById('modal-save-btn');
        if(saveBtn && !saveBtn.disabled) saveBtn.click();
      }
    }
  }
  document.addEventListener('keydown', handleModalKey);
  setTimeout(function() {
    const firstInput = modal.querySelector('input, select, textarea');
    if(firstInput) firstInput.focus();
  }, 100);
}

  if(rememberedEmail) { document.getElementById('email').value = rememberedEmail; document.getElementById('remember').checked = true; }
  document.getElementById('password').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') document.getElementById('login-btn').click();
  });
  document.getElementById('logout-btn').addEventListener('click', function() {
    if(window.sb) { window.sb.auth.signOut().then(function() { location.reload(); }); }
    else { location.reload(); }
  });
  document.getElementById('login-btn').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    if(remember) localStorage.setItem('rememberedEmail', email);
    else localStorage.removeItem('rememberedEmail');
    if(!window.sb) { showAlert('Supabase 未連接，請檢查網路或設定。'); return; }
    window.sb.auth.signInWithPassword({ email: email, password: password })
      .then(function(res) {
        if (res.error) { showAlert('登入失敗：' + res.error.message); }
        else {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('main-system').classList.remove('hidden');
          if (typeof loadAll === 'function') { loadAll().then(function() { switchView('boss'); }); }
          else { switchView('boss'); }
        }
      })
      .catch(function(err) { showAlert('登入發生錯誤：' + err.message); });
  });
});

  const activeLink = document.querySelector('nav a[data-view="' + view + '"]');
  if(activeLink) activeLink.classList.add('nav-active');
}

function render() { switchView(currentView); }

function sortTable(tbodyId, colIndex) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a, b) {
    const aText = a.cells[colIndex] ? a.cells[colIndex].textContent || '' : '';
    const bText = b.cells[colIndex] ? b.cells[colIndex].textContent || '' : '';
    return aText.localeCompare(bText, 'zh-TW');
  });
  for(let i=0; i<rows.length; i++) tbody.appendChild(rows[i]);
}

<script>
// ==================== 老闆查閱 ====================
function renderBoss(c) {
  const startY = parseInt(bossDateRange.start.split('-')[0]);
  const startM = parseInt(bossDateRange.start.split('-')[1]);
  const endY = parseInt(bossDateRange.end.split('-')[0]);
  const endM = parseInt(bossDateRange.end.split('-')[1]);

  const monthOrders = D.orders.filter(function(o) {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });

  let rev = 0;
  for(let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount||0;

  const monthPurchases = D.purchases.filter(function(p) {
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let pur = 0;
  for(let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount||0;

  const monthExpenses = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let exp = 0;
  for(let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount||0;

  let subMonthlyTotal = 0;
  const targetMonth = bossDateRange.start;
  for(let i=0; i<D.subs.length; i++) {
    const s = D.subs[i];
    if(s.start_date && s.end_date && s.amount) {
      const startDate = new Date(s.start_date);
      const endDate = new Date(s.end_date);
      const targetDate = new Date(targetMonth + '-01');
      if(targetDate >= startDate && targetDate <= endDate) {
        const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
        if(diffMonths > 0) {
          subMonthlyTotal += s.amount / diffMonths;
        }
      }
    }
  }

  let totalCash = 0;
  for(let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance||0;

  const monthlyProfit = rev - pur - exp - subMonthlyTotal;

  const unreimbursedExpenses = D.expenses.filter(function(e) { return e.employee_id && !e.is_reimbursed; });
  const unreimbursedByEmp = {};
  for(let i=0; i<unreimbursedExpenses.length; i++) {
    const e = unreimbursedExpenses[i];
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += e.amount || 0;
      unreimbursedByEmp[emp.name].items.push(e);
    }
  }

  const inventoryByType = {};
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    let totalQty = 0;
    const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity||0;
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({ type: p.type, name: p.name, sku: p.sku, quantity: totalQty, cost: p.cost_price || 0, value: totalQty * (p.cost_price || 0) });
    }
  }

  const inventoryAssets = { finished: { count: 0, value: 0 }, semi: { count: 0, value: 0 }, gift_box: { count: 0, value: 0 }, outer_box: { count: 0, value: 0 } };
  let allItems = [];
  for(const type in inventoryByType) { allItems = allItems.concat(inventoryByType[type]); }
  for(let i=0; i<allItems.length; i++) {
    const item = allItems[i];
    if(inventoryAssets[item.type]) {
      inventoryAssets[item.type].count += item.quantity;
      inventoryAssets[item.type].value += item.value;
    }
  }
  let totalInventoryValue = 0;
  for(const type in inventoryAssets) { totalInventoryValue += inventoryAssets[type].value; }

  const channelStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const ch = D.channels.find(function(x) { return x.id===o.sales_channel_id; });
    if(ch) {
      if(!channelStats[ch.name]) channelStats[ch.name] = {count:0, amount:0, commission:0};
      channelStats[ch.name].count++;
      channelStats[ch.name].amount += o.total_amount||0;
      channelStats[ch.name].commission += o.channel_commission||0;
    }
  }

  const paymentStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const pm = D.payments.find(function(x) { return x.id===o.payment_method_id; });
    if(pm) {
      if(!paymentStats[pm.name]) paymentStats[pm.name] = {count:0, amount:0, commission:0};
      paymentStats[pm.name].count++;
      paymentStats[pm.name].amount += o.total_amount||0;
      paymentStats[pm.name].commission += o.payment_commission||0;
    }
  }

  let companyShipping = 0;
  let customerShipping = 0;
  for(let i=0; i<monthOrders.length; i++) {
    companyShipping += monthOrders[i].absorbed_shipping_fee || 0;
    customerShipping += monthOrders[i].customer_paid_shipping || 0;
  }
  let totalChannelCommission = 0;
  for(const ch in channelStats) totalChannelCommission += channelStats[ch].commission;
  let totalPaymentCommission = 0;
  for(const pm in paymentStats) totalPaymentCommission += paymentStats[pm].commission;
  const totalShippingCost = companyShipping;
  const totalOrderExpenses = totalChannelCommission + totalPaymentCommission + totalShippingCost;

  const subTag = D.tags.find(function(t) { return t.name.indexOf('訂閱') !== -1; });
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(function(ct) { return ct.tag_id === subTag.id; }).map(function(ct) { return ct.customer_id; });
    const uniqueIds = [];
    for(let i=0; i<subTagIds.length; i++) { if(uniqueIds.indexOf(subTagIds[i]) === -1) uniqueIds.push(subTagIds[i]); }
    subCustomerCount = uniqueIds.length;
  }
  let subMonthlyRevenue = 0;
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    if(o.is_subscription && o.subscription_days > 0) {
      const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
      subMonthlyRevenue += dailyRevenue * 30;
    }
  }
  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  let channelStatsHtml = '';
  for(const name in channelStats) {
    const stat = channelStats[name];
    channelStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!channelStatsHtml) channelStatsHtml = '<div class="text-gray-400">無數據</div>';

  let paymentStatsHtml = '';
  for(const name in paymentStats) {
    const stat = paymentStats[name];
    paymentStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!paymentStatsHtml) paymentStatsHtml = '<div class="text-gray-400">無數據</div>';

  let unreimbursedHtml = '';
  for(const name in unreimbursedByEmp) {
    const data = unreimbursedByEmp[name];
    let itemsHtml = '';
    for(let i=0; i<data.items.length; i++) {
      const e = data.items[i];
      itemsHtml += '<div class="flex justify-between"><span>'+(e.description || '無描述')+' ('+e.payment_date+')</span><span>'+(e.amount||0).toLocaleString()+'</span></div>';
    }

// ==================== 下載 Excel ====================
function downloadBossReport() {
  const startDate = bossDateRange.start;
  const endDate = bossDateRange.end;
  const fileName = startDate + '_至_' + endDate + '_養芯ERP資料.xlsx';
  const wb = XLSX.utils.book_new();

  const custData = D.customers.map(function(c) {
    const win = D.windows.find(w => w.id === c.primary_contact_window_id);
    const tags = D.customerTags.filter(ct => ct.customer_id === c.id).map(ct => {
      const t = D.tags.find(tg => tg.id === ct.tag_id);
      return t ? t.name : '';
    }).join(', ');
    return {
      '類型': c.type || '',
      '公司/姓名': c.company_name || c.contact_person || '',
      '聯絡人': c.contact_person || '',
      '電話': c.phone || '',
      '主要窗口': win ? win.name : '',
      '標籤': tags,
      '統一編號': c.tax_id || '',
      '發票抬頭': c.invoice_title || '',
      'Email': c.email || '',
      '訂閱': c.is_subscription ? '是 ('+(c.subscription_days||0)+'天)' : '否',
      '備註': c.notes || ''
    };
  });
  const ws1 = XLSX.utils.json_to_sheet(custData);
  XLSX.utils.book_append_sheet(wb, ws1, '客戶管理');

  const ordData = D.orders.filter(function(o) {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    const dateStr = y + '-' + m;
    return dateStr >= startDate && dateStr <= endDate;
  }).map(function(o) {
    const c = D.customers.find(x => x.id === o.customer_id);
    const bank = D.banks.find(x => x.id === o.bank_account_id);
    return {
      '日期': new Date(o.created_at).toLocaleDateString(),
      '訂單編號': o.order_no || '',
      '客戶': c ? c.company_name || c.contact_person : '',
      '總金額': o.total_amount || 0,
      '毛利率': o.gross_profit_margin ? o.gross_profit_margin.toFixed(1)+'%' : '',
      '入帳銀行': bank ? bank.account_name : '',
      '運費': o.shipping_fee || 0,
      '訂閱': o.is_subscription_order ? '是' : '否'
    };
  });
  const ws2 = XLSX.utils.json_to_sheet(ordData);
  XLSX.utils.book_append_sheet(wb, ws2, '訂單出貨');

  const expData = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    return (y + '-' + m) >= startDate && (y + '-' + m) <= endDate;
  }).map(function(e) {
    const cat = D.expCats.find(c => c.id === e.category_id);
    const emp = D.emps.find(x => x.id === e.employee_id);
    const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
    return {
      '日期': e.payment_date || '',
      '類別': cat ? cat.name : '',
      '金額': e.amount || 0,
      '描述': e.description || '',
      '代墊員工': emp ? emp.name : '',
      '結帳狀態': e.is_reimbursed ? '已結帳' : '待結帳',
      '出帳銀行': bank ? bank.account_name : ''
    };
  });
  const ws3 = XLSX.utils.json_to_sheet(expData);
  XLSX.utils.book_append_sheet(wb, ws3, '收支與訂閱');

  const purData = D.purchases.filter(function(p) {
    if(!p.created_at) return false;
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    return (y + '-' + m) >= startDate && (y + '-' + m) <= endDate;
  }).map(function(p) {
    const v = D.vendors.find(x => x.id === p.vendor_id);
    return {
      '日期': p.created_at ? new Date(p.created_at).toLocaleDateString() : '',
      '廠商': v ? v.name : '',
      '類型': p.is_invoice_purchase ? '購買發票' : '一般採購',
      '有發票': p.is_invoice_purchase ? '有' : '無',
      '總金額': p.total_amount || 0
    };
  });
  const ws4 = XLSX.utils.json_to_sheet(purData);
  XLSX.utils.book_append_sheet(wb, ws4, '採購入庫');

  const venData = D.vendors.map(function(v) {
    return {
      '名稱': v.name || '',
      '統一編號': v.tax_id || '',
      '聯絡人': v.contact_person || '',
      '電話': v.phone || '',
      '合作狀態': v.cooperation_status === 'paused' ? '暫時無配合' : '正常配合'
    };
  });
  const ws5 = XLSX.utils.json_to_sheet(venData);
  XLSX.utils.book_append_sheet(wb, ws5, '廠商管理');

  const invData = D.products.map(function(p) {
    let totalQty = 0;
    const invs = D.warehouseInv.filter(i => i.product_id === p.id);
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity || 0;
    const initStock = p.initial_stock || 0;
    const variance = initStock > 0 ? ((totalQty - initStock) / initStock * 100) : 0;
    return {
      '產品': p.name || '',
      'SKU': p.sku || '',
      '目前庫存': totalQty,
      '初始庫存': initStock,
      '誤差率': initStock > 0 ? variance.toFixed(1)+'%' : '-'
    };
  });
  const ws6 = XLSX.utils.json_to_sheet(invData);
  XLSX.utils.book_append_sheet(wb, ws6, '庫存盤點');

  const bankData = D.banks.map(function(b) {
    return {
      '帳戶名稱': b.account_name || '',
      '銀行名稱': b.bank_name || '',
      '帳號': b.account_number || '',
      '餘額': b.balance || 0,
      '狀態': b.is_active !== false ? '啟用' : '停用'
    };
  });
  const ws7 = XLSX.utils.json_to_sheet(bankData);
  XLSX.utils.book_append_sheet(wb, ws7, '銀行帳戶');

  XLSX.writeFile(wb, fileName);
  showAlert('Excel 報表已下載！');
}

function sortCustTable(field) {
  if(custSortField === field) custSortAsc = !custSortAsc;
  else { custSortField = field; custSortAsc = true; }
  renderCustTable();
}

function renderCustTable() {
  const kw = (document.getElementById('cust-search')?.value || '').toLowerCase();
  let list = D.customers.filter(function(c) {
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().indexOf(kw) !== -1;
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; });
    let tagMatch = false;
    for(let i=0; i<custTags.length; i++) {
      const ct = custTags[i];
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      if(tag && tag.name.toLowerCase().indexOf(kw) !== -1) { tagMatch = true; break; }
    }
    return basicMatch || tagMatch;
  });

  list.sort(function(a, b) {
    let aVal = a[custSortField] || '';
    let bVal = b[custSortField] || '';
    if(typeof aVal === 'string') aVal = aVal.toLowerCase();
    if(typeof bVal === 'string') bVal = bVal.toLowerCase();
    if(aVal < bVal) return custSortAsc ? -1 : 1;
    if(aVal > bVal) return custSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const c = list[i];
    const win = D.windows.find(function(w) { return w.id===c.primary_contact_window_id; });
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; }).map(function(ct) {
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
    }).join('');
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full '+(c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800')+'">'+c.type+'</span></td><td class="px-4 py-3 font-medium">'+(c.company_name||c.contact_person)+'</td><td class="px-4 py-3 text-sm">'+c.contact_person+'<br><span class="text-gray-500">'+c.phone+'</span></td><td class="px-4 py-3 text-sm">'+(c.invoice_title||'-')+'<br><span class="text-gray-500">'+(c.tax_id||'-')+'</span></td><td class="px-4 py-3 text-sm">'+(win ? win.name : '-')+'</td><td class="px-4 py-3">'+(custTags || '<span class="text-gray-400">無</span>')+'</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewCustDetail(\''+c.id+'\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button><button onclick="openCustModal(\''+c.id+'\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delCust(\''+c.id+'\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('cust-tbody').innerHTML = html;
}

    for(let i=0; i<addrs.length; i++) {

    }

  const html = '<div class="space-y-4">' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">' +

      '<div><b>統編:</b> '+(c.tax_id||'-')+'</div>' +
      '<div><b>聯絡人:</b> '+c.contact_person+'</div>' +
      '<div><b>電話:</b> '+c.phone+'</div>' +
      '<div><b>Email:</b> '+(c.email||'-')+'</div>' +
      '<div><b>發票抬頭:</b> '+(c.invoice_title||'-')+'</div>' +
      '<div class="md:col-span-2"><b>標籤:</b> '+(custTags || '無')+'</div>' +
      '<div class="md:col-span-2 bg-indigo-50 p-2 rounded"><b>訂閱客戶:</b> '+subInfo+'</div>' +
    '</div>' +
    '<div class="border-t pt-3"><h3 class="font-bold mb-2">寄送地址</h3>'+addrHtml+'</div>' +
    noteHtml +
  '</div>';
  openModal('客戶詳情', html, function(){return Promise.resolve();}, true);
}

async function openCustModal(id) {

    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">公司/客戶名稱</label><input type="text" id="c-comp" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.company_name||'':'')+'"></div><div><label class="block text-sm font-bold mb-2">聯絡人</label><input type="text" id="c-contact" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.contact_person||'':'')+'" oninput="syncAddrContact()"></div></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">電話 *</label><input type="text" id="c-phone" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.phone||'':'')+'" oninput="syncAddrContact()"></div><div><label class="block text-sm font-bold mb-2">Email</label><input type="email" id="c-email" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.email||'':'')+'"></div></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">發票抬頭</label><input type="text" id="c-title" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.invoice_title||'':'')+'"></div><div><label class="block text-sm font-bold mb-2">統一編號</label><input type="text" id="c-tax" class="w-full px-3 py-2 border rounded input-field" value="'+(c?c.tax_id||'':'')+'"></div></div>' +
    '<div class="bg-indigo-50 p-4 rounded-lg border border-indigo-200 mb-4">' +
      '<h3 class="font-bold text-indigo-800 mb-2">🔄 訂閱客戶設定</h3>' +
      '<div class="form-row"><label>訂閱客戶</label><div class="checkbox-inline"><input type="checkbox" id="c-is-sub" '+(c&&c.is_subscription?'checked':'')+' onchange="document.getElementById(\'c-sub-days-box\').style.display = this.checked ? \'block\' : \'none\'"><label for="c-is-sub">啟用</label></div></div>' +
      '<div id="c-sub-days-box" style="display:'+(c&&c.is_subscription?'block':'none')+'">' +

      '</div>' +
    '</div>' +
    '<div class="mb-4"><label class="block text-sm font-bold mb-2">標籤</label><div id="c-tags" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50">'+tagHtml+'</div></div>' +
    '<div class="border-t pt-4"><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">寄送地址</h3><button type="button" onclick="addAddr()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm btn-touch">+ 新增地址</button></div><div id="addr-box" class="space-y-3"></div></div>';

  openModal(id?'編輯客戶':'新增客戶', html, saveCust);
  if(id) {
    const addrsResp = await sb.from('customer_addresses').select('*').eq('customer_id', id);

    document.getElementById('addr-box').innerHTML = '';

function syncAddrContact() {
  const contact = document.getElementById('c-contact') ? document.getElementById('c-contact').value || '' : '';
  const phone = document.getElementById('c-phone') ? document.getElementById('c-phone').value || '' : '';
  const recvInputs = document.querySelectorAll('#addr-box .a-recv');
  const phoneInputs = document.querySelectorAll('#addr-box .a-phone');
  for(let i=0; i<recvInputs.length; i++) { if(!recvInputs[i].dataset.userEdited) recvInputs[i].value = contact; }
  for(let i=0; i<phoneInputs.length; i++) { if(!phoneInputs[i].dataset.userEdited) phoneInputs[i].value = phone; }
}

function addAddr(addrData, isDefault) {
  const box = document.getElementById('addr-box');
  const contact = document.getElementById('c-contact') ? document.getElementById('c-contact').value || '' : '';
  const phone = document.getElementById('c-phone') ? document.getElementById('c-phone').value || '' : '';
  const div = document.createElement('div');
  div.className = 'border rounded-lg p-4 bg-gray-50';
  const recipientName = addrData ? addrData.recipient_name : contact;
  const recipientPhone = addrData ? addrData.recipient_phone : phone;
  const addressType = addrData ? addrData.address_type : 'home';
  const street = addrData ? addrData.street : '';
  const isDefaultChecked = addrData ? addrData.is_default : (isDefault && box.children.length === 0);
  div.innerHTML = '<div class="flex justify-between items-center mb-3"><label class="flex items-center gap-1 text-sm"><input type="checkbox" class="a-def" '+(isDefaultChecked?'checked':'')+'><span>預設</span></label><button type="button" onclick="this.closest(\'.border\').remove()" class="text-red-600 btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="block text-xs font-bold mb-1">類型</label><select class="a-type w-full px-3 py-2 border rounded input-field"><option value="home" '+(addressType==='home'?'selected':'')+'>住家</option><option value="office" '+(addressType==='office'?'selected':'')+'>公司</option><option value="cvs_711" '+(addressType==='cvs_711'?'selected':'')+'>7-11</option><option value="cvs_family" '+(addressType==='cvs_family'?'selected':'')+'>全家</option></select></div><div><label class="block text-xs font-bold mb-1">收件人</label><input type="text" class="a-recv w-full px-3 py-2 border rounded input-field" value="'+recipientName+'" oninput="this.dataset.userEdited=\'true\'"></div><div><label class="block text-xs font-bold mb-1">電話</label><input type="text" class="a-phone w-full px-3 py-2 border rounded input-field" value="'+recipientPhone+'" oninput="this.dataset.userEdited=\'true\'"></div><div><label class="block text-xs font-bold mb-1">地址/門市</label><input type="text" class="a-addr w-full px-3 py-2 border rounded input-field" value="'+street+'"></div></div>';
  box.appendChild(div);
}

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value,
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value,
    phone: document.getElementById('c-phone').value,
    primary_contact_window_id: document.getElementById('c-win').value||null,
    invoice_title: document.getElementById('c-title').value||null,
    tax_id: document.getElementById('c-tax').value||null,
    email: document.getElementById('c-email').value||null
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  try {
    let cid = id;
    if(id) {
      await sb.from('customers').update(data).eq('id', id);
    } else {
      const inserted = await sb.from('customers').insert([data]).select().single();
      if (!inserted || !inserted.data) {
        throw new Error('新增客戶失敗，請檢查資料庫欄位是否正確。');
      }
      cid = inserted.data.id;
    }
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = [];
    const checkboxes = document.querySelectorAll('.c-tag-cb:checked');
    for(let i=0; i<checkboxes.length; i++) tagIds.push(checkboxes[i].value);
    if(tagIds.length) {
      const tagInserts = [];
      for(let i=0; i<tagIds.length; i++) tagInserts.push({customer_id: cid, tag_id: tagIds[i]});
      await sb.from('customer_tags').insert(tagInserts);
    }
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    const addrDivs = document.querySelectorAll('#addr-box > div');
    for(let i=0; i<addrDivs.length; i++) {
      const d = addrDivs[i];
      addrs.push({
        customer_id: cid,
        address_type: d.querySelector('.a-type').value,
        recipient_name: d.querySelector('.a-recv').value,
        recipient_phone: d.querySelector('.a-phone').value,
        street: d.querySelector('.a-addr').value,
        is_default: d.querySelector('.a-def').checked
      });
    }
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    showAlert('客戶已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    console.error('saveCust error:', e);
    let msg = '儲存失敗：' + e.message;
    if (e.message && e.message.includes('column') && e.message.includes('notes')) {
      msg = '儲存失敗：資料表缺少 notes 欄位，已跳過該欄位。請檢查資料庫結構或聯絡管理員。';
    }
    showAlert(msg);
  }
}

async function delCust(id) {
  if(!confirm('確定刪除？')) return;
  try {
    await sb.from('customer_addresses').delete().eq('customer_id', id);
    await sb.from('customer_tags').delete().eq('customer_id', id);
    await sb.from('customers').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('刪除失敗：' + e.message);
  }
}

function manageWindows() {
  const html = '<div class="flex gap-2 mb-4"><input type="text" id="w-name" placeholder="窗口姓名" class="flex-1 px-3 py-2 border rounded input-field"><button onclick="addWin()" class="px-4 py-2 bg-blue-600 text-white rounded btn-touch">新增</button></div><div id="win-list" class="space-y-2">' + D.windows.map(function(w){return '<div class="flex justify-between p-2 border rounded"><span>'+w.name+'</span><button onclick="delWin(\''+w.id+'\')" class="text-red-600 text-sm btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></div>';}).join('') + '</div>';
  openModal('管理聯繫窗口', html, function(){return Promise.resolve();}, true);
}
async function addWin() { const n = document.getElementById('w-name').value.trim(); if(!n) return showAlert('必填！'); await sb.from('contact_windows').insert([{name:n}]); await loadAll(); manageWindows(); }
async function delWin(id) { if(!confirm('確定刪除？')) return; await sb.from('contact_windows').delete().eq('id',id); await loadAll(); manageWindows(); }

function manageTags() {
  let colorOptions = '';
  for(const k in COLOR_NAMES) colorOptions += '<option value="'+k+'">'+COLOR_NAMES[k]+'</option>';
  const html = '<div class="flex flex-wrap gap-2 items-center mb-4"><div class="flex-1 min-w-[150px]"><input type="text" id="t-name" placeholder="標籤名稱" class="w-full px-3 py-2 border rounded input-field"></div><div class="flex-shrink-0"><select id="t-color" class="px-2 py-2 border rounded input-field" style="width:auto;min-width:80px;">'+colorOptions+'</select></div><button onclick="addTag()" class="px-4 py-2 bg-blue-600 text-white rounded btn-touch">新增</button></div><div id="tag-list" class="space-y-2">' + D.tags.map(function(t){return '<div class="flex justify-between items-center p-2 border rounded"><span class="tag-'+t.color+' px-2 py-1 rounded text-sm">'+t.name+'</span><button onclick="delTag(\''+t.id+'\')" class="text-red-600 text-sm btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></div>';}).join('') + '</div>';
  openModal('管理標籤', html, function(){return Promise.resolve();}, true);
}
async function addTag() { const n = document.getElementById('t-name').value.trim(); if(!n) return; await sb.from('tags').insert([{name:n, color:document.getElementById('t-color').value}]); await loadAll(); manageTags(); }
async function delTag(id) { if(!confirm('刪除?')) return; await sb.from('tags').delete().eq('id',id); await loadAll(); manageTags(); }
</script>
<script>
// ==================== 訂單出貨 ====================
function renderOrders(c) {
  c.innerHTML = '<div class="content-card">' +
    '<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">' +
      '<h1 class="text-3xl font-bold">📦 訂單出貨</h1>' +
      '<button onclick="openOrdModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold btn-touch">+ 新增出貨單</button>' +
    '</div>' +
    '<div class="bg-white rounded-lg shadow p-4 mb-4">' +
      '<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">' +
        '<div><label class="block text-sm font-bold mb-2">🔍 搜尋</label><input type="text" id="ord-search" class="w-full px-3 py-2 border rounded-lg" placeholder="輸入客戶名稱、電話..." oninput="renderOrdTable()"></div>' +
        '<div><label class="block text-sm font-bold mb-2">📅 開始日期</label><input type="month" id="ord-start-date" class="w-full px-3 py-2 border rounded-lg" onchange="renderOrdTable()"></div>' +
        '<div><label class="block text-sm font-bold mb-2">📅 結束日期</label><input type="month" id="ord-end-date" class="w-full px-3 py-2 border rounded-lg" onchange="renderOrdTable()"></div>' +
        '<div class="flex items-end"><button onclick="clearOrdFilters()" class="w-full px-4 py-2 bg-gray-500 text-white rounded-lg btn-touch">清除篩選</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="bg-white rounded-lg shadow overflow-hidden table-container">' +
      '<table class="min-w-full divide-y divide-gray-200">' +
        '<thead class="bg-gray-50">' +
          '<tr><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header cursor-pointer" onclick="sortOrdTable(\'created_at\')">日期 <span class="sort-icon">↕</span></th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header cursor-pointer" onclick="sortOrdTable(\'customer_name\')">客戶 <span class="sort-icon">↕</span></th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">入帳銀行</th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">運費代墊</th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header cursor-pointer" onclick="sortOrdTable(\'total_amount\')">總金額 <span class="sort-icon">↕</span></th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header cursor-pointer" onclick="sortOrdTable(\'gross_profit_margin\')">毛利率 <span class="sort-icon">↕</span></th>' +
          '<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">操作</th></tr>' +
        '</thead>' +
        '<tbody id="ord-tbody" class="bg-white divide-y divide-gray-200"></tbody>' +
      '</table>' +
    '</div>' +
  '</div>';
  renderOrdTable();
}

function sortOrdTable(field) {
  if(ordSortField === field) ordSortAsc = !ordSortAsc;
  else { ordSortField = field; ordSortAsc = true; }
  renderOrdTable();
}

function renderOrdTable() {
  const searchInput = document.getElementById('ord-search');
  const startDateInput = document.getElementById('ord-start-date');
  const endDateInput = document.getElementById('ord-end-date');

  const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
  const startDate = startDateInput ? startDateInput.value : '';
  const endDate = endDateInput ? endDateInput.value : '';

  let list = D.orders.map(function(o) {
    const c = D.customers.find(function(x) { return x.id === o.customer_id; });
    return Object.assign({}, o, { customer_name: c ? (c.company_name || c.contact_person || '') : '' });
  });

  if(searchTerm) {
    list = list.filter(function(o) {
      const c = D.customers.find(function(x) { return x.id === o.customer_id; });
      const customerName = c ? (c.company_name || c.contact_person || '').toLowerCase() : '';
      const customerPhone = c ? (c.phone || '').toLowerCase() : '';
      return customerName.indexOf(searchTerm) !== -1 || customerPhone.indexOf(searchTerm) !== -1;
    });
  }

  if(startDate) {
    list = list.filter(function(o) {
      const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
      return orderDate >= startDate;
    });
  }
  if(endDate) {
    list = list.filter(function(o) {
      const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
      return orderDate <= endDate;
    });
  }

  list.sort(function(a, b) {
    let aVal = a[ordSortField] || '';
    let bVal = b[ordSortField] || '';
    if(ordSortField === 'created_at') {
      aVal = new Date(aVal);
      bVal = new Date(bVal);
    } else if(ordSortField === 'customer_name') {
      aVal = aVal.toLowerCase();
      bVal = bVal.toLowerCase();
    }
    if(aVal < bVal) return ordSortAsc ? -1 : 1;
    if(aVal > bVal) return ordSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  let totalAmount = 0;
  let totalMargin = 0;
  let count = 0;

  for(let i=0; i<list.length; i++) {
    const o = list[i];
    const c = D.customers.find(function(x) { return x.id === o.customer_id; });
    const emp = o.shipping_advance_employee_id ? D.emps.find(function(x) { return x.id === o.shipping_advance_employee_id; }) : null;
    const bank = D.banks.find(function(x) { return x.id === o.bank_account_id; });

    totalAmount += o.total_amount || 0;
    if(o.gross_profit_margin !== undefined) { totalMargin += o.gross_profit_margin || 0; count++; }

    let marginHtml = '<span class="text-gray-400">-</span>';
    if(o.gross_profit_margin !== undefined && o.gross_profit_margin !== null) {
      const color = o.gross_profit_margin >= 0 ? 'text-green-600' : 'text-red-600';
      marginHtml = '<span class="'+color+' font-bold">'+o.gross_profit_margin.toFixed(1)+'%</span>';
    }

    let advanceHtml = '<span class="text-gray-400">-</span>';
    if(o.shipping_advance_amount > 0 && emp) {
      advanceHtml = '<div class="text-xs text-center"><div class="text-orange-600">'+emp.name+'</div><div class="font-bold">'+o.shipping_advance_amount.toLocaleString()+'</div></div>';
    }

    html += '<tr class="hover:bg-gray-50">' +
      '<td class="px-4 py-3 text-center whitespace-nowrap">' + new Date(o.created_at).toLocaleDateString() + '</td>' +
      '<td class="px-4 py-3 text-center">' + (c ? c.company_name || c.contact_person : '-') + '</td>' +
      '<td class="px-4 py-3 text-center">' + (bank ? bank.account_name : '-') + '</td>' +
      '<td class="px-4 py-3 text-center">' + advanceHtml + '</td>' +
      '<td class="px-4 py-3 text-center font-bold">' + (o.total_amount || 0).toLocaleString() + '</td>' +
      '<td class="px-4 py-3 text-center">' + marginHtml + '</td>' +
      '<td class="px-4 py-3 whitespace-nowrap space-x-2 text-center">' +

function searchCustomerInOrder() {
  const kw = document.getElementById('o-cust-search').value.toLowerCase();
  const select = document.getElementById('o-cust');
  const options = select.querySelectorAll('option');
  for(let i=0; i<options.length; i++) {
    const opt = options[i];
    const text = (opt.dataset.name || '').toLowerCase() + ' ' + (opt.dataset.phone || '').toLowerCase();
    opt.style.display = text.indexOf(kw) !== -1 ? 'block' : 'none';
  }
}

function fillCustomerData() {
  const custId = document.getElementById('o-cust').value;
  if(!custId) return;
  const cust = D.customers.find(function(c) { return c.id === custId; });
  if(!cust) return;
  document.getElementById('o-recv-name').value = cust.contact_person || '';
  document.getElementById('o-recv-phone').value = cust.phone || '';
  document.getElementById('o-invoice-title').value = cust.invoice_title || '';
  document.getElementById('o-invoice-tax').value = cust.tax_id || '';
  loadCustomerDefaultAddress(custId);
}

async function loadCustomerDefaultAddress(custId) {
  const resp = await sb.from('customer_addresses').select('*').eq('customer_id', custId).eq('is_default', true).limit(1);
  if(resp.data && resp.data.length > 0) {
    const addr = resp.data[0];
    document.getElementById('o-recv-addr').value = addr.street || addr.cvs_store_name || '';
  }
}

// ===== 新增產品明細（圖三風格：緊湊、小字、短欄位） =====
function addOrdItem(typeFilter, prod, qty, price, hasInvoice) {
  const box = document.getElementById('o-items');
  const div = document.createElement('div');
  div.className = 'ord-item-row';
  const uid = 'ord_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

  let prodOptionsHtml = '';
  const filtered = D.products.filter(p => p.type === typeFilter);
  for (let i = 0; i < filtered.length; i++) {
    const p = filtered[i];
    const selected = (prod && prod.id === p.id) ? 'selected' : '';
    const displayPrice = p.sell_price || 0;
    prodOptionsHtml += `<div class="opt-item" data-id="${p.id}" data-price="${displayPrice}" data-name="${p.name}" ${selected} onclick="selectOrdProduct(this, '${uid}')">
      <span class="opt-name">${p.name}</span><span class="opt-cost">(售價: ${displayPrice})</span>
    </div>`;
  }
  if (!prodOptionsHtml) {
    prodOptionsHtml = '<div class="opt-item no-match">尚無此類商品</div>';
  }

  let defaultName = prod ? prod.name : '';
  let defaultPrice = prod ? (prod.sell_price || 0) : 0;
  const isFinished = (typeFilter === 'finished');
  const checkedAttr = (hasInvoice && isFinished) ? 'checked' : '';

  div.innerHTML = `
    <div class="prod-search-wrapper">
      <input type="text" class="pu-prod-search" placeholder="搜" value="${defaultName}" autocomplete="off" oninput="filterOrdProdOptions(this, '${uid}')" onfocus="document.getElementById('ord_dropdown_${uid}').classList.add('show')" onblur="setTimeout(function(){document.getElementById('ord_dropdown_${uid}').classList.remove('show')},300)">
      <div class="pu-prod-select" id="ord_dropdown_${uid}">
        ${prodOptionsHtml}
      </div>
      <input type="hidden" class="pu-prod-id" value="${prod ? prod.id : ''}">
    </div>
    <input type="number" class="o-qty" value="${qty || 1}" min="1" oninput="calcOrd()">
    <input type="number" class="o-price" value="${price !== undefined ? price : defaultPrice}" step="0.01" oninput="calcOrd()">
    ${isFinished ? `<div class="invoice-check"><input type="checkbox" class="o-has-invoice" ${checkedAttr} onchange="calcOrd()" id="inv_${uid}"><label for="inv_${uid}">有</label></div>` : ''}
    <button type="button" onclick="this.parentElement.remove(); calcOrd()" class="del-btn">✕</button>
  `;
  box.appendChild(div);

  if (prod) {
    const hiddenInput = div.querySelector('.pu-prod-id');
    hiddenInput.value = prod.id;
    const priceInput = div.querySelector('.o-price');
    if (price !== undefined && price > 0) { priceInput.value = price; }
    else { priceInput.value = prod.sell_price || 0; }
  }
  setTimeout(calcOrd, 50);
}

function filterOrdProdOptions(input, uid) {
  const kw = input.value.toLowerCase();
  const dropdown = document.getElementById('ord_dropdown_' + uid);
  if (!dropdown) return;
  const items = dropdown.querySelectorAll('.opt-item');
  let hasMatch = false;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (item.classList.contains('no-match')) continue;
    const name = (item.dataset.name || '').toLowerCase();
    if (name.indexOf(kw) !== -1) { item.style.display = 'block'; hasMatch = true; }
    else { item.style.display = 'none'; }
  }
  let noMatch = dropdown.querySelector('.opt-item.no-match');
  if (!hasMatch) {
    if (!noMatch) { noMatch = document.createElement('div'); noMatch.className = 'opt-item no-match'; noMatch.textContent = '無符合商品'; dropdown.appendChild(noMatch); }
    noMatch.style.display = 'block';
  } else { if (noMatch) noMatch.style.display = 'none'; }
  dropdown.classList.add('show');
}

function selectOrdProduct(el, uid) {
  const id = el.dataset.id;
  const price = parseFloat(el.dataset.price) || 0;
  const name = el.dataset.name || '';
  const wrapper = document.getElementById('ord_dropdown_' + uid)?.closest('.prod-search-wrapper');
  if (!wrapper) return;
  const searchInput = wrapper.querySelector('.pu-prod-search');
  const hiddenInput = wrapper.querySelector('.pu-prod-id');
  const priceInput = wrapper.parentElement?.querySelector('.o-price');
  if (searchInput) searchInput.value = name;
  if (hiddenInput) hiddenInput.value = id;
  if (priceInput && !priceInput.dataset.userSet) { priceInput.value = price; }
  const dropdown = document.getElementById('ord_dropdown_' + uid);
  if (dropdown) dropdown.classList.remove('show');
  calcOrd();
}

function calcOrd() {
  let productSubtotal = 0;
  let totalCost = 0;
  const rows = document.querySelectorAll('#o-items .ord-item-row');
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const hiddenInput = r.querySelector('.pu-prod-id');
    if (!hiddenInput || !hiddenInput.value) continue;
    const productId = hiddenInput.value;
    const product = D.products.find(p => p.id === productId);
    if (!product) continue;
    const costPrice = product.cost_price || 0;
    const price = parseFloat(r.querySelector('.o-price').value) || 0;
    const qty = parseInt(r.querySelector('.o-qty').value) || 0;
    productSubtotal += price * qty;

    let finalCost = costPrice;
    const hasInvoiceCheck = r.querySelector('.o-has-invoice');
    if (hasInvoiceCheck && hasInvoiceCheck.checked && product.type === 'finished') {
      finalCost = costPrice * 1.05;
    }
    totalCost += finalCost * qty;
  }

  const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
  const shipPayer = document.getElementById('o-ship-payer').value;
  let finalShipping = 0;
  if (shipPayer === 'customer') finalShipping = shippingFee;

  const invType = document.getElementById('o-invoice-type').value;
  let taxAmount = 0;
  if (invType === 'tax_plus') taxAmount = productSubtotal * 0.05;

  const couponAmount = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
  const pointsAmount = parseFloat(document.getElementById('o-points-amount').value) || 0;
  const totalDiscount = couponAmount + pointsAmount;

  let amountAfterDiscount = productSubtotal + finalShipping + taxAmount - totalDiscount;
  if (amountAfterDiscount < 0) amountAfterDiscount = 0;

  const chSelect = document.getElementById('o-channel');
  const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
  const pmSelect = document.getElementById('o-payment');
  const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;

  const chCommission = amountAfterDiscount * (chRate / 100);
  const pmCommission = amountAfterDiscount * (pmRate / 100);
  const companyShippingCost = shipPayer === 'company' ? shippingFee : 0;

  const grossProfit = amountAfterDiscount - totalCost - chCommission - pmCommission - companyShippingCost;
  const margin = amountAfterDiscount > 0 ? (grossProfit / amountAfterDiscount) * 100 : 0;

  document.getElementById('o-total').textContent = Math.round(amountAfterDiscount).toLocaleString();
  document.getElementById('o-cost').textContent = totalCost.toLocaleString();
  document.getElementById('o-tax').textContent = Math.round(taxAmount).toLocaleString();
  document.getElementById('o-coupon-display').textContent = Math.round(couponAmount).toLocaleString();
  document.getElementById('o-points-display').textContent = Math.round(pointsAmount).toLocaleString();

  document.getElementById('o-pm-commission').textContent = Math.round(pmCommission).toLocaleString();

}

// ===== 存檔訂單（修正 oldOrder 未定義錯誤，全部改為 .maybeSingle()） =====
async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  const wid = document.getElementById('o-warehouse').value;
  const bankId = document.getElementById('o-bank').value;
  if(!cid) return showAlert('請選擇客戶！');
  if(!wid) return showAlert('請選擇出貨倉庫！');
  if(!bankId) return showAlert('請選擇入款銀行！');

  const items = [];
  let productSubtotal = 0;
  let totalCost = 0;
  const rows = document.querySelectorAll('#o-items .ord-item-row');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const hiddenInput = r.querySelector('.pu-prod-id');
    if (!hiddenInput || !hiddenInput.value) continue;
    const pid = hiddenInput.value;
    const q = parseInt(r.querySelector('.o-qty').value) || 0;
    const p = parseFloat(r.querySelector('.o-price').value) || 0;
    if(pid && q > 0) {
      const hasInvoiceCheck = r.querySelector('.o-has-invoice');
      const hasInvoice = hasInvoiceCheck ? hasInvoiceCheck.checked : false;
      items.push({product_id: pid, quantity: q, unit_price: p, has_invoice: hasInvoice});
      productSubtotal += p * q;
      const product = D.products.find(x => x.id === pid);
      const cost = product ? product.cost_price || 0 : 0;
      const finalCost = hasInvoice && product && product.type === 'finished' ? cost * 1.05 : cost;
      totalCost += finalCost * q;
    }
  }
  if(!items.length) return showAlert('請加入產品！');

  const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
  const shipPayer = document.getElementById('o-ship-payer').value;
  const finalShipping = shipPayer === 'customer' ? shippingFee : 0;
  const invType = document.getElementById('o-invoice-type').value;
  const taxAmount = invType === 'tax_plus' ? productSubtotal * 0.05 : 0;
  const couponAmount = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
  const pointsAmount = parseFloat(document.getElementById('o-points-amount').value) || 0;
  const totalDiscount = couponAmount + pointsAmount;

  let totalAmountRaw = productSubtotal + finalShipping + taxAmount - totalDiscount;
  if(totalAmountRaw < 0) totalAmountRaw = 0;
  const totalAmount = Math.round(totalAmountRaw);

  const chSelect = document.getElementById('o-channel');
  const chId = chSelect.value || null;
  const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
  const pmSelect = document.getElementById('o-payment');
  const pmId = pmSelect.value || null;
  const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;

  const chCommission = totalAmount * (chRate / 100);
  const pmCommission = totalAmount * (pmRate / 100);
  const companyShippingCost = shipPayer === 'company' ? shippingFee : 0;
  const grossProfit = totalAmount - totalCost - chCommission - pmCommission - companyShippingCost;
  const margin = totalAmount > 0 ? (grossProfit / totalAmount) * 100 : 0;
  const hasAdvance = document.getElementById('o-has-advance').checked;
  const advanceEmpId = hasAdvance ? (document.getElementById('o-advance-emp').value || null) : null;
  const advanceAmount = 0;
  const advanceStatus = 'pending';
  const advanceBankId = null;

  const isSubscriptionOrder = document.getElementById('o-is-subscription').checked;
  const subscriptionDays = parseInt(document.getElementById('o-subscription-days').value) || 30;

  let orderNo;
  if (editingId) {
    const old = D.orders.find(x => x.id === editingId);
    orderNo = old ? old.order_no : 'ORD-' + Date.now();
  } else {
    orderNo = 'ORD-' + Date.now();
  }

  const orderDate = new Date().toISOString();

  const data = {
    customer_id: cid,
    warehouse_id: wid,
    bank_account_id: bankId,
    total_amount: totalAmount,
    gross_profit_margin: margin,
    status: 'shipped',
    order_no: orderNo,
    invoice_type: invType,
    invoice_no: document.getElementById('o-invoice-no').value || null,
    invoice_title: document.getElementById('o-invoice-title').value || null,
    invoice_tax_id: document.getElementById('o-invoice-tax').value || null,
    shipping_fee: shippingFee,
    absorbed_shipping_fee: companyShippingCost,
    customer_paid_shipping: finalShipping,
    sales_channel_id: chId,
    payment_method_id: pmId,
    shipping_recv_name: document.getElementById('o-recv-name').value || null,
    shipping_recv_phone: document.getElementById('o-recv-phone').value || null,
    shipping_address: document.getElementById('o-recv-addr').value || null,
    shipping_advance_employee_id: advanceEmpId,
    is_subscription_order: isSubscriptionOrder,
    subscription_days: subscriptionDays,
    coupon_amount: couponAmount,
    points_amount: pointsAmount,
    shipping_advance_amount: advanceAmount,
    shipping_advance_reimbursed: advanceStatus === 'reimbursed',
    shipping_advance_bank_id: advanceBankId,
    shipping_advance_reimbursed_date: advanceStatus === 'reimbursed' ? new Date().toISOString().split('T')[0] : null,
    created_at: orderDate
  };

  try {
    let orderId = editingId;
    let oldOrder = null;

    if (editingId) {
      const oldOrderResp = await sb.from('orders').select('*').eq('id', editingId).maybeSingle();
      oldOrder = oldOrderResp.data;
      if (oldOrder) {
        if (oldOrder.bank_account_id && oldOrder.total_amount) {
          const oldBank = D.banks.find(b => b.id === oldOrder.bank_account_id);
          if (oldBank) {
            await sb.from('bank_accounts').update({ balance: (oldBank.balance || 0) - oldOrder.total_amount }).eq('id', oldOrder.bank_account_id);
          }
        }
        const oldItemsResp = await sb.from('order_items').select('*').eq('order_id', editingId);
        const oldItems = oldItemsResp.data || [];
        for (let item of oldItems) {
          const prod = D.products.find(p => p.id === item.product_id);
          if (!prod) continue;
          if (['finished','gift_box','outer_box'].includes(prod.type)) {
            const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', oldOrder.warehouse_id).eq('product_id', prod.id).maybeSingle();
            if (inv.data) {
              await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) + item.quantity }).eq('id', inv.data.id);
            } else {
              await sb.from('warehouse_inventory').insert([{ warehouse_id: oldOrder.warehouse_id, product_id: prod.id, quantity: item.quantity, safety_stock: 0 }]);
            }
          }
          const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
          for (let bom of bomItems) {
            const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
            if (matInv.data && matInv.data.length > 0) {
              let target = matInv.data.find(inv => inv.warehouse_id === oldOrder.warehouse_id);
              if (!target) target = matInv.data[0];
              await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) + (bom.quantity * item.quantity) }).eq('id', target.id);
            } else {
              await sb.from('warehouse_inventory').insert([{ warehouse_id: oldOrder.warehouse_id, product_id: bom.child_product_id, quantity: bom.quantity * item.quantity, safety_stock: 0 }]);
            }
          }
        }
        await sb.from('order_items').delete().eq('order_id', editingId);
        await sb.from('expenses').delete().eq('related_order_id', editingId);
      }
      await sb.from('orders').update(data).eq('id', editingId);
    } else {
      const insertResult = await sb.from('orders').insert([data]).select().single();
      if (insertResult.error) {
        console.error('訂單插入錯誤：', insertResult.error);
        return showAlert('訂單插入失敗：' + insertResult.error.message);
      }
      orderId = insertResult.data.id;
      editingId = orderId;
    }

    if (items.length > 0) {
        try {
            const itemsWithOrderId = items.map(i => Object.assign({}, i, { order_id: orderId }));
            const itemResult = await sb.from('order_items').insert(itemsWithOrderId);
            if (itemResult.error) throw itemResult.error;
        } catch (itemError) {
            if (itemError.code === 'PGRST204' && itemError.message.includes('has_invoice')) {
                console.warn('⚠️ order_items 缺少 has_invoice 欄位，正在重新嘗試插入（不包含 has_invoice）...');
                const itemsWithoutInvoice = items.map(i => {
                    const { has_invoice, ...rest } = i;
                    return { ...rest, order_id: orderId };
                });
                const retryResult = await sb.from('order_items').insert(itemsWithoutInvoice);
                if (retryResult.error) throw retryResult.error;
                showAlert('⚠️ 偵測到 order_items 缺少 has_invoice 欄位，已暫停該功能。\n建議執行：ALTER TABLE order_items ADD COLUMN has_invoice BOOLEAN DEFAULT FALSE;');
            } else {
                throw itemError;
            }
        }
    }

    const targetBank = D.banks.find(b => b.id === bankId);
    if (targetBank) {
      await sb.from('bank_accounts').update({ balance: (targetBank.balance || 0) + totalAmount }).eq('id', bankId);
    }

    for (let item of items) {
      const prod = D.products.find(p => p.id === item.product_id);
      if (!prod) continue;
      if (['finished','gift_box','outer_box'].includes(prod.type)) {
        const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', wid).eq('product_id', prod.id).maybeSingle();
        if (inv.data) {
          await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) - item.quantity }).eq('id', inv.data.id);
        } else {
          await sb.from('warehouse_inventory').insert([{ warehouse_id: wid, product_id: prod.id, quantity: -item.quantity, safety_stock: 0 }]);
        }
      }
      const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
      for (let bom of bomItems) {
        const required = bom.quantity * item.quantity;
        const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
        if (matInv.data && matInv.data.length > 0) {
          let target = matInv.data.find(inv => inv.warehouse_id === wid);
          if (!target) target = matInv.data[0];
          await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) - required }).eq('id', target.id);
        } else {
          await sb.from('warehouse_inventory').insert([{ warehouse_id: wid, product_id: bom.child_product_id, quantity: -required, safety_stock: 0 }]);
        }
      }
    }

    if (hasAdvance && advanceEmpId && advanceAmount > 0) {
      await sb.from('expenses').insert([{
        category_id: (D.expCats.find(c => c.name === '運費') || {}).id,
        amount: advanceAmount,
        description: '訂單 ' + orderNo + ' 運費代墊',
        payment_date: new Date().toISOString().split('T')[0],
        employee_id: advanceEmpId,
        is_reimbursed: advanceStatus === 'reimbursed',
        reimbursement_bank_id: advanceBankId,
        reimbursed_date: advanceStatus === 'reimbursed' ? new Date().toISOString().split('T')[0] : null,
        related_order_id: orderId
      }]);
    }

    showAlert('出貨單已儲存！');
    window.closeModal();
    await loadAll();
    
    if (currentView === 'orders') {
        renderOrders(document.getElementById('main-content'));
    } else {
        render();
    }
  } catch(e) {
    console.error('saveOrd 錯誤：', e);
    showAlert('儲存失敗：' + (e.message || '未知錯誤'));
  }
}

// ===== 刪除訂單（修正 oldOrder 未定義） =====
async function delOrd(id) {
  if(!confirm('確定刪除？')) return;
  try {
    const orderResp = await sb.from('orders').select('*').eq('id', id).maybeSingle();
    const o = orderResp.data;
    if(!o) return showAlert('找不到訂單！');

    if(o.bank_account_id && o.total_amount) {
      const bank = D.banks.find(b => b.id === o.bank_account_id);
      if(bank) {
        await sb.from('bank_accounts').update({ balance: (bank.balance || 0) - o.total_amount }).eq('id', o.bank_account_id);
      }
    }

    const itemsResp = await sb.from('order_items').select('*').eq('order_id', id);
    const items = itemsResp.data || [];
    for (let item of items) {
      const prod = D.products.find(p => p.id === item.product_id);
      if (!prod) continue;
      if (['finished','gift_box','outer_box'].includes(prod.type)) {
        const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', o.warehouse_id).eq('product_id', prod.id).maybeSingle();
        if (inv.data) {
          await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) + item.quantity }).eq('id', inv.data.id);
        } else {
          await sb.from('warehouse_inventory').insert([{ warehouse_id: o.warehouse_id, product_id: prod.id, quantity: item.quantity, safety_stock: 0 }]);
        }
      }
      const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
      for (let bom of bomItems) {
        const restoreQty = bom.quantity * item.quantity;
        const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
        if (matInv.data && matInv.data.length > 0) {
          let target = matInv.data.find(inv => inv.warehouse_id === o.warehouse_id);
          if (!target) target = matInv.data[0];
          await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) + restoreQty }).eq('id', target.id);
        } else {
          await sb.from('warehouse_inventory').insert([{ warehouse_id: o.warehouse_id, product_id: bom.child_product_id, quantity: restoreQty, safety_stock: 0 }]);
        }
      }
    }

    await sb.from('expenses').delete().eq('related_order_id', id);
    await sb.from('order_items').delete().eq('order_id', id);
    await sb.from('orders').delete().eq('id', id);

    showAlert('訂單已刪除！');
    await loadAll();
    render();
  } catch(e) {
    showAlert('刪除失敗：' + e.message);
    console.error('delOrd error:', e);
  }
}

async function openProdModal(id) {
  editingId = id || null;
  const p = id ? D.products.find(function(x) { return x.id === id; }) : null;

  if(id && p && p.initial_stock > 0) {

async function saveProd() {

  const d = {
    sku: document.getElementById('p-sku').value,

  showWhTab('all');
}

function sortInvTable(field) {
  if(invSortField === field) invSortAsc = !invSortAsc;
  else { invSortField = field; invSortAsc = true; }
  const activeTab = document.querySelector('.wh-tab.bg-blue-600');
  const whId = activeTab ? activeTab.dataset.wh : 'all';
  showWhTab(whId);
}

function showWhTab(whId) {
  const tabs = document.querySelectorAll('.wh-tab');
  for(let i=0; i<tabs.length; i++) {
    const t = tabs[i];
    t.className = t.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-700');
    if(t.dataset.wh === whId) t.className = t.className.replace('bg-gray-200 text-gray-700', 'bg-blue-600 text-white');
  }
  const container = document.getElementById('inv-content');
  const searchKw = (document.getElementById('inv-search')?.value || '').toLowerCase();

  let productList = D.products.slice();
  if(searchKw) {
    productList = productList.filter(function(p) {
      return p.name.toLowerCase().indexOf(searchKw) !== -1 ||
             (p.sku || '').toLowerCase().indexOf(searchKw) !== -1;
    });
  }

  productList.sort(function(a, b) {
    let aVal = a[invSortField] || '';
    let bVal = b[invSortField] || '';
    if(typeof aVal === 'string') aVal = aVal.toLowerCase();
    if(typeof bVal === 'string') bVal = bVal.toLowerCase();
    if(aVal < bVal) return invSortAsc ? -1 : 1;
    if(aVal > bVal) return invSortAsc ? 1 : -1;
    return 0;
  });

  let rows = '';
  if(whId === 'all') {
    for(let i=0; i<productList.length; i++) {
      const p = productList[i];
      let totalQty = 0;
      const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
      for(let j=0; j<invs.length; j++) { totalQty += invs[j].quantity || 0; }

      const initialStock = p.initial_stock || 0;
      const variance = initialStock > 0 ? ((totalQty - initialStock) / initialStock * 100) : 0;
      const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
      const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';

      rows += '<tr class="border-b hover:bg-gray-50">' +
        '<td class="px-4 py-3 text-center">' + p.name + '</td>' +
        '<td class="px-4 py-3 text-center">' + (p.sku || '-') + '</td>' +
        '<td class="px-4 py-3 text-center font-bold text-lg">' + totalQty + '</td>' +
        '<td class="px-4 py-3 text-center">' + initialStock + '</td>' +
        '<td class="px-4 py-3 text-center ' + varianceClass + ' font-bold">' + varianceText + '</td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'name\')">產品 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'sku\')">SKU <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'quantity\')">目前庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'initial_stock\')">初始庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs">誤差率</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  } else {
    const wh = D.warehouses.find(function(w) { return w.id === whId; });
    const inv = D.warehouseInv.filter(function(i) { return i.warehouse_id === whId; });
    for(let i=0; i<productList.length; i++) {
      const p = productList[i];
      const wInv = inv.find(function(x) { return x.product_id === p.id; });
      const qty = wInv ? wInv.quantity : 0;

      const initialStock = p.initial_stock || 0;
      const variance = initialStock > 0 ? ((qty - initialStock) / initialStock * 100) : 0;
      const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
      const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';

      rows += '<tr class="border-b hover:bg-gray-50">' +
        '<td class="px-4 py-3 text-center">' + p.name + '</td>' +
        '<td class="px-4 py-3 text-center font-bold">' + qty + '</td>' +
        '<td class="px-4 py-3 text-center">' + initialStock + '</td>' +
        '<td class="px-4 py-3 text-center ' + varianceClass + ' font-bold">' + varianceText + '</td>' +
        '<td class="px-4 py-3 text-center"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded text-center" value="' + qty + '"><button onclick="saveInvItem(this, \'' + p.id + '\', \'' + whId + '\')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs btn-touch">儲存</button></td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold text-center">' + (wh ? wh.name : '') + ' - 庫存明細</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'name\')">產品 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'quantity\')">目前庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'initial_stock\')">初始庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs">誤差率</th><th class="px-4 py-3 text-center text-xs">盤點調整</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
}

function saveInvItem(btn, pid, wid) {

  const searchText = (document.getElementById('pur-search')?.value || '').toLowerCase();
  const startDate = document.getElementById('pur-start-date')?.value || '';
  const endDate = document.getElementById('pur-end-date')?.value || '';

  let list = D.purchases.map(function(p) {
    const vendor = D.vendors.find(v => v.id === p.vendor_id);
    return Object.assign({}, p, { vendor_name: vendor ? vendor.name : '' });
  }).filter(function(p) {
    const purchaseDate = p.created_at ? p.created_at.split('T')[0] : '';
    const matchSearch = !searchText || p.vendor_name.toLowerCase().includes(searchText);
    const matchStartDate = !startDate || purchaseDate >= startDate;
    const matchEndDate = !endDate || purchaseDate <= endDate;
    return matchSearch && matchStartDate && matchEndDate;
  });

  list.sort(function(a, b) {
    let aVal = a[purSortField] || '';
    let bVal = b[purSortField] || '';
    if(purSortField === 'created_at') {
      aVal = new Date(aVal);
      bVal = new Date(bVal);
    } else if(purSortField === 'vendor_name') {
      aVal = aVal.toLowerCase();
      bVal = bVal.toLowerCase();
    }
    if(aVal < bVal) return purSortAsc ? -1 : 1;
    if(aVal > bVal) return purSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const p = list[i];
    const v = D.vendors.find(function(x) { return x.id === p.vendor_id; });
    const typeLabel = p.is_invoice_purchase ?
      '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">購買發票</span>' :
      '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">一般採購</span>';
    const invoiceLabel = p.is_invoice_purchase ? '<span class="text-green-600 font-bold">有</span>' : '<span class="text-gray-400">無</span>';

    const items = p.items || [];
    const itemsText = items.map(function(item) {
      const prod = D.products.find(x => x.id === item.product_id);
      return (prod?.name || '?') + ' x' + item.quantity;
    }).join(', ');

    let amountDisplay = p.total_amount || 0;
    let amountHtml = '<span class="font-bold">' + amountDisplay.toLocaleString() + '</span>';
    if (p.is_invoice_purchase) {
      amountHtml = '<span class="font-bold text-orange-600">' + amountDisplay.toLocaleString() + '</span>';
    }

    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + (p.created_at ? new Date(p.created_at).toLocaleDateString() : '-') + '</td><td class="px-4 py-3">' + (v?.name || '-') + '</td><td class="px-4 py-3">' + typeLabel + '</td><td class="px-4 py-3">' + invoiceLabel + '</td><td class="px-4 py-3 text-sm text-gray-600">' + (itemsText || '-') + '</td><td class="px-4 py-3">' + amountHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewPurchaseDetail(\'' + p.id + '\')" class="text-blue-600 hover:text-blue-800 btn-touch">詳情</button><button onclick="openPurModal(' + (p.is_invoice_purchase ? 'true' : 'false') + ', \'' + p.id + '\')" class="text-green-600 hover:text-green-800 btn-touch">編輯</button><button onclick="delPur(\'' + p.id + '\')" class="text-red-600 hover:text-red-800 btn-touch">刪除</button></td></tr>';
  }

  const tbody = document.getElementById('pur-tbody');
  if(tbody) tbody.innerHTML = html;
}

function clearPurFilters() {
  const searchInput = document.getElementById('pur-search');
  const startDateInput = document.getElementById('pur-start-date');
  const endDateInput = document.getElementById('pur-end-date');
  if(searchInput) searchInput.value = '';
  if(startDateInput) startDateInput.value = '';
  if(endDateInput) endDateInput.value = '';
  purSortField = 'created_at';
  purSortAsc = false;
  renderPurTable();
}

  sb.from('purchase_items').select('*').eq('purchase_id', id).then(function(res) {
    const items = res.data || [];
    let itemsHTML = '<div class="space-y-2">';

    else {
      items.forEach(function(item) {
        const product = D.products.find(x => x.id === item.product_id);
        itemsHTML += '<div class="border-b pb-2">' +
          '<div class="grid grid-cols-3 gap-2 text-sm">' +

      '<div><span class="text-gray-600">廠商：</span>' + (vendor ? vendor.name : '-') + '</div>' +
      '<div><span class="text-gray-600">類型：</span>' + (isInvoice ? '購買發票' : '一般採購') + '</div>' +

      '</div>' +
      '</div>';
    openModal('採購詳情', html, null, true);
  }).catch(function(e) { showAlert('載入明細失敗：' + e.message); });
}

    const v = D.vendors[i];

  }
  let whOptions = '';

  for(let i=0; i<activeWh.length; i++) {
    const w = activeWh[i];
    whOptions += '<option value="' + w.id + '" ' + (existingData && existingData.warehouse_id === w.id ? 'selected' : '') + '>' + w.name + '</option>';
