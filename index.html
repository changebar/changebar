// Excel 下載功能
function downloadExcel(filename, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(sheet => {
    const ws = XLSX.utils.json_to_sheet(sheet.data);
    XLSX.utils.book_append_sheet(wb, ws, sheet.name);
  });
  XLSX.writeFile(wb, filename);
}

function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      document.getElementById('alert-ok-btn').removeEventListener('click', handler);
      r(); 
    };
    document.getElementById('alert-ok-btn').addEventListener('click', handler);
    const keyHandler = (e) => {
      if (e.key === 'Enter') { handler(); document.removeEventListener('keydown', keyHandler); }
    };
    document.addEventListener('keydown', keyHandler);
  });
}

function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { await onSave(); } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  const closeModal = () => {
    document.getElementById('modal-overlay').classList.add('hidden');
    editingId = null;
    isSaving = false;
    if(saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '儲存 (Enter)'; }
  };
  
  cancelBtn.onclick = closeModal;
  closeBtn.onclick = closeModal;
  
  const escHandler = (e) => {
    if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escHandler); }
  };
  document.addEventListener('keydown', escHandler);
  
  if(!hideSave) {
    const enterHandler = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('input')) {
        e.preventDefault();
        saveBtn.click();
        document.removeEventListener('keydown', enterHandler);
      }
    };
    document.addEventListener('keydown', enterHandler);
  }
}

function closeModal() { 
  document.getElementById('modal-overlay').classList.add('hidden'); 
  editingId = null; 
  isSaving = false;
}

document.getElementById('login-btn').addEventListener('click', () => {

async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    locs:'warehouse_locations', expCats:'expense_categories', 
    orders:'orders', purchases:'purchases', warehouseInv:'warehouse_inventory'
  };
  await Promise.all(Object.keys(map).map(k => sb.from(map[k]).select('*').then(r => D[k] = r.data || [])));
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}
  // ==================== 老闆查閱（含訂閱提醒+Excel下載）====================

  const rev = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,o)=>s+(o.total_amount||0),0);
  const pur = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,p)=>s+(p.total_amount||0),0);
  const exp = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,e)=>s+(e.amount||0),0);
  const sub = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);

  const profitMargin = rev > 0 ? ((monthlyProfit / rev) * 100).toFixed(1) : 0;
  
  // 即將到期的訂閱（30天內）
  const now = new Date();
  const thirtyDaysLater = new Date(now.getTime() + 30*24*60*60*1000);
  const expiringSubs = D.subs.filter(s => {
    if(!s.end_date || s.is_active===false) return false;
    const d = new Date(s.end_date);

  c.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">👑 老闆查閱</h1>
      <div class="flex gap-2">
        <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow">
        <button onclick="openDownloadModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-bold">📥 下載報表</button>

    ${expiringSubs.length > 0 ? `

      <ul class="list-disc list-inside text-yellow-700">
        ${expiringSubs.map(s => {
          const daysLeft = Math.ceil((new Date(s.end_date) - now) / (1000*60*60*24));
          return `<li><b>${s.name}</b> - ${s.provider || '-'} (剩餘 ${daysLeft} 天，到期：${s.end_date}, 金額：$${(s.amount||0).toLocaleString()})</li>`;
        }).join('')}
      </ul>
    </div>
    ` : '<div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg shadow mb-8"><p class="text-green-800 font-bold">✅ 目前無即將到期的訂閱</p></div>'}
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月業績</p>
        <p class="text-3xl font-bold mt-2">$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">訂單數：${D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 單</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月採購</p>
        <p class="text-3xl font-bold mt-2">$${pur.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">採購單：${D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 單</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月開銷(含訂閱)</p>
        <p class="text-3xl font-bold mt-2">$${(exp+sub).toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">費用筆數：${D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 筆</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月淨利</p>
        <p class="text-3xl font-bold mt-2">$${monthlyProfit.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">利潤率：${profitMargin}%</p>

    <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
      <h3 class="text-lg font-bold mb-4 text-gray-800">🏦 公司總資金狀態</h3>
      <p class="text-4xl font-bold text-orange-600 mb-6">現金總額：$${totalCash.toLocaleString()}</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${D.banks.map(b=>`<div class="p-4 bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg border"><p class="font-bold text-lg">${b.account_name}</p><p class="text-gray-500 text-sm">${b.bank_name} - ${b.account_number}</p><p class="text-2xl font-bold text-green-600 mt-2">$${(b.balance||0).toLocaleString()}</p></div>`).join('')}

  `;

window.openDownloadModal = function() {

      <select id="dl-type" class="w-full px-3 py-2 border rounded">

        <option value="finance">收支與訂閱明細</option>
        <option value="profit">業績/利潤/採購/毛利率</option>
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">開始日期</label><input type="date" id="dl-start" class="w-full px-3 py-2 border rounded" value="${bossMonth}-01"></div>
      <div><label class="block text-sm font-bold mb-1">結束日期</label><input type="date" id="dl-end" class="w-full px-3 py-2 border rounded" value="${bossMonth}-${new Date(new Date(bossMonth+'-01').getFullYear(), new Date(bossMonth+'-01').getMonth()+1, 0).getDate()}"></div>
    </div>
  `;
  openModal('下載 Excel 報表', html, downloadReport);
};

async function downloadReport() {
  const type = document.getElementById('dl-type').value;
  const start = document.getElementById('dl-start').value;
  const end = document.getElementById('dl-end').value;
  
  if(!start || !end) return showAlert('請選擇日期範圍！');
  
  const startDate = new Date(start);
  const endDate = new Date(end);
  endDate.setHours(23, 59, 59, 999);
  
  let sheets = [];
  const filename = `養芯健康_${type}_${start}_${end}.xlsx`;
  
  if(type === 'orders') {
    const orders = D.orders.filter(o => {
      const d = new Date(o.created_at);
      return d >= startDate && d <= endDate;
    });
    const data = orders.map(o => {
      const c = D.customers.find(x=>x.id===o.customer_id);
      const ch = D.channels.find(x=>x.id===o.sales_channel_id);
      const pm = D.payments.find(x=>x.id===o.payment_method_id);
      const b = D.banks.find(x=>x.id===o.bank_account_id);
      return {
        '訂單編號': o.order_no,
        '日期': new Date(o.created_at).toLocaleDateString('zh-TW'),
        '客戶': c?.company_name || c?.contact_person || '-',
        '總金額': o.total_amount,
        '發票號碼': o.invoice_no || '-',
        '發票類型': o.tax_handling === 'no' ? '沒發票' : o.tax_handling === 'has' ? '有發票' : '稅外加',
        '稅金': o.tax_amount,
        '運費': o.shipping_fee,
        '銷售通路': ch?.name || '-',
        '通路抽成': o.channel_commission,
        '付款方式': pm?.name || '-',
        '付款手續費': o.payment_commission,
        '入帳帳戶': b?.account_name || '-',
        '狀態': o.status
      };
    });
    sheets.push({name: '訂單明細', data});
  }
  else if(type === 'purchases') {
    const purchases = D.purchases.filter(p => {
      const d = new Date(p.created_at);
      return d >= startDate && d <= endDate;
    });
    const data = purchases.map(p => {
      const v = D.vendors.find(x=>x.id===p.vendor_id);
      const w = D.warehouses.find(x=>x.id===p.warehouse_id);
      return {
        '採購單號': p.purchase_no,
        '日期': new Date(p.created_at).toLocaleDateString('zh-TW'),
        '廠商': v?.name || '-',
        '總金額': p.total_amount,
        '發票號碼': p.invoice_no || '-',
        '發票金額': p.invoice_amount,
        '是否購買發票': p.is_invoice_purchase ? '是' : '否',
        '有無發票': p.has_invoice ? '有' : '無',
        '入庫倉庫': w?.name || '-',
        '出帳帳戶': D.banks.find(b=>b.id===p.bank_account_id)?.account_name || '-'
      };
    });
    sheets.push({name: '採購明細', data});
  }
  else if(type === 'customers') {
    const data = D.customers.map(c => ({
      '類型': c.type,
      '公司名稱': c.company_name || '-',
      '聯絡人': c.contact_person,
      '電話': c.phone,
      'Email': c.email || '-',
      '統一編號': c.tax_id || '-',
      '發票抬頭': c.invoice_title || '-',
      '聯絡窗口': D.windows.find(w=>w.id===c.primary_contact_window_id)?.name || c.contact_window_name || '-'
    }));
    sheets.push({name: '客戶名單', data});
  }
  else if(type === 'finance') {
    const expenses = D.expenses.filter(e => {
      if(!e.payment_date) return false;
      const d = new Date(e.payment_date);
      return d >= startDate && d <= endDate;
    });
    const expData = expenses.map(e => {
      const cat = D.expCats.find(c=>c.id===e.category_id);
      return {
        '日期': e.payment_date,
        '類別': cat?.name || '-',
        '金額': e.amount,
        '描述': e.description || '-'
      };
    });
    sheets.push({name: '收支明細', data: expData});
    
    const subData = D.subs.map(s => ({
      '名稱': s.name,
      '供應商': s.provider || '-',
      '開始日期': s.start_date || '-',
      '結束日期': s.end_date || '-',
      '金額': s.amount,
      '狀態': s.is_active !== false ? '有效' : '已停用'
    }));
    sheets.push({name: '訂閱明細', data: subData});
  }
  else if(type === 'profit') {
    const orders = D.orders.filter(o => {
      const d = new Date(o.created_at);
      return d >= startDate && d <= endDate;
    });
    const purchases = D.purchases.filter(p => {
      const d = new Date(p.created_at);
      return d >= startDate && d <= endDate;
    });
    const expenses = D.expenses.filter(e => {
      if(!e.payment_date) return false;
      const d = new Date(e.payment_date);
      return d >= startDate && d <= endDate;
    });
    const subs = D.subs.filter(s => {
      if(!s.start_date) return false;
      const d = new Date(s.start_date);
      return d >= startDate && d <= endDate;
    });
    
    const totalRev = orders.reduce((s,o)=>s+(o.total_amount||0),0);
    const totalPur = purchases.reduce((s,p)=>s+(p.total_amount||0),0);
    const totalExp = expenses.reduce((s,e)=>s+(e.amount||0),0);
    const totalSub = subs.reduce((s,x)=>s+(x.amount||0),0);
    const profit = totalRev - totalPur - totalExp - totalSub;
    const margin = totalRev > 0 ? ((profit/totalRev)*100).toFixed(2) : 0;
    
    const summary = [{
      '期間': `${start} ~ ${end}`,
      '總業績': totalRev,
      '總採購金額': totalPur,
      '總開銷': totalExp + totalSub,
      '淨利': profit,
      '毛利率(%)': margin
    }];
    sheets.push({name: '利潤分析', data: summary});
  }
  
  downloadExcel(filename, sheets);
  showAlert('報表已下載！');
  closeModal();
}

window.calcOrd = function() {
  let sub = 0;
  let totalCost = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.o-price').value)||0;
    const qty = parseInt(r.querySelector('.o-qty').value)||0;
    const prodId = r.querySelector('.o-prod').value;
    const prod = D.products.find(p=>p.id===prodId);
    sub += price * qty;
    if(prod) totalCost += (prod.cost_price||0) * qty;
  });
  document.getElementById('o-subtotal').textContent = sub.toLocaleString();
  
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  
  let tax = 0;
  let invInfo = '';
  if(invType==='tax') {
    tax = Math.round(sub * 0.05);
    invInfo = `稅外加：商品 $${sub.toLocaleString()} + 5% 稅金 $${tax.toLocaleString()} = 客人需付 $${(sub+tax).toLocaleString()}`;
    document.getElementById('o-tax-row').style.display = 'block';
  } else if(invType==='has') {
    tax = 0;
    invInfo = `有發票：訂單價格即為含稅價 $${sub.toLocaleString()}`;
    document.getElementById('o-tax-row').style.display = 'block';
  } else {
    document.getElementById('o-tax-row').style.display = 'none';
  }
  document.getElementById('o-tax').textContent = tax.toLocaleString();
  document.getElementById('o-inv-info').textContent = invInfo;
  
  const shipDisplay = shipType==='pay' ? ship : 0;
  document.getElementById('o-ship-display').textContent = shipDisplay.toLocaleString();
  document.getElementById('o-ship-row').style.display = ship > 0 ? 'block' : 'none';
  
  // 計算抽成和手續費
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);
  const channelCommission = sub * (channelRate / 100);
  const paymentCommission = sub * (paymentRate / 100);
  const totalCommission = channelCommission + paymentCommission;
  document.getElementById('o-commission').textContent = totalCommission.toLocaleString();
  document.getElementById('o-commission-row').style.display = totalCommission > 0 ? 'block' : 'none';
  
  const total = sub + tax + shipDisplay;
  document.getElementById('o-total').textContent = total.toLocaleString();
  
  // 計算淨利和毛利率
  const profit = total - totalCost - ship - totalCommission;
  const margin = total > 0 ? ((profit/total)*100).toFixed(1) : 0;
  document.getElementById('o-profit').textContent = profit.toLocaleString();
  document.getElementById('o-margin').textContent = margin;
};

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  if(!cid) return showAlert('請選擇客戶！');
  const items = []; let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value)||0;
    const p = parseFloat(r.querySelector('.o-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); sub+=p*q; }
  });
  if(!items.length) return showAlert('請加入產品！');
  
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0; 
  if(invType==='tax') tax = Math.round(sub*0.05);
  
  const shipCharge = shipType==='pay'?ship:0;
  const total = sub + tax + shipCharge;
  
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);

  const data = {
    customer_id:cid, total_amount:total, status:'shipped', order_no:'ORD-'+Date.now(),
    invoice_title:document.getElementById('o-inv-title').value||null, invoice_tax_id:document.getElementById('o-inv-tax').value||null,
    invoice_type:document.getElementById('o-inv-fmt').value, invoice_no:document.getElementById('o-inv-no').value||null,
    tax_handling:invType, tax_amount:tax, shipping_fee:ship, absorbed_shipping_fee:shipType==='free'?ship:0,
    bank_account_id:document.getElementById('o-bank').value||null,
    sales_channel_id:document.getElementById('o-channel').value||null,
    payment_method_id:document.getElementById('o-payment').value||null,
    channel_commission:sub*(channelRate/100),
    payment_commission:sub*(paymentRate/100),
    shipping_address_detail:JSON.stringify({recv:document.getElementById('o-recv').value, phone:document.getElementById('o-phone').value, addr:document.getElementById('o-addr').value})
  };

  try {
    if(editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const r = await sb.from('orders').insert([data]).select().single();
      editingId = r.data.id;
    }
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:editingId})));
    
    showAlert('出貨單已儲存！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

};

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value, company_name: document.getElementById('c-comp').value||null,
    tax_id: document.getElementById('c-tax').value||null, invoice_title: document.getElementById('c-title').value||null,
    contact_person: document.getElementById('c-contact').value, phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null, email: document.getElementById('c-email').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  try {
    let cid = id;
    if(id) await sb.from('customers').update(data).eq('id',id);
    else { const r = await sb.from('customers').insert([data]).select().single(); cid = r.data.id; }
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr')?.value||'', cvs_store_name:d.querySelector('.a-cvsname')?.value||'', store_name:d.querySelector('.a-cvsname')?.value||'', cvs_store_address:d.querySelector('.a-cvsaddr')?.value||'', is_default:d.querySelector('.a-def').checked });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    showAlert('客戶已儲存！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

window.showWhTab = function(whId) {
  document.querySelectorAll('.wh-tab').forEach(t => { t.className = t.className.replace('bg-blue-600 text-white','bg-gray-200 text-gray-700'); if(t.dataset.wh===whId) t.className = t.className.replace('bg-gray-200 text-gray-700','bg-blue-600 text-white'); });
  const wh = D.warehouses.find(w=>w.id===whId);
  const inv = D.warehouseInv.filter(i=>i.warehouse_id===whId);
  const container = document.getElementById('inv-content');
  
  let rows = D.products.map(p => {
    const wInv = inv.find(i=>i.product_id===p.id);
    const qty = wInv?.quantity || 0;
    const safe = wInv?.safety_stock || 0;
    const low = qty < safe && safe > 0;
    return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold">${qty}</td><td class="px-4 py-3"><input type="number" class="inv-safe w-20 px-2 py-1 border rounded" value="${safe}" data-pid="${p.id}" data-wid="${whId}"></td><td class="px-4 py-3">${low?'<span class="text-red-600 font-bold">低庫存</span>':qty>0?'<span class="text-green-600">正常</span>':'<span class="text-gray-400">無庫存</span>'}</td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="${qty}" data-pid="${p.id}" data-wid="${whId}"><button onclick="saveInvItem(this)" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs">儲存</button></td></tr>`;
  }).join('');

window.saveInvItem = async function(btn) {
  const tr = btn.closest('tr');
  const pid = tr.querySelector('.inv-qty').dataset.pid;
  const wid = tr.querySelector('.inv-qty').dataset.wid;
  const qty = parseInt(tr.querySelector('.inv-qty').value)||0;
  const safe = parseInt(tr.querySelector('.inv-safe').value)||0;
  
  const existing = D.warehouseInv.find(i=>i.warehouse_id===wid && i.product_id===pid);
  try {
    if(existing) {
      await sb.from('warehouse_inventory').update({quantity:qty, safety_stock:safe}).eq('id', existing.id);
    } else {
      await sb.from('warehouse_inventory').insert([{warehouse_id:wid, product_id:pid, quantity:qty, safety_stock:safe}]);
    }
    await loadAll();
    showWhTab(wid);
    showAlert('庫存已更新！');

};

window.calcPur = function() {
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    subtotal += (parseFloat(r.querySelector('.pu-price').value)||0) * (parseInt(r.querySelector('.pu-qty').value)||0);
  });
  const tax = Math.round(subtotal * 0.05);
  const total = subtotal + tax;
  document.getElementById('pu-subtotal').textContent = subtotal.toLocaleString();
  document.getElementById('pu-tax').textContent = tax.toLocaleString();
  document.getElementById('pu-total').textContent = total.toLocaleString();
};

async function savePur() {
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const hasInvoice = document.getElementById('pu-has-inv').checked;
  const items = []; let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value)||0;
    const p = parseFloat(r.querySelector('.pu-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); subtotal+=p*q; }
  });
  if(!items.length) return showAlert('請加入採購商品！');

  const tax = Math.round(subtotal * 0.05);
  const total = subtotal + tax;
  const bankId = document.getElementById('pu-bank').value;
  const whId = document.getElementById('pu-wh').value;
  
  const d = {
    vendor_id:vendorId, total_amount:subtotal, status:'completed', purchase_no:'PUR-'+Date.now(),
    invoice_no:document.getElementById('pu-inv-no').value||null,
    invoice_amount:total,
    is_invoice_purchase:isInvoiceMode,
    has_invoice:hasInvoice,
    warehouse_id:whId||null,
    bank_account_id:bankId||null
  };
  
  try {
    const r = await sb.from('purchases').insert([d]).select().single();
    const purId = r.data.id;
    await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:purId})));

    // 自動入庫到指定倉庫
    if(whId) {
      for(const i of items) {
        const existing = D.warehouseInv.find(w=>w.warehouse_id===whId && w.product_id===i.product_id);
        if(existing) {
          await sb.from('warehouse_inventory').update({quantity: (existing.quantity||0) + i.quantity}).eq('id', existing.id);
        } else {
          await sb.from('warehouse_inventory').insert([{warehouse_id:whId, product_id:i.product_id, quantity:i.quantity, safety_stock:0}]);
        }
        // 同時更新產品總庫存
        const p = D.products.find(x=>x.id===i.product_id);
        if(p) await sb.from('products').update({current_stock: (p.current_stock||0) + i.quantity}).eq('id', i.product_id);
      }
    }
    
    // 自動扣款
    if(bankId) {
      const b = D.banks.find(x=>x.id===bankId);
      if(b) await sb.from('bank_accounts').update({balance: (b.balance||0) - total}).eq('id', bankId);
    }
    
    showAlert(isInvoiceMode?'購買發票已記錄！':'採購已入庫！'); closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

function renderFinance(c) {

    </div>
    <div class="flex gap-4 mb-4">
      <input type="month" id="exp-month" value="${bossMonth}" onchange="renderExpTable()" class="px-4 py-2 border rounded">
      <input type="text" id="exp-search" placeholder="🔍 搜尋..." class="flex-1 px-4 py-2 border rounded" oninput="renderExpTable()">
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden mb-8"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">日期</th><th class="px-4 py-3 text-left text-xs">類別</th><th class="px-4 py-3 text-left text-xs">金額</th><th class="px-4 py-3 text-left text-xs">描述</th><th class="px-4 py-3 text-left text-xs">操作</th></tr></thead><tbody id="exp-tbody"></tbody></table></div>
    
    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">系統訂閱 (定期費用)</h2><button onclick="openSubModal()" class="bg-cyan-600 text-white px-4 py-2 rounded">+ 新增訂閱</button></div>

  `;
  renderExpTable();
  document.getElementById('sub-tbody').innerHTML = D.subs.map(s=>`<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${s.name}</td><td class="px-4 py-3">${s.provider||'-'}</td><td class="px-4 py-3">${s.end_date||'-'}</td><td class="px-4 py-3">$${(s.amount||0).toLocaleString()}</td><td class="px-4 py-3"><button onclick="openSubModal('${s.id}')" class="text-green-600 text-sm mr-2">編輯</button><button onclick="delSub('${s.id}')" class="text-red-600 text-sm">刪除</button></td></tr>`).join('');
}

function renderExpTable() {
  const [y,m] = (document.getElementById('exp-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('exp-search')?.value||'').toLowerCase();
  const list = D.expenses.filter(e => {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const cat = D.expCats.find(c=>c.id===e.category_id);
    return d.getFullYear()===y && d.getMonth()+1===m && (!kw || (cat?.name||'').toLowerCase().includes(kw) || (e.description||'').toLowerCase().includes(kw));
  }).sort((a,b)=>new Date(b.payment_date)-new Date(a.payment_date));
  document.getElementById('exp-tbody').innerHTML = list.map(e=>{const cat=D.expCats.find(c=>c.id===e.category_id);return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3">${e.payment_date}</td><td class="px-4 py-3">${cat?.name||'-'}</td><td class="px-4 py-3 font-bold text-red-600">$${(e.amount||0).toLocaleString()}</td><td class="px-4 py-3">${e.description||'-'}</td><td class="px-4 py-3"><button onclick="delExp('${e.id}')" class="text-red-600 text-sm">刪除</button></td></tr>`;}).join('');
}
