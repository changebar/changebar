<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

      <button id="modal-close-btn" class="text-3xl text-gray-500 hover:text-gray-800 transition-colors w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-200">&times;</button>

    <div class="p-4 md:p-6 overflow-y-auto flex-1" id="modal-content"></div>

      </div>
      <p id="alert-message" class="text-xl font-semibold text-gray-800 mb-2">訊息</p>
    </div>

</div>

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { 
  products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], 
  vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], 
  emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[]
};
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let isSaving = false;

const COLOR_NAMES = {
  '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色',
  '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色'
};

// 手機版側邊欄切換
window.toggleSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('hidden');
};

// 顯示 Alert
function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const btn = document.getElementById('alert-ok-btn');
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      btn.removeEventListener('click', handler);
      document.removeEventListener('keydown', keyHandler);
      r(); 
    };
    const keyHandler = (e) => { if (e.key === 'Enter') handler(); };
    btn.addEventListener('click', handler);
    document.addEventListener('keydown', keyHandler);
  });
}

// 全域 closeModal 函數
window.closeModal = function() {
  document.getElementById('modal-overlay').classList.add('hidden');
  editingId = null;
  isSaving = false;
  const saveBtn = document.getElementById('modal-save-btn');
  if(saveBtn) {
    saveBtn.disabled = false;
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.onclick = null;
  }
  if(window.enterHandler) document.removeEventListener('keydown', window.enterHandler);
  if(window.escHandler) document.removeEventListener('keydown', window.escHandler);
};

// 開啟 Modal
function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  isSaving = false;
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存 (Enter)';

  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { 
        await onSave(); 
      } catch(e) {
        // 錯誤已在 onSave 內部處理
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  cancelBtn.onclick = window.closeModal;
  closeBtn.onclick = window.closeModal;
  
  window.escHandler = (e) => { if (e.key === 'Escape') window.closeModal(); };
  document.addEventListener('keydown', window.escHandler);
  
  if(!hideSave) {
    window.enterHandler = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        saveBtn.click();
      }
    };
    document.addEventListener('keydown', window.enterHandler);
  }
}

// 登入功能
document.getElementById('login-btn').addEventListener('click', () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  
  if(remember) {
    localStorage.setItem('rememberedEmail', email);
  } else {
    localStorage.removeItem('rememberedEmail');
  }
  
  sb.auth.signInWithPassword({ email: email, password: password }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => switchView('boss')); 
    }
  });
});

// 記住帳號功能
window.addEventListener('load', () => {
  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }
});

// Enter鍵登入
document.getElementById('password').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') {
    document.getElementById('login-btn').click();
  }
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
    if(window.innerWidth <= 768) toggleSidebar();
  });
});

// 載入所有資料
async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    expCats:'expense_categories', orders:'orders', purchases:'purchases', 
    warehouseInv:'warehouse_inventory', customerTags:'customer_tags'
  };
  await Promise.all(Object.keys(map).map(k => sb.from(map[k]).select('*').then(r => D[k] = r.data || [])));
}

// 切換視圖
function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

// 渲染視圖
function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}
  // ==================== 老闆查閱 ====================
function renderBoss(c) {
  const [y, m] = bossMonth.split('-').map(Number);
  const monthOrders = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const rev = monthOrders.reduce((s,o)=>s+(o.total_amount||0),0);
  const monthPurchases = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; });
  const pur = monthPurchases.reduce((s,p)=>s+(p.total_amount||0),0);
  const monthExpenses = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const exp = monthExpenses.reduce((s,e)=>s+(e.amount||0),0);
  const monthSubs = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; });
  const sub = monthSubs.reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;

  const subTag = D.tags.find(t => t.name.includes('訂閱'));
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(ct => ct.tag_id === subTag.id).map(ct => ct.customer_id);
    subCustomerCount = new Set(subTagIds).size;
  }

  let subMonthlyRevenue = 0;
  monthOrders.filter(o => o.is_subscription && o.subscription_days > 0).forEach(o => {
    const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
    subMonthlyRevenue += dailyRevenue * 30;
  });

  const companyShipping = monthOrders.reduce((s, o) => s + (o.absorbed_shipping_fee || 0), 0);
  const customerShipping = monthOrders.reduce((s, o) => s + (o.customer_paid_shipping || 0), 0);

  const unreimbursedExpenses = D.expenses.filter(e => e.employee_id && !e.is_reimbursed);
  const unreimbursedTotal = unreimbursedExpenses.reduce((s, e) => s + (e.amount || 0), 0);
  const unreimbursedByEmp = {};
  unreimbursedExpenses.forEach(e => {
    const emp = D.emps.find(x => x.id === e.employee_id);
    if(emp) unreimbursedByEmp[emp.name] = (unreimbursedByEmp[emp.name] || 0) + (e.amount || 0);
  });

  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  c.innerHTML = `
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <h1 class="text-3xl font-bold">👑 老闆查閱</h1>
      <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow">
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月業績</p>
        <p class="text-3xl font-bold mt-2">$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">訂單數：${monthOrderCount} 單</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月採購</p>
        <p class="text-3xl font-bold mt-2">$${pur.toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月開銷(含訂閱)</p>
        <p class="text-3xl font-bold mt-2">$${(exp+sub).toLocaleString()}</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月淨利</p>
        <p class="text-3xl font-bold mt-2">$${monthlyProfit.toLocaleString()}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">📊 營運指標</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">累積客戶總數</span><span class="text-2xl font-bold text-indigo-600">${totalCustomers} 位</span></div>
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">訂閱客戶數</span><span class="text-2xl font-bold text-indigo-600">${subCustomerCount} 位</span></div>
          <div class="flex justify-between items-center"><span class="text-gray-600">訂閱換算月營收</span><span class="text-2xl font-bold text-indigo-600">$${Math.round(subMonthlyRevenue).toLocaleString()}</span></div>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-orange-500">
        <h3 class="text-lg font-bold mb-4 text-gray-800">🚚 運費與員工代墊</h3>
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">公司吸收運費</span><span class="text-xl font-bold text-red-600">$${companyShipping.toLocaleString()}</span></div>
          <div class="flex justify-between items-center border-b pb-2"><span class="text-gray-600">客戶自付運費</span><span class="text-xl font-bold text-green-600">$${customerShipping.toLocaleString()}</span></div>
          <div class="flex justify-between items-center pt-2"><span class="text-gray-600 font-bold">待結帳代墊總額</span><span class="text-xl font-bold text-orange-600">$${unreimbursedTotal.toLocaleString()}</span></div>
        </div>
      </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h3 class="text-lg font-bold mb-4 text-gray-800">🏦 公司總資金狀態 (現金總額：$${totalCash.toLocaleString()})</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value, 
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value, 
    phone: document.getElementById('c-phone').value
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  
  try {
    let cid = id;
    if(id) {
      await sb.from('customers').update(data).eq('id',id);
    } else {
      const {data:inserted} = await sb.from('customers').insert([data]).select().single();
      cid = inserted.id;
    }
    
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr').value, is_default:d.querySelector('.a-def').checked });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    
    showAlert('客戶已儲存！'); 
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delCust(id) {
  if(!confirm('確定刪除？')) return;
  await sb.from('customer_addresses').delete().eq('customer_id',id);
  await sb.from('customer_tags').delete().eq('customer_id',id);
  await sb.from('customers').delete().eq('id',id);
  await loadAll(); render();
}

  const box = document.getElementById('o-items');

  div.innerHTML = `<div class="flex-1"><select class="o-prod w-full px-3 py-2 border rounded" onchange="if(this.value)this.parentElement.parentElement.querySelector('.o-price').value=this.options[this.selectedIndex].dataset.price;calcOrd()"><option value="">選擇產品</option>${D.products.map(p=>`<option value="${p.id}" data-price="${p.sell_price}">${p.name}</option>`).join('')}</select></div><div class="w-20"><input type="number" class="o-qty w-full px-3 py-2 border rounded" value="1" min="1" oninput="calcOrd()"></div><div class="w-28"><input type="number" class="o-price w-full px-3 py-2 border rounded" value="0" step="0.01" oninput="calcOrd()"></div><button type="button" onclick="this.parentElement.remove();calcOrd()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>`;
  box.appendChild(div);

function calcOrd() {
  let total = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.o-price').value)||0;
    const qty = parseInt(r.querySelector('.o-qty').value)||0;
    total += price * qty;
  });
  document.getElementById('o-total').textContent = total.toLocaleString();
}

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  if(!cid) return showAlert('請選擇客戶！');
  const items = []; 
  let total = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value)||0;
    const p = parseFloat(r.querySelector('.o-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); total+=p*q; }
  });
  if(!items.length) return showAlert('請加入產品！');
  
  const data = { customer_id:cid, total_amount:total, status:'shipped', order_no: editingId ? D.orders.find(x=>x.id===editingId)?.order_no : 'ORD-'+Date.now() };
  
  try {
    if(editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const {data:r} = await sb.from('orders').insert([data]).select().single();
      editingId = r.id;
    }
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:editingId})));
    showAlert('出貨單已儲存！'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

  if(!confirm('確定刪除？')) return; 
  await sb.from('order_items').delete().eq('order_id',id);
  await sb.from('orders').delete().eq('id',id);
  await loadAll(); render();
}

function showWhTab(whId) {
  document.querySelectorAll('.wh-tab').forEach(t => { t.className = t.className.replace('bg-blue-600 text-white','bg-gray-200 text-gray-700'); if(t.dataset.wh===whId) t.className = t.className.replace('bg-gray-200 text-gray-700','bg-blue-600 text-white'); });

  let rows = '';
  if(whId === 'all') {
    rows = D.products.map(p => {
      const totalQty = D.warehouseInv.filter(i=>i.product_id===p.id).reduce((sum, i) => sum + (i.quantity||0), 0);
      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3">${p.sku||'-'}</td><td class="px-4 py-3 font-bold text-lg">${totalQty}</td><td class="px-4 py-3">${totalQty>0?'<span class="text-green-600">有庫存</span>':'<span class="text-gray-400">無庫存</span>'}</td></tr>`;
    }).join('');

  } else {
    const wh = D.warehouses.find(w=>w.id===whId);
    const inv = D.warehouseInv.filter(i=>i.warehouse_id===whId);
    rows = D.products.map(p => {
      const wInv = inv.find(i=>i.product_id===p.id);

      const safe = wInv?.safety_stock || 0;
      return `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">${p.name}</td><td class="px-4 py-3 font-bold">${qty}</td><td class="px-4 py-3"><input type="number" class="inv-safe w-20 px-2 py-1 border rounded" value="${safe}"></td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="${qty}"><button onclick="saveInvItem(this, '${p.id}', '${whId}')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs">儲存</button></td></tr>`;
    }).join('');
    container.innerHTML = `<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold">${wh?.name||''} - 庫存明細</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">低庫存設定</th><th class="px-4 py-3 text-left text-xs">盤點調整</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
}

function saveInvItem(btn, pid, wid) {
  const tr = btn.closest('tr');
  const qty = parseInt(tr.querySelector('.inv-qty').value)||0;
  const safe = parseInt(tr.querySelector('.inv-safe').value)||0;
  const existing = D.warehouseInv.find(i=>i.warehouse_id===wid && i.product_id===pid);
  const data = {quantity:qty, safety_stock:safe};
  let promise = existing ? sb.from('warehouse_inventory').update(data).eq('id', existing.id) : sb.from('warehouse_inventory').insert([{warehouse_id:wid, product_id:pid, ...data}]);
  promise.then(() => { loadAll().then(() => { showWhTab(wid); showAlert('庫存已更新！'); }); }).catch(e => showAlert('失敗：'+e.message));

function openPurEdit(id) { const p = D.purchases.find(x=>x.id===id); if(p) openPurModal(p.is_invoice_purchase, id); }

async function openPurModal(isInvoicePurchase, editId = null) {
  editingId = editId || null;
  const existingData = editId ? D.purchases.find(x=>x.id===editId) : null;
  const html = `<input type="hidden" id="pu-invoice-mode" value="${isInvoicePurchase}"><input type="hidden" id="pu-edit-id" value="${editId||''}"><div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-1">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded">${D.vendors.map(v=>`<option value="${v.id}" ${existingData?.vendor_id===v.id?'selected':''}>${v.name}</option>`).join('')}</select></div>${!isInvoicePurchase ? `<div><label class="block text-sm font-bold mb-1">入庫倉庫</label><select id="pu-wh" class="w-full px-3 py-2 border rounded">${D.warehouses.filter(w=>w.is_active).map(w=>`<option value="${w.id}" ${existingData?.warehouse_id===w.id?'selected':''}>${w.name}</option>`).join('')}</select></div>` : ''}</div>${!isInvoicePurchase ? `<div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-1">發票號碼</label><input type="text" id="pu-inv-no" class="w-full px-3 py-2 border rounded" value="${existingData?.invoice_no||''}"></div><div><label class="block text-sm font-bold mb-1 mt-6">有無發票</label><label class="flex items-center gap-2"><input type="checkbox" id="pu-has-inv" class="w-5 h-5" ${existingData?.has_invoice?'checked':''}><span>有發票</span></label></div></div>` : '<div class="bg-orange-50 p-4 rounded border mb-4"><p class="text-orange-800 font-bold">📄 購買發票模式：最後總金額才四捨五入計算稅金。</p></div>'}<div class="mb-4"><label class="block text-sm font-bold mb-1">商品明細</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm">+ 新增商品</button></div>${isInvoicePurchase ? `<div class="bg-orange-50 p-4 rounded mb-4 border"><div class="text-center"><span class="text-sm text-gray-600 block">需付款 (稅金)</span><span class="font-bold text-xl text-red-600">$<span id="pu-total">0</span></span></div></div>` : `<div class="bg-gray-50 p-4 rounded mb-4"><div class="text-xl font-bold">採購總金額：$<span id="pu-total">0</span></div></div>`}<div class="mb-4"><label class="block text-sm font-bold mb-1">出帳帳戶</label><select id="pu-bank" class="w-full px-3 py-2 border rounded"><option value="">不扣款</option>${D.banks.map(b=>`<option value="${b.id}" ${existingData?.bank_account_id===b.id?'selected':''}>${b.account_name}</option>`).join('')}</select></div>`;
  openModal(isInvoicePurchase?(editId?'編輯購買發票':'購買發票'):(editId?'編輯採購':'一般採購入庫'), html, savePur);
  if(editId && existingData) {
    const {data: items} = await sb.from('purchase_items').select('*').eq('purchase_id', editId);
    if(items && items.length > 0) {
      document.getElementById('pu-items').innerHTML = '';
      items.forEach(item => {
        const p = D.products.find(x=>x.id===item.product_id);
        const div = document.createElement('div');
        div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
        div.innerHTML = `<div class="flex-1"><select class="pu-prod w-full px-3 py-2 border rounded"><option value="${p?.id||''}" data-cost="${p?.cost_price||0}" selected>${p?.name||'-'}</option></select></div><div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded" value="${item.quantity}" min="1"></div><div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded" value="${item.unit_price}" step="0.01"></div><button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>`;
        document.getElementById('pu-items').appendChild(div);
      });
    }
  } else { addPurItem(); }
  calcPur();

function addPurItem() {
  const box = document.getElementById('pu-items');
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
  div.innerHTML = `<div class="flex-1"><select class="pu-prod w-full px-3 py-2 border rounded" onchange="if(this.value){this.parentElement.parentElement.querySelector('.pu-price').value=this.options[this.selectedIndex].dataset.cost;}calcPur()"><option value="">選擇商品</option>${D.products.map(p=>`<option value="${p.id}" data-cost="${p.cost_price||0}">${p.name}</option>`).join('')}</select></div><div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded" value="1" min="1" oninput="calcPur()"></div><div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded" value="0" step="0.01" oninput="calcPur()"></div><button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>`;
  box.appendChild(div);
}

function calcPur() {
  const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => { subtotal += (parseFloat(r.querySelector('.pu-price').value)||0) * (parseInt(r.querySelector('.pu-qty').value)||0); });
  if(isInvoiceMode) { if(document.getElementById('pu-total')) document.getElementById('pu-total').textContent = Math.round(subtotal * 0.05).toLocaleString(); }
  else { if(document.getElementById('pu-total')) document.getElementById('pu-total').textContent = subtotal.toLocaleString(); }
}

async function savePur() {
  const editId = document.getElementById('pu-edit-id')?.value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const bankId = document.getElementById('pu-bank').value;
  const items = []; let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const pid = r.querySelector('.pu-prod').value; const q = parseInt(r.querySelector('.pu-qty').value)||0; const p = parseFloat(r.querySelector('.pu-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); subtotal+=p*q; }
  });
  if(!items.length) return showAlert('請加入採購商品！');
  let d = { vendor_id: vendorId, bank_account_id: bankId||null, is_invoice_purchase: isInvoiceMode };
  if(isInvoiceMode) { d.total_amount = Math.round(subtotal * 0.05); d.invoice_amount = d.total_amount; }
  else { d.total_amount = subtotal; d.invoice_amount = subtotal; d.invoice_no = document.getElementById('pu-inv-no')?.value||null; d.has_invoice = document.getElementById('pu-has-inv')?.checked||false; d.warehouse_id = document.getElementById('pu-wh')?.value||null; }
  try {
    if(editId) { await sb.from('purchase_items').delete().eq('purchase_id', editId); await sb.from('purchases').update(d).eq('id', editId); }
    else { d.purchase_no = 'PUR-'+Date.now(); d.status = 'completed'; const {data:r} = await sb.from('purchases').insert([d]).select().single(); const purId = r.id; await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:purId}))); if(!isInvoiceMode && d.warehouse_id) { for(const i of items) { const existing = D.warehouseInv.find(w=>w.warehouse_id===d.warehouse_id && w.product_id===i.product_id); if(existing) await sb.from('warehouse_inventory').update({quantity: (existing.quantity||0) + i.quantity}).eq('id', existing.id); else await sb.from('warehouse_inventory').insert([{warehouse_id:d.warehouse_id, product_id:i.product_id, quantity:i.quantity, safety_stock:0}]); const p = D.products.find(x=>x.id===i.product_id); if(p) await sb.from('products').update({current_stock: (p.current_stock||0) + i.quantity}).eq('id', i.product_id); } } }
    if(bankId) { const b = D.banks.find(x=>x.id===bankId); if(b) await sb.from('bank_accounts').update({balance: (b.balance||0) - d.total_amount}).eq('id', bankId); }

  document.getElementById('emp-tbody').innerHTML = D.emps.map(e=>{const b=D.banks.find(x=>x.id===e.bank_account_id);return `<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">${e.name}</td><td class="px-4 py-3 font-bold">$${(e.salary||0).toLocaleString()}</td><td class="px-4 py-3">${b?.account_name||'-'}</td><td class="px-4 py-3 space-x-2"><button onclick="openEmpModal('${e.id}')" class="text-green-600 text-sm">編輯</button><button onclick="delEmp('${e.id}')" class="text-red-600 text-sm">刪除</button></td></tr>`;}).join('');
}
function openChModal(id) { editingId=id||null; const ch=id?D.channels.find(x=>x.id===id):null; const html = `<input type="hidden" id="ch-id" value="${id||''}"><div class="mb-4"><label class="block text-sm font-bold mb-1">名稱</label><input type="text" id="ch-name" class="w-full px-3 py-2 border rounded" value="${ch?.name||''}"></div><div class="mb-4"><label class="block text-sm font-bold mb-1">抽成率 (%)</label><input type="number" id="ch-rate" class="w-full px-3 py-2 border rounded" value="${ch?.commission_rate||0}"></div>`; openModal(id?'編輯通路':'新增通路', html, async()=>{ const d={name:document.getElementById('ch-name').value, commission_rate:parseFloat(document.getElementById('ch-rate').value)||0}; try { if(editingId) await sb.from('sales_channels').update(d).eq('id',id); else await sb.from('sales_channels').insert([d]); showAlert('已儲存！'); window.closeModal(); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); } }); }
async function delCh(id) { if(!confirm('確定刪除?'))return; await sb.from('sales_channels').delete().eq('id',id); await loadAll(); render(); }
function openPmModal(id) { editingId=id||null; const pm=id?D.payments.find(x=>x.id===id):null; const html = `<input type="hidden" id="pm-id" value="${id||''}"><div class="mb-4"><label class="block text-sm font-bold mb-1">名稱</label><input type="text" id="pm-name" class="w-full px-3 py-2 border rounded" value="${pm?.name||''}"></div><div class="mb-4"><label class="block text-sm font-bold mb-1">手續費率 (%)</label><input type="number" id="pm-rate" class="w-full px-3 py-2 border rounded" value="${pm?.commission_rate||0}"></div>`; openModal(id?'編輯付款方式':'新增付款方式', html, async()=>{ const d={name:document.getElementById('pm-name').value, commission_rate:parseFloat(document.getElementById('pm-rate').value)||0}; try { if(editingId) await sb.from('payment_methods').update(d).eq('id',id); else await sb.from('payment_methods').insert([d]); showAlert('已儲存！'); window.closeModal(); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); } }); }
async function delPm(id) { if(!confirm('確定刪除?'))return; await sb.from('payment_methods').delete().eq('id',id); await loadAll(); render(); }
function openEmpModal(id) { editingId=id||null; const e=id?D.emps.find(x=>x.id===id):null; const html = `<input type="hidden" id="e-id" value="${id||''}"><div class="mb-4"><label class="block text-sm font-bold mb-1">姓名</label><input type="text" id="e-name" class="w-full px-3 py-2 border rounded" value="${e?.name||''}"></div><div class="mb-4"><label class="block text-sm font-bold mb-1">月薪</label><input type="number" id="e-sal" class="w-full px-3 py-2 border rounded" value="${e?.salary||0}"></div><div class="mb-4"><label class="block text-sm font-bold mb-1">支付銀行</label><select id="e-bank" class="w-full px-3 py-2 border rounded"><option value="">無</option>${D.banks.map(b=>`<option value="${b.id}" ${e?.bank_account_id===b.id?'selected':''}>${b.account_name}</option>`).join('')}</select></div>`; openModal(id?'編輯員工':'新增員工', html, async()=>{ const d = {name:document.getElementById('e-name').value, salary:parseFloat(document.getElementById('e-sal').value)||0, bank_account_id:document.getElementById('e-bank').value||null}; if(!d.name) return showAlert('姓名必填！'); try { if(editingId) await sb.from('employees').update(d).eq('id',id); else await sb.from('employees').insert([d]); showAlert('已儲存！'); window.closeModal(); await loadAll(); render(); } catch(e) { showAlert('失敗：'+e.message); } }); }
async function delEmp(id) { if(!confirm('確定刪除?'))return; await sb.from('employees').delete().eq('id',id); await loadAll(); render(); }

// ==================== 系統啟動 ====================
sb.auth.getSession().then(r => { 
  if(r.data?.session) { 
    document.getElementById('login-view').classList.add('hidden'); 
    document.getElementById('main-system').classList.remove('hidden'); 
    loadAll().then(()=>switchView('boss')); 
  } 
});
</script>
</body>
</html>
