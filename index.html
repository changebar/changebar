<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老闆退休管理系統 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
        .search-dropdown { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; width: 100%; }
        .search-item:hover { background-color: #f3f4f6; cursor: pointer; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        .tag-VIP { background-color: #a855f7; color: white; }
        .tag-價格敏感 { background-color: #eab308; color: black; }
        .tag-月結 { background-color: #3b82f6; color: white; }
        .tag-大客戶 { background-color: #ef4444; color: white; }
        .tag-新客戶 { background-color: #22c55e; color: white; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 登入頁面 -->
    <div id="login-view" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🏢 企業戰情室登入</h1>
            <form class="space-y-4" onsubmit="return false;">
                <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded-md">
                <input type="password" id="password" placeholder="密碼" required class="w-full px-3 py-2 border rounded-md">
                <button type="button" id="login-btn" class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登入系統</button>
            </form>
        </div>
    </div>

    <!-- 主系統 -->
    <div id="main-system" class="hidden min-h-screen flex">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-xl font-bold border-b border-gray-700">📊 退休管理系統 v2.0</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="switchView('dashboard')" id="nav-dashboard" class="block py-2 px-4 rounded hover:bg-gray-700 nav-active">🏠 儀表板</a>
                <a href="#" onclick="switchView('crm')" id="nav-crm" class="block py-2 px-4 rounded hover:bg-gray-700">👥 客戶管理</a>
                <a href="#" onclick="switchView('orders')" id="nav-orders" class="block py-2 px-4 rounded hover:bg-gray-700">📦 訂單管理</a>
                <a href="#" onclick="switchView('inventory')" id="nav-inventory" class="block py-2 px-4 rounded hover:bg-gray-700">🏭 倉庫庫存</a>
                <a href="#" onclick="switchView('finance')" id="nav-finance" class="block py-2 px-4 rounded hover:bg-gray-700">💰 財務發票</a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <button id="logout-btn" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded text-sm">登出</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <!-- 儀表板 -->
            <div id="view-dashboard">
                <h1 class="text-3xl font-bold mb-6">老闆，早安！戰情總覽：</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總客戶數</p><p id="stat-customers" class="text-3xl font-bold text-blue-600 mt-2">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">本月訂單</p><p id="stat-orders" class="text-3xl font-bold text-green-600 mt-2">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">本月營收</p><p id="stat-revenue" class="text-3xl font-bold text-purple-600 mt-2">$0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">庫存警報</p><p id="stat-alerts" class="text-3xl font-bold text-red-600 mt-2">0</p></div>
                </div>
            </div>

            <!-- 客戶管理 -->
            <div id="view-crm" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold">👥 客戶關係管理</h1>
                    <button onclick="openCustomerModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+ 新增客戶</button>
                </div>
                
                <!-- 標籤篩選 -->
                <div class="mb-6 bg-white p-4 rounded-lg shadow">
                    <h3 class="font-bold text-gray-700 mb-3">🏷️ 標籤篩選：</h3>
                    <div id="tag-filters" class="flex flex-wrap gap-2">
                        <button onclick="filterByTag(null)" class="px-3 py-1 bg-gray-200 rounded-full text-sm hover:bg-gray-300">全部</button>
                    </div>
                </div>

                <!-- 搜尋 -->
                <div class="mb-6 relative">
                    <input type="text" id="customer-search" placeholder="🔍 搜尋客戶..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
                    <div id="search-dropdown" class="search-dropdown mt-2 hidden"></div>
                </div>

                <!-- 客戶列表 -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">類型</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司/姓名</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">統編</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">標籤</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">地址</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
                        <tbody id="customer-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- 訂單管理 -->
            <div id="view-orders" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold">📦 訂單管理</h1>
                    <button onclick="openOrderModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 shadow-md font-bold">+ 新增訂單</button>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">訂單編號</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">客戶</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">金額</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">發票</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">狀態</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
                        <tbody id="order-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- 倉庫庫存 -->
            <div id="view-inventory" class="hidden">
                <h1 class="text-3xl font-bold mb-6">🏭 倉庫庫存管理</h1>
                <div id="warehouse-inventory-container" class="space-y-6"></div>
            </div>

            <!-- 財務 -->
            <div id="view-finance" class="hidden">
                <h1 class="text-3xl font-bold mb-6">💰 財務與發票</h1>
                <p class="text-gray-500">開發中...</p>
            </div>
        </main>
    </div>

    <!-- 客戶 Modal（包含地址管理） -->
    <div id="customer-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 id="customer-modal-title" class="text-2xl font-bold">📝 新增客戶</h2>
                <button onclick="closeCustomerModal()" class="text-2xl">&times;</button>
            </div>
            
            <form id="customer-form" onsubmit="return false;" class="space-y-4">
                <input type="hidden" id="cust-id">
                
                <!-- 基本資訊 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">類型</label>
                        <select id="cust-type" class="w-full px-3 py-2 border rounded" onchange="toggleCompanyField()">
                            <option value="B2C">B2C</option>
                            <option value="B2B">B2B</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">負責窗口</label>
                        <select id="cust-window" class="w-full px-3 py-2 border rounded"></select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">公司名稱 <span id="company-required" class="text-red-500 hidden">*</span></label>
                    <input type="text" id="cust-company" class="w-full px-3 py-2 border rounded">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">統一編號</label>
                        <input type="text" id="cust-tax-id" class="w-full px-3 py-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">发票抬头</label>
                        <input type="text" id="cust-invoice-title" class="w-full px-3 py-2 border rounded" placeholder="預設同公司">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">聯絡人 *</label>
                        <input type="text" id="cust-contact" required class="w-full px-3 py-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">電話 *</label>
                        <input type="text" id="cust-phone" required class="w-full px-3 py-2 border rounded">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">Email</label>
                    <input type="email" id="cust-email" class="w-full px-3 py-2 border rounded">
                </div>

                <!-- 標籤選擇 -->
                <div>
                    <label class="block text-sm font-bold mb-1">標籤（可多选）</label>
                    <div id="customer-tags-container" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50">
                        <!-- 標籤會動態生成 -->
                    </div>
                </div>

                <!-- 地址管理 -->
                <div class="border-t pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-lg">📍 寄送地址管理</h3>
                        <button type="button" onclick="addCustomerAddress()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">+ 新增地址</button>
                    </div>
                    <div id="customer-addresses-container" class="space-y-3">
                        <!-- 地址會動態生成 -->
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeCustomerModal()" class="px-6 py-2 bg-gray-300 rounded">取消</button>
                    <button type="button" onclick="saveCustomer()" class="px-6 py-2 bg-blue-600 text-white rounded font-bold">💾 儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 訂單 Modal -->
    <div id="order-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 id="order-modal-title" class="text-2xl font-bold">📝 新增訂單</h2>
                <button onclick="closeOrderModal()" class="text-2xl">&times;</button>
            </div>
            
            <form id="order-form" onsubmit="return false;" class="space-y-6">
                <input type="hidden" id="order-id">
                
                <!-- 客戶選擇 -->
                <div>
                    <label class="block text-sm font-bold mb-2">1. 選擇客戶 *</label>
                    <div class="relative">
                        <input type="text" id="order-customer-search" placeholder="搜尋客戶..." class="w-full px-4 py-2 border rounded" autocomplete="off">
                        <div id="order-customer-dropdown" class="search-dropdown mt-1 hidden"></div>
                        <input type="hidden" id="selected-customer-id">
                    </div>
                    <p id="selected-customer-display" class="mt-2 text-sm text-blue-600 hidden"></p>
                </div>

                <!-- 發票資訊 -->
                <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                    <h3 class="font-bold mb-3">📄 發票資訊</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">需要發票</label>
                            <select id="order-need-invoice" class="w-full px-3 py-2 border rounded" onchange="toggleInvoiceFields()">
                                <option value="no">不需要</option>
                                <option value="yes">需要</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">稅金處理</label>
                            <select id="order-tax-handling" class="w-full px-3 py-2 border rounded">
                                <option value="tax_included">含稅價</option>
                                <option value="tax_excluded">稅外加</option>
                                <option value="no_invoice">不開發票</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">發票類型</label>
                            <select id="order-invoice-type" class="w-full px-3 py-2 border rounded">
                                <option value="3">三聯式</option>
                                <option value="2">二聯式</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">发票抬头</label>
                            <input type="text" id="order-invoice-title" class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">統一編號</label>
                            <input type="text" id="order-tax-id" class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">發票號碼</label>
                            <input type="text" id="order-invoice-no" class="w-full px-3 py-2 border rounded" placeholder="例：ABC1234567">
                        </div>
                    </div>
                </div>

                <!-- 寄送地址 -->
                <div>
                    <label class="block text-sm font-bold mb-2">2. 寄送地址 *</label>
                    <div class="flex gap-2 mb-2">
                        <select id="shipping-address-select" class="flex-1 px-4 py-2 border rounded" onchange="selectSavedAddress()">
                            <option value="">選擇已存地址...</option>
                        </select>
                        <button type="button" onclick="enableTempAddress()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">手動輸入</button>
                    </div>
                    <div id="temp-address-section" class="hidden grid grid-cols-2 gap-4 p-4 bg-gray-50 rounded border">
                        <div>
                            <label class="block text-xs font-bold mb-1">收件人</label>
                            <input type="text" id="temp-recipient" class="w-full px-3 py-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">電話</label>
                            <input type="text" id="temp-phone" class="w-full px-3 py-2 border rounded">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-bold mb-1">地址</label>
                            <input type="text" id="temp-address" class="w-full px-3 py-2 border rounded" placeholder="完整地址或門市名稱">
                        </div>
                    </div>
                </div>

                <!-- 產品明細 -->
                <div>
                    <label class="block text-sm font-bold mb-2">3. 產品明細</label>
                    <div id="order-items-container" class="space-y-3"></div>
                    <button type="button" onclick="addOrderItemRow()" class="mt-3 px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">+ 新增產品</button>
                </div>

                <!-- 總金額 -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="text-sm text-gray-600">訂單總金額</div>
                            <div class="text-3xl font-bold text-purple-600" id="order-total-amount">$0</div>
                            <div class="text-xs text-gray-500 mt-1" id="order-tax-info"></div>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm font-bold mb-1">備註</label>
                            <textarea id="order-notes" class="w-full px-3 py-2 border rounded" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeOrderModal()" class="px-6 py-2 bg-gray-300 rounded">取消</button>
                    <button type="button" onclick="submitOrder()" class="px-6 py-2 bg-blue-600 text-white rounded font-bold">💾 儲存訂單</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [], allWindows = [], allCustomers = [], allTags = [], allWarehouses = [];
        let editingOrderId = null, originalOrderItems = [];

        // 登入
        document.getElementById('login-btn').addEventListener('click', async () => {
            const { error } = await sb.auth.signInWithPassword({ 
                email: document.getElementById('email').value, 
                password: document.getElementById('password').value 
            });
            if (error) alert('登入失敗：' + error.message);
            else {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-system').classList.remove('hidden');
                await loadInitialData();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await sb.auth.signOut();
            location.reload();
        });

        async function loadInitialData() {
            await loadWindows();
            await loadTags();
            await loadWarehouses();
            await loadProducts();
            loadDashboardData();
        }

        function switchView(viewName) {
            ['dashboard', 'crm', 'orders', 'inventory', 'finance'].forEach(v => {
                document.getElementById('view-' + v).classList.add('hidden');
                document.getElementById('nav-' + v).classList.remove('nav-active');
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.getElementById('nav-' + viewName).classList.add('nav-active');
            
            if (viewName === 'crm') loadCustomers();
            if (viewName === 'orders') loadOrders();
            if (viewName === 'inventory') loadWarehouseInventory();
        }

        // 載入基礎資料
        async function loadWindows() {
            const { data } = await sb.from('contact_windows').select('*').eq('is_active', true);
            allWindows = data || [];
        }

        async function loadTags() {
            const { data } = await sb.from('tags').select('*').eq('category', 'customer').order('name');
            allTags = data || [];
            renderTagFilters();
        }

        async function loadWarehouses() {
            const { data } = await sb.from('warehouses').select('*').eq('is_active', true);
            allWarehouses = data || [];
        }

        async function loadProducts() {
            const { data } = await sb.from('products').select('*').eq('type', 'finished');
            allProducts = data || [];
        }

        async function loadDashboardData() {
            const { count } = await sb.from('customers').select('*', { count: 'exact', head: true });
            document.getElementById('stat-customers').textContent = count || 0;
            
            const { data: orders } = await sb.from('orders').select('total_amount');
            document.getElementById('stat-orders').textContent = orders?.length || 0;
            const total = orders ? orders.reduce((s, o) => s + (o.total_amount || 0), 0) : 0;
            document.getElementById('stat-revenue').textContent = '$' + total.toLocaleString();
            
            const { data: prods } = await sb.from('product_inventory').select('quantity, safety_stock');
            const alerts = prods ? prods.filter(p => p.quantity < p.safety_stock).length : 0;
            document.getElementById('stat-alerts').textContent = alerts;
        }

        // 標籤篩選
        function renderTagFilters() {
            const container = document.getElementById('tag-filters');
            container.innerHTML = '<button onclick="filterByTag(null)" class="px-3 py-1 bg-gray-200 rounded-full text-sm hover:bg-gray-300">全部</button>' +
                allTags.map(t => `<button onclick="filterByTag('${t.id}')" class="px-3 py-1 tag-${t.name} rounded-full text-sm hover:opacity-80">${t.name}</button>`).join('');
        }

        let currentTagFilter = null;
        function filterByTag(tagId) {
            currentTagFilter = tagId;
            loadCustomers();
        }

        // ==========================================
        // 👥 客戶管理
        // ==========================================

        function toggleCompanyField() {
            const type = document.getElementById('cust-type').value;
            document.getElementById('company-required').classList.toggle('hidden', type === 'B2C');
        }

        function openCustomerModal(customerId = null) {
            document.getElementById('customer-modal-title').textContent = customerId ? '✏️ 編輯客戶' : '📝 新增客戶';
            document.getElementById('customer-form').reset();
            document.getElementById('cust-id').value = customerId || '';
            document.getElementById('cust-type').value = 'B2C';
            toggleCompanyField();
            
            // 填充窗口
            document.getElementById('cust-window').innerHTML = '<option value="">請選擇...</option>' + 
                allWindows.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            
            // 填充標籤

            }
            
            document.getElementById('customer-modal').classList.remove('hidden');

        async function loadCustomerForEdit(id) {
            const { data: c } = await sb.from('customers').select('*, customer_tags(tag_id)').eq('id', id).single();
            if (!c) return;

            document.getElementById('cust-id').value = c.id;
            document.getElementById('cust-type').value = c.type;
            toggleCompanyField();
            document.getElementById('cust-company').value = c.company_name || '';
            document.getElementById('cust-tax-id').value = c.tax_id || '';
            document.getElementById('cust-invoice-title').value = c.invoice_title || c.company_name || '';
            document.getElementById('cust-contact').value = c.contact_person;
            document.getElementById('cust-phone').value = c.phone;
            document.getElementById('cust-email').value = c.email || '';
            document.getElementById('cust-window').value = c.primary_contact_window_id || '';

            // 標籤
            const selectedTags = c.customer_tags?.map(ct => ct.tag_id) || [];
            renderCustomerTags(selectedTags);

            // 地址
            const { data: addresses } = await sb.from('customer_addresses').select('*').eq('customer_id', id);
            document.getElementById('customer-addresses-container').innerHTML = '';
            if (addresses && addresses.length) {
                addresses.forEach(addr => addCustomerAddress(addr));
            } else {
                addCustomerAddress();
            }
        }

        async function saveCustomer() {
            const id = document.getElementById('cust-id').value;
            const type = document.getElementById('cust-type').value;
            const company = document.getElementById('cust-company').value;
            
            if (type === 'B2B' && !company) return alert('B2B 請填寫公司名稱！');
            if (!document.getElementById('cust-contact').value || !document.getElementById('cust-phone').value) {
                return alert('聯絡人和電話必填！');
            }

            // 收集標籤
            const tagCheckboxes = document.querySelectorAll('.cust-tag-checkbox:checked');
            const tagIds = Array.from(tagCheckboxes).map(cb => cb.value);

            const customerData = {
                type,
                company_name: company || null,
                tax_id: document.getElementById('cust-tax-id').value || null,
                invoice_title: document.getElementById('cust-invoice-title').value || null,
                contact_person: document.getElementById('cust-contact').value,
                phone: document.getElementById('cust-phone').value,
                email: document.getElementById('cust-email').value || null,
                primary_contact_window_id: document.getElementById('cust-window').value || null
            };

            try {
                let customerId = id;
                if (id) {
                    await sb.from('customers').update(customerData).eq('id', id);
                } else {
                    const { data } = await sb.from('customers').insert([customerData]).select().single();
                    customerId = data.id;
                }

                // 更新標籤關聯
                await sb.from('customer_tags').delete().eq('customer_id', customerId);
                if (tagIds.length) {
                    await sb.from('customer_tags').insert(tagIds.map(tid => ({ customer_id: customerId, tag_id: tid })));
                }

                // 更新地址
                await updateCustomerAddresses(customerId);

                alert('✅ 客戶已儲存！');
                closeCustomerModal();
                loadCustomers();
            } catch (err) {
                alert('儲存失敗：' + err.message);
            }
        }

        async function updateCustomerAddresses(customerId) {
            const addressDivs = document.querySelectorAll('#customer-addresses-container > div');
            const addresses = [];
            
            addressDivs.forEach((div, index) => {
                const addressId = div.dataset.addressId;
                if (addressId.startsWith('new-')) {
                    addresses.push({
                        customer_id: customerId,
                        address_type: div.querySelector('.addr-type').value,
                        address_name: div.querySelector('.addr-name').value,
                        recipient_name: div.querySelector('.addr-recipient').value,
                        recipient_phone: div.querySelector('.addr-phone').value,
                        city: div.querySelector('.addr-city').value,
                        district: div.querySelector('.addr-district').value,
                        street: div.querySelector('.addr-street').value,
                        cvs_store_name: div.querySelector('.addr-cvs-name').value,
                        cvs_store_code: div.querySelector('.addr-cvs-code').value,
                        is_default: div.querySelector('.addr-default').checked
                    });
                }
            });

            if (addresses.length) {
                await sb.from('customer_addresses').insert(addresses);
            }
        }

        async function loadCustomers() {
            let query = sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id)');
            
            if (currentTagFilter) {
                query = query.eq('customer_tags.tag_id', currentTagFilter);
            }
            
            const { data } = await query.order('created_at', { ascending: false });
            allCustomers = data || [];

            if (!allCustomers.length) {
                document.getElementById('customer-table-body').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">尚無客戶</td></tr>';
                return;
            }

            const addrMap = { home:'🏠', office:'🏢', cvs_711:'🏪', cvs_family:'全家' };
            
            document.getElementById('customer-table-body').innerHTML = allCustomers.map(c => {
                const tags = c.customer_tags?.map(ct => {
                    const tag = allTags.find(t => t.id === ct.tag_id);
                    return tag ? `<span class="tag-${tag.name} px-2 py-1 rounded text-xs mr-1">${tag.name}</span>` : '';
                }).join('') || '<span class="text-gray-400 text-xs">無標籤</span>';

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full ${c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${c.type}</span></td>
                        <td class="px-6 py-4 font-medium">${c.company_name || c.contact_person}</td>
                        <td class="px-6 py-4 text-sm">${c.tax_id || '-'}</td>
                        <td class="px-6 py-4">${tags}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">查看詳情</td>
                        <td class="px-6 py-4">
                            <button onclick="openCustomerModal('${c.id}')" class="text-blue-600 hover:underline text-sm mr-2">編輯</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openOrderModal(orderId = null) {
            editingOrderId = orderId;
            document.getElementById('order-modal-title').textContent = orderId ? '✏️ 編輯訂單' : '📝 新增訂單';
            document.getElementById('order-form').reset();
            document.getElementById('order-id').value = orderId || '';
            document.getElementById('selected-customer-id').value = '';
            document.getElementById('selected-customer-display').classList.add('hidden');
            document.getElementById('order-items-container').innerHTML = '';
            document.getElementById('temp-address-section').classList.add('hidden');
            
            if (orderId) {
                loadOrderForEdit(orderId);
            } else {
                addOrderItemRow();
            }
            
            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
            editingOrderId = null;
            originalOrderItems = [];
        }

        function toggleInvoiceFields() {
            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const fields = ['order-invoice-title', 'order-tax-id', 'order-invoice-type', 'order-invoice-no', 'order-tax-handling'];
            fields.forEach(id => {
                document.getElementById(id).disabled = !needInvoice;
            });
            calculateOrderTotal();
        }

        // 客戶搜尋
        let orderSearchTimer;
        document.getElementById('order-customer-search')?.addEventListener('input', (e) => {
            clearTimeout(orderSearchTimer);
            const kw = e.target.value.trim();
            const dd = document.getElementById('order-customer-dropdown');
            
            if (!kw) { dd.classList.add('hidden'); return; }
            
            orderSearchTimer = setTimeout(() => {
                const filtered = allCustomers.filter(c => 
                    (c.contact_person && c.contact_person.includes(kw)) ||
                    (c.company_name && c.company_name.includes(kw)) ||
                    (c.phone && c.phone.includes(kw))
                );
                
                dd.innerHTML = filtered.map(c => `
                    <div class="search-item p-3 border-b" onclick="selectOrderCustomer('${c.id}', '${c.company_name || c.contact_person}', '${c.tax_id || ''}', '${c.invoice_title || ''}')">
                        ${c.company_name || c.contact_person} - ${c.contact_person} (${c.phone})
                    </div>
                `).join('') || '<div class="p-3 text-gray-500">無結果</div>';
                dd.classList.remove('hidden');
            }, 300);
        });

        async function selectOrderCustomer(id, name, taxId, invoiceTitle) {
            document.getElementById('order-customer-dropdown').classList.add('hidden');
            document.getElementById('order-customer-search').value = name;
            document.getElementById('selected-customer-id').value = id;
            document.getElementById('selected-customer-display').textContent = `✅ ${name}`;
            document.getElementById('selected-customer-display').classList.remove('hidden');

            // 自動帶入發票資訊
            const customer = allCustomers.find(c => c.id === id);
            if (customer) {
                if (customer.type === 'B2B') {
                    document.getElementById('order-need-invoice').value = 'yes';
                    document.getElementById('order-invoice-title').value = invoiceTitle || customer.company_name || '';
                    document.getElementById('order-tax-id').value = taxId || customer.tax_id || '';
                } else {
                    document.getElementById('order-need-invoice').value = 'no';
                    document.getElementById('order-invoice-title').value = '';
                    document.getElementById('order-tax-id').value = '';
                }
                toggleInvoiceFields();

                // 載入地址
                const { data: addresses } = await sb.from('customer_addresses').select('*').eq('customer_id', id);
                const addrSelect = document.getElementById('shipping-address-select');
                addrSelect.innerHTML = '<option value="">選擇已存地址...</option>';
                
                if (addresses && addresses.length) {
                    const addrMap = { home:'🏠', office:'🏢', cvs_711:'🏪', cvs_family:'全家' };
                    addresses.forEach(a => {
                        const text = `${addrMap[a.address_type]||a.address_type} - ${a.address_name || a.street || a.cvs_store_name} (${a.recipient_name})`;
                        addrSelect.innerHTML += `<option value="${a.id}" ${a.is_default ? 'selected' : ''}>${text}</option>`;
                    });
                }
            }
        }

            document.getElementById('temp-address-section').classList.remove('hidden');

        function selectSavedAddress() {

        }

        function addOrderItemRow(productData = null) {
            const container = document.getElementById('order-items-container');
            const id = 'row-' + Date.now();
            
            const options = allProducts.map(p => `
                <option value="${p.id}" data-price="${p.sell_price}" ${productData?.product_id === p.id ? 'selected' : ''}>
                    ${p.name} - $${p.sell_price} (庫存: ${p.current_stock})
                </option>
            `).join('');

            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
            div.innerHTML = `
                <div class="flex-1">
                    <label class="block text-xs font-bold mb-1">產品</label>
                    <select class="order-product w-full px-3 py-2 border rounded" onchange="updateItemPrice('${id}')">
                        <option value="">選擇產品...</option>${options}
                    </select>
                </div>
                <div class="w-24">
                    <label class="block text-xs font-bold mb-1">數量</label>
                    <input type="number" class="order-qty w-full px-3 py-2 border rounded" value="${productData?.quantity || 1}" min="1" onchange="calculateOrderTotal()">
                </div>
                <div class="w-32">
                    <label class="block text-xs font-bold mb-1">單價 (可調)</label>
                    <input type="number" class="order-price w-full px-3 py-2 border rounded" value="${productData?.unit_price || ''}" step="0.01" onchange="calculateOrderTotal()">
                </div>
                <div class="w-32">
                    <label class="block text-xs font-bold mb-1">小計</label>
                    <div class="order-subtotal px-3 py-2 font-bold">$0</div>
                </div>
                <button type="button" onclick="document.getElementById('${id}').remove(); calculateOrderTotal()" class="px-3 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200">✕</button>
            `;
            container.appendChild(div);
            
            if (productData?.unit_price) {
                updateItemPrice(id, productData.unit_price);
            }
            calculateOrderTotal();
        }

        function updateItemPrice(rowId, forcedPrice = null) {
            const row = document.getElementById(rowId);
            const select = row.querySelector('.order-product');
            const priceInput = row.querySelector('.order-price');
            
            if (forcedPrice !== null) {
                priceInput.value = forcedPrice;
            } else if (select.value) {
                const price = select.options[select.selectedIndex].dataset.price;
                priceInput.value = price;
            }
            calculateOrderTotal();
        }

        function calculateOrderTotal() {
            let total = 0;
            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const price = parseFloat(row.querySelector('.order-price').value) || 0;
                const qty = parseInt(row.querySelector('.order-qty').value) || 0;
                const subtotal = price * qty;
                row.querySelector('.order-subtotal').textContent = '$' + subtotal.toLocaleString();
                total += subtotal;
            });

            document.getElementById('order-total-amount').textContent = '$' + total.toLocaleString();
            
            const taxHandling = document.getElementById('order-tax-handling').value;
            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            
            let taxInfo = '';
            if (needInvoice) {
                if (taxHandling === 'tax_included') {
                    const tax = total * 0.05 / 1.05;
                    taxInfo = `含稅價 | 稅額: $${Math.round(tax)} | 未稅: $${Math.round(total - tax)}`;
                } else if (taxHandling === 'tax_excluded') {
                    const tax = total * 0.05;
                    taxInfo = `稅外加 | 稅額: $${Math.round(tax)} | 含稅總計: $${Math.round(total + tax)}`;
                } else {
                    taxInfo = '不開發票';
                }
            } else {
                taxInfo = '不開發票';
            }
            document.getElementById('order-tax-info').textContent = taxInfo;
        }

        async function submitOrder() {
            const customerId = document.getElementById('selected-customer-id').value;
            const windowId = document.getElementById('contact-window-select')?.value;
            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const taxHandling = document.getElementById('order-tax-handling').value;
            
            if (!customerId) return alert('請選擇客戶！');
            
            // 收集產品
            const items = [];
            let totalAmount = 0;
            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const prodId = row.querySelector('.order-product').value;
                const qty = parseInt(row.querySelector('.order-qty').value) || 0;
                const price = parseFloat(row.querySelector('.order-price').value) || 0;
                if (prodId && qty > 0) {
                    items.push({ product_id: prodId, quantity: qty, unit_price: price });
                    totalAmount += price * qty;
                }
            });

            if (!items.length) return alert('請至少加入一筆產品！');

            try {
                const orderData = {
                    customer_id: customerId,
                    contact_window_id: windowId,
                    total_amount: totalAmount,
                    notes: document.getElementById('order-notes').value,
                    status: 'confirmed',
                    invoice_title: needInvoice ? document.getElementById('order-invoice-title').value : null,
                    invoice_tax_id: needInvoice ? document.getElementById('order-tax-id').value : null,
                    invoice_type: needInvoice ? document.getElementById('order-invoice-type').value : null,
                    invoice_no: needInvoice ? document.getElementById('order-invoice-no').value : null,
                    tax_handling: taxHandling,
                    tax_amount: taxHandling === 'tax_included' ? totalAmount * 0.05 / 1.05 : (taxHandling === 'tax_excluded' ? totalAmount * 0.05 : 0)
                };

                if (editingOrderId) {
                    // 編輯：回補庫存
                    for (const item of originalOrderItems) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
                    }
                    await sb.from('order_items').delete().eq('order_id', editingOrderId);
                    await sb.from('orders').update(orderData).eq('id', editingOrderId);
                } else {
                    // 新增
                    orderData.order_no = 'ORD-' + new Date().getFullYear() + '-' + Math.floor(Math.random()*10000).toString().padStart(4,'0');
                    const { data } = await sb.from('orders').insert([orderData]).select().single();
                    editingOrderId = data.id;
                }

                // 插入明細
                await sb.from('order_items').insert(items.map(item => ({
                    order_id: editingOrderId,
                    product_id: item.product_id,
                    quantity: item.quantity,
                    unit_price: item.unit_price
                })));

                // 扣庫存
                for (const item of items) {
                    const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                    await sb.from('products').update({ current_stock: prod.current_stock - item.quantity }).eq('id', item.product_id);
                }

                alert('✅ 訂單已儲存！');
                closeOrderModal();
                loadOrders();
                loadDashboardData();
            } catch (err) {
                alert('儲存失敗：' + err.message);
            }
        }

                        <button onclick="deleteOrder('${o.id}')" class="text-red-600 hover:underline text-sm">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadOrderForEdit(id) {
            const { data: order } = await sb.from('orders').select('*, order_items(*)').eq('id', id).single();
            if (!order) return;

            originalOrderItems = order.order_items || [];
            
            // 填充客戶
            const { data: customer } = await sb.from('customers').select('*').eq('id', order.customer_id).single();
            if (customer) {
                selectOrderCustomer(customer.id, customer.company_name || customer.contact_person, customer.tax_id, customer.invoice_title);
            }

            document.getElementById('contact-window-select').value = order.contact_window_id || '';
            document.getElementById('order-notes').value = order.notes || '';
            document.getElementById('order-need-invoice').value = order.invoice_no ? 'yes' : 'no';
            document.getElementById('order-invoice-title').value = order.invoice_title || '';
            document.getElementById('order-tax-id').value = order.invoice_tax_id || '';
            document.getElementById('order-invoice-type').value = order.invoice_type || '3';
            document.getElementById('order-invoice-no').value = order.invoice_no || '';
            document.getElementById('order-tax-handling').value = order.tax_handling || 'tax_included';
            
            toggleInvoiceFields();
            
            // 填充產品
            document.getElementById('order-items-container').innerHTML = '';
            order.order_items?.forEach(item => addOrderItemRow(item));
        }

        async function deleteOrder(id) {
            if (!confirm('確定刪除？庫存會回補。')) return;
            
            const { data: items } = await sb.from('order_items').select('*').eq('order_id', id);
            for (const item of items || []) {
                const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
            }
            
            await sb.from('order_items').delete().eq('order_id', id);
            await sb.from('orders').delete().eq('id', id);
            
            alert('✅ 訂單已刪除');
            loadOrders();
            loadDashboardData();
        }

        // 倉庫庫存
        async function loadWarehouseInventory() {
            const container = document.getElementById('warehouse-inventory-container');
            container.innerHTML = '';

            for (const warehouse of allWarehouses) {
                const { data: inventory } = await sb
                    .from('product_inventory')
                    .select('*, products(name, sku, safety_stock)')
                    .eq('warehouse_id', warehouse.id);

                const div = document.createElement('div');
                div.className = 'bg-white rounded-lg shadow p-6';
                div.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">🏭 ${warehouse.name}</h3>
                    <table class="min-w-full">
                        <thead class="bg-gray-50">
                            <tr><th class="px-4 py-2 text-left">產品</th><th class="px-4 py-2 text-left">SKU</th><th class="px-4 py-2 text-left">庫存</th><th class="px-4 py-2 text-left">安全庫存</th><th class="px-4 py-2 text-left">狀態</th></tr>
                        </thead>
                        <tbody>
                            ${inventory?.map(inv => `
                                <tr class="border-t">
                                    <td class="px-4 py-2">${inv.products?.name}</td>
                                    <td class="px-4 py-2 text-sm text-gray-600">${inv.products?.sku}</td>
                                    <td class="px-4 py-2 font-bold">${inv.quantity}</td>
                                    <td class="px-4 py-2">${inv.products?.safety_stock || inv.safety_stock}</td>
                                    <td class="px-4 py-2">${inv.quantity < (inv.products?.safety_stock || inv.safety_stock) ? '<span class="text-red-600 font-bold">⚠️ 低於安全庫存</span>' : '<span class="text-green-600">✓ 正常</span>'}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="5" class="px-4 py-2 text-center text-gray-500">無庫存資料</td></tr>'}
                        </tbody>
                    </table>
                `;
                container.appendChild(div);
            }
        }

        // 初始化
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-system').classList.remove('hidden');
                await loadInitialData();
            }
        })();
    </script>
</body>
</html>
