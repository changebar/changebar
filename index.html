    <script>
        const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [], allWindows = [], allCustomers = [], allTags = [], allWarehouses = [];
        let editingOrderId = null, originalOrderItems = [], currentCustomerTags = [], currentCustomerType = 'B2C';
        const STANDARD_SHIPPING_FEE = 100;

        // 登入與登出
        document.getElementById('login-btn').addEventListener('click', async () => {
            const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
            if (error) alert('登入失敗：' + error.message);
            else {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-system').classList.remove('hidden');
                await loadInitialData();
            }
        });
        document.getElementById('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

        async function loadInitialData() {
            await Promise.all([loadWindows(), loadTags(), loadWarehouses(), loadProducts()]);
            loadDashboardData();
        }

        function switchView(viewName) {
            ['dashboard', 'crm', 'orders', 'inventory', 'finance'].forEach(v => {
                document.getElementById('view-' + v).classList.add('hidden');
                document.getElementById('nav-' + v).classList.remove('nav-active');
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            document.getElementById('nav-' + viewName).classList.add('nav-active');
            if (viewName === 'crm') loadCustomers();
            if (viewName === 'orders') loadOrders();
            if (viewName === 'inventory') loadWarehouseInventory();
        }

        async function loadWindows() { const { data } = await sb.from('contact_windows').select('*').eq('is_active', true); allWindows = data || []; }
        async function loadTags() { const { data } = await sb.from('tags').select('*').eq('category', 'customer').order('name'); allTags = data || []; renderTagFilters(); }
        async function loadWarehouses() { const { data } = await sb.from('warehouses').select('*').eq('is_active', true); allWarehouses = data || []; }
        async function loadProducts() { const { data } = await sb.from('products').select('*').eq('type', 'finished'); allProducts = data || []; }

        async function loadDashboardData() {
            const { count } = await sb.from('customers').select('*', { count: 'exact', head: true });
            document.getElementById('stat-customers').textContent = count || 0;
            const { data: orders } = await sb.from('orders').select('total_amount, absorbed_shipping_fee');
            document.getElementById('stat-orders').textContent = orders?.length || 0;
            const total = orders ? orders.reduce((s, o) => s + (o.total_amount || 0), 0) : 0;
            document.getElementById('stat-revenue').textContent = '$' + total.toLocaleString();
            const absorbed = orders ? orders.reduce((s, o) => s + (o.absorbed_shipping_fee || 0), 0) : 0;
            document.getElementById('stat-shipping-cost').textContent = '$' + absorbed.toLocaleString();
        }

        // 標籤與窗口管理
        function renderTagFilters() {
            const container = document.getElementById('tag-filters');
            container.innerHTML = '<button onclick="filterByTag(null)" class="px-3 py-1 bg-gray-200 rounded-full text-sm hover:bg-gray-300">全部</button>' +
                allTags.map(t => `<button onclick="filterByTag('${t.id}')" class="px-3 py-1 tag-${t.color} rounded-full text-sm hover:opacity-80">${t.name}</button>`).join('');
        }
        let currentTagFilter = null;
        window.filterByTag = function(tagId) { currentTagFilter = tagId; loadCustomers(); }

        window.openTagModal = function() { document.getElementById('tag-modal').classList.remove('hidden'); renderTagList(); }
        window.closeTagModal = function() { document.getElementById('tag-modal').classList.add('hidden'); }
        function renderTagList() {
            document.getElementById('tag-list-container').innerHTML = allTags.map(t => `
                <div class="flex justify-between items-center p-2 border rounded">
                    <span class="tag-${t.color} px-2 py-1 rounded text-sm">${t.name}</span>
                    <button onclick="deleteTag('${t.id}')" class="text-red-600 hover:text-red-800 text-sm">刪除</button>
                </div>
            `).join('');
        }
        window.addNewTag = async function() {
            const name = document.getElementById('new-tag-name').value.trim();
            const color = document.getElementById('new-tag-color').value;
            if (!name) return;
            await sb.from('tags').insert([{ name, color, category: 'customer' }]);
            document.getElementById('new-tag-name').value = '';
            await loadTags(); renderTagList();
        }
        window.deleteTag = async function(id) {
            if (!confirm('確定刪除此標籤？')) return;
            await sb.from('tags').delete().eq('id', id);
            await loadTags(); renderTagList();
        }

        window.openWindowModal = function() { document.getElementById('window-modal').classList.remove('hidden'); renderWindowList(); }
        window.closeWindowModal = function() { document.getElementById('window-modal').classList.add('hidden'); }
        function renderWindowList() {
            document.getElementById('window-list-container').innerHTML = allWindows.map(w => `
                <div class="flex justify-between items-center p-2 border rounded">
                    <span>${w.name} (${w.role === 'sales' ? '業務' : w.role === 'support' ? '客服' : '經理'})</span>
                    <button onclick="deleteWindow('${w.id}')" class="text-red-600 hover:text-red-800 text-sm">刪除</button>
                </div>
            `).join('');
        }
        window.addNewWindow = async function() {
            const name = document.getElementById('new-window-name').value.trim();
            const role = document.getElementById('new-window-role').value;
            if (!name) return;
            await sb.from('contact_windows').insert([{ name, role }]);
            document.getElementById('new-window-name').value = '';
            await loadWindows(); renderWindowList();
        }
        window.deleteWindow = async function(id) {
            if (!confirm('確定刪除此窗口？')) return;
            await sb.from('contact_windows').update({ is_active: false }).eq('id', id);
            await loadWindows(); renderWindowList();
        }

        // 客戶管理
        function toggleCompanyField() { document.getElementById('company-required').classList.toggle('hidden', document.getElementById('cust-type').value === 'B2C'); }
        
        window.openCustomerModal = function(customerId = null) {
            document.getElementById('customer-modal-title').textContent = customerId ? '️ 編輯客戶' : '📝 新增客戶';
            document.getElementById('customer-form').reset();
            document.getElementById('cust-id').value = customerId || '';
            document.getElementById('cust-type').value = 'B2C';
            toggleCompanyField();
            document.getElementById('cust-window').innerHTML = '<option value="">請選擇...</option>' + allWindows.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            renderCustomerTags();
            document.getElementById('customer-addresses-container').innerHTML = '';
            if (customerId) loadCustomerForEdit(customerId);
            else addCustomerAddress();
            document.getElementById('customer-modal').classList.remove('hidden');
        }
        window.closeCustomerModal = function() { document.getElementById('customer-modal').classList.add('hidden'); }

        function renderCustomerTags(selectedTags = []) {
            document.getElementById('customer-tags-container').innerHTML = allTags.map(t => `
                <label class="flex items-center gap-2 px-3 py-2 bg-white border rounded cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" value="${t.id}" ${selectedTags.includes(t.id) ? 'checked' : ''} class="cust-tag-checkbox">
                    <span class="tag-${t.color} px-2 py-1 rounded text-xs">${t.name}</span>
                </label>
            `).join('');
        }

        function updateAddressPreview() {
            const contact = document.getElementById('cust-contact').value;
            const phone = document.getElementById('cust-phone').value;
            document.querySelectorAll('#customer-addresses-container > div').forEach(div => {
                const recipientInput = div.querySelector('.addr-recipient');
                const phoneInput = div.querySelector('.addr-phone');
                if (!recipientInput.dataset.manual) recipientInput.value = contact;
                if (!phoneInput.dataset.manual) phoneInput.value = phone;
            });
        }

        function addCustomerAddress(addressData = null) {
            const container = document.getElementById('customer-addresses-container');
            const id = addressData?.id || 'new-' + Date.now();
            const type = addressData?.address_type || 'home';
            const contact = document.getElementById('cust-contact').value;
            const phone = document.getElementById('cust-phone').value;
            
            const div = document.createElement('div');
            div.className = 'border rounded-lg p-4 bg-gray-50';
            div.dataset.addressId = id;
            div.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold">地址 ${container.children.length + 1}</h4>
                    <button type="button" onclick="this.closest('.border').remove()" class="text-red-600 hover:text-red-800">刪除</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs font-bold mb-1">類型</label>
                        <select class="addr-type w-full px-3 py-2 border rounded">
                            <option value="home" ${type==='home'?'selected':''}> 住家</option><option value="office" ${type==='office'?'selected':''}> 公司</option>
                            <option value="cvs_711" ${type==='cvs_711'?'selected':''}> 7-11</option><option value="cvs_family" ${type==='cvs_family'?'selected':''}>🏪 全家</option>
                        </select>
                    </div>
                    <div><label class="block text-xs font-bold mb-1">聯絡窗口名</label><input type="text" class="addr-name w-full px-3 py-2 border rounded" value="${addressData?.address_name || ''}"></div>
                    <div><label class="block text-xs font-bold mb-1">收件人 *</label><input type="text" class="addr-recipient w-full px-3 py-2 border rounded" required value="${addressData?.recipient_name || contact || ''}" oninput="this.dataset.manual='true'"></div>
                    <div><label class="block text-xs font-bold mb-1">電話 *</label><input type="text" class="addr-phone w-full px-3 py-2 border rounded" required value="${addressData?.recipient_phone || phone || ''}" oninput="this.dataset.manual='true'"></div>
                    <div><label class="block text-xs font-bold mb-1">縣市</label><input type="text" class="addr-city w-full px-3 py-2 border rounded" value="${addressData?.city || ''}"></div>
                    <div><label class="block text-xs font-bold mb-1">區</label><input type="text" class="addr-district w-full px-3 py-2 border rounded" value="${addressData?.district || ''}"></div>
                    <div class="col-span-2"><label class="block text-xs font-bold mb-1">街道</label><input type="text" class="addr-street w-full px-3 py-2 border rounded" value="${addressData?.street || ''}"></div>
                    <div><label class="block text-xs font-bold mb-1">門市名稱</label><input type="text" class="addr-cvs-name w-full px-3 py-2 border rounded" value="${addressData?.cvs_store_name || ''}"></div>
                    <div><label class="block text-xs font-bold mb-1">門市代碼</label><input type="text" class="addr-cvs-code w-full px-3 py-2 border rounded" value="${addressData?.cvs_store_code || ''}"></div>
                    <div class="col-span-2"><label class="flex items-center gap-2"><input type="checkbox" class="addr-default" ${addressData?.is_default ? 'checked' : ''}><span class="text-sm font-bold">設為預設</span></label></div>
                </div>
            `;
            container.appendChild(div);
        }

        async function loadCustomerForEdit(id) {
            const { data: c } = await sb.from('customers').select('*, customer_tags(tag_id)').eq('id', id).single();
            if (!c) return;
            document.getElementById('cust-id').value = c.id;
            document.getElementById('cust-type').value = c.type;
            toggleCompanyField();
            document.getElementById('cust-company').value = c.company_name || '';
            document.getElementById('cust-tax-id').value = c.tax_id || '';
            document.getElementById('cust-invoice-title').value = c.invoice_title || c.company_name || '';
            document.getElementById('cust-contact').value = c.contact_person;
            document.getElementById('cust-phone').value = c.phone;
            document.getElementById('cust-email').value = c.email || '';
            document.getElementById('cust-window').value = c.primary_contact_window_id || '';
            renderCustomerTags(c.customer_tags?.map(ct => ct.tag_id) || []);
            const { data: addresses } = await sb.from('customer_addresses').select('*').eq('customer_id', id);
            document.getElementById('customer-addresses-container').innerHTML = '';
            if (addresses?.length) addresses.forEach(addr => addCustomerAddress(addr));
            else addCustomerAddress();
        }

        window.saveCustomer = async function() {
            const id = document.getElementById('cust-id').value;
            const type = document.getElementById('cust-type').value;
            const company = document.getElementById('cust-company').value;
            if (type === 'B2B' && !company) return alert('B2B 請填寫公司名稱！');
            if (!document.getElementById('cust-contact').value || !document.getElementById('cust-phone').value) return alert('聯絡人和電話必填！');

            const tagIds = Array.from(document.querySelectorAll('.cust-tag-checkbox:checked')).map(cb => cb.value);
            const customerData = {
                type, company_name: company || null, tax_id: document.getElementById('cust-tax-id').value || null,
                invoice_title: document.getElementById('cust-invoice-title').value || null,
                contact_person: document.getElementById('cust-contact').value, phone: document.getElementById('cust-phone').value,
                email: document.getElementById('cust-email').value || null,
                primary_contact_window_id: document.getElementById('cust-window').value || null
            };

            try {
                let customerId = id;
                if (id) await sb.from('customers').update(customerData).eq('id', id);
                else { const { data } = await sb.from('customers').insert([customerData]).select().single(); customerId = data.id; }

                await sb.from('customer_tags').delete().eq('customer_id', customerId);
                if (tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid => ({ customer_id: customerId, tag_id: tid })));

                await sb.from('customer_addresses').delete().eq('customer_id', customerId);
                const addressDivs = document.querySelectorAll('#customer-addresses-container > div');
                for (const div of addressDivs) {
                    await sb.from('customer_addresses').insert([{
                        customer_id: customerId,
                        address_type: div.querySelector('.addr-type').value,
                        address_name: div.querySelector('.addr-name').value,
                        recipient_name: div.querySelector('.addr-recipient').value,
                        recipient_phone: div.querySelector('.addr-phone').value,
                        city: div.querySelector('.addr-city').value,
                        district: div.querySelector('.addr-district').value,
                        street: div.querySelector('.addr-street').value,
                        cvs_store_name: div.querySelector('.addr-cvs-name').value,
                        cvs_store_code: div.querySelector('.addr-cvs-code').value,
                        is_default: div.querySelector('.addr-default').checked
                    }]);
                }
                alert('✅ 客戶已儲存！');
                closeCustomerModal();
                loadCustomers();
            } catch (err) { alert('儲存失敗：' + err.message); }
        }

        async function loadCustomers() {
            let query = sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id)');
            if (currentTagFilter) query = query.eq('customer_tags.tag_id', currentTagFilter);
            const { data } = await query.order('created_at', { ascending: false });
            allCustomers = data || [];

            if (!allCustomers.length) {
                document.getElementById('customer-table-body').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">尚無客戶</td></tr>';
                return;
            }

            document.getElementById('customer-table-body').innerHTML = allCustomers.map(c => {
                const tags = c.customer_tags?.map(ct => {
                    const tag = allTags.find(t => t.id === ct.tag_id);
                    return tag ? `<span class="tag-${tag.color} px-2 py-1 rounded text-xs mr-1">${tag.name}</span>` : '';
                }).join('') || '<span class="text-gray-400 text-xs">無</span>';

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full ${c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${c.type}</span></td>
                        <td class="px-6 py-4">
                            <div class="font-medium">${c.company_name || c.contact_person}</div>
                            <div class="text-xs text-gray-500">${c.phone}</div>
                        </td>
                        <td class="px-6 py-4 text-sm">${c.tax_id || '-'}</td>
                        <td class="px-6 py-4">${tags}</td>
                        <td class="px-6 py-4 text-sm">${c.contact_windows?.name || '<span class="text-gray-400">未分配</span>'}</td>
                        <td class="px-6 py-4">
                            <button onclick="viewCustomerDetail('${c.id}')" class="text-blue-600 hover:underline text-sm mr-2">詳情</button>
                            <button onclick="openCustomerModal('${c.id}')" class="text-green-600 hover:underline text-sm mr-2">編輯</button>
                            <button onclick="deleteCustomer('${c.id}')" class="text-red-600 hover:underline text-sm">刪除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.viewCustomerDetail = async function(id) {
            const { data: c } = await sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id), customer_addresses(*)').eq('id', id).single();
            if (!c) return;
            const addrMap = { home:'🏠住家', office:'公司', cvs_711:'🏪7-11', cvs_family:'全家' };
            document.getElementById('customer-detail-content').innerHTML = `
                <div class="space-y-4 text-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <div><b>類型:</b> ${c.type}</div>
                        <div><b>聯繫窗口:</b> ${c.contact_windows?.name || '未分配'}</div>
                        ${c.company_name ? `<div><b>公司名稱:</b> ${c.company_name}</div><div><b>統一編號:</b> ${c.tax_id || '-'}</div>` : ''}
                        <div><b>聯絡人:</b> ${c.contact_person}</div>
                        <div><b>電話:</b> ${c.phone}</div>
                        <div><b>Email:</b> ${c.email || '-'}</div>
                        <div class="col-span-2"><b>標籤:</b> ${c.customer_tags?.map(ct => { const t = allTags.find(x => x.id === ct.tag_id); return t ? `<span class="tag-${t.color} px-2 py-1 rounded text-xs mr-1">${t.name}</span>` : ''; }).join('') || '-'}</div>
                    </div>
                    <div class="border-t pt-3">
                        <h3 class="font-bold mb-2"> 地址列表</h3>
                        ${c.customer_addresses?.map(a => `
                            <div class="border p-3 rounded mb-2 ${a.is_default ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}">
                                <div class="font-bold">${addrMap[a.address_type] || a.address_type} ${a.is_default ? '<span class="text-blue-600 text-xs">(預設)</span>' : ''} ${a.address_name ? `(${a.address_name})` : ''}</div>
                                <div>${a.recipient_name} · ${a.recipient_phone}</div>
                                <div>${a.city || ''}${a.district || ''}${a.street || ''}</div>
                                ${a.cvs_store_name ? `<div> ${a.cvs_store_name} (${a.cvs_store_code || ''})</div>` : ''}
                            </div>
                        `).join('') || '<p class="text-gray-500">尚無地址</p>'}
                    </div>
                </div>
            `;
            document.getElementById('customer-detail-modal').classList.remove('hidden');
        }

        window.deleteCustomer = async function(id) {
            if (!confirm('確定刪除此客戶？相關訂單資料將保留。')) return;
            try {
                await sb.from('customer_tags').delete().eq('customer_id', id);
                await sb.from('customer_addresses').delete().eq('customer_id', id);
                const { error } = await sb.from('customers').delete().eq('id', id);
                if (error) throw error;
                alert('✅ 客戶已刪除');
                loadCustomers();
            } catch (err) { alert('刪除失敗：' + err.message); }
        }

        // 訂單管理
        window.openOrderModal = function(orderId = null) {
            editingOrderId = orderId;
            document.getElementById('order-modal-title').textContent = orderId ? '✏️ 編輯訂單' : '📝 新增訂單';
            document.getElementById('order-form').reset();
            document.getElementById('order-id').value = orderId || '';
            document.getElementById('selected-customer-id').value = '';
            document.getElementById('selected-customer-display').classList.add('hidden');
            document.getElementById('order-items-container').innerHTML = '';
            document.getElementById('temp-address-section').classList.add('hidden');
            currentCustomerTags = [];
            currentCustomerType = 'B2C';
            
            if (orderId) loadOrderForEdit(orderId);
            else addOrderItemRow();
            document.getElementById('order-modal').classList.remove('hidden');
        }
        window.closeOrderModal = function() { document.getElementById('order-modal').classList.add('hidden'); editingOrderId = null; originalOrderItems = []; }

        function toggleInvoiceFields() {
            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const fields = ['order-invoice-title', 'order-tax-id', 'order-invoice-type', 'order-invoice-no', 'order-tax-handling'];
            fields.forEach(id => document.getElementById(id).disabled = !needInvoice);
            
            if (needInvoice) {
                const customer = allCustomers.find(c => c.id === document.getElementById('selected-customer-id').value);
                if (customer) {
                    document.getElementById('order-invoice-title').value = customer.invoice_title || customer.company_name || '';
                    document.getElementById('order-tax-id').value = customer.tax_id || '';
                }
            } else {
                document.getElementById('order-invoice-title').value = '';
                document.getElementById('order-tax-id').value = '';
                document.getElementById('order-invoice-no').value = '';
            }
            calculateOrderFinalTotal();
        }

        let orderSearchTimer;
        document.getElementById('order-customer-search')?.addEventListener('input', (e) => {
            clearTimeout(orderSearchTimer);
            const kw = e.target.value.trim();
            const dd = document.getElementById('order-customer-dropdown');
            if (!kw) { dd.classList.add('hidden'); return; }
            orderSearchTimer = setTimeout(() => {
                const filtered = allCustomers.filter(c => (c.contact_person && c.contact_person.includes(kw)) || (c.company_name && c.company_name.includes(kw)) || (c.phone && c.phone.includes(kw)));
                dd.innerHTML = filtered.map(c => `<div class="search-item p-3 border-b" onclick="selectOrderCustomer('${c.id}', '${c.company_name || c.contact_person}', '${c.tax_id || ''}', '${c.invoice_title || ''}', '${JSON.stringify(c.customer_tags?.map(ct=>ct.tag_id) || [])}', '${c.type}')">${c.company_name || c.contact_person} - ${c.contact_person} (${c.phone})</div>`).join('') || '<div class="p-3 text-gray-500">無結果</div>';
                dd.classList.remove('hidden');
            }, 300);
        });

        window.selectOrderCustomer = async function(id, name, taxId, invoiceTitle, tagsJson, type) {
            document.getElementById('order-customer-dropdown').classList.add('hidden');
            document.getElementById('order-customer-search').value = name;
            document.getElementById('selected-customer-id').value = id;
            document.getElementById('selected-customer-display').textContent = `✅ ${name}`;
            document.getElementById('selected-customer-display').classList.remove('hidden');
            
            currentCustomerTags = JSON.parse(tagsJson);
            currentCustomerType = type;

            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            if (needInvoice) {
                document.getElementById('order-invoice-title').value = invoiceTitle || (type === 'B2B' ? name : '');
                document.getElementById('order-tax-id').value = taxId || '';
            }
            toggleInvoiceFields();

            const { data: addresses } = await sb.from('customer_addresses').select('*').eq('customer_id', id);
            const addrSelect = document.getElementById('shipping-address-select');
            addrSelect.innerHTML = '<option value="">選擇已存地址...</option>';
            if (addresses?.length) {
                const addrMap = { home:'', office:'🏢', cvs_711:'🏪', cvs_family:'全家' };
                addresses.forEach(a => {
                    const text = `${addrMap[a.address_type]||a.address_type} - ${a.address_name || a.street || a.cvs_store_name} (${a.recipient_name})`;
                    addrSelect.innerHTML += `<option value="${a.id}" ${a.is_default ? 'selected' : ''}>${text}</option>`;
                });
            }
            calculateOrderFinalTotal();
        }

        window.enableTempAddress = function() { document.getElementById('temp-address-section').classList.remove('hidden'); document.getElementById('shipping-address-select').value = ''; }
        window.selectSavedAddress = function() { document.getElementById('temp-address-section').classList.add('hidden'); }

        window.addOrderItemRow = function(productData = null) {
            const container = document.getElementById('order-items-container');
            const id = 'row-' + Date.now();
            const options = allProducts.map(p => `<option value="${p.id}" data-price="${p.sell_price}" ${productData?.product_id === p.id ? 'selected' : ''}>${p.name} - $${p.sell_price} (庫存: ${p.current_stock})</option>`).join('');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
            div.innerHTML = `
                <div class="flex-1"><label class="block text-xs font-bold mb-1">產品</label><select class="order-product w-full px-3 py-2 border rounded" onchange="updateItemPrice('${id}')"><option value="">選擇產品...</option>${options}</select></div>
                <div class="w-24"><label class="block text-xs font-bold mb-1">數量</label><input type="number" class="order-qty w-full px-3 py-2 border rounded" value="${productData?.quantity || 1}" min="1" onchange="calculateOrderFinalTotal()"></div>
                <div class="w-32"><label class="block text-xs font-bold mb-1">單價 (可調)</label><input type="number" class="order-price w-full px-3 py-2 border rounded" value="${productData?.unit_price || ''}" step="0.01" onchange="calculateOrderFinalTotal()"></div>
                <div class="w-32"><label class="block text-xs font-bold mb-1">小計</label><div class="order-subtotal px-3 py-2 font-bold">$0</div></div>
                <button type="button" onclick="document.getElementById('${id}').remove(); calculateOrderFinalTotal()" class="px-3 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200">✕</button>
            `;
            container.appendChild(div);
            if (productData?.unit_price) updateItemPrice(id, productData.unit_price);
            calculateOrderFinalTotal();
        }

        window.updateItemPrice = function(rowId, forcedPrice = null) {
            const row = document.getElementById(rowId);
            const select = row.querySelector('.order-product');
            const priceInput = row.querySelector('.order-price');
            if (forcedPrice !== null) priceInput.value = forcedPrice;
            else if (select.value) priceInput.value = select.options[select.selectedIndex].dataset.price;
            calculateOrderFinalTotal();
        }

        window.calculateOrderFinalTotal = function() {
            let subtotal = 0;
            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const price = parseFloat(row.querySelector('.order-price').value) || 0;
                const qty = parseInt(row.querySelector('.order-qty').value) || 0;
                const sub = price * qty;
                row.querySelector('.order-subtotal').textContent = '$' + sub.toLocaleString();
                subtotal += sub;
            });

            document.getElementById('display-subtotal').textContent = '$' + subtotal.toLocaleString();

            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const taxType = document.getElementById('order-tax-handling').value;
            let tax = 0;
            let finalTotal = subtotal;

            if (needInvoice) {
                if (taxType === 'tax_excluded') {
                    tax = subtotal * 0.05;
                    finalTotal = subtotal + tax;
                    document.getElementById('display-tax-row').classList.remove('hidden');
                    document.getElementById('order-tax-info').textContent = `稅外加：商品 $${subtotal} + 5% 稅金 $${Math.round(tax)} = 總計 $${Math.round(finalTotal)}`;
                } else if (taxType === 'tax_included') {
                    tax = subtotal * 0.05 / 1.05;
                    finalTotal = subtotal;
                    document.getElementById('display-tax-row').classList.remove('hidden');
                    document.getElementById('order-tax-info').textContent = `含稅價：總計 $${subtotal} (其中未稅 $${Math.round(subtotal - tax)}, 稅金 $${Math.round(tax)})`;
                } else {
                    document.getElementById('display-tax-row').classList.add('hidden');
                    document.getElementById('order-tax-info').textContent = '不開發票，無稅金';
                }
            } else {
                document.getElementById('display-tax-row').classList.add('hidden');
                document.getElementById('order-tax-info').textContent = '不開發票';
            }
            document.getElementById('display-tax').textContent = '$' + Math.round(tax).toLocaleString();

            let shippingFee = 0;
            let absorbedShipping = 0;
            const isVIP = currentCustomerTags.some(tagId => allTags.find(t => t.id === tagId)?.name === 'VIP');
            const threshold = isVIP ? 1000 : 2000;

            if (subtotal < threshold && subtotal > 0) {
                shippingFee = STANDARD_SHIPPING_FEE;
                absorbedShipping = 0;
            } else if (subtotal >= threshold) {
                shippingFee = 0;
                absorbedShipping = STANDARD_SHIPPING_FEE;
            }

            finalTotal += shippingFee;
            document.getElementById('display-shipping').textContent = '$' + shippingFee.toLocaleString();
            
            if (absorbedShipping > 0) {
                document.getElementById('display-absorbed-row').classList.remove('hidden');
                document.getElementById('display-absorbed').textContent = '$' + absorbedShipping.toLocaleString();
            } else {
                document.getElementById('display-absorbed-row').classList.add('hidden');
            }

            document.getElementById('order-total-amount').textContent = '$' + Math.round(finalTotal).toLocaleString();
        }

        window.submitOrder = async function() {
            const customerId = document.getElementById('selected-customer-id').value;
            if (!customerId) return alert('請選擇客戶！');
            
            const items = [];
            let subtotal = 0;
            document.querySelectorAll('#order-items-container > div').forEach(row => {
                const prodId = row.querySelector('.order-product').value;
                const qty = parseInt(row.querySelector('.order-qty').value) || 0;
                const price = parseFloat(row.querySelector('.order-price').value) || 0;
                if (prodId && qty > 0) { items.push({ product_id: prodId, quantity: qty, unit_price: price }); subtotal += price * qty; }
            });
            if (!items.length) return alert('請至少加入一筆產品！');

            const needInvoice = document.getElementById('order-need-invoice').value === 'yes';
            const taxType = document.getElementById('order-tax-handling').value;
            let tax = 0;
            if (needInvoice) {
                tax = taxType === 'tax_excluded' ? subtotal * 0.05 : (taxType === 'tax_included' ? subtotal * 0.05 / 1.05 : 0);
            }

            const isVIP = currentCustomerTags.some(tagId => allTags.find(t => t.id === tagId)?.name === 'VIP');
            const threshold = isVIP ? 1000 : 2000;
            let shippingFee = subtotal < threshold && subtotal > 0 ? STANDARD_SHIPPING_FEE : 0;
            let absorbedShipping = subtotal >= threshold ? STANDARD_SHIPPING_FEE : 0;
            const finalTotal = subtotal + tax + shippingFee;

            const orderData = {
                customer_id: customerId,
                total_amount: finalTotal,
                notes: document.getElementById('order-notes').value,
                status: 'confirmed',
                invoice_title: needInvoice ? document.getElementById('order-invoice-title').value : null,
                invoice_tax_id: needInvoice ? document.getElementById('order-tax-id').value : null,
                invoice_type: needInvoice ? document.getElementById('order-invoice-type').value : null,
                invoice_no: needInvoice ? document.getElementById('order-invoice-no').value : null,
                tax_handling: needInvoice ? taxType : 'no_invoice',
                tax_amount: tax,
                shipping_fee: shippingFee,
                absorbed_shipping_fee: absorbedShipping
            };

            try {
                if (editingOrderId) {
                    for (const item of originalOrderItems) {
                        const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                        if(prod) await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
                    }
                    await sb.from('order_items').delete().eq('order_id', editingOrderId);
                    await sb.from('orders').update(orderData).eq('id', editingOrderId);
                } else {
                    orderData.order_no = 'ORD-' + new Date().getFullYear() + '-' + Math.floor(Math.random()*10000).toString().padStart(4,'0');
                    const { data } = await sb.from('orders').insert([orderData]).select().single();
                    editingOrderId = data.id;
                }

                await sb.from('order_items').insert(items.map(item => ({ order_id: editingOrderId, product_id: item.product_id, quantity: item.quantity, unit_price: item.unit_price })));
                for (const item of items) {
                    const { data: prod } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                    if(prod) await sb.from('products').update({ current_stock: prod.current_stock - item.quantity }).eq('id', item.product_id);
                }

                alert('✅ 訂單已儲存！');
                closeOrderModal();
                loadOrders();
                loadDashboardData();
            } catch (err) { alert('儲存失敗：' + err.message); }
        }

        async function loadOrders() {
            const { data } = await sb.from('orders').select('*, customers(company_name, contact_person), contact_windows(name)').order('created_at', { ascending: false });
            if (!data?.length) { document.getElementById('order-table-body').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">尚無訂單</td></tr>'; return; }
            const statusMap = { pending:'🟡待處理', confirmed:'🔵已確認', shipped:'🟣已出貨', completed:'🟢已完成' };
            document.getElementById('order-table-body').innerHTML = data.map(o => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-bold">${o.order_no}</td>
                    <td class="px-6 py-4">${o.customers?.company_name || o.customers?.contact_person}</td>
                    <td class="px-6 py-4">$${Math.round(o.total_amount).toLocaleString()}</td>
                    <td class="px-6 py-4 text-sm">${o.invoice_no ? (o.invoice_type === '3' ? '三聯' : '二聯') : '無'}</td>
                    <td class="px-6 py-4">${statusMap[o.status] || o.status}</td>
                    <td class="px-6 py-4">
                        <button onclick="openOrderModal('${o.id}')" class="text-blue-600 hover:underline text-sm mr-2">編輯</button>
                        <button onclick="deleteOrder('${o.id}')" class="text-red-600 hover:underline text-sm">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadOrderForEdit(id) {
            const { data: order } = await sb.from('orders').select('*, order_items(*), customers(*)').eq('id', id).single();
            if (!order) return;
            originalOrderItems = order.order_items || [];
            const c = order.customers;
            if (c) selectOrderCustomer(c.id, c.company_name || c.contact_person, c.tax_id, c.invoice_title, JSON.stringify(c.customer_tags?.map(ct=>ct.tag_id) || []), c.type);
            
            document.getElementById('order-notes').value = order.notes || '';
            document.getElementById('order-need-invoice').value = order.invoice_no ? 'yes' : 'no';
            document.getElementById('order-invoice-title').value = order.invoice_title || '';
            document.getElementById('order-tax-id').value = order.invoice_tax_id || '';
            document.getElementById('order-invoice-type').value = order.invoice_type || '3';
            document.getElementById('order-invoice-no').value = order.invoice_no || '';
            document.getElementById('order-tax-handling').value = order.tax_handling || 'tax_included';
            toggleInvoiceFields();
            document.getElementById('order-items-container').innerHTML = '';
            order.order_items?.forEach(item => addOrderItemRow(item));
        }

        // 🚨 修復版：訂單刪除功能 (加入完整錯誤捕獲與防呆)
        window.deleteOrder = async function(id) {
            if (!confirm('確定刪除此訂單？刪除後庫存會自動回補。')) return;
            
            try {
                // 1. 取得訂單明細
                const { data: items, error: itemsError } = await sb.from('order_items').select('*').eq('order_id', id);
                if (itemsError) throw itemsError;

                // 2. 回補庫存 (加入防呆：如果產品被刪了，跳過該項)
                for (const item of (items || [])) {
                    const { data: prod, error: prodError } = await sb.from('products').select('current_stock').eq('id', item.product_id).single();
                    if (prodError || !prod) continue; 
                    await sb.from('products').update({ current_stock: prod.current_stock + item.quantity }).eq('id', item.product_id);
                }

                // 3. 刪除明細與訂單
                const { error: delItemsError } = await sb.from('order_items').delete().eq('order_id', id);
                if (delItemsError) throw delItemsError;

                const { error: delOrderError } = await sb.from('orders').delete().eq('id', id);
                if (delOrderError) throw delOrderError;

                alert('✅ 訂單已成功刪除，庫存已回補！');
                loadOrders();
                loadDashboardData();
            } catch (err) {
                console.error(err);
                alert('❌ 刪除失敗：' + err.message);
            }
        };

        async function loadWarehouseInventory() {
            const container = document.getElementById('warehouse-inventory-container');
            container.innerHTML = '';
            for (const warehouse of allWarehouses) {
                const { data: inventory } = await sb.from('product_inventory').select('*, products(name, sku, safety_stock)').eq('warehouse_id', warehouse.id);
                const div = document.createElement('div');
                div.className = 'bg-white rounded-lg shadow p-6';
                div.innerHTML = `<h3 class="text-xl font-bold mb-4">🏭 ${warehouse.name}</h3><table class="min-w-full"><thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left">產品</th><th class="px-4 py-2 text-left">SKU</th><th class="px-4 py-2 text-left">庫存</th><th class="px-4 py-2 text-left">狀態</th></tr></thead><tbody>${inventory?.map(inv => `<tr class="border-t"><td class="px-4 py-2">${inv.products?.name}</td><td class="px-4 py-2 text-sm text-gray-600">${inv.products?.sku}</td><td class="px-4 py-2 font-bold">${inv.quantity}</td><td class="px-4 py-2">${inv.quantity < (inv.products?.safety_stock || inv.safety_stock) ? '<span class="text-red-600 font-bold">⚠️ 低於安全庫存</span>' : '<span class="text-green-600">✓ 正常</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="px-4 py-2 text-center text-gray-500">無庫存資料</td></tr>'}</tbody></table>`;
                container.appendChild(div);
            }
        }

        (async () => { const { data: { session } } = await sb.auth.getSession(); if (session) { document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-system').classList.remove('hidden'); await loadInitialData(); } })();
    </script>
