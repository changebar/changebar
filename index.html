function searchCustomerInOrder() {
    const kw = document.getElementById('o-cust-search').value.toLowerCase();
    const select = document.getElementById('o-cust');
    const options = select.querySelectorAll('option');
    for (let i=0; i<options.length; i++) {
        const opt = options[i];
        const text = (opt.dataset.name || '').toLowerCase() + ' ' + (opt.dataset.phone || '').toLowerCase();
        opt.style.display = text.indexOf(kw) !== -1 ? 'block' : 'none';
    }
}

function fillCustomerData() {
    const custId = document.getElementById('o-cust').value;
    if (!custId) return;
    const cust = D.customers.find(function(c) { return c.id === custId; });
    if (!cust) return;
    document.getElementById('o-recv-name').value = cust.company_name || cust.contact_person || '';
    document.getElementById('o-recv-phone').value = cust.phone || '';
    document.getElementById('o-invoice-title').value = cust.invoice_title || '';
    document.getElementById('o-invoice-tax').value = cust.tax_id || '';
    loadCustomerDefaultAddress(custId);
}

async function loadCustomerDefaultAddress(custId) {
    const resp = await sb.from('customer_addresses').select('*').eq('customer_id', custId).eq('is_default', true).limit(1);
    if (resp.data && resp.data.length > 0) {
        const addr = resp.data[0];
        document.getElementById('o-recv-addr').value = addr.street || addr.cvs_store_name || '';
    }
}

function addOrdItem(typeFilter, prod, qty, price, hasInvoice, isGift) {
    const box = document.getElementById('o-items');
    const div = document.createElement('div');
    div.className = 'ord-item-row';
    const uid = 'ord_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);

    let prodOptionsHtml = '';
    const filtered = D.products.filter(p => p.type === typeFilter);
    for (let i=0; i<filtered.length; i++) {
        const p = filtered[i];
        const selected = (prod && prod.id === p.id) ? 'selected' : '';
        const displayPrice = p.sell_price || 0;
        prodOptionsHtml += '<div class="opt-item" data-id="' + p.id + '" data-price="' + displayPrice + '" data-name="' + p.name + '" ' + selected + ' onclick="selectOrdProduct(this, \'' + uid + '\')"><span class="opt-name">' + p.name + '</span><span class="opt-cost">(售價: ' + displayPrice + ')</span></div>';
    }
    if (!prodOptionsHtml) {
        prodOptionsHtml = '<div class="opt-item no-match">尚無此類商品</div>';
    }

    let defaultName = prod ? prod.name : '';
    let defaultPrice = prod ? (prod.sell_price || 0) : 0;
    const isFinished = (typeFilter === 'finished');
    const checkedAttr = (hasInvoice && isFinished) ? 'checked' : '';
    const giftChecked = isGift ? 'checked' : '';

    div.innerHTML = '<div class="prod-search-wrapper"><input type="text" class="pu-prod-search" placeholder="🔍 搜尋商品..." value="' + defaultName + '" autocomplete="off" oninput="filterOrdProdOptions(this, \'' + uid + '\')" onfocus="document.getElementById(\'ord_dropdown_' + uid + '\').classList.add(\'show\')" onblur="setTimeout(function(){document.getElementById(\'ord_dropdown_' + uid + '\').classList.remove(\'show\')},300)"><div class="pu-prod-select" id="ord_dropdown_' + uid + '">' + prodOptionsHtml + '</div><input type="hidden" class="pu-prod-id" value="' + (prod ? prod.id : '') + '"></div><input type="number" class="o-qty" value="' + (qty || 1) + '" min="1" oninput="calcOrd()"><input type="number" class="o-price" value="' + (price !== undefined ? price : defaultPrice) + '" step="0.01" oninput="calcOrd()">' + (isFinished ? '<div class="invoice-check"><input type="checkbox" class="o-has-invoice" ' + checkedAttr + ' onchange="calcOrd()" id="inv_' + uid + '"><label for="inv_' + uid + '">有</label></div>' : '') + '<div class="invoice-check"><input type="checkbox" class="o-is-gift" ' + giftChecked + ' onchange="calcOrd()" id="gift_' + uid + '"><label for="gift_' + uid + '">🎁贈品</label></div><button type="button" onclick="this.parentElement.remove(); calcOrd()" class="del-btn">✕</button>';
    box.appendChild(div);
    if (prod) {
        const hiddenInput = div.querySelector('.pu-prod-id');
        hiddenInput.value = prod.id;
        const priceInput = div.querySelector('.o-price');
        if (price !== undefined && price > 0) {
            priceInput.value = price;
        } else {
            priceInput.value = prod.sell_price || 0;
        }
    }
    setTimeout(calcOrd, 50);
}

function filterOrdProdOptions(input, uid) {
    const kw = input.value.toLowerCase();
    const dropdown = document.getElementById('ord_dropdown_' + uid);
    if (!dropdown) return;
    const items = dropdown.querySelectorAll('.opt-item');
    let hasMatch = false;
    for (let i=0; i<items.length; i++) {
        const item = items[i];
        if (item.classList.contains('no-match')) continue;
        const name = (item.dataset.name || '').toLowerCase();
        if (name.indexOf(kw) !== -1) {
            item.style.display = 'block';
            hasMatch = true;
        } else {
            item.style.display = 'none';
        }
    }
    let noMatch = dropdown.querySelector('.opt-item.no-match');
    if (!hasMatch) {
        if (!noMatch) {
            noMatch = document.createElement('div');
            noMatch.className = 'opt-item no-match';
            noMatch.textContent = '無符合商品';
            dropdown.appendChild(noMatch);
        }
        noMatch.style.display = 'block';
    } else {
        if (noMatch) noMatch.style.display = 'none';
    }
    dropdown.classList.add('show');
}

function selectOrdProduct(el, uid) {
    const id = el.dataset.id;
    const price = parseFloat(el.dataset.price) || 0;
    const name = el.dataset.name || '';
    const wrapper = document.getElementById('ord_dropdown_' + uid)?.closest('.prod-search-wrapper');
    if (!wrapper) return;
    const searchInput = wrapper.querySelector('.pu-prod-search');
    const hiddenInput = wrapper.querySelector('.pu-prod-id');
    const priceInput = wrapper.parentElement?.querySelector('.o-price');
    if (searchInput) searchInput.value = name;
    if (hiddenInput) hiddenInput.value = id;
    if (priceInput && !priceInput.dataset.userSet) {
        priceInput.value = price;
    }
    const dropdown = document.getElementById('ord_dropdown_' + uid);
    if (dropdown) dropdown.classList.remove('show');
    calcOrd();
}

function calcOrd() {
    let productSubtotal = 0;
    let totalCost = 0;
    const rows = document.querySelectorAll('#o-items .ord-item-row');
    for (let i=0; i<rows.length; i++) {
        const r = rows[i];
        const hiddenInput = r.querySelector('.pu-prod-id');
        if (!hiddenInput || !hiddenInput.value) continue;
        const productId = hiddenInput.value;
        const product = D.products.find(p => p.id === productId);
        if (!product) continue;
        const costPrice = product.cost_price || 0;
        const price = parseFloat(r.querySelector('.o-price').value) || 0;
        const qty = parseInt(r.querySelector('.o-qty').value) || 0;
        const isGift = r.querySelector('.o-is-gift')?.checked || false;
        if (!isGift) {
            productSubtotal += price * qty;
        }
        let finalCost = costPrice;
        const hasInvoiceCheck = r.querySelector('.o-has-invoice');
        if (hasInvoiceCheck && hasInvoiceCheck.checked && product.type === 'finished') {
            finalCost = costPrice * 1.05;
        }
        totalCost += finalCost * qty;
    }
    const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
    const shipPayer = document.getElementById('o-ship-payer').value;
    let finalShipping = 0;
    if (shipPayer === 'customer') finalShipping = shippingFee;
    const invType = document.getElementById('o-invoice-type').value;
    let taxAmount = 0;
    if (invType === 'tax_plus') taxAmount = productSubtotal * 0.05;
    const couponAmount = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
    const pointsAmount = parseFloat(document.getElementById('o-points-amount').value) || 0;
    const totalDiscount = couponAmount + pointsAmount;
    let amountAfterDiscount = productSubtotal + finalShipping + taxAmount - totalDiscount;
    if (amountAfterDiscount < 0) amountAfterDiscount = 0;
    const chSelect = document.getElementById('o-channel');
    const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
    const pmSelect = document.getElementById('o-payment');
    const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;
    const chCommission = amountAfterDiscount * (chRate / 100);
    const pmCommission = amountAfterDiscount * (pmRate / 100);
    const companyShippingCost = shipPayer === 'company' ? shippingFee : 0;
    const grossProfit = amountAfterDiscount - totalCost - chCommission - pmCommission - companyShippingCost;
    const margin = amountAfterDiscount > 0 ? (grossProfit / amountAfterDiscount) * 100 : 0;
    document.getElementById('o-total').textContent = Math.round(amountAfterDiscount).toLocaleString();
    document.getElementById('o-cost').textContent = totalCost.toLocaleString();
    document.getElementById('o-tax').textContent = Math.round(taxAmount).toLocaleString();
    document.getElementById('o-coupon-display').textContent = Math.round(couponAmount).toLocaleString();
    document.getElementById('o-points-display').textContent = Math.round(pointsAmount).toLocaleString();
    document.getElementById('o-ch-commission').textContent = Math.round(chCommission).toLocaleString();
    document.getElementById('o-pm-commission').textContent = Math.round(pmCommission).toLocaleString();
    document.getElementById('o-margin').textContent = margin.toFixed(1) + '%';
    document.getElementById('o-margin').className = margin >= 0 ? 'text-green-600' : 'text-red-600';
}

// ================================================================
//  saveOrd - 最終修正版（銀行餘額正確 + 費用編輯時不消失）
// ================================================================
async function saveOrd() {
    if (isSaving) return;
    isSaving = true;
    try {
        // ===== 1. 收集表單值 =====
        const cid = document.getElementById('o-cust').value;
        const wid = document.getElementById('o-warehouse').value;
        const bankId = document.getElementById('o-bank').value;
        const chId = document.getElementById('o-channel').value;
        const pmId = document.getElementById('o-payment').value;
        const recvName = document.getElementById('o-recv-name').value || null;
        const recvPhone = document.getElementById('o-recv-phone').value || null;
        const recvAddr = document.getElementById('o-recv-addr').value || null;
        const shippingFee = parseFloat(document.getElementById('o-shipping-fee').value) || 0;
        const shipPayer = document.getElementById('o-ship-payer').value;
        const invType = document.getElementById('o-invoice-type').value;
        const invNo = document.getElementById('o-invoice-no').value || null;
        const invTitle = document.getElementById('o-invoice-title').value || null;
        const invTax = document.getElementById('o-invoice-tax').value || null;
        const coupon = parseFloat(document.getElementById('o-coupon-amount').value) || 0;
        const points = parseFloat(document.getElementById('o-points-amount').value) || 0;
        const hasAdvance = document.getElementById('o-has-advance').checked;
        const advanceEmpId = hasAdvance ? (document.getElementById('o-advance-emp').value || null) : null;

        // ===== 2. 收集商品 =====
        const rows = document.querySelectorAll('#o-items .ord-item-row');
        const itemsData = [];
        let totalCost = 0;
        for (const r of rows) {
            const pid = r.querySelector('.pu-prod-id')?.value;
            if (!pid) continue;
            const qty = parseInt(r.querySelector('.o-qty').value) || 0;
            const price = parseFloat(r.querySelector('.o-price').value) || 0;
            if (qty <= 0) continue;
            const isGift = r.querySelector('.o-is-gift')?.checked || false;
            const hasInvoice = r.querySelector('.o-has-invoice')?.checked || false;
            itemsData.push({
                product_id: pid,
                quantity: qty,
                unit_price: price,
                has_invoice: hasInvoice,
                is_gift: isGift
            });
            const prod = D.products.find(p => p.id === pid);
            if (prod) {
                const cost = prod.cost_price || 0;
                const finalCost = (hasInvoice && prod.type === 'finished') ? cost * 1.05 : cost;
                totalCost += finalCost * qty;
            }
        }

        // ===== 3. 驗證必填 =====
        const missing = [];
        if (!cid) missing.push('客戶');
        if (!wid) missing.push('出貨倉庫');
        if (!bankId) missing.push('入款銀行帳戶');
        if (!chId) missing.push('銷售通路');
        if (!pmId) missing.push('付款方式');
        if (itemsData.length === 0) missing.push('至少一個商品');
        if (missing.length > 0) {
            showAlert('⚠️ 以下欄位尚未填寫，請補齊後再儲存：\n\n' + missing.join('\n'));
            isSaving = false;
            return;
        }

        // ===== 4. 計算總金額 =====
        let productTotal = 0;
        for (const item of itemsData) {
            const prod = D.products.find(p => p.id === item.product_id);
            if (!prod) continue;
            if (!item.is_gift) productTotal += item.unit_price * item.quantity;
        }
        const customerShipping = (shipPayer === 'customer') ? shippingFee : 0;
        const companyShipping = (shipPayer === 'company') ? shippingFee : 0;
        const taxAmount = (invType === 'tax_plus') ? productTotal * 0.05 : 0;
        const totalDiscount = coupon + points;
        let totalAmount = productTotal + customerShipping + taxAmount - totalDiscount;
        if (totalAmount < 0) totalAmount = 0;
        totalAmount = Math.round(totalAmount);

        // ===== 5. 計算費用 =====
        const chSelect = document.getElementById('o-channel');
        const chRate = chSelect.selectedIndex > 0 ? parseFloat(chSelect.options[chSelect.selectedIndex].dataset.rate) || 0 : 0;
        const pmSelect = document.getElementById('o-payment');
        const pmRate = pmSelect.selectedIndex > 0 ? parseFloat(pmSelect.options[pmSelect.selectedIndex].dataset.rate) || 0 : 0;
        const chCommission = Math.round(totalAmount * (chRate / 100));
        const pmCommission = Math.round(totalAmount * (pmRate / 100));
        const companyShippingCost = companyShipping;

        // ===== 6. 毛利率 =====
        const grossProfit = totalAmount - totalCost - chCommission - pmCommission - companyShippingCost;
        const margin = totalAmount > 0 ? (grossProfit / totalAmount) * 100 : 0;

        // ===== 7. 準備訂單資料 =====
        const orderNo = editingId ? (D.orders.find(o => o.id === editingId)?.order_no || 'ORD-' + Date.now()) : 'ORD-' + Date.now();
        const orderDate = new Date().toISOString();
        const dateStr = new Date(orderDate).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');
        const orderData = {
            customer_id: cid,
            warehouse_id: wid,
            bank_account_id: bankId,
            total_amount: totalAmount,
            gross_profit_margin: margin,
            status: 'shipped',
            order_no: orderNo,
            invoice_type: invType,
            invoice_no: invNo,
            invoice_title: invTitle,
            invoice_tax_id: invTax,
            shipping_fee: shippingFee,
            absorbed_shipping_fee: companyShippingCost,
            customer_paid_shipping: customerShipping,
            sales_channel_id: chId,
            payment_method_id: pmId,
            shipping_recv_name: recvName,
            shipping_recv_phone: recvPhone,
            shipping_address: recvAddr,
            shipping_advance_employee_id: advanceEmpId,
            is_subscription_order: false,
            subscription_days: 0,
            coupon_amount: coupon,
            points_amount: points,
            shipping_advance_amount: hasAdvance ? shippingFee : 0,
            shipping_advance_reimbursed: false,
            shipping_advance_bank_id: null,
            shipping_advance_reimbursed_date: null,
            created_at: orderDate
        };

        let orderId = editingId;
        let oldItems = [];
        let oldBankId = null;
        let oldTotalAmount = 0;
        let oldExpensesTotal = 0;
        let oldNetAmount = 0;

        // ================================================================
        //  8. 編輯模式
        // ================================================================
        if (editingId) {
            const oldOrderResp = await sb.from('orders').select('*').eq('id', editingId).maybeSingle();
            const oldOrder = oldOrderResp.data;
            if (!oldOrder) throw new Error('找不到要編輯的訂單');
            oldBankId = oldOrder.bank_account_id;
            oldTotalAmount = oldOrder.total_amount || 0;

            // 查詢舊的 expenses
            const oldExpensesResp = await sb.from('expenses').select('*').eq('related_order_id', editingId);
            const oldExpensesData = oldExpensesResp.data || [];
            oldExpensesTotal = oldExpensesData.reduce((sum, e) => sum + (e.amount || 0), 0);
            oldNetAmount = oldTotalAmount - oldExpensesTotal;

            const oldItemsResp = await sb.from('order_items').select('*').eq('order_id', editingId);
            oldItems = oldItemsResp.data || [];

            // 補回舊庫存
            for (const oldItem of oldItems) {
                const prod = D.products.find(p => p.id === oldItem.product_id);
                if (!prod) continue;
                if (['finished', 'gift_box', 'outer_box'].includes(prod.type)) {
                    const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', oldOrder.warehouse_id).eq('product_id', prod.id).maybeSingle();
                    if (inv.data) {
                        await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) + oldItem.quantity }).eq('id', inv.data.id);
                    } else {
                        await sb.from('warehouse_inventory').insert([{ warehouse_id: oldOrder.warehouse_id, product_id: prod.id, quantity: oldItem.quantity, safety_stock: 0 }]);
                    }
                }
                const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
                for (const bom of bomItems) {
                    const restoreQty = bom.quantity * oldItem.quantity;
                    const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
                    if (matInv.data && matInv.data.length > 0) {
                        let target = matInv.data.find(inv => inv.warehouse_id === oldOrder.warehouse_id);
                        if (!target) target = matInv.data[0];
                        await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) + restoreQty }).eq('id', target.id);
                    } else {
                        await sb.from('warehouse_inventory').insert([{ warehouse_id: oldOrder.warehouse_id, product_id: bom.child_product_id, quantity: restoreQty, safety_stock: 0 }]);
                    }
                }
            }

            await sb.from('order_items').delete().eq('order_id', editingId);
            await sb.from('expenses').delete().eq('related_order_id', editingId);

            const updateResult = await sb.from('orders').update(orderData).eq('id', editingId);
            if (updateResult.error) throw new Error('更新訂單失敗：' + updateResult.error.message);
            orderId = editingId;
        } else {
            // ================================================================
            //  9. 新增模式
            // ================================================================
            const insertResult = await sb.from('orders').insert([orderData]).select().single();
            if (insertResult.error) throw new Error('新增訂單失敗：' + insertResult.error.message);
            orderId = insertResult.data.id;
        }

        // ================================================================
        //  10. 插入新的 order_items
        // ================================================================
        if (itemsData.length > 0) {
            const itemsWithOrder = itemsData.map(item => ({ ...item, order_id: orderId }));
            const itemResult = await sb.from('order_items').insert(itemsWithOrder);
            if (itemResult.error) throw new Error('插入訂單明細失敗：' + itemResult.error.message);
        }

        // ================================================================
        //  11. 扣除新庫存
        // ================================================================
        for (const item of itemsData) {
            const prod = D.products.find(p => p.id === item.product_id);
            if (!prod) continue;
            if (['finished', 'gift_box', 'outer_box'].includes(prod.type)) {
                const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', wid).eq('product_id', prod.id).maybeSingle();
                if (inv.data) {
                    await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) - item.quantity }).eq('id', inv.data.id);
                } else {
                    await sb.from('warehouse_inventory').insert([{ warehouse_id: wid, product_id: prod.id, quantity: -item.quantity, safety_stock: 0 }]);
                }
            }
            const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
            for (const bom of bomItems) {
                const required = bom.quantity * item.quantity;
                const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
                if (matInv.data && matInv.data.length > 0) {
                    let target = matInv.data.find(inv => inv.warehouse_id === wid);
                    if (!target) target = matInv.data[0];
                    await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) - required }).eq('id', target.id);
                } else {
                    await sb.from('warehouse_inventory').insert([{ warehouse_id: wid, product_id: bom.child_product_id, quantity: -required, safety_stock: 0 }]);
                }
            }
        }

        // ================================================================
        //  12. ★★★ 準備新的費用記錄（先不插入，先計算總額） ★★★
        // ================================================================
        const expCats = D.expCats;
        const shippingCat = expCats.find(c => c.name === '運費');
        const channelCat = expCats.find(c => c.name === '通路抽成');
        const paymentCat = expCats.find(c => c.name === '付款手續費');
        const descPrefix = dateStr + ' ' + (recvName || '客戶');

        const newExpenses = [];
        // ★★★ 運費：只記錄一筆「公司吸收」 ★★★
        if (companyShippingCost > 0 && shippingCat) {
            const isReimbursed = !advanceEmpId;
            newExpenses.push({
                category_id: shippingCat.id,
                amount: Math.round(companyShippingCost),
                description: descPrefix + ' 運費（公司吸收）',
                payment_date: new Date().toISOString().split('T')[0],
                employee_id: advanceEmpId || null,
                is_reimbursed: isReimbursed,
                reimbursement_bank_id: isReimbursed ? bankId : null,
                reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null,
                related_order_id: orderId
            });
        }
        // 通路抽成
        if (chCommission > 0 && channelCat) {
            newExpenses.push({
                category_id: channelCat.id,
                amount: chCommission,
                description: descPrefix + ' 通路抽成 (' + chRate + '%)',
                payment_date: new Date().toISOString().split('T')[0],
                employee_id: null,
                is_reimbursed: true,
                reimbursement_bank_id: bankId,
                reimbursed_date: new Date().toISOString().split('T')[0],
                related_order_id: orderId
            });
        }
        // 付款手續費
        if (pmCommission > 0 && paymentCat) {
            newExpenses.push({
                category_id: paymentCat.id,
                amount: pmCommission,
                description: descPrefix + ' 付款手續費 (' + pmRate + '%)',
                payment_date: new Date().toISOString().split('T')[0],
                employee_id: null,
                is_reimbursed: true,
                reimbursement_bank_id: bankId,
                reimbursed_date: new Date().toISOString().split('T')[0],
                related_order_id: orderId
            });
        }

        // 計算新費用總額
        const newExpensesTotal = newExpenses.reduce((sum, e) => sum + e.amount, 0);
        const newNetAmount = totalAmount - newExpensesTotal;

        // ================================================================
        //  13. ★★★ 銀行餘額處理 ★★★
        // ================================================================
        if (editingId) {
            // ★★★ 編輯模式：根據銀行是否變更採取不同策略 ★★★
            if (oldBankId !== bankId) {
                // 情況1：銀行帳戶變更了 → 分別處理舊銀行和新銀行
                // 從舊銀行退回 oldNetAmount
                if (oldBankId && oldNetAmount > 0) {
                    const oldBank = await sb.from('bank_accounts').select('balance').eq('id', oldBankId).single();
                    if (oldBank.data) {
                        await sb.from('bank_accounts').update({
                            balance: (oldBank.data.balance || 0) + oldNetAmount
                        }).eq('id', oldBankId);
                    }
                }
                // 向新銀行存入 newNetAmount
                if (bankId && newNetAmount > 0) {
                    const newBank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
                    if (newBank.data) {
                        await sb.from('bank_accounts').update({
                            balance: (newBank.data.balance || 0) + newNetAmount
                        }).eq('id', bankId);
                    }
                }
            } else {
                // 情況2：銀行帳戶沒變 → 只調整差額（新淨額 - 舊淨額）
                const diff = newNetAmount - oldNetAmount;
                if (diff !== 0 && bankId) {
                    const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
                    if (bank.data) {
                        await sb.from('bank_accounts').update({
                            balance: (bank.data.balance || 0) + diff
                        }).eq('id', bankId);
                    }
                }
            }
        } else {
            // ★★★ 新增模式：銀行餘額增加新淨額 ★★★
            if (bankId && newNetAmount > 0) {
                const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
                if (bank.data) {
                    await sb.from('bank_accounts').update({
                        balance: (bank.data.balance || 0) + newNetAmount
                    }).eq('id', bankId);
                }
            }
        }

        // ================================================================
        //  14. ★★★ 插入費用記錄 ★★★
        // ================================================================
        if (newExpenses.length > 0) {
            for (const exp of newExpenses) {
                if (!exp.category_id) {
                    console.warn('⚠️ 跳過費用記錄，找不到對應類別：', exp.description);
                    continue;
                }
                const insertExpResult = await sb.from('expenses').insert([exp]);
                if (insertExpResult.error) {
                    console.warn('⚠️ 插入費用失敗：', insertExpResult.error.message);
                }
            }
        }

        // ================================================================
        //  15. 完成
        // ================================================================
        showAlert('✅ 出貨單已儲存！');
        window.closeModal();
        await loadAll();
        if (currentView === 'orders') {
            renderOrders(document.getElementById('main-content'));
        } else {
            render();
        }
    } catch (e) {
        console.error('儲存訂單失敗：', e);
        showAlert('❌ 儲存失敗：' + e.message);
    } finally {
        isSaving = false;
    }
}
// ================================================================
//  delOrd - 刪除訂單時正確扣除銀行餘額
// ================================================================
async function delOrd(id) {
    if (isDeleting) return;
    if (!confirm('確定刪除這筆訂單？刪除後庫存將自動補回，銀行款項也會退回。')) return;
    isDeleting = true;
    try {
        const orderResp = await sb.from('orders').select('*').eq('id', id).maybeSingle();
        const o = orderResp.data;
        if (!o) { showAlert('❌ 找不到訂單！'); isDeleting = false; return; }

        // ★★★ 刪除訂單：扣除銀行餘額（因為這筆收入被取消） ★★★
        if (o.bank_account_id && o.total_amount > 0) {
            const bank = D.banks.find(b => b.id === o.bank_account_id);
            if (bank) {
                await sb.from('bank_accounts').update({
                    balance: (bank.balance || 0) - o.total_amount
                }).eq('id', o.bank_account_id);
            }
        }

        // 取得舊訂單明細
        const itemsResp = await sb.from('order_items').select('*').eq('order_id', id);
        const items = itemsResp.data || [];

        // 補回庫存
        for (const item of items) {
            const prod = D.products.find(p => p.id === item.product_id);
            if (!prod) continue;
            if (['finished', 'gift_box', 'outer_box'].includes(prod.type)) {
                const inv = await sb.from('warehouse_inventory').select('id, quantity').eq('warehouse_id', o.warehouse_id).eq('product_id', prod.id).maybeSingle();
                if (inv.data) {
                    await sb.from('warehouse_inventory').update({ quantity: (inv.data.quantity || 0) + item.quantity }).eq('id', inv.data.id);
                } else {
                    await sb.from('warehouse_inventory').insert([{ warehouse_id: o.warehouse_id, product_id: prod.id, quantity: item.quantity, safety_stock: 0 }]);
                }
            }
            const bomItems = D.bom.filter(b => b.parent_product_id === prod.id);
            for (const bom of bomItems) {
                const restoreQty = bom.quantity * item.quantity;
                const matInv = await sb.from('warehouse_inventory').select('id, quantity, warehouse_id').eq('product_id', bom.child_product_id);
                if (matInv.data && matInv.data.length > 0) {
                    let target = matInv.data.find(inv => inv.warehouse_id === o.warehouse_id);
                    if (!target) target = matInv.data[0];
                    await sb.from('warehouse_inventory').update({ quantity: (target.quantity || 0) + restoreQty }).eq('id', target.id);
                } else {
                    await sb.from('warehouse_inventory').insert([{ warehouse_id: o.warehouse_id, product_id: bom.child_product_id, quantity: restoreQty, safety_stock: 0 }]);
                }
            }
        }

        // 刪除關聯資料（包含 expenses）
        await sb.from('expenses').delete().eq('related_order_id', id);
        await sb.from('order_items').delete().eq('order_id', id);
        await sb.from('orders').delete().eq('id', id);

        showAlert('✅ 訂單已刪除，庫存已補回！');
        await loadAll();
        render();
    } catch (e) {
        showAlert('❌ 刪除失敗：' + e.message);
        console.error('delOrd error:', e);
    } finally {
        isDeleting = false;
    }
}

async function viewOrdDetail(id) {
    const o = D.orders.find(function(x) { return x.id === id; });
    if (!o) return showAlert('找不到訂單');
    const c = D.customers.find(function(x) { return x.id === o.customer_id; });
    const w = D.warehouses.find(function(x) { return x.id === o.warehouse_id; });
    const ch = D.channels.find(function(x) { return x.id === o.sales_channel_id; });
    const pm = D.payments.find(function(x) { return x.id === o.payment_method_id; });
    const bank = D.banks.find(function(x) { return x.id === o.bank_account_id; });
    const itemsResp = await sb.from('order_items').select('*').eq('order_id', id);
    const items = itemsResp.data || [];
    let itemsHtml = '<table class="min-w-full text-sm mt-2"><thead><tr class="bg-gray-100"><th class="p-2 text-left">產品</th><th class="p-2 text-right">數量</th><th class="p-2 text-right">單價</th><th class="p-2 text-right">小計</th><th class="p-2 text-center">贈品</th></tr></thead><tbody>';
    let totalCost = 0;
    for (let i=0; i<items.length; i++) {
        const item = items[i];
        const p = D.products.find(function(x) { return x.id === item.product_id; });
        const subtotal = item.quantity * item.unit_price;
        const cost = p ? (p.cost_price || 0) * item.quantity : 0;
        totalCost += cost;
        itemsHtml += '<tr class="border-b"><td class="p-2">' + (p ? p.name : '未知') + '</td><td class="p-2 text-right">' + item.quantity + '</td><td class="p-2 text-right">' + item.unit_price + '</td><td class="p-2 text-right">' + subtotal.toLocaleString() + '</td><td class="p-2 text-center">' + (item.is_gift ? '🎁' : '') + '</td></tr>';
    }
    itemsHtml += '</tbody></table>';
    const invTypeText = o.invoice_type === 'tax_plus' ? '稅外加 (+5%)' : (o.invoice_type === 'yes' ? '有發票' : '無發票');
    const shipPayer = o.customer_paid_shipping > 0 ? '客戶支付' : '公司吸收';
    const marginColor = (o.gross_profit_margin || 0) >= 0 ? 'text-green-600' : 'text-red-600';
    const html = '<div class="space-y-4 text-sm"><div class="grid grid-cols-2 gap-4 bg-gray-50 p-3 rounded"><div><b>訂單編號:</b> '+o.order_no+'</div><div><b>日期:</b> '+new Date(o.created_at).toLocaleDateString()+'</div><div><b>客戶:</b> '+(c?c.company_name||c.contact_person:'-')+'</div><div><b>倉庫:</b> '+(w?w.name:'-')+'</div></div><div><b>📮 寄送地址:</b> '+(o.shipping_address||'無')+'</div><div class="grid grid-cols-2 gap-4 bg-yellow-50 p-3 rounded"><div><b> 發票:</b> '+invTypeText+'</div><div><b>號碼:</b> '+(o.invoice_no||'-')+'</div><div><b>抬頭:</b> '+(o.invoice_title||'-')+'</div><div><b>統編:</b> '+(o.invoice_tax_id||'-')+'</div></div><div class="grid grid-cols-2 gap-4 bg-blue-50 p-3 rounded"><div><b>️ 銷售通路:</b> '+(ch?ch.name:'-')+'</div><div><b>💳 付款方式:</b> '+(pm?pm.name:'-')+'</div><div><b>🏦 入款銀行:</b> '+(bank?bank.account_name:'-')+'</div><div><b>🚚 運費處理:</b> '+shipPayer+' ('+(o.shipping_fee||0)+')</div></div><div><b>📦 產品明細:</b>'+itemsHtml+'</div><div class="grid grid-cols-2 gap-4 bg-indigo-50 p-3 rounded font-bold text-lg"><div>總金額: <span class="text-indigo-600">'+(o.total_amount||0).toLocaleString()+'</span></div><div>毛利率: <span class="'+marginColor+'">'+(o.gross_profit_margin||0).toFixed(1)+'%</span></div></div></div>';
    openModal('訂單詳情', html, function(){return Promise.resolve();}, true);
}

console.log('✅ 全部模組已載入，所有功能完整。');
</script>
</body>
</html>
