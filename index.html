<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { 
  products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], 
  vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], 
  emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[]
};
let editingId = null, currentView = 'boss', bossMonth = new Date().toISOString().slice(0,7);
let bossDateRange = { start: bossMonth, end: bossMonth };
let isSaving = false;

const COLOR_NAMES = {
  '1': '紅色', '2': '粉色', '3': '紫色', '4': '靛藍', '5': '藍色',
  '6': '青色', '7': '綠色', '8': '黃綠', '9': '黃色', '10': '橘色'

  'gift_box': '禮盒',
  'outer_box': '外箱子'
};

window.toggleSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen = sidebar.classList.contains('open');
  
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    setTimeout(() => overlay.classList.add('hidden'), 250);
  } else {
    overlay.classList.remove('hidden');
    void overlay.offsetWidth; 
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
};

function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
}

document.getElementById('alert-ok-btn').addEventListener('click', () => {
  document.getElementById('alert-modal').classList.add('hidden');
});

// ESC键关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!document.getElementById('modal-overlay').classList.contains('hidden')) {
      window.closeModal();
    }
    if (!document.getElementById('alert-modal').classList.contains('hidden')) {
      document.getElementById('alert-modal').classList.add('hidden');
    }
  }
});

window.closeModal = function() {
  document.getElementById('modal-overlay').classList.add('hidden');
  editingId = null;
  isSaving = false;
  const saveBtn = document.getElementById('modal-save-btn');
  if(saveBtn) {
    saveBtn.disabled = false;
    saveBtn.textContent = '儲存 (Enter)';
    saveBtn.onclick = null;
  }
};

function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  isSaving = false;
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存 (Enter)';

  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { 
        await onSave(); 
      } catch(e) {
        console.error('Save error:', e);
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  cancelBtn.onclick = window.closeModal;
  closeBtn.onclick = window.closeModal;
  
  // Enter键保存（排除输入框）
  const handleEnter = (e) => {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      if (!hideSave && saveBtn.onclick) {
        saveBtn.click();
      }
    }
  };
  
  document.addEventListener('keydown', handleEnter, { once: true });
}

// 登入功能
document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  
  if(remember) localStorage.setItem('rememberedEmail', email);
  else localStorage.removeItem('rememberedEmail');
  
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showAlert('登入失敗：' + error.message);
    } else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      await loadAll();
      switchView('boss'); 
    }
  } catch(err) {
    showAlert('登入發生錯誤：' + err.message);
  }
});

window.addEventListener('load', () => {
  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }
});

document.getElementById('password').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
    if(window.innerWidth <= 768) toggleSidebar();
  });
});

async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    expCats:'expense_categories', orders:'orders', purchases:'purchases', 
    warehouseInv:'warehouse_inventory', customerTags:'customer_tags'
  };
  for (let key in map) {
    const { data } = await sb.from(map[key]).select('*');
    D[key] = data || [];
  }
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}

// ==================== 老闆查閱（完整功能：代墊款明細 + 日期範圍 + 庫存資產 + Excel 下載）====================
function renderBoss(c) {
  const [startY, startM] = bossDateRange.start.split('-').map(Number);
  const [endY, endM] = bossDateRange.end.split('-').map(Number);
  
  const monthOrders = D.orders.filter(o => { 
    const d = new Date(o.created_at); 
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  
  const rev = monthOrders.reduce((s,o)=>s+(o.total_amount||0),0);
  const monthPurchases = D.purchases.filter(p => { 
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  const pur = monthPurchases.reduce((s,p)=>s+(p.total_amount||0),0);
  
  const monthExpenses = D.expenses.filter(e => { 
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  const exp = monthExpenses.reduce((s,e)=>s+(e.amount||0),0);
  
  const monthSubs = D.subs.filter(s => { 
    if(!s.start_date) return false;
    const d = new Date(s.start_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  const sub = monthSubs.reduce((s,x)=>s+(x.amount||0),0);
  
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;
  
  // 代垫款明细（不随日期变化，显示所有待结帐）
  const unreimbursedExpenses = D.expenses.filter(e => e.employee_id && !e.is_reimbursed);
  const unreimbursedByEmp = {};
  unreimbursedExpenses.forEach(e => {
    const emp = D.emps.find(x => x.id === e.employee_id);
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += (e.amount || 0);
      unreimbursedByEmp[emp.name].items.push(e);
    }
  });
  
  // 库存资产计算（含明细，不随日期变化，显示当前库存）
  const inventoryByType = {};
  D.products.forEach(p => {
    const totalQty = D.warehouseInv.filter(i => i.product_id === p.id).reduce((sum, i) => sum + (i.quantity || 0), 0);
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({
        name: p.name,
        sku: p.sku,
        quantity: totalQty,
        cost: p.cost_price || 0,
        value: totalQty * (p.cost_price || 0)
      });
    }
  });
  
  const inventoryAssets = {
    finished: { count: 0, value: 0 },
    semi: { count: 0, value: 0 },
    gift_box: { count: 0, value: 0 },
    outer_box: { count: 0, value: 0 }
  };
  
  Object.values(inventoryByType).flat().forEach(item => {
    if(inventoryAssets[item.type]) {
      inventoryAssets[item.type].count += item.quantity;
      inventoryAssets[item.type].value += item.value;
    }
  });
  
  const totalInventoryValue = Object.values(inventoryAssets).reduce((s, x) => s + x.value, 0);
  
  const channelStats = {};
  monthOrders.forEach(o => {
    const ch = D.channels.find(x=>x.id===o.sales_channel_id);
    if(ch) {
      if(!channelStats[ch.name]) channelStats[ch.name] = {count:0, amount:0, commission:0};
      channelStats[ch.name].count++;
      channelStats[ch.name].amount += o.total_amount||0;
      channelStats[ch.name].commission += o.channel_commission||0;
    }
  });
  
  const paymentStats = {};
  monthOrders.forEach(o => {
    const pm = D.payments.find(x=>x.id===o.payment_method_id);
    if(pm) {
      if(!paymentStats[pm.name]) paymentStats[pm.name] = {count:0, amount:0, commission:0};

// Excel 下载功能（增强版：订单出货、采购入库、客户管理）
function downloadBossReport() {
  const [startY, startM] = bossDateRange.start.split('-').map(Number);
  const [endY, endM] = bossDateRange.end.split('-').map(Number);
  
  // 过滤订单
  const filteredOrders = D.orders.filter(o => { 
    const d = new Date(o.created_at); 
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  
  // 过滤采购
  const filteredPurchases = D.purchases.filter(p => { 
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && 
           (y < endY || (y === endY && m <= endM));
  });
  
  const wb = XLSX.utils.book_new();
  
  // 订单出货数据
  const orderData = filteredOrders.map(o => {
    const c = D.customers.find(x=>x.id===o.customer_id);
    const ch = D.channels.find(x=>x.id===o.sales_channel_id);
    const pm = D.payments.find(x=>x.id===o.payment_method_id);
    return {
      '日期': new Date(o.created_at).toLocaleDateString(),
      '訂單編號': o.order_no,
      '客戶': c?.company_name || c?.contact_person || '-',
      '銷售通路': ch?.name || '-',
      '付款方式': pm?.name || '-',
      '總金額': o.total_amount || 0,
      '發票號碼': o.invoice_no || '-',
      '狀態': o.status || '-',
      '訂閱訂單': o.is_subscription ? '是' : '否'
    };
  });
  
  const ws1 = XLSX.utils.json_to_sheet(orderData);
  XLSX.utils.book_append_sheet(wb, ws1, '訂單出貨');
  
  // 采购入库数据
  const purchaseData = filteredPurchases.map(p => {
    const v = D.vendors.find(x=>x.id===p.vendor_id);
    const w = D.warehouses.find(x=>x.id===p.warehouse_id);
    return {
      '日期': new Date(p.created_at).toLocaleDateString(),
      '採購單號': p.purchase_no,
      '廠商': v?.name || '-',
      '入庫倉庫': w?.name || '-',
      '總金額': p.total_amount || 0,
      '發票號碼': p.invoice_no || '-',
      '有無發票': p.has_invoice ? '有' : '無',
      '類型': p.is_invoice_purchase ? '購買發票' : '一般採購'
    };
  });
  
  const ws2 = XLSX.utils.json_to_sheet(purchaseData);
  XLSX.utils.book_append_sheet(wb, ws2, '採購入庫');
  
  // 客户管理数据
  const customerData = D.customers.map(c => {
    const win = D.windows.find(x=>x.id===c.primary_contact_window_id);
    return {
      '類型': c.type,
      '公司名稱': c.company_name || '-',
      '聯絡人': c.contact_person,
      '電話': c.phone,
      'Email': c.email || '-',
      '發票抬頭': c.invoice_title || '-',
      '統一編號': c.tax_id || '-',
      '主要窗口': win?.name || '-',
      '訂閱客戶': c.is_subscription ? '是' : '否',
      '訂閱週期': c.subscription_days ? `${c.subscription_days}天` : '-'
    };
  });
  
  const ws3 = XLSX.utils.json_to_sheet(customerData);
  XLSX.utils.book_append_sheet(wb, ws3, '客戶管理');
  
  // 下载，档案名称增加日期
  const today = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, `老闆查閱報表_${bossDateRange.start}_${bossDateRange.end}_${today}.xlsx`);
  showAlert('Excel 報表已下載！');
}

// 表格排序功能
function sortTable(tbodyId, colIndex) {
  const tbody = document.getElementById(tbodyId);
  const rows = Array.from(tbody.querySelectorAll('tr'));
  
  rows.sort((a, b) => {
    const aText = a.cells[colIndex]?.textContent || '';
    const bText = b.cells[colIndex]?.textContent || '';
    return aText.localeCompare(bText, 'zh-TW');
  });
  
  rows.forEach(row => tbody.appendChild(row));
}

function renderCustTable() {
  const kw = (document.getElementById('cust-search')?.value || '').toLowerCase();
  const list = D.customers.filter(c => {
    // 搜索客户基本信息
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().includes(kw);
    
    // 搜索标签
    const custTags = (D.customerTags || []).filter(ct => ct.customer_id === c.id);
    const tagMatch = custTags.some(ct => {
      const tag = D.tags.find(t => t.id === ct.tag_id);
      return tag && tag.name.toLowerCase().includes(kw);
    });
    
    return basicMatch || tagMatch;
  });
  
  document.getElementById('cust-tbody').innerHTML = list.map(c => {
    const win = D.windows.find(w=>w.id===c.primary_contact_window_id);
    const custTags = (D.customerTags || []).filter(ct => ct.customer_id === c.id).map(ct => {
      const tag = D.tags.find(t => t.id === ct.tag_id);
      return tag ? `<span class="tag-${tag.color} px-2 py-1 rounded text-xs mr-1">${tag.name}</span>` : '';

      <td class="px-4 py-3 text-sm">${c.invoice_title||'-'}<br><span class="text-gray-500">${c.tax_id||'-'}</span></td>

  if(!c) return showAlert('找不到客戶');
  
  const win = D.windows.find(w=>w.id===c.primary_contact_window_id);
  const custTags = (D.customerTags || []).filter(ct => ct.customer_id === c.id).map(ct => {
    const tag = D.tags.find(t => t.id === ct.tag_id);
    return tag ? `<span class="tag-${tag.color} px-2 py-1 rounded text-xs mr-1">${tag.name}</span>` : '';
  }).join('');
  
  const {data:addrs} = await sb.from('customer_addresses').select('*').eq('customer_id', id);
  const addrHtml = (addrs||[]).map(a => `
    <div class="border p-3 rounded mb-2 bg-gray-50">
      <div class="font-bold text-sm mb-1">${a.address_type} ${a.is_default?'(預設)':''}</div>
      <div class="text-sm">收件人：${a.recipient_name} (${a.recipient_phone})</div>
      <div class="text-sm text-gray-600">${a.street || a.cvs_store_name || '-'}</div>
    </div>
  `).join('') || '<p class="text-gray-500">無地址</p>';

  const html = `
    <div class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
        <div><b>類型:</b> ${c.type}</div>
        <div><b>主要窗口:</b> ${win?.name || '-'}</div>
        <div><b>公司:</b> ${c.company_name||'-'}</div>
        <div><b>統編:</b> ${c.tax_id||'-'}</div>
        <div><b>聯絡人:</b> ${c.contact_person}</div>
        <div><b>電話:</b> ${c.phone}</div>
        <div><b>Email:</b> ${c.email||'-'}</div>
        <div><b>聯絡窗口名:</b> ${c.contact_window_name||'-'}</div>
        <div><b>發票抬頭:</b> ${c.invoice_title||'-'}</div>
        <div class="md:col-span-2"><b>標籤:</b> ${custTags || '無'}</div>
        ${c.is_subscription ? `<div class="md:col-span-2 bg-indigo-50 p-2 rounded"><b>訂閱客戶:</b> 是 (週期: ${c.subscription_days} 天)</div>` : ''}
      </div>
      <div class="border-t pt-3">
        <h3 class="font-bold mb-2">寄送地址</h3>
        ${addrHtml}
      </div>
    </div>
  `;
  openModal('客戶詳情', html, null, true);
}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">類型</label><select id="c-type" class="w-full px-3 py-2 border rounded input-field"><option value="B2C" ${c?.type==='B2C'?'selected':''}>B2C</option><option value="B2B" ${c?.type==='B2B'?'selected':''}>B2B</option></select></div>
      <div><label class="block text-sm font-bold mb-1">主要聯繫窗口</label><select id="c-win" class="w-full px-3 py-2 border rounded input-field"><option value="">無</option>${D.windows.map(w=>`<option value="${w.id}" ${c?.primary_contact_window_id===w.id?'selected':''}>${w.name}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">公司/客戶名稱</label><input type="text" id="c-comp" class="w-full px-3 py-2 border rounded input-field" value="${c?.company_name||''}"></div>
      <div><label class="block text-sm font-bold mb-1">聯絡窗口名 (手動輸入)</label><input type="text" id="c-winname" class="w-full px-3 py-2 border rounded input-field" value="${c?.contact_window_name||''}"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input type="text" id="c-contact" class="w-full px-3 py-2 border rounded input-field" value="${c?.contact_person||''}" oninput="syncAddrContact()"></div>
      <div><label class="block text-sm font-bold mb-1">電話 *</label><input type="text" id="c-phone" class="w-full px-3 py-2 border rounded input-field" value="${c?.phone||''}" oninput="syncAddrContact()"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="c-title" class="w-full px-3 py-2 border rounded input-field" value="${c?.invoice_title||''}"></div>
      <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="c-tax" class="w-full px-3 py-2 border rounded input-field" value="${c?.tax_id||''}"></div>
    </div>
    <div class="mb-4"><label class="block text-sm font-bold mb-1">Email</label><input type="email" id="c-email" class="w-full px-3 py-2 border rounded input-field" value="${c?.email||''}"></div>
    
    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-200 mb-4">
      <h3 class="font-bold text-indigo-800 mb-2">🔄 訂閱客戶設定</h3>
      <label class="flex items-center gap-2 cursor-pointer mb-2">
        <input type="checkbox" id="c-is-sub" class="w-5 h-5 text-indigo-600 rounded" ${c?.is_subscription?'checked':''} onchange="document.getElementById('c-sub-days-box').style.display = this.checked ? 'block' : 'none'">
        <span class="font-medium">訂閱客戶</span>
      </label>
      <div id="c-sub-days-box" style="display:${c?.is_subscription?'block':'none'}">
        <label class="block text-sm font-bold mb-1">訂閱週期 (天數)</label>
        <select id="c-sub-days" class="w-full px-3 py-2 border rounded input-field">
          <option value="30" ${c?.subscription_days===30?'selected':''}>30 天 (月繳)</option>
          <option value="45" ${c?.subscription_days===45?'selected':''}>45 天</option>
          <option value="60" ${c?.subscription_days===60?'selected':''}>60 天 (雙月繳)</option>
        </select>
      </div>
    </div>

    <div class="mb-4"><label class="block text-sm font-bold mb-1">標籤</label><div id="c-tags" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50">${D.tags.map(t=>`<label class="flex items-center gap-2 px-3 py-2 bg-white border rounded cursor-pointer"><input type="checkbox" value="${t.id}" class="c-tag-cb" ${custTagIds.includes(t.id)?'checked':''}><span class="tag-${t.color} px-2 py-1 rounded text-xs">${t.name}</span></label>`).join('')}</div></div>
    
    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">寄送地址</h3><button type="button" onclick="addAddr()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm btn-touch">+ 新增地址</button></div>

    </div>

  openModal(id?'編輯客戶':'新增客戶', html, saveCust);
  
  // 编辑模式下正确带入地址
  if(id) {
    const {data:addrs} = await sb.from('customer_addresses').select('*').eq('customer_id', id);
    document.getElementById('addr-box').innerHTML = '';
    if(addrs && addrs.length > 0) {
      addrs.forEach(a => addAddr(a));
    } else {
      addAddr();
    }
  } else {
    addAddr(true);
  }
}

// 即時同步地址收件人和电话
function syncAddrContact() {
  const contact = document.getElementById('c-contact')?.value || '';
  const phone = document.getElementById('c-phone')?.value || '';
  const recvInputs = document.querySelectorAll('#addr-box .a-recv');
  const phoneInputs = document.querySelectorAll('#addr-box .a-phone');
  
  recvInputs.forEach(input => {
    if(!input.dataset.userEdited) input.value = contact;
  });
  phoneInputs.forEach(input => {
    if(!input.dataset.userEdited) input.value = phone;
  });
}

function addAddr(addrData = null, isDefault = false) {
  const box = document.getElementById('addr-box');
  const contact = document.getElementById('c-contact')?.value || '';
  const phone = document.getElementById('c-phone')?.value || '';
  const div = document.createElement('div');
  div.className = 'border rounded-lg p-4 bg-gray-50';
  
  // 编辑模式下使用已有数据，新增模式下使用联系人信息
  const recipientName = addrData?.recipient_name || contact;
  const recipientPhone = addrData?.recipient_phone || phone;
  const addressType = addrData?.address_type || 'home';
  const street = addrData?.street || '';
  const isDefaultChecked = addrData?.is_default || (isDefault && box.children.length === 0);
  
  div.innerHTML = `
    <div class="flex justify-between items-center mb-3">
      <label class="flex items-center gap-1 text-sm"><input type="checkbox" class="a-def" ${isDefaultChecked?'checked':''}><span>預設</span></label>
      <button type="button" onclick="this.closest('.border').remove()" class="text-red-600 btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div><label class="block text-xs font-bold mb-1">類型</label><select class="a-type w-full px-3 py-2 border rounded input-field">
        <option value="home" ${addressType==='home'?'selected':''}>住家</option>
        <option value="office" ${addressType==='office'?'selected':''}>公司</option>
        <option value="cvs_711" ${addressType==='cvs_711'?'selected':''}>7-11</option>
        <option value="cvs_family" ${addressType==='cvs_family'?'selected':''}>全家</option>
      </select></div>
      <div><label class="block text-xs font-bold mb-1">收件人</label><input type="text" class="a-recv w-full px-3 py-2 border rounded input-field" value="${recipientName}" oninput="this.dataset.userEdited='true'"></div>
      <div><label class="block text-xs font-bold mb-1">電話</label><input type="text" class="a-phone w-full px-3 py-2 border rounded input-field" value="${recipientPhone}" oninput="this.dataset.userEdited='true'"></div>
      <div><label class="block text-xs font-bold mb-1">地址/門市</label><input type="text" class="a-addr w-full px-3 py-2 border rounded input-field" value="${street}"></div>
    </div>
  `;
  box.appendChild(div);
}

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const isSub = document.getElementById('c-is-sub').checked;
  const subDays = isSub ? parseInt(document.getElementById('c-sub-days').value) : null;
  
  const data = {
    type: document.getElementById('c-type').value, 
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value, 
    phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null,
    invoice_title: document.getElementById('c-title').value||null,
    tax_id: document.getElementById('c-tax').value||null,
    email: document.getElementById('c-email').value||null,
    is_subscription: isSub,
    subscription_days: subDays
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  
  try {
    let cid = id;
    if(id) {
      await sb.from('customers').update(data).eq('id',id);
    } else {
      const {data:inserted} = await sb.from('customers').insert([data]).select().single();
      cid = inserted.id;
    }
    
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      addrs.push({ 
        customer_id:cid, 
        address_type:d.querySelector('.a-type').value, 
        recipient_name:d.querySelector('.a-recv').value, 
        recipient_phone:d.querySelector('.a-phone').value, 
        street:d.querySelector('.a-addr').value, 
        is_default:d.querySelector('.a-def').checked 
      });
    });
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    
    showAlert('客戶已儲存！'); 
    window.closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

async function delCust(id) {
  if(!confirm('確定刪除？')) return;
  try {
    await sb.from('customer_addresses').delete().eq('customer_id',id);
    await sb.from('customer_tags').delete().eq('customer_id',id);
    await sb.from('customers').delete().eq('id',id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('刪除失敗：'+e.message);
  }
}

function manageWindows() {
  const html = `<div class="flex gap-2 mb-4"><input type="text" id="w-name" placeholder="窗口姓名" class="flex-1 px-3 py-2 border rounded input-field"><button onclick="addWin()" class="px-4 py-2 bg-blue-600 text-white rounded btn-touch">新增</button></div><div id="win-list" class="space-y-2">${D.windows.map(w=>`<div class="flex justify-between p-2 border rounded"><span>${w.name}</span><button onclick="delWin('${w.id}')" class="text-red-600 text-sm btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></div>`).join('')}</div>`;
  openModal('管理聯繫窗口', html, null, true);
}
async function addWin() { const n = document.getElementById('w-name').value.trim(); if(!n) return showAlert('必填！'); await sb.from('contact_windows').insert([{name:n}]); await loadAll(); manageWindows(); }
async function delWin(id) { if(!confirm('確定刪除？')) return; await sb.from('contact_windows').delete().eq('id',id); await loadAll(); manageWindows(); }

function manageTags() {
  const html = `<div class="flex gap-2 mb-4"><input type="text" id="t-name" placeholder="標籤名稱" class="flex-1 px-3 py-2 border rounded input-field"><select id="t-color" class="px-3 py-2 border rounded input-field md:w-auto">${Object.entries(COLOR_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button onclick="addTag()" class="px-4 py-2 bg-blue-600 text-white rounded btn-touch">新增</button></div><div id="tag-list" class="space-y-2">${D.tags.map(t=>`<div class="flex justify-between p-2 border rounded"><span class="tag-${t.color} px-2 py-1 rounded text-sm">${t.name}</span><button onclick="delTag('${t.id}')" class="text-red-600 text-sm btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></div>`).join('')}</div>`;
  openModal('管理標籤', html, null, true);
}
async function addTag() { const n = document.getElementById('t-name').value.trim(); if(!n) return; await sb.from('tags').insert([{name:n, color:document.getElementById('t-color').value}]); await loadAll(); manageTags(); }
async function delTag(id) { if(!confirm('刪除?')) return; await sb.from('tags').delete().eq('id',id); await loadAll(); manageTags(); }
