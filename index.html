<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老闆退休管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; }
.hidden { display: none !important; }
.nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
.search-dropdown { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; width: 100%; }
.search-item:hover { background-color: #f3f4f6; cursor: pointer; }
.tag-1 { background-color: #f43f5e; color: white; }
.tag-2 { background-color: #ec4899; color: white; }
.tag-3 { background-color: #8b5cf6; color: white; }
.tag-4 { background-color: #6366f1; color: white; }
.tag-5 { background-color: #3b82f6; color: white; }
.tag-6 { background-color: #06b6d4; color: white; }
.tag-7 { background-color: #10b981; color: white; }
.tag-8 { background-color: #84cc16; color: white; }
.tag-9 { background-color: #eab308; color: black; }
.tag-10 { background-color: #f97316; color: white; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="login-view" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">企業戰情室登入</h1>
    <form class="space-y-4" onsubmit="return false;">
      <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded-md">
      <input type="password" id="password" placeholder="密碼" required class="w-full px-3 py-2 border rounded-md">
      <button type="button" id="login-btn" class="w-full py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">登入系統</button>
    </form>
  </div>
</div>

<div id="main-system" class="hidden min-h-screen flex">
  <aside class="w-64 bg-gray-800 text-white flex flex-col flex-shrink-0">
    <div class="p-4 text-xl font-bold border-b border-gray-700">退休管理系統</div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" onclick="switchView('dashboard')" id="nav-dashboard" class="block py-2 px-4 rounded hover:bg-gray-700 nav-active">儀表板</a>
      <a href="#" onclick="switchView('crm')" id="nav-crm" class="block py-2 px-4 rounded hover:bg-gray-700">客戶管理</a>
      <a href="#" onclick="switchView('orders')" id="nav-orders" class="block py-2 px-4 rounded hover:bg-gray-700">訂單管理</a>
      <a href="#" onclick="switchView('inventory')" id="nav-inventory" class="block py-2 px-4 rounded hover:bg-gray-700">倉庫庫存</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button id="logout-btn" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded text-sm">登出</button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <div id="view-dashboard">
      <h1 class="text-3xl font-bold mb-6">老闆，早安！戰情總覽：</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總客戶數</p><p id="stat-customers" class="text-3xl font-bold text-blue-600 mt-2">0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總訂單數</p><p id="stat-orders" class="text-3xl font-bold text-green-600 mt-2">0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">總營收</p><p id="stat-revenue" class="text-3xl font-bold text-purple-600 mt-2">$0</p></div>
        <div class="bg-white p-6 rounded-lg shadow"><p class="text-gray-500 text-sm">公司吸收運費</p><p id="stat-shipping-cost" class="text-3xl font-bold text-orange-600 mt-2">$0</p></div>
      </div>
    </div>

    <div id="view-crm" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">客戶關係管理</h1>
        <div class="space-x-2">
          <button onclick="openWindowModal()" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">管理聯繫窗口</button>
          <button onclick="openTagModal()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">管理標籤</button>
          <button onclick="openCustomerModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md font-bold">+ 新增客戶</button>
        </div>
      </div>
      <div class="mb-4 bg-white p-4 rounded-lg shadow">
        <h3 class="font-bold text-gray-700 mb-2">標籤快速分類：</h3>
        <div id="tag-filters" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="mb-4 relative">
        <input type="text" id="customer-search" placeholder="搜尋客戶姓名、公司、電話..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown mt-2 hidden"></div>
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">類型</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司/姓名 (電話)</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">統編</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">標籤</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
          <tbody id="customer-table-body" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <div id="view-orders" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">訂單管理</h1>
        <button onclick="openOrderModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 shadow-md font-bold">+ 新增訂單</button>
      </div>
      <div class="mb-4 relative">
        <input type="text" id="order-search" placeholder="搜尋訂單 (客戶名稱、發票號碼)..." class="w-full px-4 py-3 border rounded-lg shadow-sm text-lg" autocomplete="off">
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">訂單日期</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">客戶</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">總金額</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">發票</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead>
          <tbody id="order-table-body" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <div id="view-inventory" class="hidden">
      <h1 class="text-3xl font-bold mb-6">倉庫庫存管理</h1>
      <div id="warehouse-inventory-container" class="space-y-6"></div>
    </div>
  </main>
</div>

<!-- 客戶 Modal -->
<div id="customer-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
      <h2 id="customer-modal-title" class="text-2xl font-bold">新增客戶</h2>
      <button onclick="closeCustomerModal()" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1">
      <form id="customer-form" onsubmit="return false;" class="space-y-4">
        <input type="hidden" id="cust-id">
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">類型</label><select id="cust-type" class="w-full px-3 py-2 border rounded" onchange="toggleCompanyField()"><option value="B2C">B2C</option><option value="B2B">B2B</option></select></div>
          <div><label class="block text-sm font-bold mb-1">聯繫窗口</label><select id="cust-window" class="w-full px-3 py-2 border rounded"></select></div>
        </div>
        <div><label class="block text-sm font-bold mb-1">公司/客戶名稱 <span id="company-required" class="text-red-500 hidden">*</span></label><input type="text" id="cust-company" class="w-full px-3 py-2 border rounded"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="cust-tax-id" class="w-full px-3 py-2 border rounded"></div>
          <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="cust-invoice-title" class="w-full px-3 py-2 border rounded"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-bold mb-1">聯絡人 *</label><input type="text" id="cust-contact" required class="w-full px-3 py-2 border rounded" oninput="updateAddressPreview()"></div>
          <div><label class="block text-sm font-bold mb-1">電話 *</label><input type="text" id="cust-phone" required class="w-full px-3 py-2 border rounded" oninput="updateAddressPreview()"></div>
        </div>
        <div><label class="block text-sm font-bold mb-1">標籤</label><div id="customer-tags-container" class="flex flex-wrap gap-2 p-3 border rounded bg-gray-50"></div></div>
        <div class="border-t pt-4">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-lg">寄送地址管理</h3>
            <button type="button" onclick="addCustomerAddress()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">+ 新增地址</button>
          </div>
          <div id="customer-addresses-container" class="space-y-3"></div>
        </div>
      </form>
    </div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg flex-shrink-0">
      <button type="button" onclick="closeCustomerModal()" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button>
      <button type="button" onclick="saveCustomer()" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">儲存</button>
    </div>
  </div>
</div>

<!-- 訂單 Modal -->
<div id="order-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[90vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
      <h2 id="order-modal-title" class="text-2xl font-bold">新增訂單</h2>
      <button onclick="closeOrderModal()" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1">
      <form id="order-form" onsubmit="return false;" class="space-y-6">
        <input type="hidden" id="order-id">
        <div>
          <label class="block text-sm font-bold mb-2">1. 選擇客戶 *</label>
          <div class="relative">
            <input type="text" id="order-customer-search" placeholder="搜尋客戶..." class="w-full px-4 py-2 border rounded" autocomplete="off">
            <div id="order-customer-dropdown" class="search-dropdown mt-1 hidden"></div>
            <input type="hidden" id="selected-customer-id">
          </div>
          <p id="selected-customer-display" class="mt-2 text-sm text-blue-600 hidden"></p>
        </div>
        <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
          <h3 class="font-bold mb-3">發票與稅金資訊</h3>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="block text-sm font-bold mb-1">需要發票 *</label><select id="order-need-invoice" class="w-full px-3 py-2 border rounded" onchange="toggleInvoiceFields()"><option value="no">不需要</option><option value="yes">需要</option></select></div>
            <div><label class="block text-sm font-bold mb-1">稅金處理</label><select id="order-tax-handling" class="w-full px-3 py-2 border rounded" onchange="calculateOrderFinalTotal()"><option value="tax_included">含稅價</option><option value="tax_excluded">稅外加</option><option value="no_invoice">不開發票</option></select></div>
            <div><label class="block text-sm font-bold mb-1">發票類型</label><select id="order-invoice-type" class="w-full px-3 py-2 border rounded"><option value="3">三聯式</option><option value="2">二聯式</option></select></div>
            <div><label class="block text-sm font-bold mb-1">發票抬頭</label><input type="text" id="order-invoice-title" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-sm font-bold mb-1">統一編號</label><input type="text" id="order-tax-id" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-sm font-bold mb-1">發票號碼</label><input type="text" id="order-invoice-no" class="w-full px-3 py-2 border rounded"></div>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold mb-2">2. 寄送地址 *</label>
          <div class="flex gap-2 mb-2">
            <select id="shipping-address-select" class="flex-1 px-4 py-2 border rounded" onchange="selectSavedAddress()"><option value="">選擇已存地址...</option></select>
            <button type="button" onclick="enableTempAddress()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">手動輸入</button>
          </div>
          <div id="temp-address-section" class="hidden grid grid-cols-2 gap-4 p-4 bg-gray-50 rounded border">
            <div><label class="block text-xs font-bold mb-1">收件人</label><input type="text" id="temp-recipient" class="w-full px-3 py-2 border rounded"></div>
            <div><label class="block text-xs font-bold mb-1">電話</label><input type="text" id="temp-phone" class="w-full px-3 py-2 border rounded"></div>
            <div class="col-span-2"><label class="block text-xs font-bold mb-1">地址</label><input type="text" id="temp-address" class="w-full px-3 py-2 border rounded"></div>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold mb-2">3. 產品明細</label>
          <div id="order-items-container" class="space-y-3"></div>
          <button type="button" onclick="addOrderItemRow()" class="mt-3 px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">+ 新增產品</button>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg border-2 border-purple-200">
          <div class="flex justify-between items-start">
            <div class="space-y-2">
              <div class="text-sm text-gray-600">商品小計：<span id="display-subtotal" class="font-bold">$0</span></div>
              <div class="text-sm text-gray-600" id="display-tax-row">稅金：<span id="display-tax" class="font-bold">$0</span></div>
              <div class="text-sm text-gray-600">運費 (客戶支付)：<span id="display-shipping" class="font-bold">$0</span></div>
              <div class="text-sm text-orange-600 hidden" id="display-absorbed-row">公司吸收運費成本：<span id="display-absorbed" class="font-bold">$0</span></div>
              <div class="text-3xl font-bold text-purple-600 mt-4">訂單總金額：<span id="order-total-amount">$0</span></div>
            </div>
            <div class="w-1/2"><label class="block text-sm font-bold mb-1">備註</label><textarea id="order-notes" class="w-full px-3 py-2 border rounded" rows="3"></textarea></div>
          </div>
        </div>
      </form>
    </div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg flex-shrink-0">
      <button type="button" onclick="closeOrderModal()" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button>
      <button type="button" onclick="submitOrder()" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">儲存訂單</button>
    </div>
  </div>
</div>

<!-- 標籤 Modal -->
<div id="tag-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[80vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0"><h2 class="text-2xl font-bold">管理標籤</h2><button onclick="closeTagModal()" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button></div>
    <div class="p-6 overflow-y-auto flex-1">
      <div class="flex gap-2 mb-4"><input type="text" id="new-tag-name" placeholder="新標籤名稱" class="flex-1 px-3 py-2 border rounded"><select id="new-tag-color" class="px-3 py-2 border rounded"><option value="1">紅色</option><option value="2">粉色</option><option value="3">紫色</option><option value="4">靛藍</option><option value="5">藍色</option><option value="6">青色</option><option value="7">綠色</option><option value="8">黃綠</option><option value="9">黃色</option><option value="10">橘色</option></select><button onclick="addNewTag()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">新增</button></div>
      <div id="tag-list-container" class="space-y-2"></div>
    </div>
    <div class="p-4 border-t flex justify-end bg-gray-50 rounded-b-lg flex-shrink-0"><button onclick="closeTagModal()" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button></div>
  </div>
</div>

<!-- 窗口 Modal -->
<div id="window-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[80vh] flex flex-col">
    <div class="p-6 border-b flex justify-between items-center flex-shrink-0"><h2 class="text-2xl font-bold">管理聯繫窗口</h2><button onclick="closeWindowModal()" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button></div>
    <div class="p-6 overflow-y-auto flex-1">
      <div class="flex gap-2 mb-4"><input type="text" id="new-window-name" placeholder="窗口姓名" class="flex-1 px-3 py-2 border rounded"><select id="new-window-role" class="px-3 py-2 border rounded"><option value="sales">業務</option><option value="support">客服</option><option value="manager">經理</option></select><button onclick="addNewWindow()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">新增</button></div>
      <div id="window-list-container" class="space-y-2"></div>
    </div>
    <div class="p-4 border-t flex justify-end bg-gray-50 rounded-b-lg flex-shrink-0"><button onclick="closeWindowModal()" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">關閉</button></div>
  </div>
</div>

<!-- 自訂 Alert/Confirm -->
<div id="custom-alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 text-center">
    <p id="custom-alert-message" class="text-lg mb-6 text-gray-800">訊息內容</p>
    <div class="flex justify-center space-x-4">
      <button id="custom-alert-ok-btn" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">確定</button>
      <button id="custom-alert-cancel-btn" class="hidden px-6 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">取消</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allProducts = [], allWindows = [], allCustomers = [], allTags = [], allWarehouses = [];
let editingOrderId = null, originalOrderItems = [], currentCustomerTags = [], currentCustomerType = 'B2C', currentTagFilter = null;
const STANDARD_SHIPPING_FEE = 100;

function showAlert(message) {
  return new Promise(function(resolve) {
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-cancel-btn').classList.add('hidden');
    document.getElementById('custom-alert-modal').classList.remove('hidden');
    document.getElementById('custom-alert-ok-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve();
    };
  });
}

function showConfirm(message) {
  return new Promise(function(resolve) {
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-cancel-btn').classList.remove('hidden');
    document.getElementById('custom-alert-modal').classList.remove('hidden');
    document.getElementById('custom-alert-ok-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve(true);
    };
    document.getElementById('custom-alert-cancel-btn').onclick = function() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
      resolve(false);
    };
  });
}

document.getElementById('login-btn').addEventListener('click', function() {
  sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }).then(function(result) {
    if (result.error) { showAlert('登入失敗：' + result.error.message); }
    else {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('main-system').classList.remove('hidden');
      loadInitialData();
    }
  });
});

document.getElementById('logout-btn').addEventListener('click', function() {
  sb.auth.signOut().then(function() { location.reload(); });
});

function loadInitialData() {

}

function loadProducts() {

function loadDashboardData() {
  sb.from('customers').select('*', { count: 'exact', head: true }).then(function(result) {
    document.getElementById('stat-customers').textContent = result.count || 0;
  });
  sb.from('orders').select('total_amount, absorbed_shipping_fee').then(function(result) {
    if (result.error) {
      console.warn('訂單數據載入失敗:', result.error.message);
      document.getElementById('stat-orders').textContent = '0';
      document.getElementById('stat-revenue').textContent = '$0';
      document.getElementById('stat-shipping-cost').textContent = '$0';
    } else {
      var orders = result.data || [];
      document.getElementById('stat-orders').textContent = orders.length;
      var total = orders.reduce(function(s, o) { return s + (o.total_amount || 0); }, 0);
      document.getElementById('stat-revenue').textContent = '$' + total.toLocaleString();
      var absorbed = orders.reduce(function(s, o) { return s + (o.absorbed_shipping_fee || 0); }, 0);
      document.getElementById('stat-shipping-cost').textContent = '$' + absorbed.toLocaleString();
    }
  });
}

function loadCustomerForEdit(id) {
  sb.from('customers').select('*, customer_tags(tag_id)').eq('id', id).single().then(function(result) {
    var c = result.data;
    if (!c) return;
    document.getElementById('cust-id').value = c.id;
    document.getElementById('cust-type').value = c.type;
    toggleCompanyField();
    document.getElementById('cust-company').value = c.company_name || '';
    document.getElementById('cust-tax-id').value = c.tax_id || '';
    document.getElementById('cust-invoice-title').value = c.invoice_title || c.company_name || '';
    document.getElementById('cust-contact').value = c.contact_person;
    document.getElementById('cust-phone').value = c.phone;
    document.getElementById('cust-window').value = c.primary_contact_window_id || '';
    var tagIds = c.customer_tags ? c.customer_tags.map(function(ct) { return ct.tag_id; }) : [];
    renderCustomerTags(tagIds);
    sb.from('customer_addresses').select('*').eq('customer_id', id).then(function(addrResult) {
      document.getElementById('customer-addresses-container').innerHTML = '';
      var addresses = addrResult.data || [];
      if (addresses.length) {
        addresses.forEach(function(addr) { addCustomerAddress(addr); });
      } else {
        addCustomerAddress();
      }
    });
  });
}

window.saveCustomer = function() {
  var id = document.getElementById('cust-id').value;
  var type = document.getElementById('cust-type').value;
  var company = document.getElementById('cust-company').value;
  if (type === 'B2B' && !company) { showAlert('B2B 請填寫公司名稱！'); return; }
  if (!document.getElementById('cust-contact').value || !document.getElementById('cust-phone').value) { showAlert('聯絡人和電話必填！'); return; }

  var checkboxes = document.querySelectorAll('.cust-tag-checkbox:checked');
  var tagIds = [];
  for (var i = 0; i < checkboxes.length; i++) { tagIds.push(checkboxes[i].value); }

  var customerData = {
    type: type,
    company_name: company || null,
    tax_id: document.getElementById('cust-tax-id').value || null,
    invoice_title: document.getElementById('cust-invoice-title').value || null,
    contact_person: document.getElementById('cust-contact').value,
    phone: document.getElementById('cust-phone').value,
    primary_contact_window_id: document.getElementById('cust-window').value || null
  };

  var savePromise;
  if (id) {
    savePromise = sb.from('customers').update(customerData).eq('id', id);
  } else {
    savePromise = sb.from('customers').insert([customerData]).select().single();
  }

  savePromise.then(function(result) {
    var customerId = id || result.data.id;
    return sb.from('customer_tags').delete().eq('customer_id', customerId).then(function() {
      if (tagIds.length) {
        var inserts = tagIds.map(function(tid) { return { customer_id: customerId, tag_id: tid }; });
        return sb.from('customer_tags').insert(inserts);
      }
    });
  }).then(function() {
    return sb.from('customer_addresses').delete().eq('customer_id', document.getElementById('cust-id').value || document.getElementById('cust-id').value);
  }).then(function() {
    var addressDivs = document.querySelectorAll('#customer-addresses-container > div');
    var promises = [];
    for (var i = 0; i < addressDivs.length; i++) {
      var div = addressDivs[i];
      var custId = document.getElementById('cust-id').value;
      promises.push(sb.from('customer_addresses').insert([{
        customer_id: custId,
        address_type: div.querySelector('.addr-type').value,
        address_name: div.querySelector('.addr-name').value,
        recipient_name: div.querySelector('.addr-recipient').value,
        recipient_phone: div.querySelector('.addr-phone').value,
        city: div.querySelector('.addr-city').value,
        district: div.querySelector('.addr-district').value,
        street: div.querySelector('.addr-street').value,
        cvs_store_name: div.querySelector('.addr-cvs-name').value,
        cvs_store_code: div.querySelector('.addr-cvs-code').value,
        is_default: div.querySelector('.addr-default').checked
      }]));
    }
    return Promise.all(promises);
  }).then(function() {
    showAlert('客戶已儲存！');
    closeCustomerModal();
    loadCustomers();
  }).catch(function(err) {
    showAlert('儲存失敗：' + err.message);
  });
};

function loadCustomers() {
  var query = sb.from('customers').select('*, contact_windows(name), customer_tags(tag_id)');
  if (currentTagFilter) query = query.eq('customer_tags.tag_id', currentTagFilter);
  query.order('created_at', { ascending: false }).then(function(result) {
    allCustomers = result.data || [];
    if (!allCustomers.length) {
      document.getElementById('customer-table-body').innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">尚無客戶</td></tr>';
      return;
    }
    var html = '';
    allCustomers.forEach(function(c) {
      var tags = '';
      if (c.customer_tags) {
        c.customer_tags.forEach(function(ct) {
          var tag = allTags.find(function(t) { return t.id === ct.tag_id; });
          if (tag) tags += '<span class="tag-' + tag.color + ' px-2 py-1 rounded text-xs mr-1">' + tag.name + '</span>';
        });
      }
      html += '<tr class="hover:bg-gray-50"><td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full ' + (c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800') + '">' + c.type + '</span></td><td class="px-6 py-4"><div class="font-medium">' + (c.company_name || c.contact_person) + '</div><div class="text-xs text-gray-500">' + c.phone + '</div></td><td class="px-6 py-4 text-sm">' + (c.tax_id || '-') + '</td><td class="px-6 py-4">' + tags + '</td><td class="px-6 py-4"><button onclick="viewCustomerDetail(\'' + c.id + '\')" class="text-blue-600 hover:underline text-sm mr-2">詳情</button><button onclick="openCustomerModal(\'' + c.id + '\')" class="text-green-600 hover:underline text-sm mr-2">編輯</button><button onclick="deleteCustomer(\'' + c.id + '\')" class="text-red-600 hover:underline text-sm">刪除</button></td></tr>';
    });
    document.getElementById('customer-table-body').innerHTML = html;
  });
}

  orderSearchTimer2 = setTimeout(function() {
    var filtered = allCustomers.filter(function(c) {
      return (c.contact_person && c.contact_person.indexOf(kw) !== -1) || (c.company_name && c.company_name.indexOf(kw) !== -1) || (c.phone && c.phone.indexOf(kw) !== -1);
    });
    var html = '';
    if (filtered.length === 0) {
      html = '<div class="p-3 text-gray-500">無結果</div>';
    } else {
      filtered.forEach(function(c) {
        var tagsJson = c.customer_tags ? JSON.stringify(c.customer_tags.map(function(ct) { return ct.tag_id; })) : '[]';
        html += '<div class="search-item p-3 border-b" onclick="selectOrderCustomer(\'' + c.id + '\', \'' + (c.company_name || c.contact_person) + '\', \'' + (c.tax_id || '') + '\', \'' + (c.invoice_title || '') + '\', \'' + tagsJson + '\', \'' + c.type + '\')">' + (c.company_name || c.contact_person) + ' - ' + c.contact_person + ' (' + c.phone + ')</div>';
      });
    }
    dd.innerHTML = html;
    dd.classList.remove('hidden');
  }, 300);
});

window.selectOrderCustomer = function(id, name, taxId, invoiceTitle, tagsJson, type) {
  document.getElementById('order-customer-dropdown').classList.add('hidden');
  document.getElementById('order-customer-search').value = name;
  document.getElementById('selected-customer-id').value = id;
  document.getElementById('selected-customer-display').textContent = '已選擇：' + name;
  document.getElementById('selected-customer-display').classList.remove('hidden');
  currentCustomerTags = JSON.parse(tagsJson);
  currentCustomerType = type;
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  if (needInvoice) {
    document.getElementById('order-invoice-title').value = invoiceTitle || (type === 'B2B' ? name : '');
    document.getElementById('order-tax-id').value = taxId || '';
  }
  toggleInvoiceFields();
  sb.from('customer_addresses').select('*').eq('customer_id', id).then(function(result) {
    var addresses = result.data || [];
    var addrSelect = document.getElementById('shipping-address-select');
    addrSelect.innerHTML = '<option value="">選擇已存地址...</option>';
    addresses.forEach(function(a) {
      var text = (a.address_type || '') + ' - ' + (a.address_name || a.street || a.cvs_store_name || '') + ' (' + a.recipient_name + ')';
      addrSelect.innerHTML += '<option value="' + a.id + '" ' + (a.is_default ? 'selected' : '') + '>' + text + '</option>';
    });
  });
  calculateOrderFinalTotal();
};

window.enableTempAddress = function() {
  document.getElementById('temp-address-section').classList.remove('hidden');
  document.getElementById('shipping-address-select').value = '';
};

window.selectSavedAddress = function() {
  document.getElementById('temp-address-section').classList.add('hidden');
};

window.addOrderItemRow = function(productData) {
  var container = document.getElementById('order-items-container');
  var id = 'row-' + Date.now();
  var options = '<option value="">選擇產品...</option>';
  allProducts.forEach(function(p) {
    var selected = productData && productData.product_id === p.id ? 'selected' : '';
    options += '<option value="' + p.id + '" data-price="' + p.sell_price + '" ' + selected + '>' + p.name + ' - $' + p.sell_price + ' (庫存: ' + p.current_stock + ')</option>';
  });
  var div = document.createElement('div');
  div.id = id;
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded';
  div.innerHTML = '<div class="flex-1"><label class="block text-xs font-bold mb-1">產品</label><select class="order-product w-full px-3 py-2 border rounded" onchange="updateItemPrice(\'' + id + '\')">' + options + '</select></div><div class="w-24"><label class="block text-xs font-bold mb-1">數量</label><input type="number" class="order-qty w-full px-3 py-2 border rounded" value="' + (productData ? productData.quantity : 1) + '" min="1" onchange="calculateOrderFinalTotal()"></div><div class="w-32"><label class="block text-xs font-bold mb-1">單價</label><input type="number" class="order-price w-full px-3 py-2 border rounded" value="' + (productData ? productData.unit_price : '') + '" step="0.01" onchange="calculateOrderFinalTotal()"></div><div class="w-32"><label class="block text-xs font-bold mb-1">小計</label><div class="order-subtotal px-3 py-2 font-bold">$0</div></div><button type="button" onclick="document.getElementById(\'' + id + '\').remove(); calculateOrderFinalTotal()" class="px-3 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200">X</button>';
  container.appendChild(div);
  if (productData && productData.unit_price) updateItemPrice(id, productData.unit_price);
  calculateOrderFinalTotal();
};

window.updateItemPrice = function(rowId, forcedPrice) {
  var row = document.getElementById(rowId);
  var select = row.querySelector('.order-product');
  var priceInput = row.querySelector('.order-price');
  if (forcedPrice !== null && forcedPrice !== undefined) priceInput.value = forcedPrice;
  else if (select.value) priceInput.value = select.options[select.selectedIndex].dataset.price;
  calculateOrderFinalTotal();
};

window.calculateOrderFinalTotal = function() {
  var subtotal = 0;
  var rows = document.querySelectorAll('#order-items-container > div');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var price = parseFloat(row.querySelector('.order-price').value) || 0;
    var qty = parseInt(row.querySelector('.order-qty').value) || 0;
    row.querySelector('.order-subtotal').textContent = '$' + (price * qty).toLocaleString();
    subtotal += price * qty;
  }
  document.getElementById('display-subtotal').textContent = '$' + subtotal.toLocaleString();
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  var taxType = document.getElementById('order-tax-handling').value;
  var tax = 0;
  if (needInvoice) {
    if (taxType === 'tax_excluded') {
      tax = subtotal * 0.05;
      document.getElementById('display-tax-row').classList.remove('hidden');
    } else if (taxType === 'tax_included') {
      tax = subtotal * 0.05 / 1.05;
      document.getElementById('display-tax-row').classList.remove('hidden');
    } else {
      document.getElementById('display-tax-row').classList.add('hidden');
    }
  } else {
    document.getElementById('display-tax-row').classList.add('hidden');
  }
  document.getElementById('display-tax').textContent = '$' + Math.round(tax).toLocaleString();
  var shippingFee = 0, absorbedShipping = 0;
  var isVIP = currentCustomerTags.some(function(tagId) {
    var tag = allTags.find(function(t) { return t.id === tagId; });
    return tag && tag.name === 'VIP';
  });
  var threshold = isVIP ? 1000 : 2000;
  if (subtotal < threshold && subtotal > 0) shippingFee = STANDARD_SHIPPING_FEE;
  else if (subtotal >= threshold) absorbedShipping = STANDARD_SHIPPING_FEE;
  document.getElementById('display-shipping').textContent = '$' + shippingFee.toLocaleString();
  if (absorbedShipping > 0) {
    document.getElementById('display-absorbed-row').classList.remove('hidden');
    document.getElementById('display-absorbed').textContent = '$' + absorbedShipping.toLocaleString();
  } else {
    document.getElementById('display-absorbed-row').classList.add('hidden');
  }
  document.getElementById('order-total-amount').textContent = '$' + Math.round(subtotal + tax + shippingFee).toLocaleString();
};

window.submitOrder = function() {
  var customerId = document.getElementById('selected-customer-id').value;
  if (!customerId) { showAlert('請選擇客戶！'); return; }
  var items = [];
  var subtotal = 0;
  var rows = document.querySelectorAll('#order-items-container > div');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var prodId = row.querySelector('.order-product').value;
    var qty = parseInt(row.querySelector('.order-qty').value) || 0;
    var price = parseFloat(row.querySelector('.order-price').value) || 0;
    if (prodId && qty > 0) {
      items.push({ product_id: prodId, quantity: qty, unit_price: price });
      subtotal += price * qty;
    }
  }
  if (!items.length) { showAlert('請至少加入一筆產品！'); return; }
  var needInvoice = document.getElementById('order-need-invoice').value === 'yes';
  var taxType = document.getElementById('order-tax-handling').value;
  var tax = needInvoice ? (taxType === 'tax_excluded' ? subtotal * 0.05 : (taxType === 'tax_included' ? subtotal * 0.05 / 1.05 : 0)) : 0;
  var isVIP = currentCustomerTags.some(function(tagId) {
    var tag = allTags.find(function(t) { return t.id === tagId; });
    return tag && tag.name === 'VIP';
  });
  var threshold = isVIP ? 1000 : 2000;
  var shippingFee = subtotal < threshold && subtotal > 0 ? STANDARD_SHIPPING_FEE : 0;
  var absorbedShipping = subtotal >= threshold ? STANDARD_SHIPPING_FEE : 0;
  var finalTotal = subtotal + tax + shippingFee;
  var orderData = {
    customer_id: customerId,
    total_amount: finalTotal,
    notes: document.getElementById('order-notes').value,
    status: 'confirmed',
    invoice_title: needInvoice ? document.getElementById('order-invoice-title').value : null,
    invoice_tax_id: needInvoice ? document.getElementById('order-tax-id').value : null,
    invoice_type: needInvoice ? document.getElementById('order-invoice-type').value : null,
    invoice_no: needInvoice ? document.getElementById('order-invoice-no').value : null,
    tax_handling: needInvoice ? taxType : 'no_invoice',
    tax_amount: tax,
    shipping_fee: shippingFee,
    absorbed_shipping_fee: absorbedShipping
  };

  var savePromise;
  if (editingOrderId) {
    var restorePromises = [];
    for (var i = 0; i < originalOrderItems.length; i++) {
      var item = originalOrderItems[i];
      restorePromises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(result) {
        if (result.data) {
          return sb.from('products').update({ current_stock: result.data.current_stock + item.quantity }).eq('id', item.product_id);
        }
      }));
    }
    savePromise = Promise.all(restorePromises).then(function() {
      return sb.from('order_items').delete().eq('order_id', editingOrderId);
    }).then(function() {
      return sb.from('orders').update(orderData).eq('id', editingOrderId);
    });
  } else {
    orderData.order_no = 'ORD-' + new Date().getFullYear() + '-' + Math.floor(Math.random()*10000).toString().padStart(4,'0');
    savePromise = sb.from('orders').insert([orderData]).select().single();
  }

  savePromise.then(function(result) {
    var orderId = editingOrderId || result.data.id;
    var itemInserts = items.map(function(item) {
      return { order_id: orderId, product_id: item.product_id, quantity: item.quantity, unit_price: item.unit_price };
    });
    return sb.from('order_items').insert(itemInserts).then(function() {
      var stockPromises = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        stockPromises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(result) {
          if (result.data) {
            return sb.from('products').update({ current_stock: result.data.current_stock - item.quantity }).eq('id', item.product_id);
          }
        }));
      }
      return Promise.all(stockPromises);
    });
  }).then(function() {
    showAlert('訂單已儲存！');
    closeOrderModal();
    loadOrders();
    loadDashboardData();
  }).catch(function(err) {
    showAlert('儲存失敗：' + err.message);
  });
};

function loadOrders(searchKw) {
  if (!searchKw) searchKw = '';
  sb.from('orders').select('*, customers(company_name, contact_person)').order('created_at', { ascending: false }).then(function(result) {
    var data = result.data || [];
    if (!data.length) {
      document.getElementById('order-table-body').innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">尚無訂單</td></tr>';
      return;
    }
    var filteredData = data;
    if (searchKw) {
      filteredData = data.filter(function(o) {
        var customerName = (o.customers && (o.customers.company_name || o.customers.contact_person) || '').toLowerCase();
        var invoiceNo = (o.invoice_no || '').toLowerCase();
        return customerName.indexOf(searchKw) !== -1 || invoiceNo.indexOf(searchKw) !== -1;
      });
    }
    var html = '';
    filteredData.forEach(function(o) {
      var dateObj = new Date(o.created_at);
      var dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0') + ' ' + String(dateObj.getHours()).padStart(2,'0') + ':' + String(dateObj.getMinutes()).padStart(2,'0');
      html += '<tr class="hover:bg-gray-50"><td class="px-6 py-4 font-bold text-gray-700">' + dateStr + '</td><td class="px-6 py-4">' + (o.customers ? (o.customers.company_name || o.customers.contact_person) : '已刪除客戶') + '</td><td class="px-6 py-4">$' + Math.round(o.total_amount).toLocaleString() + '</td><td class="px-6 py-4 text-sm">' + (o.invoice_no ? (o.invoice_type === '3' ? '三聯' : '二聯') : '無') + '</td><td class="px-6 py-4"><button onclick="openOrderModal(\'' + o.id + '\')" class="text-blue-600 hover:underline text-sm mr-2">編輯</button><button onclick="deleteOrder(\'' + o.id + '\')" class="text-red-600 hover:underline text-sm">刪除</button></td></tr>';
    });
    document.getElementById('order-table-body').innerHTML = html;
  });
}

function loadOrderForEdit(id) {
  sb.from('orders').select('*, order_items(*), customers(*)').eq('id', id).single().then(function(result) {
    var order = result.data;
    if (!order) return;
    originalOrderItems = order.order_items || [];
    var c = order.customers;
    if (c) {
      var tagsJson = c.customer_tags ? JSON.stringify(c.customer_tags.map(function(ct) { return ct.tag_id; })) : '[]';
      selectOrderCustomer(c.id, c.company_name || c.contact_person, c.tax_id, c.invoice_title, tagsJson, c.type);
    }
    document.getElementById('order-notes').value = order.notes || '';
    document.getElementById('order-need-invoice').value = order.invoice_no ? 'yes' : 'no';
    document.getElementById('order-invoice-title').value = order.invoice_title || '';
    document.getElementById('order-tax-id').value = order.invoice_tax_id || '';
    document.getElementById('order-invoice-type').value = order.invoice_type || '3';
    document.getElementById('order-invoice-no').value = order.invoice_no || '';
    document.getElementById('order-tax-handling').value = order.tax_handling || 'tax_included';
    toggleInvoiceFields();
    document.getElementById('order-items-container').innerHTML = '';
    if (order.order_items) {
      order.order_items.forEach(function(item) { addOrderItemRow(item); });
    }
  });
}

window.deleteOrder = function(id) {
  showConfirm('確定刪除此訂單？庫存會回補。').then(function(ok) {
    if (!ok) return;
    sb.from('invoices').delete().eq('related_order_id', id).then(function() {
      return sb.from('order_items').select('*').eq('order_id', id);
    }).then(function(result) {
      var items = result.data || [];
      var promises = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        promises.push(sb.from('products').select('current_stock').eq('id', item.product_id).single().then(function(prodResult) {
          if (prodResult.data) {
            return sb.from('products').update({ current_stock: prodResult.data.current_stock + item.quantity }).eq('id', item.product_id);
          }
        }));
      }
      return Promise.all(promises);
    }).then(function() {
      return sb.from('order_items').delete().eq('order_id', id);
    }).then(function() {
      return sb.from('orders').delete().eq('id', id);
    }).then(function() {
      showAlert('訂單已刪除！');
      loadOrders();
      loadDashboardData();
    }).catch(function(err) {
      showAlert('刪除失敗：' + err.message);
    });
  });
};

function loadWarehouseInventory() {
  var container = document.getElementById('warehouse-inventory-container');
  container.innerHTML = '';
  var promises = [];
  for (var i = 0; i < allWarehouses.length; i++) {
    var warehouse = allWarehouses[i];
    promises.push(sb.from('product_inventory').select('*, products(name, sku, safety_stock)').eq('warehouse_id', warehouse.id).then(function(result) {
      var inventory = result.data || [];
      var div = document.createElement('div');
      div.className = 'bg-white rounded-lg shadow p-6';
      var html = '<h3 class="text-xl font-bold mb-4">' + warehouse.name + '</h3><table class="min-w-full"><thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left">產品</th><th class="px-4 py-2 text-left">SKU</th><th class="px-4 py-2 text-left">庫存</th><th class="px-4 py-2 text-left">狀態</th></tr></thead><tbody>';
      if (inventory.length) {
        inventory.forEach(function(inv) {
          var status = inv.quantity < (inv.products ? inv.products.safety_stock : inv.safety_stock) ? '<span class="text-red-600 font-bold">低庫存</span>' : '<span class="text-green-600">正常</span>';
          html += '<tr class="border-t"><td class="px-4 py-2">' + (inv.products ? inv.products.name : '') + '</td><td class="px-4 py-2 text-sm text-gray-600">' + (inv.products ? inv.products.sku : '') + '</td><td class="px-4 py-2 font-bold">' + inv.quantity + '</td><td class="px-4 py-2">' + status + '</td></tr>';
        });
      } else {
        html += '<tr><td colspan="4" class="px-4 py-2 text-center text-gray-500">無資料</td></tr>';
      }
      html += '</tbody></table>';
      div.innerHTML = html;
      container.appendChild(div);
    }));
  }
  Promise.all(promises);
}

sb.auth.getSession().then(function(result) {
  if (result.data && result.data.session) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('main-system').classList.remove('hidden');
    loadInitialData();
  }
});
