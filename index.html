  } else {
    invoiceCheckHtml = '<input type="hidden" id="pu-has-invoice" value="true">';
  }

  let calcHtml = '';
  if (isInvoicePurchase) {
    calcHtml = '<div class="bg-gray-50 p-4 rounded mb-4"><div class="grid grid-cols-2 gap-4"><div><span class="text-sm text-gray-600">成本小計：</span><span id="pu-cost" class="font-bold">0</span></div><div><span class="text-sm text-gray-600">稅金 (5%)：</span><span id="pu-tax" class="font-bold text-orange-600">0</span></div><div class="col-span-2"><span class="text-sm text-gray-600">含稅總金額：</span><span id="pu-total" class="text-xl font-bold text-blue-600">0</span></div></div></div>';
  } else {
    calcHtml = '<div class="bg-gray-50 p-4 rounded mb-4"><div><span class="text-sm text-gray-600">成本小計：</span><span id="pu-cost" class="font-bold text-lg">0</span></div></div>';
  }

  const html = '<input type="hidden" id="pu-invoice-mode" value="' + (isInvoicePurchase ? 'true' : 'false') + '"><input type="hidden" id="pu-edit-id" value="' + (editId || '') + '">' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">' +
      '<div><label class="block text-sm font-bold mb-2">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded input-field">' + vendorOptions + '</select></div>' +
      (!isInvoicePurchase ? '<div><label class="block text-sm font-bold mb-2">入庫倉庫</label><select id="pu-wh" class="w-full px-3 py-2 border rounded input-field">' + whOptions + '</select></div>' : '<div></div>') +
    '</div>' +
    '<div class="mb-4"><label class="block text-sm font-bold mb-2">📅 採購日期</label><input type="date" id="pu-date" class="w-full px-3 py-2 border rounded input-field" value="' + defaultDate + '"></div>' +
    invoiceCheckHtml +
    '<div class="mb-4"><label class="block text-sm font-bold mb-2">採購商品明細</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm btn-touch">+ 新增商品</button></div>' +
    calcHtml;

  openModal(isInvoicePurchase ? '購買發票' : '一般採購入庫', html, savePur);
  if(editId && existingData) {
    const itemsResp = await sb.from('purchase_items').select('*').eq('purchase_id', editId);
    const items = itemsResp.data || [];
    if(items.length > 0) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const p = D.products.find(function(x) { return x.id === item.product_id; });
        addPurItem(p, item.quantity, item.unit_price);
      }

function addPurItem(prod, qty, price) {
  const box = document.getElementById('pu-items');
  const div = document.createElement('div');
  div.className = 'flex flex-wrap gap-2 items-center bg-gray-50 p-3 rounded';
  const uid = 'pu_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

  let prodOptionsHtml = '';
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    const selected = (prod && prod.id === p.id) ? 'selected' : '';
    const displayPrice = p.cost_price || 0;
    prodOptionsHtml += '<div class="opt-item" data-id="' + p.id + '" data-cost="' + displayPrice + '" data-name="' + p.name + '" ' + selected + ' onclick="selectPurProduct(this, \'' + uid + '\')"><span class="opt-name">' + p.name + '</span><span class="opt-cost">(成本: ' + displayPrice + ')</span></div>';
  }
  if(!prodOptionsHtml) {
    prodOptionsHtml = '<div class="opt-item no-match">尚無商品，請先建立</div>';
  }

  let defaultName = prod ? prod.name : '';
  let defaultCost = prod ? (prod.cost_price || 0) : 0;

  div.innerHTML = `
    <div class="flex-1 min-w-[150px] prod-search-wrapper">
      <input type="text" class="pu-prod-search w-full px-3 py-2 border rounded input-field" placeholder="🔍 搜尋商品..." value="${defaultName}" autocomplete="off" oninput="filterPurProdOptions(this, '${uid}')" onfocus="document.getElementById('pu_dropdown_${uid}').classList.add('show')" onblur="setTimeout(function(){document.getElementById('pu_dropdown_${uid}').classList.remove('show')},200)">
      <div class="pu-prod-select" id="pu_dropdown_${uid}">
        ${prodOptionsHtml}
      </div>
      <input type="hidden" class="pu-prod-id" value="${prod ? prod.id : ''}">
    </div>
    <div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded input-field" value="${qty || 1}" min="1" oninput="calcPur()"></div>
    <div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded input-field" value="${price !== undefined ? price : defaultCost}" step="0.01" oninput="calcPur()"></div>
    <button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch flex-shrink-0">✕</button>
  `;
  box.appendChild(div);

  if(prod) {
    const hiddenInput = div.querySelector('.pu-prod-id');
    hiddenInput.value = prod.id;
    const priceInput = div.querySelector('.pu-price');
    if(price && price > 0) { priceInput.value = price; }
    else { priceInput.value = prod.cost_price || 0; }
  }
  setTimeout(calcPur, 50);
}

function filterPurProdOptions(input, uid) {
  const kw = input.value.toLowerCase();
  const dropdown = document.getElementById('pu_dropdown_' + uid);
  if(!dropdown) return;
  const items = dropdown.querySelectorAll('.opt-item');
  let hasMatch = false;
  for(let i=0; i<items.length; i++) {
    const item = items[i];
    if(item.classList.contains('no-match')) continue;
    const name = (item.dataset.name || '').toLowerCase();
    if(name.indexOf(kw) !== -1) { item.style.display = 'block'; hasMatch = true; }
    else { item.style.display = 'none'; }
  }
  let noMatch = dropdown.querySelector('.opt-item.no-match');
  if(!hasMatch) {
    if(!noMatch) { noMatch = document.createElement('div'); noMatch.className = 'opt-item no-match'; noMatch.textContent = '無符合商品'; dropdown.appendChild(noMatch); }
    noMatch.style.display = 'block';
  } else { if(noMatch) noMatch.style.display = 'none'; }
  dropdown.classList.add('show');
}

function selectPurProduct(el, uid) {
  const id = el.dataset.id;
  const cost = parseFloat(el.dataset.cost) || 0;
  const name = el.dataset.name || '';
  const wrapper = document.getElementById('pu_dropdown_' + uid)?.closest('.prod-search-wrapper');
  if(!wrapper) return;
  const searchInput = wrapper.querySelector('.pu-prod-search');
  const hiddenInput = wrapper.querySelector('.pu-prod-id');
  const priceInput = wrapper.closest('div.flex')?.querySelector('.pu-price');
  if(searchInput) searchInput.value = name;
  if(hiddenInput) hiddenInput.value = id;
  if(priceInput && !priceInput.dataset.userSet) { priceInput.value = cost; }
  const dropdown = document.getElementById('pu_dropdown_' + uid);
  if(dropdown) dropdown.classList.remove('show');
  calcPur();
}

function calcPur() {
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const price = parseFloat(r.querySelector('.pu-price').value) || 0;
    const qty = parseInt(r.querySelector('.pu-qty').value) || 0;
    subtotal += price * qty;
  }
  const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
  document.getElementById('pu-cost').textContent = subtotal.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  if (isInvoiceMode) {
    const tax = subtotal * 0.05;
    const total = subtotal + tax;
    document.getElementById('pu-tax').textContent = tax.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
    document.getElementById('pu-total').textContent = total.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  }
}

async function savePur() {
  let editId = document.getElementById('pu-edit-id').value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  let hasInvoice = isInvoiceMode;
  if (!isInvoiceMode) {
    const checkbox = document.getElementById('pu-has-invoice');
    hasInvoice = checkbox ? checkbox.checked : false;
  }
  const purchaseDate = document.getElementById('pu-date').value || new Date().toISOString().split('T')[0];

  const items = [];
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const hiddenInput = r.querySelector('.pu-prod-id');
    const pid = hiddenInput ? hiddenInput.value : '';
    const q = parseInt(r.querySelector('.pu-qty').value) || 0;
    const p = parseFloat(r.querySelector('.pu-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      subtotal += p * q;
    }
  }
  if(!items.length) return showAlert('請加入採購商品！');

  let totalAmount;
  if (isInvoiceMode) {
    totalAmount = Math.round(subtotal * 0.05);
  } else {
    totalAmount = Math.round(subtotal);
  }

  const d = {
    vendor_id: vendorId,
    is_invoice_purchase: hasInvoice,
    total_amount: totalAmount,
    warehouse_id: document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : null,
    created_at: purchaseDate + 'T00:00:00'
  };
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      await sb.from('purchases').update(d).eq('id', editId);
    } else {
      d.purchase_no = 'PUR-' + Date.now();
      d.status = 'completed';
      const r = await sb.from('purchases').insert([d]).select().single();
      editId = r.data.id;
    }
    await sb.from('purchase_items').insert(items.map(function(i) { return Object.assign({}, i, {purchase_id: editId}); }));
    if (!isInvoiceMode && d.warehouse_id) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const existing = D.warehouseInv.find(function(w) { return w.warehouse_id === d.warehouse_id && w.product_id === item.product_id; });
        if(existing) await sb.from('warehouse_inventory').update({quantity: (existing.quantity || 0) + item.quantity}).eq('id', existing.id);
        else await sb.from('warehouse_inventory').insert([{warehouse_id: d.warehouse_id, product_id: item.product_id, quantity: item.quantity, safety_stock: 0}]);
        const prod = D.products.find(function(x) { return x.id === item.product_id; });
        if(prod) await sb.from('products').update({current_stock: (prod.current_stock || 0) + item.quantity}).eq('id', item.product_id);
      }
    }
    showAlert('採購已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delPur(id) {
  if(!confirm('確定刪除?')) return;
  try {
    await sb.from('purchase_items').delete().eq('purchase_id', id);
    await sb.from('purchases').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

function sortVenTable(field) {
  if(venSortField === field) venSortAsc = !venSortAsc;
  else { venSortField = field; venSortAsc = true; }
  renderVenTable();
}

function renderVenTable() {
  let list = [...D.vendors];
  list.sort(function(a, b) {
    let aVal = a[venSortField] || '';
    let bVal = b[venSortField] || '';
    if(typeof aVal === 'string') aVal = aVal.toLowerCase();
    if(typeof bVal === 'string') bVal = bVal.toLowerCase();
    if(aVal < bVal) return venSortAsc ? -1 : 1;
    if(aVal > bVal) return venSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const v = list[i];
    const status = v.cooperation_status || 'normal';
    const statusHtml = status === 'paused' ? '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">暫時無配合</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">正常配合</span>';
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + v.name + '</td><td class="px-4 py-3">' + (v.tax_id || '-') + '</td><td class="px-4 py-3">' + (v.contact_person || '-') + '</td><td class="px-4 py-3">' + (v.phone || '-') + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openVenModal(\'' + v.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delVen(\'' + v.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('ven-tbody').innerHTML = html;
}

function openVenModal(id) {

function sortExpTable(field) {
  if(expSortField === field) expSortAsc = !expSortAsc;
  else { expSortField = field; expSortAsc = true; }
  renderExpTable();
}

function renderExpTable() {
  const monthVal = document.getElementById('exp-month').value;
  const kw = (document.getElementById('exp-search') ? document.getElementById('exp-search').value || '' : '').toLowerCase();
  let list = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const matchMonth = (y + '-' + m) === monthVal;
    const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
    const matchKw = !kw || (cat && cat.name.toLowerCase().indexOf(kw) !== -1) || (e.description && e.description.toLowerCase().indexOf(kw) !== -1);
    return matchMonth && matchKw;
  });

  list = list.map(function(e) {
    const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
    return Object.assign({}, e, { bank_account_name: bank ? bank.account_name : '' });
  });

  list.sort(function(a, b) {
    let aVal = a[expSortField] || '';
    let bVal = b[expSortField] || '';
    if(expSortField === 'payment_date') {
      aVal = new Date(aVal);
      bVal = new Date(bVal);
    } else if(expSortField === 'category_name') {
      const catA = D.expCats.find(function(c) { return c.id === a.category_id; });
      const catB = D.expCats.find(function(c) { return c.id === b.category_id; });
      aVal = (catA ? catA.name : '').toLowerCase();
      bVal = (catB ? catB.name : '').toLowerCase();
    } else if(expSortField === 'bank_account_name') {
      aVal = aVal.toLowerCase();
      bVal = bVal.toLowerCase();
    }
    if(aVal < bVal) return expSortAsc ? -1 : 1;
    if(aVal > bVal) return expSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const e = list[i];
    const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
    const statusHtml = e.is_reimbursed ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">已結帳</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">待結帳</span>';
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + e.payment_date + '</td><td class="px-4 py-3">' + (cat ? cat.name : '-') + '</td><td class="px-4 py-3 font-bold text-red-600">' + (e.amount || 0).toLocaleString() + '</td><td class="px-4 py-3 text-sm">' + (e.description || '-') + '</td><td class="px-4 py-3">' + (emp ? emp.name : '-') + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3">' + (bank ? bank.account_name : '-') + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openExpModal(\'' + e.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delExp(\'' + e.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('exp-tbody').innerHTML = html;
}

function sortSubTable(field) {
  if(subSortField === field) subSortAsc = !subSortAsc;
  else { subSortField = field; subSortAsc = true; }
  renderSubTable();
}

function renderSubTable() {
  let list = D.subs.slice();
  list = list.map(function(s) {
    const bank = D.banks.find(b => b.id === s.bank_account_id);
    return Object.assign({}, s, { bank_account_name: bank ? bank.account_name : '' });
  });

  list.sort(function(a, b) {
    let aVal = a[subSortField] || '';
    let bVal = b[subSortField] || '';
    if(typeof aVal === 'string') aVal = aVal.toLowerCase();
    if(typeof bVal === 'string') bVal = bVal.toLowerCase();
    if(aVal < bVal) return subSortAsc ? -1 : 1;
    if(aVal > bVal) return subSortAsc ? 1 : -1;
    return 0;
  });

  let subHtml = '';
  for(let i=0; i<list.length; i++) {
    const s = list[i];
    let monthlyText = '-';
    if(s.start_date && s.end_date && s.amount) {
      const startDate = new Date(s.start_date);
      const endDate = new Date(s.end_date);
      const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
      if(diffMonths > 0) {
        const monthly = s.amount / diffMonths;
        monthlyText = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
      }
    }
    const bank = D.banks.find(b => b.id === s.bank_account_id);
    subHtml += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + s.name + '</td><td class="px-4 py-3">' + (s.provider || '-') + '</td><td class="px-4 py-3">' + (bank ? bank.account_name : '-') + '</td><td class="px-4 py-3">' + (s.start_date || '-') + ' ~ ' + (s.end_date || '-') + '</td><td class="px-4 py-3 font-bold">' + (s.amount || 0).toLocaleString() + '</td><td class="px-4 py-3 font-bold text-blue-600">' + monthlyText + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openSubModal(\'' + s.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delSub(\'' + s.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('sub-tbody').innerHTML = subHtml;
}

async function saveExp() {
  const id = document.getElementById('e-id').value;
  const empId = document.getElementById('e-emp').value || null;
  const isCompanyPay = !empId;
  const isReimbursed = isCompanyPay ? true : document.getElementById('e-reimbursed').checked;
  const bankId = document.getElementById('e-bank').value || null;
  const amount = parseFloat(document.getElementById('e-amt').value) || 0;
  const paymentDate = document.getElementById('e-date').value;
  if (!bankId && amount > 0) return showAlert('請選擇出帳銀行帳戶！');
  if (!paymentDate) return showAlert('請選擇日期！');

  const d = {
    category_id: document.getElementById('e-cat').value,
    amount: amount,
    description: document.getElementById('e-desc').value,
    payment_date: paymentDate,
    employee_id: empId,
    is_reimbursed: isReimbursed,
    reimbursement_bank_id: bankId,
    reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null
  };
  try {
    if(id) {
      await sb.from('expenses').update(d).eq('id', id);
      showAlert('已更新！');
    } else {
      const newExp = await sb.from('expenses').insert([d]).select().single();
      if(newExp.error) throw newExp.error;
      if(bankId && amount > 0) {
        const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
        if(bank.data) {
          await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) - amount }).eq('id', bankId);
        }
      }
      showAlert('已記錄並扣款！');
    }
    window.closeModal();
    await loadAll();
    if (currentView === 'finance') {
      renderFinance(document.getElementById('main-content'));
    } else {
      render();
    }
  } catch(e) {
    showAlert('失敗：' + e.message);
    console.error('saveExp error:', e);
  }
}

async function delExp(id) {
  if(!confirm('確定刪除?')) return;
  try {
    const e = D.expenses.find(function(x) { return x.id === id; });
    if(e && e.reimbursement_bank_id && e.amount > 0 && e.is_reimbursed) {
      const bank = await sb.from('bank_accounts').select('balance').eq('id', e.reimbursement_bank_id).single();
      if(bank.data) {
        await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) + e.amount }).eq('id', e.reimbursement_bank_id);
      }
    }
    await sb.from('expenses').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

function calcMonthlySub() {
  const start = document.getElementById('s-start')?.value;
  const end = document.getElementById('s-end')?.value;
  const amount = parseFloat(document.getElementById('s-amt')?.value) || 0;
  const monthlyEl = document.getElementById('s-monthly');
  if(!monthlyEl) return;
  if(!start || !end || amount <= 0) { monthlyEl.textContent = '0'; return; }
  const startDate = new Date(start);
  const endDate = new Date(end);
  const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
  if(diffMonths <= 0) { monthlyEl.textContent = '0 (日期無效)'; return; }
  const monthly = amount / diffMonths;
  monthlyEl.textContent = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

async function saveSub() {
  const id = document.getElementById('s-id').value;
  const bankId = document.getElementById('s-bank').value;
  const amount = parseFloat(document.getElementById('s-amt').value) || 0;
  const startDate = document.getElementById('s-start').value;
  const endDate = document.getElementById('s-end').value;
  const name = document.getElementById('s-name').value.trim();

  if (!name) return showAlert('請輸入訂閱名稱！');
  if (!bankId) return showAlert('請選擇出帳銀行帳戶！');
  if (amount <= 0) return showAlert('金額必須大於0！');
  if (!startDate || !endDate) return showAlert('請選擇完整的日期區間！');

  const start = new Date(startDate);
  const end = new Date(endDate);
  if (end < start) return showAlert('結束日期不能早於開始日期！');

  const d = {
    name: name,
    provider: document.getElementById('s-provider').value.trim(),
    amount: amount,
    start_date: startDate,
    end_date: endDate,
    bank_account_id: bankId
  };

  try {
    const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
    if(bank.data && bank.data.balance < amount) {
      return showAlert('⚠️ 銀行餘額不足！\n目前餘額：' + bank.data.balance.toLocaleString() + '\n訂閱金額：' + amount.toLocaleString());
    }

    let result;
    if (id) {
      const oldSub = D.subs.find(function(x) { return x.id === id; });
      if(oldSub && oldSub.bank_account_id) {
        const oldBank = await sb.from('bank_accounts').select('balance').eq('id', oldSub.bank_account_id).single();
        if(oldBank.data) {
          await sb.from('bank_accounts').update({ balance: (oldBank.data.balance || 0) + oldSub.amount }).eq('id', oldSub.bank_account_id);
        }
      }
      result = await sb.from('system_subscriptions').update(d).eq('id', id);
      if (result.error) throw result.error;
      showAlert('訂閱已更新！');
    } else {
      result = await sb.from('system_subscriptions').insert([d]).select().single();
      if (result.error) throw result.error;
      editingId = result.data.id;
      showAlert('訂閱已新增！');
    }

    if(bankId && amount > 0) {
      const currentBank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
      if(currentBank.data) {
        await sb.from('bank_accounts').update({ balance: (currentBank.data.balance || 0) - amount }).eq('id', bankId);
      }
    }

    window.closeModal();
    await loadAll();
    if (currentView === 'finance') {
      renderFinance(document.getElementById('main-content'));
    } else {
      render();
    }
  } catch(e) {
    console.error('saveSub error:', e);
    let errMsg = '儲存失敗：';
    if (e.message && (e.message.includes('start_date') || e.message.includes('end_date'))) {
      errMsg += '資料表 system_subscriptions 缺少 start_date 或 end_date 欄位。\n\n請在 Supabase SQL Editor 中執行：\nALTER TABLE system_subscriptions ADD COLUMN IF NOT EXISTS start_date DATE;\nALTER TABLE system_subscriptions ADD COLUMN IF NOT EXISTS end_date DATE;';
    } else if (e.message && e.message.includes('column') && e.message.includes('bank_account_id')) {
      errMsg += '資料表 system_subscriptions 缺少 bank_account_id 欄位。\n\n請在 Supabase SQL Editor 中執行：\nALTER TABLE system_subscriptions ADD COLUMN bank_account_id UUID REFERENCES bank_accounts(id);';
    } else {
      errMsg += e.message;
    }
    showAlert(errMsg);
  }
}

async function delSub(id) {
  if(!confirm('確定刪除這筆訂閱？刪除後會將款項退回原銀行帳戶。')) return;
  try {
    const s = D.subs.find(function(x) { return x.id === id; });
    if(s && s.bank_account_id && s.amount > 0) {
      const bank = await sb.from('bank_accounts').select('balance').eq('id', s.bank_account_id).single();
      if(bank.data) {
        await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) + s.amount }).eq('id', s.bank_account_id);
      }
    }
    await sb.from('system_subscriptions').delete().eq('id', id);
    await loadAll();
    render();
    showAlert('訂閱已刪除並完成退款！');
  } catch(e) {
    showAlert('刪除失敗：' + e.message);
    console.error('delSub error:', e);
  }
}

function renderBanks(c) {
  c.innerHTML = '<div class="content-card"><div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"><h1 class="text-3xl font-bold">🏦 銀行帳戶</h1><button onclick="openBankModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold btn-touch">+ 新增帳戶</button></div><div class="bg-white rounded-lg shadow overflow-hidden table-container"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header" onclick="sortBankTable(\'account_name\')">帳戶名稱 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">銀行名稱</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">帳號</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header" onclick="sortBankTable(\'balance\')">餘額 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">狀態</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody id="bank-tbody" class="bg-white divide-y divide-gray-200"></tbody></table></div></div>';
  renderBankTable();
}

function sortBankTable(field) {
  if(bankSortField === field) bankSortAsc = !bankSortAsc;
  else { bankSortField = field; bankSortAsc = true; }
  renderBankTable();
}

function renderBankTable() {
  let list = [...D.banks];
  list.sort(function(a, b) {
    let aVal = a[bankSortField] || '';
    let bVal = b[bankSortField] || '';
    if(typeof aVal === 'string') aVal = aVal.toLowerCase();
    if(typeof bVal === 'string') bVal = bVal.toLowerCase();
    if(aVal < bVal) return bankSortAsc ? -1 : 1;
    if(aVal > bVal) return bankSortAsc ? 1 : -1;
    return 0;
  });

  let html = '';
  for(let i=0; i<list.length; i++) {
    const b = list[i];
    const statusHtml = b.is_active ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">啟用</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-800">停用</span>';
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + b.account_name + '</td><td class="px-4 py-3">' + (b.bank_name || '-') + '</td><td class="px-4 py-3">' + (b.account_number || '-') + '</td><td class="px-4 py-3 font-bold text-green-600">' + (b.balance || 0).toLocaleString() + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openBankModal(\'' + b.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delBank(\'' + b.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
  }
  document.getElementById('bank-tbody').innerHTML = html;
}

async function openBankModal(id) {
  editingId = id || null;
  const b = id ? D.banks.find(function(x) { return x.id === id; }) : null;
  const html = '<input type="hidden" id="b-id" value="' + (id || '') + '"><div class="mb-4"><label class="block text-sm font-bold mb-2">帳戶名稱 *</label><input type="text" id="b-name" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.account_name : '') + '"></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">銀行名稱</label><input type="text" id="b-bank" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.bank_name : '') + '"></div><div><label class="block text-sm font-bold mb-2">帳號</label><input type="text" id="b-number" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.account_number : '') + '"></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">餘額</label><input type="number" id="b-balance" class="w-full px-3 py-2 border rounded input-field" value="' + (b ? b.balance : 0) + '"></div><div><label class="block text-sm font-bold mb-2">狀態</label><select id="b-active" class="w-full px-3 py-2 border rounded input-field"><option value="true" ' + (b && b.is_active !== false ? 'selected' : '') + '>啟用</option><option value="false" ' + (b && b.is_active === false ? 'selected' : '') + '>停用</option></select></div></div>';
  openModal(id ? '編輯帳戶' : '新增帳戶', html, saveBank);
}

async function saveBank() {
  const id = document.getElementById('b-id').value;
  const d = { account_name: document.getElementById('b-name').value, bank_name: document.getElementById('b-bank').value, account_number: document.getElementById('b-number').value, balance: parseFloat(document.getElementById('b-balance').value) || 0, is_active: document.getElementById('b-active').value === 'true' };

    showAlert('已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delBank(id) {
  if(!confirm('確定刪除?')) return;
  try { await sb.from('bank_accounts').delete().eq('id', id); await loadAll(); render(); } catch(e) { showAlert('失敗：' + e.message); }
}

        }

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-btn').click();
            }
        });
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const overlay = document.getElementById('modal-overlay');

                closeModal();
            }
        }
    });
    console.log('✅ 系統初始化完成，等待用戶登入...');
});
