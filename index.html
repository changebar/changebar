function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (!sidebar) return;
    if (window.innerWidth <= 1024) {
        const isOpen = sidebar.classList.contains('open');
        if (isOpen) {
            sidebar.classList.remove('open');
            if (overlay) { overlay.classList.remove('show'); setTimeout(() => { overlay.style.display = 'none'; }, 300); }
        } else {
            if (overlay) { overlay.style.display = 'block'; setTimeout(() => { overlay.classList.add('show'); }, 10); }
            sidebar.classList.add('open');
        }
    } else {
        sidebar.classList.toggle('collapsed');
        const isCollapsed = sidebar.classList.contains('collapsed');
        localStorage.setItem('sidebarCollapsed', isCollapsed ? 'true' : 'false');
    }
}
function closeSidebarMobile() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (window.innerWidth <= 1024 && sidebar) {
        sidebar.classList.remove('open');
        if (overlay) { overlay.classList.remove('show'); setTimeout(() => { overlay.style.display = 'none'; }, 300); }
    }
}
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth > 1024 && sidebar) {
        const saved = localStorage.getItem('sidebarCollapsed');
        if (saved === 'true') sidebar.classList.add('collapsed');
        else sidebar.classList.remove('collapsed');
    }
    const toggleBtn = document.getElementById('sidebar-toggle-btn');
    if (toggleBtn) toggleBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleSidebar(); });
    const expandBtn = document.getElementById('sidebar-expand-btn');
    if (expandBtn) expandBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleSidebar(); });
    const closeBtn = document.getElementById('sidebar-close-btn');
    if (closeBtn) closeBtn.addEventListener('click', function() { closeSidebarMobile(); });
    const overlay = document.getElementById('sidebar-overlay');
    if (overlay) overlay.addEventListener('click', function() { closeSidebarMobile(); });
    const menuBtn = document.getElementById('menu-toggle-btn');
    if (menuBtn) menuBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleSidebar(); });
});

// ================================================================
//  4. showAlert
// ================================================================
function showAlert(msg) {
    const overlay = document.getElementById('alert-modal');
    const msgEl = document.getElementById('alert-message');
    if (!overlay || !msgEl) { console.error('❌ alert-modal 元素不存在'); alert(msg); return; }
    const formatted = String(msg).replace(/\n/g, '<br>');
    msgEl.innerHTML = formatted;
    overlay.classList.remove('hidden');

    const okBtn = document.getElementById('alert-ok-btn');
    if (!okBtn) return;
    const newOkBtn = okBtn.cloneNode(true);
    okBtn.parentNode.replaceChild(newOkBtn, okBtn);

    function closeAlert() {
        overlay.classList.add('hidden');
        document.removeEventListener('keydown', handleAlertKey);
    }
    function handleAlertKey(e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            closeAlert();
        }
    }
    newOkBtn.addEventListener('click', closeAlert);
    document.addEventListener('keydown', handleAlertKey, true);
    setTimeout(function() { newOkBtn.focus(); }, 100);
}

window.closeModal = function() {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal-container');
    if (overlay) overlay.classList.add('hidden');
    if (modal) { modal.classList.remove('hidden'); modal.classList.remove('modal-fullscreen'); }
    editingId = null;
    isSaving = false;
};

function openModal(title, html, onSave, hideSave) {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal-container');
    const titleEl = document.getElementById('modal-title');
    const body = document.getElementById('modal-content');
    const footer = document.getElementById('modal-buttons');
    if (!overlay || !modal || !titleEl || !body) { console.error('❌ 找不到必要的 modal 元素'); return; }

    modal.classList.remove('modal-fullscreen');
    const fullscreenBtn = document.getElementById('modal-fullscreen-btn');
    if (fullscreenBtn) fullscreenBtn.textContent = '⛶';

    overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-3 md:p-4';
    modal.className = 'bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col transform transition-all modal-content';
    modal.style.overflow = 'visible !important';

    titleEl.textContent = title;
    body.innerHTML = html;
    body.style.overflowY = 'auto';
    body.style.overflowX = 'visible';

    if (fullscreenBtn) {
        fullscreenBtn.onclick = function() {
            const isFull = modal.classList.toggle('modal-fullscreen');
            fullscreenBtn.textContent = isFull ? '⤢' : '⛶';
            if (isFull) { body.style.overflowY = 'auto'; body.style.flex = '1'; }
            else { body.style.overflowY = ''; body.style.flex = ''; }
        };
    }

    const closeBtn = document.getElementById('modal-close-btn');
    if (closeBtn) closeBtn.onclick = function() { window.closeModal(); };

    if (footer) {
        footer.innerHTML = '';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-gray-300 rounded-lg hover:bg-gray-400 font-semibold transition-colors btn-touch cursor-pointer';
        cancelBtn.style.zIndex = '100';
        cancelBtn.textContent = '取消 (Esc)';
        cancelBtn.onclick = function() { window.closeModal(); };

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'px-4 md:px-6 py-2 md:py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-lg btn-touch cursor-pointer';
        saveBtn.textContent = '儲存 (Enter)';
        saveBtn.disabled = false;
        saveBtn.style.zIndex = '100';
        saveBtn.id = 'modal-save-btn';

        if (hideSave) {
            saveBtn.classList.add('hidden');
        } else {
            saveBtn.classList.remove('hidden');
            saveBtn.onclick = function() {
                if (isSaving) return;
                isSaving = true;
                saveBtn.disabled = true;
                saveBtn.textContent = '儲存中...';

                Promise.resolve(onSave())
                    .then(function() {
                        isSaving = false;
                        saveBtn.disabled = false;
                        saveBtn.textContent = '儲存 (Enter)';
                        window.closeModal();
                    })
                    .catch(function(e) {
                        console.error('❌ Save error:', e || 'Unknown error');
                        isSaving = false;
                        saveBtn.disabled = false;
                        saveBtn.textContent = '儲存 (Enter)';
                        const msg = (e && e.message) ? e.message : '儲存失敗，請檢查欄位是否完整填寫。';
                        showAlert('❌ ' + msg);
                    });
            };
        }

        footer.appendChild(cancelBtn);
        footer.appendChild(saveBtn);
    }

    overlay.classList.remove('hidden');
    modal.classList.remove('hidden');

    function handleModalKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); window.closeModal(); document.removeEventListener('keydown', handleModalKey); }
        else if (e.key === 'Enter') {
            if (e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                const saveBtn = document.getElementById('modal-save-btn');
                if (saveBtn && !saveBtn.disabled) saveBtn.click();
            }
        }
    }
    document.addEventListener('keydown', handleModalKey);

    setTimeout(function() {
        const firstInput = modal.querySelector('input, select, textarea');
        if (firstInput) firstInput.focus();
    }, 100);
}

document.addEventListener('DOMContentLoaded', function() {

    }

    const rememberedEmail = localStorage.getItem('rememberedEmail');
    if (rememberedEmail) {
        document.getElementById('email').value = rememberedEmail;
        document.getElementById('remember').checked = true;
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('logout-btn').addEventListener('click', function() {
        if (window.sb) { window.sb.auth.signOut().then(function() { location.reload(); }); }
        else { location.reload(); }
    });

    document.getElementById('login-btn').addEventListener('click', function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;
        if (remember) localStorage.setItem('rememberedEmail', email);
        else localStorage.removeItem('rememberedEmail');

        if (!window.sb) { showAlert('Supabase 未連接，請檢查網路或設定。'); return; }
        window.sb.auth.signInWithPassword({ email: email, password: password })
            .then(function(res) {
                if (res.error) { showAlert('登入失敗：' + res.error.message); }
                else {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('main-system').classList.remove('hidden');
                    if (typeof loadAll === 'function') { loadAll().then(function() { switchView('boss'); }); }
                    else { switchView('boss'); }
                }
            })
            .catch(function(err) { showAlert('登入發生錯誤：' + err.message); });
    });
});

function sortTable(tbodyId, colIndex) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort(function(a, b) {
        const aText = a.cells[colIndex] ? a.cells[colIndex].textContent || '' : '';
        const bText = b.cells[colIndex] ? b.cells[colIndex].textContent || '' : '';
        return aText.localeCompare(bText, 'zh-TW');
    });
    for (let i=0; i<rows.length; i++) tbody.appendChild(rows[i]);
}

function sortCustTable(field) {
    if (custSortField === field) custSortAsc = !custSortAsc;
    else { custSortField = field; custSortAsc = true; }
    renderCustTable();
}

function renderCustTable() {
    const kw = (document.getElementById('cust-search')?.value || '').toLowerCase();
    let list = D.customers.filter(function(c) {
        const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().indexOf(kw) !== -1;
        const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; });
        let tagMatch = false;
        for (let i=0; i<custTags.length; i++) {
            const ct = custTags[i];
            const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
            if (tag && tag.name.toLowerCase().indexOf(kw) !== -1) { tagMatch = true; break; }
        }
        return basicMatch || tagMatch;
    });
    list.sort(function(a, b) {
        let aVal = a[custSortField] || '';
        let bVal = b[custSortField] || '';
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        if (aVal < bVal) return custSortAsc ? -1 : 1;
        if (aVal > bVal) return custSortAsc ? 1 : -1;
        return 0;
    });
    let html = '';
    for (let i=0; i<list.length; i++) {
        const c = list[i];
        const win = D.windows.find(function(w) { return w.id === c.primary_contact_window_id; });
        const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; }).map(function(ct) {
            const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
            return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
        }).join('');
        html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full '+(c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800')+'">'+c.type+'</span></td><td class="px-4 py-3 font-medium">'+(c.company_name||c.contact_person)+'</td><td class="px-4 py-3 text-sm">'+c.contact_person+'<br><span class="text-gray-500">'+c.phone+'</span></td><td class="px-4 py-3 text-sm">'+(c.invoice_title||'-')+'<br><span class="text-gray-500">'+(c.tax_id||'-')+'</span></td><td class="px-4 py-3 text-sm">'+(win?win.name:'-')+'</td><td class="px-4 py-3">'+(custTags||'<span class="text-gray-400">無</span>')+'</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewCustDetail(\''+c.id+'\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button><button onclick="openCustModal(\''+c.id+'\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delCust(\''+c.id+'\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
    }
    document.getElementById('cust-tbody').innerHTML = html;
}

        const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
        return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
    }).join('');
    let subInfo = '<span class="text-gray-500">否</span>';

        subInfo = '<span class="text-green-600 font-bold">是 ('+c.subscription_days+' 天, 金額 '+c.subscription_amount+' 元)</span>';

    openModal('客戶詳情', html, function(){return Promise.resolve();}, true);

function syncAddrContact() {

async function saveCust() {
    const id = document.getElementById('c-id').value;
    const isSub = document.getElementById('c-is-sub').checked;
    const data = {
        type: document.getElementById('c-type').value,
        company_name: document.getElementById('c-comp').value || null,
        contact_person: document.getElementById('c-contact').value,
        phone: document.getElementById('c-phone').value,
        primary_contact_window_id: document.getElementById('c-win').value || null,
        invoice_title: document.getElementById('c-title').value || null,
        tax_id: document.getElementById('c-tax').value || null,
        email: document.getElementById('c-email').value || null,
        is_subscription: isSub,
        subscription_days: isSub ? parseInt(document.getElementById('c-sub-days').value) || 30 : 0,
    };
    if (isSub) {
        const amt = parseFloat(document.getElementById('c-sub-amount').value) || 0;
        data.subscription_amount = amt;
    }
    if (!data.contact_person || !data.phone) {
        throw new Error('⚠️ 聯絡人和電話為必填欄位，請補齊後再儲存！');
    }
    try {
        let cid = id;
        if (id) {
            await sb.from('customers').update(data).eq('id', id);
        } else {
            const inserted = await sb.from('customers').insert([data]).select().single();
            if (!inserted || !inserted.data) throw new Error('新增客戶失敗');
            cid = inserted.data.id;
        }
        await sb.from('customer_tags').delete().eq('customer_id', cid);
        const tagIds = [];
        const checkboxes = document.querySelectorAll('.c-tag-cb:checked');
        for (let i=0; i<checkboxes.length; i++) tagIds.push(checkboxes[i].value);
        if (tagIds.length) {
            const tagInserts = [];
            for (let i=0; i<tagIds.length; i++) tagInserts.push({customer_id: cid, tag_id: tagIds[i]});
            await sb.from('customer_tags').insert(tagInserts);
        }
        await sb.from('customer_addresses').delete().eq('customer_id', cid);
        const addrs = [];
        const addrDivs = document.querySelectorAll('#addr-box > div');
        for (let i=0; i<addrDivs.length; i++) {
            const d = addrDivs[i];
            addrs.push({
                customer_id: cid,
                address_type: d.querySelector('.a-type').value,
                recipient_name: d.querySelector('.a-recv').value,
                recipient_phone: d.querySelector('.a-phone').value,
                street: d.querySelector('.a-addr').value,
                is_default: d.querySelector('.a-def').checked
            });
        }
        if (addrs.length) await sb.from('customer_addresses').insert(addrs);
        showAlert('✅ 客戶已儲存！');
        window.closeModal();
        await loadAll();
        render();
    } catch (e) {
        console.error('saveCust error:', e);
        throw e;
    }
}

async function delCust(id) {
    if (!confirm('確定刪除？')) return;
    try {
        await sb.from('customer_addresses').delete().eq('customer_id', id);
        await sb.from('customer_tags').delete().eq('customer_id', id);
        await sb.from('customers').delete().eq('id', id);
        await loadAll();
        render();
    } catch (e) {
        showAlert('❌ 刪除失敗：' + e.message);
    }
}

async function editBom(id) {
    const b = D.bom.find(function(x) { return x.id === id; });
    if (!b) return showAlert('找不到 BOM 資料');
    let parentOptions = '';
    const finishedProducts = D.products.filter(function(p) { return p.type === 'finished'; });
    for (let i=0; i<finishedProducts.length; i++) {
        const p = finishedProducts[i];
        parentOptions += '<option value="' + p.id + '" ' + (p.id === b.parent_product_id ? 'selected' : '') + '>' + p.name + '</option>';
    }
    let childOptions = '';
    const semiProducts = D.products.filter(function(p) { return p.type === 'semi'; });
    for (let i=0; i<semiProducts.length; i++) {
        const p = semiProducts[i];
        childOptions += '<option value="' + p.id + '" ' + (p.id === b.child_product_id ? 'selected' : '') + '>' + p.name + '</option>';
    }

function showWhTab(whId) {
    const tabs = document.querySelectorAll('.wh-tab');
    for (let i=0; i<tabs.length; i++) {
        const t = tabs[i];
        t.className = t.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-700');
        if (t.dataset.wh === whId) t.className = t.className.replace('bg-gray-200 text-gray-700', 'bg-blue-600 text-white');
    }
    const container = document.getElementById('inv-content');
    const searchKw = (document.getElementById('inv-search')?.value || '').toLowerCase();
    let productList = D.products.slice();
    if (searchKw) {
        productList = productList.filter(function(p) {
            return p.name.toLowerCase().indexOf(searchKw) !== -1 ||
                   (p.sku || '').toLowerCase().indexOf(searchKw) !== -1;
        });
    }
    productList.sort(function(a, b) {
        let aVal = a[invSortField] || '';
        let bVal = b[invSortField] || '';
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        if (aVal < bVal) return invSortAsc ? -1 : 1;
        if (aVal > bVal) return invSortAsc ? 1 : -1;
        return 0;
    });
    let rows = '';
    if (whId === 'all') {
        for (let i=0; i<productList.length; i++) {
            const p = productList[i];
            let totalQty = 0;
            const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
            for (let j=0; j<invs.length; j++) { totalQty += invs[j].quantity || 0; }
            const initialStock = p.initial_stock || 0;
            const variance = initialStock > 0 ? ((totalQty - initialStock) / initialStock * 100) : 0;
            const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
            const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';
            rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 text-center">' + p.name + '</td><td class="px-4 py-3 text-center">' + (p.sku || '-') + '</td><td class="px-4 py-3 text-center font-bold text-lg">' + totalQty + '</td><td class="px-4 py-3 text-center">' + initialStock + '</td><td class="px-4 py-3 text-center ' + varianceClass + ' font-bold">' + varianceText + '</td></tr>';
        }
        container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-3 bg-gray-50 border-b"><h3 class="font-bold text-center">📦 全部倉庫庫存總覽</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'name\')">產品 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'sku\')">SKU <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'quantity\')">總庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'initial_stock\')">初始庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs">誤差率</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else {
        const wh = D.warehouses.find(function(w) { return w.id === whId; });
        const inv = D.warehouseInv.filter(function(i) { return i.warehouse_id === whId; });
        for (let i=0; i<productList.length; i++) {
            const p = productList[i];
            const wInv = inv.find(function(x) { return x.product_id === p.id; });
            const qty = wInv ? wInv.quantity : 0;
            const initialStock = p.initial_stock || 0;
            const variance = initialStock > 0 ? ((qty - initialStock) / initialStock * 100) : 0;
            const varianceClass = variance < 0 ? 'text-red-600' : (variance > 5 ? 'text-orange-600' : 'text-green-600');
            const varianceText = initialStock > 0 ? variance.toFixed(1) + '%' : '-';
            rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 text-center">' + p.name + '</td><td class="px-4 py-3 text-center font-bold">' + qty + '</td><td class="px-4 py-3 text-center">' + initialStock + '</td><td class="px-4 py-3 text-center ' + varianceClass + ' font-bold">' + varianceText + '</td><td class="px-4 py-3 text-center"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded text-center" value="' + qty + '"><button onclick="saveInvItem(this, \'' + p.id + '\', \'' + whId + '\')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs btn-touch">儲存</button></td></tr>';
        }
        container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-3 bg-gray-50 border-b"><h3 class="font-bold text-center">🏚️ ' + (wh ? wh.name : '') + ' - 庫存明細</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'name\')">產品 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'quantity\')">庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs cursor-pointer sortable-header" onclick="sortInvTable(\'initial_stock\')">初始庫存 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs">誤差率</th><th class="px-4 py-3 text-center text-xs">調整</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
}

s font-medium text-gray-500 uppercase">商品明細</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase sortable-header cursor-pointer" onclick="sortPurTable(\'total_amount\')">總金額 <span class="sort-icon">↕</span></th><th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody id="pur-tbody"></tbody></table></div></div>';

function sortPurTable(field) {
    if (purSortField === field) purSortAsc = !purSortAsc;
    else { purSortField = field; purSortAsc = true; }
    renderPurTable();
}

function renderPurTable() {
    const searchText = (document.getElementById('pur-search')?.value || '').toLowerCase();
    const startDate = document.getElementById('pur-start-date')?.value || '';
    const endDate = document.getElementById('pur-end-date')?.value || '';
    let list = D.purchases.map(function(p) {
        const vendor = D.vendors.find(v => v.id === p.vendor_id);
        return Object.assign({}, p, { vendor_name: vendor ? vendor.name : '' });
    }).filter(function(p) {
        const purchaseDate = p.created_at ? p.created_at.split('T')[0] : '';
        const matchSearch = !searchText || p.vendor_name.toLowerCase().includes(searchText);
        const matchStartDate = !startDate || purchaseDate >= startDate;
        const matchEndDate = !endDate || purchaseDate <= endDate;
        return matchSearch && matchStartDate && matchEndDate;
    });
    list.sort(function(a, b) {
        let aVal = a[purSortField] || '';
        let bVal = b[purSortField] || '';
        if (purSortField === 'created_at') {
            aVal = new Date(aVal);
            bVal = new Date(bVal);
        } else if (purSortField === 'vendor_name') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
        }
        if (aVal < bVal) return purSortAsc ? -1 : 1;
        if (aVal > bVal) return purSortAsc ? 1 : -1;
        return 0;
    });
    let html = '';
    let totalSum = 0;
    for (let i=0; i<list.length; i++) {
        const p = list[i];
        const v = D.vendors.find(function(x) { return x.id === p.vendor_id; });
        const typeLabel = p.is_invoice_purchase ? '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs">購買發票</span>' : '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">一般採購</span>';
        const invoiceLabel = p.is_invoice_purchase ? '<span class="text-green-600 font-bold">有</span>' : '<span class="text-gray-400">無</span>';
        const items = D.purchaseItems.filter(item => item.purchase_id === p.id) || [];
        const itemsText = items.map(function(item) {
            const prod = D.products.find(x => x.id === item.product_id);
            return (prod?.name || '?') + ' x' + item.quantity;
        }).join(', ');
        let amountDisplay = p.total_amount || 0;
        totalSum += amountDisplay;
        let amountHtml = '<span class="font-bold">' + amountDisplay.toLocaleString() + '</span>';
        if (p.is_invoice_purchase) { amountHtml = '<span class="font-bold text-orange-600">' + amountDisplay.toLocaleString() + '</span>'; }
        html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + (p.created_at ? new Date(p.created_at).toLocaleDateString() : '-') + '</td><td class="px-4 py-3">' + (v?.name || '-') + '</td><td class="px-4 py-3">' + typeLabel + '</td><td class="px-4 py-3">' + invoiceLabel + '</td><td class="px-4 py-3 text-sm text-gray-600">' + (itemsText || '-') + '</td><td class="px-4 py-3">' + amountHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewPurchaseDetail(\'' + p.id + '\')" class="text-blue-600 hover:text-blue-800 btn-touch">詳情</button><button onclick="openPurModal(' + (p.is_invoice_purchase ? 'true' : 'false') + ', \'' + p.id + '\')" class="text-green-600 hover:text-green-800 btn-touch">編輯</button><button onclick="delPur(\'' + p.id + '\')" class="text-red-600 hover:text-red-800 btn-touch">刪除</button></td></tr>';
    }
    html += '<tr class="total-row"><td colspan="5" class="text-right pr-4">總計</td><td class="font-bold text-lg">' + totalSum.toLocaleString() + '</td><td></td></tr>';
    const tbody = document.getElementById('pur-tbody');
    if (tbody) tbody.innerHTML = html;
}

function clearPurFilters() {
    const searchInput = document.getElementById('pur-search');
    const startDateInput = document.getElementById('pur-start-date');
    const endDateInput = document.getElementById('pur-end-date');
    if (searchInput) searchInput.value = '';
    if (startDateInput) startDateInput.value = '';
    if (endDateInput) endDateInput.value = '';
    purSortField = 'created_at';
    purSortAsc = false;
    renderPurTable();
}

function viewPurchaseDetail(id) {
    const p = D.purchases.find(x => x.id === id);
    if (!p) { showAlert('找不到採購資料'); return; }
    const vendor = D.vendors.find(v => v.id === p.vendor_id);
    const items = D.purchaseItems.filter(item => item.purchase_id === id) || [];
    let itemsHTML = '<div class="space-y-2">';

    } else {
        invoiceCheckHtml = '<input type="hidden" id="pu-has-invoice" value="true">';
    }

    let calcHtml = '';
    if (isInvoicePurchase) {
        calcHtml = '<div class="bg-gray-50 p-4 rounded mb-4"><div class="grid grid-cols-2 gap-4"><div><span class="text-sm text-gray-600">成本小計：</span><span id="pu-cost" class="font-bold">0</span></div><div><span class="text-sm text-gray-600">稅金 (5%)：</span><span id="pu-tax" class="font-bold text-orange-600">0</span></div><div class="col-span-2"><span class="text-sm text-gray-600">含稅總金額：</span><span id="pu-total" class="text-xl font-bold text-blue-600">0</span></div></div></div>';
    } else {
        calcHtml = '<div class="bg-gray-50 p-4 rounded mb-4"><div><span class="text-sm text-gray-600">成本小計：</span><span id="pu-cost" class="font-bold text-lg">0</span></div></div>';
    }

    const html = '<input type="hidden" id="pu-invoice-mode" value="' + (isInvoicePurchase ? 'true' : 'false') + '"><input type="hidden" id="pu-edit-id" value="' + (editId || '') + '"><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded input-field">' + vendorOptions + '</select></div>' + (isInvoicePurchase ? '<div></div>' : '<div><label class="block text-sm font-bold mb-2">入庫倉庫 *</label><select id="pu-wh" class="w-full px-3 py-2 border rounded input-field">' + whOptions + '</select></div>') + '</div><div class="mb-4"><label class="block text-sm font-bold mb-2">📅 採購日期</label><input type="date" id="pu-date" class="w-full px-3 py-2 border rounded input-field" value="' + defaultDate.slice(0,10) + '"></div>' + invoiceCheckHtml + '<div class="mb-4"><label class="block text-sm font-bold mb-2">採購商品明細 *</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm btn-touch">+ 新增商品</button></div>' + calcHtml;
    openModal(isInvoicePurchase ? '購買發票' : '一般採購入庫', html, savePur);

    if (editId && existingData) {
        const items = D.purchaseItems.filter(item => item.purchase_id === editId) || [];
        if (items.length > 0) {
            for (let i=0; i<items.length; i++) {
                const item = items[i];
                const p = D.products.find(function(x) { return x.id === item.product_id; });
                addPurItem(p, item.quantity, item.unit_price);
            }

}

function addPurItem(prod, qty, price) {
    const box = document.getElementById('pu-items');
    const div = document.createElement('div');
    div.className = 'pu-item-row';
    const uid = 'pu_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);

    let prodOptionsHtml = '';
    for (let i=0; i<D.products.length; i++) {
        const p = D.products[i];
        const selected = (prod && prod.id === p.id) ? 'selected' : '';
        const displayPrice = p.cost_price || 0;
        prodOptionsHtml += '<div class="opt-item" data-id="' + p.id + '" data-cost="' + displayPrice + '" data-name="' + p.name + '" ' + selected + ' onclick="selectPurProduct(this, \'' + uid + '\')"><span class="opt-name">' + p.name + '</span><span class="opt-cost">(成本: ' + displayPrice + ')</span></div>';
    }
    if (!prodOptionsHtml) {
        prodOptionsHtml = '<div class="opt-item no-match">尚無商品，請先建立</div>';
    }

    let defaultName = prod ? prod.name : '';
    let defaultCost = prod ? (prod.cost_price || 0) : 0;

    div.innerHTML = '<div class="prod-search-wrapper"><input type="text" class="pu-prod-search" placeholder="🔍 搜尋商品..." value="' + defaultName + '" autocomplete="off" oninput="filterPurProdOptions(this, \'' + uid + '\')" onfocus="document.getElementById(\'pu_dropdown_' + uid + '\').classList.add(\'show\')" onblur="setTimeout(function(){document.getElementById(\'pu_dropdown_' + uid + '\').classList.remove(\'show\')},200)"><div class="pu-prod-select" id="pu_dropdown_' + uid + '">' + prodOptionsHtml + '</div><input type="hidden" class="pu-prod-id" value="' + (prod ? prod.id : '') + '"></div><input type="number" class="pu-qty" value="' + (qty || 1) + '" min="1" oninput="calcPur()"><input type="number" class="pu-price" value="' + (price !== undefined ? price : defaultCost) + '" step="0.01" oninput="calcPur()"><button type="button" onclick="this.parentElement.remove();calcPur()" class="del-btn">✕</button>';
    box.appendChild(div);
    if (prod) {
        const hiddenInput = div.querySelector('.pu-prod-id');
        hiddenInput.value = prod.id;
        const priceInput = div.querySelector('.pu-price');
        if (price && price > 0) { priceInput.value = price; }
        else { priceInput.value = prod.cost_price || 0; }
    }
    setTimeout(calcPur, 50);
}

function filterPurProdOptions(input, uid) {
    const kw = input.value.toLowerCase();
    const dropdown = document.getElementById('pu_dropdown_' + uid);
    if (!dropdown) return;
    const items = dropdown.querySelectorAll('.opt-item');
    let hasMatch = false;
    for (let i=0; i<items.length; i++) {
        const item = items[i];
        if (item.classList.contains('no-match')) continue;
        const name = (item.dataset.name || '').toLowerCase();
        if (name.indexOf(kw) !== -1) { item.style.display = 'block'; hasMatch = true; }
        else { item.style.display = 'none'; }
    }
    let noMatch = dropdown.querySelector('.opt-item.no-match');
    if (!hasMatch) {
        if (!noMatch) { noMatch = document.createElement('div'); noMatch.className = 'opt-item no-match'; noMatch.textContent = '無符合商品'; dropdown.appendChild(noMatch); }
        noMatch.style.display = 'block';
    } else { if (noMatch) noMatch.style.display = 'none'; }
    dropdown.classList.add('show');
}

function selectPurProduct(el, uid) {
    const id = el.dataset.id;
    const cost = parseFloat(el.dataset.cost) || 0;
    const name = el.dataset.name || '';
    const wrapper = document.getElementById('pu_dropdown_' + uid)?.closest('.prod-search-wrapper');
    if (!wrapper) return;
    const searchInput = wrapper.querySelector('.pu-prod-search');
    const hiddenInput = wrapper.querySelector('.pu-prod-id');
    const priceInput = wrapper.closest('.pu-item-row')?.querySelector('.pu-price');
    if (searchInput) searchInput.value = name;
    if (hiddenInput) hiddenInput.value = id;
    if (priceInput && !priceInput.dataset.userSet) { priceInput.value = cost; }
    const dropdown = document.getElementById('pu_dropdown_' + uid);
    if (dropdown) dropdown.classList.remove('show');
    calcPur();
}

function calcPur() {
    let subtotal = 0;
    const rows = document.querySelectorAll('#pu-items .pu-item-row');
    for (let i=0; i<rows.length; i++) {
        const r = rows[i];
        const price = parseFloat(r.querySelector('.pu-price').value) || 0;
        const qty = parseInt(r.querySelector('.pu-qty').value) || 0;
        subtotal += price * qty;
    }
    const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
    document.getElementById('pu-cost').textContent = subtotal.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
    if (isInvoiceMode) {
        const tax = subtotal * 0.05;
        const total = subtotal + tax;
        document.getElementById('pu-tax').textContent = tax.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
        document.getElementById('pu-total').textContent = total.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 2});
    }
}

async function savePur() {
    let editId = document.getElementById('pu-edit-id').value;
    const vendorId = document.getElementById('pu-v').value;
    const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
    let hasInvoice = isInvoiceMode;
    if (!isInvoiceMode) {
        const checkbox = document.getElementById('pu-has-invoice');
        hasInvoice = checkbox ? checkbox.checked : false;
    }
    const purchaseDate = document.getElementById('pu-date').value || new Date().toISOString().split('T')[0];

    const missing = [];
    if (!vendorId) missing.push('廠商');
    if (!isInvoiceMode) {
        const whId = document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : '';
        if (!whId) missing.push('入庫倉庫');
    }

    const items = [];
    let subtotal = 0;
    const rows = document.querySelectorAll('#pu-items .pu-item-row');
    for (let i=0; i<rows.length; i++) {
        const r = rows[i];
        const hiddenInput = r.querySelector('.pu-prod-id');
        const pid = hiddenInput ? hiddenInput.value : '';
        const q = parseInt(r.querySelector('.pu-qty').value) || 0;
        const p = parseFloat(r.querySelector('.pu-price').value) || 0;
        if (pid && q > 0) {
            items.push({ product_id: pid, quantity: q, unit_price: p });
            subtotal += p * q;
        }
    }
    if (!items.length) missing.push('採購商品明細');

    if (missing.length > 0) {
        throw new Error('⚠️ 以下欄位尚未填寫，請補齊後再儲存：\n\n' + missing.join('\n'));
    }

    let totalAmount;
    if (isInvoiceMode) {
        totalAmount = Math.round(subtotal * 0.05);
    } else {
        totalAmount = Math.round(subtotal);
    }

    const d = {
        vendor_id: vendorId,
        is_invoice_purchase: hasInvoice,
        total_amount: totalAmount,
        warehouse_id: document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : null,
        created_at: purchaseDate + 'T00:00:00'
    };

    try {
        if (editId) {
            await sb.from('purchase_items').delete().eq('purchase_id', editId);
            await sb.from('purchases').update(d).eq('id', editId);
        } else {
            d.purchase_no = 'PUR-' + Date.now();
            d.status = 'completed';
            const r = await sb.from('purchases').insert([d]).select().single();
            editId = r.data.id;
        }
        await sb.from('purchase_items').insert(items.map(function(i) { return Object.assign({}, i, { purchase_id: editId }); }));

        if (!isInvoiceMode && d.warehouse_id) {
            for (let i=0; i<items.length; i++) {
                const item = items[i];
                const existing = D.warehouseInv.find(function(w) { return w.warehouse_id === d.warehouse_id && w.product_id === item.product_id; });
                if (existing) await sb.from('warehouse_inventory').update({ quantity: (existing.quantity || 0) + item.quantity }).eq('id', existing.id);
                else await sb.from('warehouse_inventory').insert([{ warehouse_id: d.warehouse_id, product_id: item.product_id, quantity: item.quantity, safety_stock: 0 }]);
                const prod = D.products.find(function(x) { return x.id === item.product_id; });
                if (prod) await sb.from('products').update({ current_stock: (prod.current_stock || 0) + item.quantity }).eq('id', item.product_id);
            }
        }

        showAlert('✅ 採購已儲存！');
        window.closeModal();
        await loadAll();
        render();
    } catch (e) {
        console.error('savePur error:', e);
        throw e;
    }
}

async function delPur(id) {
    if (!confirm('確定刪除?')) return;
    try {
        await sb.from('purchase_items').delete().eq('purchase_id', id);
        await sb.from('purchases').delete().eq('id', id);
        await loadAll();
        render();
    } catch(e) {
        showAlert('❌ 失敗：' + e.message);
    }
}

function sortExpTable(field) {
    if (expSortField === field) expSortAsc = !expSortAsc;
    else { expSortField = field; expSortAsc = true; }
    renderExpTable();
}

function renderExpTable() {
    const monthVal = document.getElementById('exp-month').value;
    const kw = (document.getElementById('exp-search') ? document.getElementById('exp-search').value || '' : '').toLowerCase();
    let list = D.expenses.filter(function(e) {
        if (!e.payment_date) return false;
        const d = new Date(e.payment_date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const matchMonth = (y + '-' + m) === monthVal;
        const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
        const matchKw = !kw || (cat && cat.name.toLowerCase().indexOf(kw) !== -1) || (e.description && e.description.toLowerCase().indexOf(kw) !== -1);
        return matchMonth && matchKw;
    });
    list = list.map(function(e) {
        const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
        return Object.assign({}, e, { bank_account_name: bank ? bank.account_name : '' });
    });
    list.sort(function(a, b) {
        let aVal = a[expSortField] || '';
        let bVal = b[expSortField] || '';
        if (expSortField === 'payment_date') {
            aVal = new Date(aVal);
            bVal = new Date(bVal);
        } else if (expSortField === 'category_name') {
            const catA = D.expCats.find(function(c) { return c.id === a.category_id; });
            const catB = D.expCats.find(function(c) { return c.id === b.category_id; });
            aVal = (catA ? catA.name : '').toLowerCase();
            bVal = (catB ? catB.name : '').toLowerCase();
        } else if (expSortField === 'bank_account_name') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
        }
        if (aVal < bVal) return expSortAsc ? -1 : 1;
        if (aVal > bVal) return expSortAsc ? 1 : -1;
        return 0;
    });
    let html = '';
    let totalSum = 0;
    for (let i=0; i<list.length; i++) {
        const e = list[i];
        const cat = D.expCats.find(function(c) { return c.id === e.category_id; });
        const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
        const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
        const statusHtml = e.is_reimbursed ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">已結帳</span>' : '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">待結帳</span>';
        const amount = e.amount || 0;
        totalSum += amount;
        html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap">' + e.payment_date + '</td><td class="px-4 py-3">' + (cat ? cat.name : '-') + '</td><td class="px-4 py-3 font-bold text-red-600">' + amount.toLocaleString() + '</td><td class="px-4 py-3 text-sm">' + (e.description || '-') + '</td><td class="px-4 py-3">' + (emp ? emp.name : '-') + '</td><td class="px-4 py-3">' + statusHtml + '</td><td class="px-4 py-3">' + (bank ? bank.account_name : '-') + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openExpModal(\'' + e.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delExp(\'' + e.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
    }
    html += '<tr class="total-row"><td colspan="2" class="text-right pr-4">總計</td><td class="font-bold text-lg">' + totalSum.toLocaleString() + '</td><td colspan="5"></td></tr>';
    document.getElementById('exp-tbody').innerHTML = html;
}

function renderSubTable() {
    let list = D.subs.slice();
    list = list.map(function(s) {
        const bank = D.banks.find(b => b.id === s.bank_account_id);
        return Object.assign({}, s, { bank_account_name: bank ? bank.account_name : '' });
    });
    list.sort(function(a, b) {
        let aVal = a[subSortField] || '';
        let bVal = b[subSortField] || '';
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        if (aVal < bVal) return subSortAsc ? -1 : 1;
        if (aVal > bVal) return subSortAsc ? 1 : -1;
        return 0;
    });
    let subHtml = '';
    let totalAmount = 0;
    for (let i=0; i<list.length; i++) {
        const s = list[i];
        let monthlyText = '-';
        if (s.start_date && s.end_date && s.amount) {
            const startDate = new Date(s.start_date);
            const endDate = new Date(s.end_date);
            const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
            if (diffMonths > 0) {
                const monthly = s.amount / diffMonths;
                monthlyText = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
            }
        }
        const bank = D.banks.find(b => b.id === s.bank_account_id);
        totalAmount += s.amount || 0;
        subHtml += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + s.name + '</td><td class="px-4 py-3">' + (s.provider || '-') + '</td><td class="px-4 py-3">' + (bank ? bank.account_name : '-') + '</td><td class="px-4 py-3">' + (s.start_date || '-') + ' ~ ' + (s.end_date || '-') + '</td><td class="px-4 py-3 font-bold">' + (s.amount || 0).toLocaleString() + '</td><td class="px-4 py-3 font-bold text-blue-600">' + monthlyText + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="openSubModal(\'' + s.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delSub(\'' + s.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';
    }
    subHtml += '<tr class="total-row"><td colspan="4" class="text-right pr-4">總計</td><td class="font-bold text-lg">' + totalAmount.toLocaleString() + '</td><td colspan="2"></td></tr>';
    document.getElementById('sub-tbody').innerHTML = subHtml;
}

function toggleExpBankSelect() {
    const empId = document.getElementById('e-emp').value;
    const reimbursedCheck = document.getElementById('e-reimbursed');
    if (empId) {
        reimbursedCheck.checked = false;
        reimbursedCheck.disabled = false;
        document.querySelector('label[for="e-reimbursed"]').textContent = '此筆費用已結帳給員工';
    } else {
        reimbursedCheck.checked = true;
        reimbursedCheck.disabled = true;
        document.querySelector('label[for="e-reimbursed"]').textContent = '公司支付自動結帳';
    }
}

async function saveExp() {
    const id = document.getElementById('e-id').value;
    const empId = document.getElementById('e-emp').value || null;
    const isCompanyPay = !empId;
    const isReimbursed = isCompanyPay ? true : document.getElementById('e-reimbursed').checked;
    const bankId = document.getElementById('e-bank').value || null;
    const amount = parseFloat(document.getElementById('e-amt').value) || 0;
    const paymentDate = document.getElementById('e-date').value;
    const catId = document.getElementById('e-cat').value;

    const missing = [];
    if (!catId) missing.push('類別');
    if (amount <= 0) missing.push('金額 (須大於0)');
    if (!paymentDate) missing.push('日期');
    if (!bankId) missing.push('出帳銀行帳戶');

    if (missing.length > 0) {
        throw new Error('⚠️ 以下欄位尚未填寫或無效，請補齊後再儲存：\n\n' + missing.join('\n'));
    }

    const d = {
        category_id: catId,
        amount: amount,
        description: document.getElementById('e-desc').value || null,
        payment_date: paymentDate,
        employee_id: empId,
        is_reimbursed: isReimbursed,
        reimbursement_bank_id: bankId,
        reimbursed_date: isReimbursed ? new Date().toISOString().split('T')[0] : null
    };

    try {
        if (id) {
            await sb.from('expenses').update(d).eq('id', id);
            showAlert('✅ 已更新！');
        } else {
            const newExp = await sb.from('expenses').insert([d]).select().single();
            if (newExp.error) throw newExp.error;
            if (bankId && amount > 0) {
                const bank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
                if (bank.data) {
                    await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) - amount }).eq('id', bankId);
                }
            }
            showAlert('✅ 已記錄並扣款！');
        }
        window.closeModal();
        await loadAll();
        if (currentView === 'finance') {
            renderFinance(document.getElementById('main-content'));
        } else {
            render();
        }
    } catch(e) {
        console.error('saveExp error:', e);
        throw e;
    }
}

async function delExp(id) {
    if (!confirm('確定刪除?')) return;
    try {
        const e = D.expenses.find(function(x) { return x.id === id; });
        if (e && e.reimbursement_bank_id && e.amount > 0 && e.is_reimbursed) {
            const bank = await sb.from('bank_accounts').select('balance').eq('id', e.reimbursement_bank_id).single();
            if (bank.data) {
                await sb.from('bank_accounts').update({ balance: (bank.data.balance || 0) + e.amount }).eq('id', e.reimbursement_bank_id);
            }
        }
        await sb.from('expenses').delete().eq('id', id);
        await loadAll();
        render();
    } catch(e) {
        showAlert('❌ 失敗：' + e.message);
    }
}

function sortSubTable(field) {
    if (subSortField === field) subSortAsc = !subSortAsc;
    else { subSortField = field; subSortAsc = true; }
    renderSubTable();
}

async function openSubModal(id) {
    editingId = id || null;
    const s = id ? D.subs.find(function(x) { return x.id === id; }) : null;
    const today = new Date().toISOString().split('T')[0];

    if (D.banks.length === 0) {
        const confirmCreate = confirm('⚠️ 目前沒有任何銀行帳戶！\n\n建立訂閱需要選擇一個銀行帳戶進行扣款。\n\n是否前往「銀行帳戶」建立？');
        if (confirmCreate) { document.querySelector('nav a[data-view="banks"]').click(); }
        return;
    }

    let bankOptions = '<option value="">請選擇出帳銀行</option>';
    for (let i=0; i<D.banks.length; i++) {
        const b = D.banks[i];
        const selected = (s && s.bank_account_id === b.id) ? 'selected' : '';
        bankOptions += '<option value="' + b.id + '" ' + selected + '>' + b.account_name + ' (餘額: ' + (b.balance||0).toLocaleString() + ')</option>';
    }

    const html = '<input type="hidden" id="s-id" value="' + (id || '') + '"><div class="mb-4"><label class="block text-sm font-bold mb-2">名稱 *</label><input type="text" id="s-name" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.name : '') + '"></div><div class="mb-4"><label class="block text-sm font-bold mb-2">供應商</label><input type="text" id="s-provider" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? s.provider : '') + '"></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"><div><label class="block text-sm font-bold mb-2">開始日期 *</label><input type="date" id="s-start" class="w-full px-3 py-2 border rounded input-field" value="' + (s && s.start_date ? s.start_date.slice(0,10) : today) + '"></div><div><label class="block text-sm font-bold mb-2">結束日期 *</label><input type="date" id="s-end" class="w-full px-3 py-2 border rounded input-field" value="' + (s && s.end_date ? s.end_date.slice(0,10) : '') + '"></div><div><label class="block text-sm font-bold mb-2">總金額 *</label><input type="number" id="s-amt" class="w-full px-3 py-2 border rounded input-field" value="' + (s ? Number(s.amount) || 0 : 0) + '" step="0.01"></div></div><div class="mb-4"><label class="block text-sm font-bold mb-2">出帳銀行帳戶 *</label><select id="s-bank" class="w-full px-3 py-2 border rounded input-field">' + bankOptions + '</select></div><div class="bg-blue-50 p-3 rounded"><span class="text-sm text-gray-600">每月攤提費用：</span><span id="s-monthly" class="text-lg font-bold text-blue-600">0</span></div>';
    openModal(id ? '編輯訂閱' : '新增訂閱', html, saveSub);
    calcMonthlySub();
    document.getElementById('s-start')?.addEventListener('change', calcMonthlySub);
    document.getElementById('s-end')?.addEventListener('change', calcMonthlySub);
    document.getElementById('s-amt')?.addEventListener('input', calcMonthlySub);
}

function calcMonthlySub() {
    const start = document.getElementById('s-start')?.value;
    const end = document.getElementById('s-end')?.value;
    const amount = parseFloat(document.getElementById('s-amt')?.value) || 0;
    const monthlyEl = document.getElementById('s-monthly');
    if (!monthlyEl) return;
    if (!start || !end || amount <= 0) { monthlyEl.textContent = '0'; return; }
    const startDate = new Date(start);
    const endDate = new Date(end);
    const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
    if (diffMonths <= 0) { monthlyEl.textContent = '0 (日期無效)'; return; }
    const monthly = amount / diffMonths;
    monthlyEl.textContent = monthly.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

async function saveSub() {
    const id = document.getElementById('s-id').value;
    const bankId = document.getElementById('s-bank').value;
    const amount = parseFloat(document.getElementById('s-amt').value) || 0;
    const startDate = document.getElementById('s-start').value;
    const endDate = document.getElementById('s-end').value;
    const name = document.getElementById('s-name').value.trim();

    const missing = [];
    if (!name) missing.push('名稱');
    if (!bankId) missing.push('出帳銀行帳戶');
    if (amount <= 0) missing.push('總金額 (須大於0)');
    if (!startDate) missing.push('開始日期');
    if (!endDate) missing.push('結束日期');

    if (missing.length > 0) {
        throw new Error('⚠️ 以下欄位尚未填寫或無效，請補齊後再儲存：\n\n' + missing.join('\n'));
    }

    const start = new Date(startDate);
    const end = new Date(endDate);
    if (end < start) {
        throw new Error('⚠️ 結束日期不能早於開始日期！');
    }

    const d = {
        name: name,
        provider: document.getElementById('s-provider').value.trim() || null,
        amount: amount,
        start_date: startDate,
        end_date: endDate,
        bank_account_id: bankId
    };

    try {
        let result;
        if (id) {
            const oldSub = D.subs.find(function(x) { return x.id === id; });
            if (oldSub && oldSub.bank_account_id) {
                const oldBank = await sb.from('bank_accounts').select('balance').eq('id', oldSub.bank_account_id).single();
                if (oldBank.data) {
                    await sb.from('bank_accounts').update({ balance: (oldBank.data.balance || 0) + oldSub.amount }).eq('id', oldSub.bank_account_id);
                }
            }
            result = await sb.from('system_subscriptions').update(d).eq('id', id);
            if (result.error) throw result.error;
            showAlert('✅ 訂閱已更新！');
        } else {
            result = await sb.from('system_subscriptions').insert([d]).select().single();
            if (result.error) throw result.error;
            editingId = result.data.id;
            showAlert('✅ 訂閱已新增！');
        }
        if (bankId && amount > 0) {
            const currentBank = await sb.from('bank_accounts').select('balance').eq('id', bankId).single();
            if (currentBank.data) {
                await sb.from('bank_accounts').update({ balance: (currentBank.data.balance || 0) - amount }).eq('id', bankId);
            }
        }
        window.closeModal();
        await loadAll();
        if (currentView === 'finance') {
            renderFinance(document.getElementById('main-content'));
        } else {
            render();
        }
    } catch(e) {
        console.error('saveSub error:', e);
        throw e;
    }
}

// ================================================================
//  19. 老闆查閱（已修正：從 expenses 抓取通路抽成與付款手續費）
// ================================================================
function renderBoss(c) {
    const startY = parseInt(bossDateRange.start.split('-')[0]);
    const startM = parseInt(bossDateRange.start.split('-')[1]);
    const endY = parseInt(bossDateRange.end.split('-')[0]);
    const endM = parseInt(bossDateRange.end.split('-')[1]);

    const monthOrders = D.orders.filter(function(o) {
        const d = new Date(o.created_at);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
    });

    let rev = 0;
    for (let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount || 0;

    const monthPurchases = D.purchases.filter(function(p) {
        const d = new Date(p.created_at);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
    });
    let pur = 0;
    for (let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount || 0;

    const monthExpenses = D.expenses.filter(function(e) {
        if (!e.payment_date) return false;
        const d = new Date(e.payment_date);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
    });
    let exp = 0;
    for (let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount || 0;

    let subMonthlyTotal = 0;
    const targetMonth = bossDateRange.start;
    for (let i=0; i<D.subs.length; i++) {
        const s = D.subs[i];
        if (s.start_date && s.end_date && s.amount) {
            const startDate = new Date(s.start_date);
            const endDate = new Date(s.end_date);
            const targetDate = new Date(targetMonth + '-01');
            if (targetDate >= startDate && targetDate <= endDate) {
                const diffMonths = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth()) + 1;
                if (diffMonths > 0) {
                    subMonthlyTotal += s.amount / diffMonths;
                }
            }
        }
    }

    let totalCash = 0;
    for (let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance || 0;

    // ★★★ 計算商品總成本 ★★★
    let totalProductCost = 0;
    let giftCost = 0;
    for (let i=0; i<monthOrders.length; i++) {
        const o = monthOrders[i];
        const items = D.orderItems.filter(item => item.order_id === o.id);
        for (let j=0; j<items.length; j++) {
            const item = items[j];
            const prod = D.products.find(p => p.id === item.product_id);
            if (prod) {
                const cost = prod.cost_price || 0;
                const finalCost = (item.has_invoice && prod.type === 'finished') ? cost * 1.05 : cost;
                const totalItemCost = finalCost * item.quantity;
                totalProductCost += totalItemCost;
                if (item.is_gift) {
                    giftCost += totalItemCost;
                }
            }
        }
    }

    // ★★★ 期間總成本 = 商品成本 + 採購成本 + 期間費用 + 訂閱攤提 ★★★
    const totalCostAll = totalProductCost + pur + exp + subMonthlyTotal;
    const monthlyProfit = rev - totalCostAll;

    // 其餘統計（通路抽成、手續費等從 expenses 抓取）
    const channelCat = D.expCats.find(c => c.name === '通路抽成');
    const paymentCat = D.expCats.find(c => c.name === '付款手續費');
    const shippingCat = D.expCats.find(c => c.name === '運費');

    const periodExpenses = D.expenses.filter(e => {
        if (!e.payment_date) return false;
        const d = new Date(e.payment_date);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
    });

    let totalChannelCommission = 0;
    let totalPaymentCommission = 0;
    let totalShippingCost = 0;
    for (const e of periodExpenses) {
        if (channelCat && e.category_id === channelCat.id) totalChannelCommission += e.amount || 0;
        if (paymentCat && e.category_id === paymentCat.id) totalPaymentCommission += e.amount || 0;
        if (shippingCat && e.category_id === shippingCat.id && e.description && e.description.includes('公司吸收')) {
            totalShippingCost += e.amount || 0;
        }
    }

    let customerShipping = 0;
    for (let i=0; i<monthOrders.length; i++) {
        customerShipping += monthOrders[i].customer_paid_shipping || 0;
    }

    const totalOrderExpenses = totalChannelCommission + totalPaymentCommission + totalShippingCost;

    // 其餘統計（客戶數、訂閱等）
    const subTag = D.tags.find(function(t) { return t.name.indexOf('訂閱') !== -1; });
    let subCustomerCount = 0;
    if (subTag && D.customerTags) {
        const subTagIds = D.customerTags.filter(function(ct) { return ct.tag_id === subTag.id; }).map(function(ct) { return ct.customer_id; });
        const uniqueIds = [];
        for (let i=0; i<subTagIds.length; i++) {
            if (uniqueIds.indexOf(subTagIds[i]) === -1) uniqueIds.push(subTagIds[i]);
        }
        subCustomerCount = uniqueIds.length;
    }
    let subMonthlyRevenue = 0;
    for (let i=0; i<D.customers.length; i++) {
        const c = D.customers[i];
        if (c.is_subscription && c.subscription_days > 0 && c.subscription_amount > 0) {
            const monthlyAmount = (c.subscription_amount / c.subscription_days) * 30;
            subMonthlyRevenue += monthlyAmount;
        }
    }
    const totalCustomers = D.customers.length;
    const monthOrderCount = monthOrders.length;

    // 通路與付款的詳細統計
    let channelStatsHtml = '';
    if (channelCat) {
        const channelExpenses = periodExpenses.filter(e => e.category_id === channelCat.id);
        let total = 0;
        for (const e of channelExpenses) total += e.amount || 0;
        channelStatsHtml = '<div class="flex justify-between"><span>通路抽成總計</span><span class="font-bold text-red-600">' + total.toLocaleString() + '</span></div>';
    } else {
        channelStatsHtml = '<div class="text-gray-400">無數據</div>';
    }

    let paymentStatsHtml = '';
    if (paymentCat) {
        const paymentExpenses = periodExpenses.filter(e => e.category_id === paymentCat.id);
        let total = 0;
        for (const e of paymentExpenses) total += e.amount || 0;
        paymentStatsHtml = '<div class="flex justify-between"><span>付款手續費總計</span><span class="font-bold text-red-600">' + total.toLocaleString() + '</span></div>';
    } else {
        paymentStatsHtml = '<div class="text-gray-400">無數據</div>';
    }

    // 員工代墊明細
    const unreimbursedExpenses = D.expenses.filter(function(e) { return e.employee_id && !e.is_reimbursed; });
    const unreimbursedByEmp = {};
    for (let i=0; i<unreimbursedExpenses.length; i++) {
        const e = unreimbursedExpenses[i];
        const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
        if (emp) {
            if (!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
            unreimbursedByEmp[emp.name].total += e.amount || 0;
            unreimbursedByEmp[emp.name].items.push(e);
        }
    }
    let unreimbursedHtml = '';
    for (const name in unreimbursedByEmp) {
        const data = unreimbursedByEmp[name];
        let itemsHtml = '';
        for (let i=0; i<data.items.length; i++) {
            const e = data.items[i];
            const cat = D.expCats.find(c => c.id === e.category_id);
            const catName = cat ? cat.name : '未分類';
            itemsHtml += '<div class="flex justify-between"><span>'+catName+' ('+e.payment_date+')</span><span>'+(e.amount||0).toLocaleString()+'</span></div>';
        }
        unreimbursedHtml += '<div class="border rounded-lg p-4"><div class="flex justify-between items-center mb-2"><span class="font-bold text-lg">'+name+'</span><span class="text-2xl font-bold text-orange-600">'+data.total.toLocaleString()+'</span></div><div class="text-sm text-gray-600 space-y-1">'+itemsHtml+'</div></div>';
    }
    if (!unreimbursedHtml) unreimbursedHtml = '<p class="text-gray-500">目前無待結帳代墊款項</p>';

    // 庫存明細
    const inventoryByType = {};

function downloadBossReport() {
    const startDate = bossDateRange.start;
    const endDate = bossDateRange.end;
    const fileName = startDate + '_至_' + endDate + '_養芯ERP資料.xlsx';
    const wb = XLSX.utils.book_new();

    const custData = D.customers.map(function(c) {
        const win = D.windows.find(w => w.id === c.primary_contact_window_id);
        const tags = D.customerTags.filter(ct => ct.customer_id === c.id).map(ct => {
            const t = D.tags.find(tg => tg.id === ct.tag_id);
            return t ? t.name : '';
        }).join(', ');
        return {
            '類型': c.type || '',
            '公司/姓名': c.company_name || c.contact_person || '',
            '聯絡人': c.contact_person || '',
            '電話': c.phone || '',
            '主要窗口': win ? win.name : '',
            '標籤': tags,
            '統一編號': c.tax_id || '',
            '發票抬頭': c.invoice_title || '',
            'Email': c.email || '',
            '訂閱': c.is_subscription ? '是 (' + (c.subscription_days||0) + '天, ' + (c.subscription_amount||0) + '元)' : '否',
            '備註': c.notes || ''
        };
    });
    const ws1 = XLSX.utils.json_to_sheet(custData);
    XLSX.utils.book_append_sheet(wb, ws1, '客戶管理');

    const ordData = D.orders.filter(function(o) {
        const d = new Date(o.created_at);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dateStr = y + '-' + m;
        return dateStr >= startDate && dateStr <= endDate;
    }).map(function(o) {
        const c = D.customers.find(x => x.id === o.customer_id);
        const bank = D.banks.find(x => x.id === o.bank_account_id);
        return {
            '日期': new Date(o.created_at).toLocaleDateString(),
            '訂單編號': o.order_no || '',
            '客戶': c ? c.company_name || c.contact_person : '',
            '總金額': o.total_amount || 0,
            '毛利率': o.gross_profit_margin ? o.gross_profit_margin.toFixed(1) + '%' : '',
            '入帳銀行': bank ? bank.account_name : '',
            '運費': o.shipping_fee || 0,
            '訂閱': o.is_subscription_order ? '是' : '否'
        };
    });
    const ws2 = XLSX.utils.json_to_sheet(ordData);
    XLSX.utils.book_append_sheet(wb, ws2, '訂單出貨');

    const expData = D.expenses.filter(function(e) {
        if (!e.payment_date) return false;
        const d = new Date(e.payment_date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return (y + '-' + m) >= startDate && (y + '-' + m) <= endDate;
    }).map(function(e) {
        const cat = D.expCats.find(c => c.id === e.category_id);
        const emp = D.emps.find(x => x.id === e.employee_id);
        const bank = D.banks.find(b => b.id === e.reimbursement_bank_id);
        return {
            '日期': e.payment_date || '',
            '類別': cat ? cat.name : '',
            '金額': e.amount || 0,
            '描述': e.description || '',
            '代墊員工': emp ? emp.name : '',
            '結帳狀態': e.is_reimbursed ? '已結帳' : '待結帳',
            '出帳銀行': bank ? bank.account_name : ''
        };
    });
    const ws3 = XLSX.utils.json_to_sheet(expData);
    XLSX.utils.book_append_sheet(wb, ws3, '收支與訂閱');

    const purData = D.purchases.filter(function(p) {
        if (!p.created_at) return false;
        const d = new Date(p.created_at);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return (y + '-' + m) >= startDate && (y + '-' + m) <= endDate;
    }).map(function(p) {
        const v = D.vendors.find(x => x.id === p.vendor_id);
        return {
            '日期': p.created_at ? new Date(p.created_at).toLocaleDateString() : '',
            '廠商': v ? v.name : '',
            '類型': p.is_invoice_purchase ? '購買發票' : '一般採購',
            '有發票': p.is_invoice_purchase ? '有' : '無',
            '總金額': p.total_amount || 0
        };
    });
    const ws4 = XLSX.utils.json_to_sheet(purData);
    XLSX.utils.book_append_sheet(wb, ws4, '採購入庫');

    const venData = D.vendors.map(function(v) {
        return {
            '名稱': v.name || '',
            '統一編號': v.tax_id || '',
            '聯絡人': v.contact_person || '',
            '電話': v.phone || '',
            '合作狀態': v.cooperation_status === 'paused' ? '暫時無配合' : '正常配合'
        };
    });
    const ws5 = XLSX.utils.json_to_sheet(venData);
    XLSX.utils.book_append_sheet(wb, ws5, '廠商管理');

    const invData = D.products.map(function(p) {
        let totalQty = 0;
        const invs = D.warehouseInv.filter(i => i.product_id === p.id);
        for (let j=0; j<invs.length; j++) totalQty += invs[j].quantity || 0;
        const initStock = p.initial_stock || 0;
        const variance = initStock > 0 ? ((totalQty - initStock) / initStock * 100) : 0;
        return {
            '產品': p.name || '',
            'SKU': p.sku || '',
            '目前庫存': totalQty,
            '初始庫存': initStock,
            '誤差率': initStock > 0 ? variance.toFixed(1) + '%' : '-'
        };
    });
    const ws6 = XLSX.utils.json_to_sheet(invData);
    XLSX.utils.book_append_sheet(wb, ws6, '庫存盤點');

    const bankData = D.banks.map(function(b) {
        return {
            '帳戶名稱': b.account_name || '',
            '銀行名稱': b.bank_name || '',
            '帳號': b.account_number || '',
            '餘額': b.balance || 0,
            '狀態': b.is_active !== false ? '啟用' : '停用'
        };
    });
    const ws7 = XLSX.utils.json_to_sheet(bankData);
    XLSX.utils.book_append_sheet(wb, ws7, '銀行帳戶');

    XLSX.writeFile(wb, fileName);
    showAlert('Excel 報表已下載！');
}

function sortOrdTable(field) {
    if (ordSortField === field) ordSortAsc = !ordSortAsc;
    else { ordSortField = field; ordSortAsc = true; }
    renderOrdTable();
}

function renderOrdTable() {
    const searchInput = document.getElementById('ord-search');
    const startDateInput = document.getElementById('ord-start-date');
    const endDateInput = document.getElementById('ord-end-date');
    const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
    const startDate = startDateInput ? startDateInput.value : '';
    const endDate = endDateInput ? endDateInput.value : '';

    let list = D.orders.map(function(o) {
        const c = D.customers.find(function(x) { return x.id === o.customer_id; });
        return Object.assign({}, o, { customer_name: c ? (c.company_name || c.contact_person || '') : '' });
    });

    if (searchTerm) {
        list = list.filter(function(o) {
            const c = D.customers.find(function(x) { return x.id === o.customer_id; });
            const customerName = c ? (c.company_name || c.contact_person || '').toLowerCase() : '';
            const customerPhone = c ? (c.phone || '').toLowerCase() : '';
            return customerName.indexOf(searchTerm) !== -1 || customerPhone.indexOf(searchTerm) !== -1;
        });
    }
    if (startDate) {
        list = list.filter(function(o) {
            const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
            return orderDate >= startDate;
        });
    }
    if (endDate) {
        list = list.filter(function(o) {
            const orderDate = new Date(o.created_at).toISOString().slice(0, 7);
            return orderDate <= endDate;
        });
    }

    list.sort(function(a, b) {
        let aVal = a[ordSortField] || '';
        let bVal = b[ordSortField] || '';
        if (ordSortField === 'created_at') {
            aVal = new Date(aVal);
            bVal = new Date(bVal);
        } else if (ordSortField === 'customer_name') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
        }
        if (aVal < bVal) return ordSortAsc ? -1 : 1;
        if (aVal > bVal) return ordSortAsc ? 1 : -1;
        return 0;
    });

    let html = '';
    let totalAmount = 0;
    let totalMargin = 0;
    let count = 0;
    for (let i=0; i<list.length; i++) {
        const o = list[i];
        const c = D.customers.find(function(x) { return x.id === o.customer_id; });
        const emp = o.shipping_advance_employee_id ? D.emps.find(function(x) { return x.id === o.shipping_advance_employee_id; }) : null;
        const bank = D.banks.find(function(x) { return x.id === o.bank_account_id; });
        totalAmount += o.total_amount || 0;
        if (o.gross_profit_margin !== undefined) { totalMargin += o.gross_profit_margin || 0; count++; }
        let marginHtml = '<span class="text-gray-400">-</span>';
        if (o.gross_profit_margin !== undefined && o.gross_profit_margin !== null) {
            const color = o.gross_profit_margin >= 0 ? 'text-green-600' : 'text-red-600';
            marginHtml = '<span class="' + color + ' font-bold">' + o.gross_profit_margin.toFixed(1) + '%</span>';
        }
        let advanceHtml = '<span class="text-gray-400">-</span>';
        if (o.shipping_advance_employee_id && o.shipping_advance_amount > 0) {
            const emp = D.emps.find(e => e.id === o.shipping_advance_employee_id);
            if (emp) {
                advanceHtml = '<div class="text-xs text-center"><div class="text-orange-600">' + emp.name + '</div><div class="font-bold">' + o.shipping_advance_amount.toLocaleString() + '</div></div>';
            }
        }
        html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-center whitespace-nowrap">' + new Date(o.created_at).toLocaleDateString() + '</td><td class="px-4 py-3 text-center">' + (c ? c.company_name || c.contact_person : '-') + '</td><td class="px-4 py-3 text-center">' + (bank ? bank.account_name : '-') + '</td><td class="px-4 py-3 text-center">' + advanceHtml + '</td><td class="px-4 py-3 text-center font-bold">' + (o.total_amount || 0).toLocaleString() + '</td><td class="px-4 py-3 text-center">' + marginHtml + '</td><td class="px-4 py-3 whitespace-nowrap space-x-2 text-center">' +
            '<button onclick="viewOrdDetail(\'' + o.id + '\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button>' +
            '<button onclick="openOrdModal(\'' + o.id + '\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button>' +
            '<button onclick="delOrd(\'' + o.id + '\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button>' +
            '</td>' +
            '</tr>';
    }
    const avgMargin = count > 0 ? (totalMargin / count).toFixed(1) : 0;
    html += '<tr class="bg-gray-100 font-bold"><td class="px-4 py-3 text-center" colspan="3">總計 (' + list.length + ' 單)</td><td class="px-4 py-3 text-center text-lg">' + totalAmount.toLocaleString() + '</td><td class="px-4 py-3 text-center text-lg">' + avgMargin + '%</td><td class="px-4 py-3 text-center" colspan="2">平均毛利率</td></tr>';
    const tbody = document.getElementById('ord-tbody');
    if (tbody) tbody.innerHTML = html;
}
