function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  const isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    setTimeout(() => overlay.classList.add('hidden'), 300);
  } else {
    overlay.classList.remove('hidden');
    void overlay.offsetWidth;
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const menuBtn = document.getElementById('menu-toggle-btn');
  const closeBtn = document.getElementById('sidebar-close-btn');
  const overlay = document.getElementById('sidebar-overlay');
  if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
  if (closeBtn) closeBtn.addEventListener('click', toggleSidebar);
  if (overlay) overlay.addEventListener('click', toggleSidebar);
  const navLinks = document.querySelectorAll('nav a');
  for(let i=0; i<navLinks.length; i++) {
    navLinks[i].addEventListener('click', function(e) {
      e.preventDefault();
      switchView(this.dataset.view);
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 1024 && sidebar && sidebar.classList.contains('open')) {
        toggleSidebar();
      }
    });
  }
});

function showAlert(msg) { document.getElementById('alert-message').textContent = msg; document.getElementById('alert-modal').classList.remove('hidden'); }
document.getElementById('alert-ok-btn').addEventListener('click', function() { document.getElementById('alert-modal').classList.add('hidden'); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (!document.getElementById('modal-overlay').classList.contains('hidden')) window.closeModal();
    if (!document.getElementById('alert-modal').classList.contains('hidden')) document.getElementById('alert-modal').classList.add('hidden');
  }
});

window.closeModal = function() {
  document.getElementById('modal-overlay').classList.add('hidden');
  editingId = null;
  isSaving = false;
  const saveBtn = document.getElementById('modal-save-btn');
  if(saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '儲存 (Enter)'; saveBtn.onclick = null; }
};

function openModal(title, html, onSave, hideSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  isSaving = false;
  saveBtn.disabled = false;
  saveBtn.textContent = '儲存 (Enter)';
  if(hideSave) { saveBtn.classList.add('hidden'); } 
  else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = function() {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      onSave().then(function() {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }).catch(function(e) {
        console.error('Save error:', e);
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      });
    };
  }
  cancelBtn.onclick = window.closeModal;
  closeBtn.onclick = window.closeModal;
  const handleEnter = function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      if (!hideSave && saveBtn.onclick) saveBtn.click();
    }
  };
  document.addEventListener('keydown', handleEnter, { once: true });
}

document.getElementById('login-btn').addEventListener('click', function() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  if(remember) localStorage.setItem('rememberedEmail', email);
  else localStorage.removeItem('rememberedEmail');
  sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(function() { switchView('boss'); });
    }
  }).catch(function(err) { showAlert('登入發生錯誤：' + err.message); });
});

window.addEventListener('load', function() {
  const rememberedEmail = localStorage.getItem('rememberedEmail');
  if(rememberedEmail) {
    document.getElementById('email').value = rememberedEmail;
    document.getElementById('remember').checked = true;
  }
});

document.getElementById('password').addEventListener('keypress', function(e) { if(e.key === 'Enter') document.getElementById('login-btn').click(); });
document.getElementById('logout-btn').addEventListener('click', function() { sb.auth.signOut().then(function() { location.reload(); }); });

async function loadAll() {
  const map = { products:'products', windows:'contact_windows', customers:'customers', tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', channels:'sales_channels', payments:'payment_methods', expenses:'expenses', subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', expCats:'expense_categories', orders:'orders', purchases:'purchases', warehouseInv:'warehouse_inventory', customerTags:'customer_tags' };
  for (const key in map) {
    const res = await sb.from(map[key]).select('*');
    D[key] = res.data || [];
  }
}

function switchView(v) {
  currentView = v;
  const navLinks = document.querySelectorAll('nav a');
  for(let i=0; i<navLinks.length; i++) {
    navLinks[i].classList.toggle('nav-active', navLinks[i].dataset.view === v);
  }
  render();
}

function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}

function sortTable(tbodyId, colIndex) {
  const tbody = document.getElementById(tbodyId);
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a, b) {
    const aText = a.cells[colIndex] ? a.cells[colIndex].textContent || '' : '';
    const bText = b.cells[colIndex] ? b.cells[colIndex].textContent || '' : '';
    return aText.localeCompare(bText, 'zh-TW');
  });
  for(let i=0; i<rows.length; i++) tbody.appendChild(rows[i]);
}
  // ==================== 老闆查閱（完整功能）====================
function renderBoss(c) {
  const startY = parseInt(bossDateRange.start.split('-')[0]);
  const startM = parseInt(bossDateRange.start.split('-')[1]);
  const endY = parseInt(bossDateRange.end.split('-')[0]);
  const endM = parseInt(bossDateRange.end.split('-')[1]);
  
  const monthOrders = D.orders.filter(function(o) {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  
  let rev = 0;
  for(let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount||0;
  
  const monthPurchases = D.purchases.filter(function(p) {
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let pur = 0;
  for(let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount||0;
  
  const monthExpenses = D.expenses.filter(function(e) {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let exp = 0;
  for(let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount||0;
  
  const monthSubs = D.subs.filter(function(s) {
    if(!s.start_date) return false;
    const d = new Date(s.start_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let sub = 0;
  for(let i=0; i<monthSubs.length; i++) sub += monthSubs[i].amount||0;
  
  let totalCash = 0;
  for(let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance||0;
  
  const monthlyProfit = rev - pur - exp - sub;
  
  const unreimbursedExpenses = D.expenses.filter(function(e) { return e.employee_id && !e.is_reimbursed; });
  const unreimbursedByEmp = {};
  for(let i=0; i<unreimbursedExpenses.length; i++) {
    const e = unreimbursedExpenses[i];
    const emp = D.emps.find(function(x) { return x.id === e.employee_id; });
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += e.amount || 0;
      unreimbursedByEmp[emp.name].items.push(e);
    }
  }
  
  const inventoryByType = {};
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    let totalQty = 0;
    const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity||0;
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({ type: p.type, name: p.name, sku: p.sku, quantity: totalQty, cost: p.cost_price || 0, value: totalQty * (p.cost_price || 0) });
    }
  }
  
  const inventoryAssets = { finished: { count: 0, value: 0 }, semi: { count: 0, value: 0 }, gift_box: { count: 0, value: 0 }, outer_box: { count: 0, value: 0 } };
  let allItems = [];
  for(const type in inventoryByType) { allItems = allItems.concat(inventoryByType[type]); }
  for(let i=0; i<allItems.length; i++) {
    const item = allItems[i];
    if(inventoryAssets[item.type]) {

function downloadBossReport() {
  const wb = XLSX.utils.book_new();
  const orderData = D.orders.map(function(o) {
    const c = D.customers.find(function(x) { return x.id===o.customer_id; });
    return {'日期': new Date(o.created_at).toLocaleDateString(), '訂單編號': o.order_no, '客戶': c ? c.company_name || c.contact_person : '-', '總金額': o.total_amount || 0};
  });
  const ws1 = XLSX.utils.json_to_sheet(orderData);
  XLSX.utils.book_append_sheet(wb, ws1, '訂單出貨');
  XLSX.writeFile(wb, '老闆查閱報表_'+new Date().toISOString().split('T')[0]+'.xlsx');
  showAlert('Excel 報表已下載！');
}

function renderCustTable() {
  const kw = (document.getElementById('cust-search') ? document.getElementById('cust-search').value || '' : '').toLowerCase();
  const list = D.customers.filter(function(c) {
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().indexOf(kw) !== -1;
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; });
    let tagMatch = false;
    for(let i=0; i<custTags.length; i++) {
      const ct = custTags[i];
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      if(tag && tag.name.toLowerCase().indexOf(kw) !== -1) { tagMatch = true; break; }
    }
    return basicMatch || tagMatch;
  });
  let html = '';
  for(let i=0; i<list.length; i++) {
    const c = list[i];
    const win = D.windows.find(function(w) { return w.id===c.primary_contact_window_id; });
    const custTags = (D.customerTags || []).filter(function(ct) { return ct.customer_id === c.id; }).map(function(ct) {
      const tag = D.tags.find(function(t) { return t.id === ct.tag_id; });
      return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
    }).join('');
    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full '+(c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800')+'">'+c.type+'</span></td><td class="px-4 py-3 font-medium">'+(c.company_name||c.contact_person)+'</td><td class="px-4 py-3 text-sm">'+c.contact_person+'<br><span class="text-gray-500">'+c.phone+'</span></td><td class="px-4 py-3 text-sm">'+(c.invoice_title||'-')+'<br><span class="text-gray-500">'+(c.tax_id||'-')+'</span></td><td class="px-4 py-3 text-sm">'+(win ? win.name : '-')+'</td><td class="px-4 py-3">'+(custTags || '<span class="text-gray-400">無</span>')+'</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewCustDetail(\''+c.id+'\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button><button onclick="openCustModal(\''+c.id+'\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delCust(\''+c.id+'\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';

    await sb.from('customer_tags').delete().eq('customer_id', cid);

function addOrdItem(prod, qty, price) {
  const box = document.getElementById('o-items');

    if(p.type !== 'semi') {
      prodOptions += '<option value="' + p.id + '" data-price="' + (p.sell_price || 0) + '" data-cost="' + (p.cost_price || 0) + '" ' + (prod && prod.id === p.id ? 'selected' : '') + '>' + p.name + ' (' + (p.type === 'finished' ? '成品' : p.type === 'gift_box' ? '禮盒' : '外箱') + ')</option>';
    }
  }
  div.innerHTML = '<div class="flex-1 min-w-[150px]"><select class="o-prod w-full px-3 py-2 border rounded input-field" onchange="calcOrd()">' + prodOptions + '</select></div><div class="w-20"><input type="number" class="o-qty w-full px-3 py-2 border rounded input-field" value="' + (qty || 1) + '" min="1" oninput="calcOrd()"></div><div class="w-28"><input type="number" class="o-price w-full px-3 py-2 border rounded input-field" value="' + (price || 0) + '" step="0.01" oninput="calcOrd()"></div><button type="button" onclick="this.parentElement.remove(); calcOrd()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch">X</button>';

function calcOrd() {
  let sub = 0;
  const rows = document.querySelectorAll('#o-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const price = parseFloat(r.querySelector('.o-price').value) || 0;
    const qty = parseInt(r.querySelector('.o-qty').value) || 0;
    sub += price * qty;
  }
  document.getElementById('o-total').textContent = sub.toLocaleString();
}

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  const wid = document.getElementById('o-warehouse').value;
  if(!cid) return showAlert('請選擇客戶！');
  if(!wid) return showAlert('請選擇出貨倉庫！');
  const items = [];
  let sub = 0;
  const rows = document.querySelectorAll('#o-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value) || 0;
    const p = parseFloat(r.querySelector('.o-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      sub += p * q;
    }
  }
  if(!items.length) return showAlert('請加入產品！');
  const data = { customer_id: cid, warehouse_id: wid, total_amount: Math.round(sub), status: 'shipped', order_no: editingId ? D.orders.find(function(x) { return x.id === editingId; }).order_no : 'ORD-' + Date.now() };
  try {
    if(editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const r = await sb.from('orders').insert([data]).select().single();
      editingId = r.data.id;
    }
    await sb.from('order_items').insert(items.map(function(i) { return Object.assign({}, i, {order_id: editingId}); }));
    for(let i=0; i<items.length; i++) {
      const item = items[i];
      const product = D.products.find(function(p) { return p.id === item.product_id; });
      if(!product) continue;
      const bomItems = D.bom.filter(function(b) { return b.parent_product_id === product.id; });
      if(bomItems.length > 0) {
        for(let j=0; j<bomItems.length; j++) {
          const bom = bomItems[j];
          const requiredQty = bom.quantity * item.quantity;
          const childProduct = D.products.find(function(p) { return p.id === bom.child_product_id; });
          const invRecord = D.warehouseInv.find(function(inv) { return inv.warehouse_id === wid && inv.product_id === bom.child_product_id; });
          if(invRecord) {
            const newQty = Math.max(0, (invRecord.quantity || 0) - requiredQty);
            await sb.from('warehouse_inventory').update({quantity: newQty}).eq('id', invRecord.id);
          }
          if(childProduct) {
            const childNewStock = Math.max(0, (childProduct.current_stock || 0) - requiredQty);
            await sb.from('products').update({current_stock: childNewStock}).eq('id', bom.child_product_id);
          }
        }
      } else {
        const invRecord = D.warehouseInv.find(function(inv) { return inv.warehouse_id === wid && inv.product_id === product.id; });
        if(invRecord) {
          const newQty = Math.max(0, (invRecord.quantity || 0) - item.quantity);
          await sb.from('warehouse_inventory').update({quantity: newQty}).eq('id', invRecord.id);
        }
        const newStock = Math.max(0, (product.current_stock || 0) - item.quantity);
        await sb.from('products').update({current_stock: newStock}).eq('id', product.id);
      }
    }
    showAlert('出貨單已儲存，庫存已根據 BOM 連動扣減！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delOrd(id) {
  if(!confirm('確定刪除？')) return;
  try {
    await sb.from('order_items').delete().eq('order_id', id);
    await sb.from('orders').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function saveProd() {
  const id = document.getElementById('p-id').value;
  const d = { sku: document.getElementById('p-sku').value, name: document.getElementById('p-name').value, type: document.getElementById('p-type').value, sell_price: parseFloat(document.getElementById('p-sell').value) || 0, cost_price: parseFloat(document.getElementById('p-cost').value) || 0 };
  if(!d.sku || !d.name) return showAlert('SKU與名稱為必填！');
  try {
    if(id) await sb.from('products').update(d).eq('id', id);
    else await sb.from('products').insert([Object.assign({}, d, {current_stock: 0})]);
    showAlert('已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delProd(id) {
  if(!confirm('確定刪除?')) return;
  try {
    await sb.from('bom_list').delete().or('parent_product_id.eq.' + id + ',child_product_id.eq.' + id);
    await sb.from('warehouse_inventory').delete().eq('product_id', id);
    await sb.from('products').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('刪除失敗：' + e.message);
  }
}

function openBomModal() {
  let parentOptions = '';

  for(let i=0; i<finishedProducts.length; i++) {
    const p = finishedProducts[i];
    parentOptions += '<option value="' + p.id + '">' + p.name + '</option>';
  }
  let childOptions = '';
  const semiProducts = D.products.filter(function(p) { return p.type === 'semi'; });
  for(let i=0; i<semiProducts.length; i++) {
    const p = semiProducts[i];
    childOptions += '<option value="' + p.id + '">' + p.name + '</option>';
  }
  const html = '<div class="mb-4"><label class="block text-sm font-bold mb-1">成品</label><select id="b-p" class="w-full px-3 py-2 border rounded input-field">' + parentOptions + '</select></div><div class="mb-4"><label class="block text-sm font-bold mb-1">物料 (半成品/原料)</label><select id="b-c" class="w-full px-3 py-2 border rounded input-field">' + childOptions + '</select></div><div class="mb-4"><label class="block text-sm font-bold mb-1">用量</label><input type="number" id="b-q" class="w-full px-3 py-2 border rounded input-field" value="1"></div>';
  openModal('新增 BOM', html, async function() {
    try {
      await sb.from('bom_list').insert([{ parent_product_id: document.getElementById('b-p').value, child_product_id: document.getElementById('b-c').value, quantity: parseFloat(document.getElementById('b-q').value) }]);

      window.closeModal();
      await loadAll();
      render();
    } catch(e) {
      showAlert('失敗：' + e.message);
    }
  });
}

function renderInventory(c) {
  let tabsHtml = '<button onclick="showWhTab(\'all\')" class="wh-tab px-4 py-2 rounded-lg bg-blue-600 text-white btn-touch" data-wh="all">📦 全部庫存總覽</button>';
  const activeWh = D.warehouses.filter(function(w) { return w.is_active; });
  for(let i=0; i<activeWh.length; i++) {
    const w = activeWh[i];
    tabsHtml += '<button onclick="showWhTab(\'' + w.id + '\')" class="wh-tab px-4 py-2 rounded-lg bg-gray-200 text-gray-700 btn-touch" data-wh="' + w.id + '">' + w.name + '</button>';
  }
  c.innerHTML = '<div class="content-card"><h1 class="text-3xl font-bold mb-6">📊 庫存盤點</h1><div class="flex gap-2 mb-4 flex-wrap overflow-x-auto pb-2">' + tabsHtml + '</div><div id="inv-content"></div></div>';
  showWhTab('all');

function showWhTab(whId) {
  const tabs = document.querySelectorAll('.wh-tab');
  for(let i=0; i<tabs.length; i++) {
    const t = tabs[i];
    t.className = t.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-700');
    if(t.dataset.wh === whId) t.className = t.className.replace('bg-gray-200 text-gray-700', 'bg-blue-600 text-white');
  }
  const container = document.getElementById('inv-content');
  let rows = '';
  if(whId === 'all') {
    for(let i=0; i<D.products.length; i++) {
      const p = D.products[i];
      let totalQty = 0;
      const invs = D.warehouseInv.filter(function(inv) { return inv.product_id === p.id; });
      for(let j=0; j<invs.length; j++) { totalQty += invs[j].quantity || 0; }
      rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + p.name + '</td><td class="px-4 py-3">' + (p.sku || '-') + '</td><td class="px-4 py-3 font-bold text-lg">' + totalQty + '</td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">SKU</th><th class="px-4 py-3 text-left text-xs">總庫存</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  } else {
    const wh = D.warehouses.find(function(w) { return w.id === whId; });
    const inv = D.warehouseInv.filter(function(i) { return i.warehouse_id === whId; });
    for(let i=0; i<D.products.length; i++) {
      const p = D.products[i];
      const wInv = inv.find(function(x) { return x.product_id === p.id; });
      const qty = wInv ? wInv.quantity : 0;
      rows += '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 font-medium">' + p.name + '</td><td class="px-4 py-3 font-bold">' + qty + '</td><td class="px-4 py-3"><input type="number" class="inv-qty w-20 px-2 py-1 border rounded" value="' + qty + '"><button onclick="saveInvItem(this, \'' + p.id + '\', \'' + whId + '\')" class="ml-2 bg-yellow-500 text-white px-2 py-1 rounded text-xs btn-touch">儲存</button></td></tr>';
    }
    container.innerHTML = '<div class="bg-white rounded-lg shadow overflow-x-auto"><div class="p-4 bg-gray-50 border-b"><h3 class="font-bold">' + (wh ? wh.name : '') + ' - 庫存明細</h3></div><table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs">產品</th><th class="px-4 py-3 text-left text-xs">目前庫存</th><th class="px-4 py-3 text-left text-xs">盤點調整</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
}

function saveInvItem(btn, pid, wid) {
  const tr = btn.closest('tr');
  const qty = parseInt(tr.querySelector('.inv-qty').value) || 0;
  const existing = D.warehouseInv.find(function(i) { return i.warehouse_id === wid && i.product_id === pid; });
  const data = {quantity: qty};
  const promise = existing ? sb.from('warehouse_inventory').update(data).eq('id', existing.id) : sb.from('warehouse_inventory').insert([{warehouse_id: wid, product_id: pid, quantity: qty, safety_stock: 0}]);
  promise.then(function() {
    loadAll().then(function() { showWhTab(wid); showAlert('庫存已更新！'); });
  }).catch(function(e) { showAlert('失敗：' + e.message); });
}

async function openPurModal(isInvoicePurchase, editId) {
  editingId = editId || null;
  const existingData = editId ? D.purchases.find(function(x) { return x.id === editId; }) : null;
  let vendorOptions = '';
  for(let i=0; i<D.vendors.length; i++) {
    const v = D.vendors[i];
    vendorOptions += '<option value="' + v.id + '" ' + (existingData && existingData.vendor_id === v.id ? 'selected' : '') + '>' + v.name + '</option>';
  }
  let whOptions = '';
  const activeWh = D.warehouses.filter(function(w) { return w.is_active; });
  for(let i=0; i<activeWh.length; i++) {
    const w = activeWh[i];
    whOptions += '<option value="' + w.id + '" ' + (existingData && existingData.warehouse_id === w.id ? 'selected' : '') + '>' + w.name + '</option>';
  }
  const html = '<input type="hidden" id="pu-invoice-mode" value="' + (isInvoicePurchase ? 'true' : 'false') + '"><input type="hidden" id="pu-edit-id" value="' + (editId || '') + '"><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-bold mb-1">廠商 *</label><select id="pu-v" class="w-full px-3 py-2 border rounded input-field">' + vendorOptions + '</select></div>' + (!isInvoicePurchase ? '<div><label class="block text-sm font-bold mb-1">入庫倉庫</label><select id="pu-wh" class="w-full px-3 py-2 border rounded input-field">' + whOptions + '</select></div>' : '') + '</div><div class="mb-4"><label class="block text-sm font-bold mb-1">採購商品明細</label><div id="pu-items" class="space-y-3"></div><button type="button" onclick="addPurItem()" class="mt-2 px-4 py-2 bg-gray-200 rounded text-sm btn-touch">+ 新增商品</button></div><div class="bg-gray-50 p-4 rounded mb-4"><div class="text-xl font-bold">採購總金額：<span id="pu-total">0</span></div></div>';
  openModal(isInvoicePurchase ? '購買發票' : '一般採購入庫', html, savePur);
  if(editId && existingData) {
    const itemsResp = await sb.from('purchase_items').select('*').eq('purchase_id', editId);
    const items = itemsResp.data || [];
    if(items.length > 0) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const p = D.products.find(function(x) { return x.id === item.product_id; });
        addPurItem(p, item.quantity, item.unit_price);
      }
    }
  } else {
    addPurItem();
  }
  calcPur();
}

function addPurItem(prod, qty, price) {
  const box = document.getElementById('pu-items');
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-end bg-gray-50 p-3 rounded flex-wrap';
  let prodOptions = '<option value="">選擇商品</option>';
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    prodOptions += '<option value="' + p.id + '" data-cost="' + (p.cost_price || 0) + '" ' + (prod && prod.id === p.id ? 'selected' : '') + '>' + p.name + '</option>';
  }
  div.innerHTML = '<div class="flex-1 min-w-[150px]"><select class="pu-prod w-full px-3 py-2 border rounded input-field" onchange="if(this.value){this.parentElement.parentElement.querySelector(\'.pu-price\').value=this.options[this.selectedIndex].dataset.cost;}calcPur()">' + prodOptions + '</select></div><div class="w-20"><input type="number" class="pu-qty w-full px-3 py-2 border rounded input-field" value="' + (qty || 1) + '" min="1" oninput="calcPur()"></div><div class="w-28"><input type="number" class="pu-price w-full px-3 py-2 border rounded input-field" value="' + (price || 0) + '" step="0.01" oninput="calcPur()"></div><button type="button" onclick="this.parentElement.remove();calcPur()" class="px-3 py-2 bg-red-100 text-red-600 rounded btn-touch">X</button>';
  box.appendChild(div);
}

function calcPur() {
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const price = parseFloat(r.querySelector('.pu-price').value) || 0;
    const qty = parseInt(r.querySelector('.pu-qty').value) || 0;
    subtotal += price * qty;
  }
  document.getElementById('pu-total').textContent = subtotal.toLocaleString();
}

async function savePur() {
  const editId = document.getElementById('pu-edit-id').value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const items = [];
  let subtotal = 0;
  const rows = document.querySelectorAll('#pu-items > div');
  for(let i=0; i<rows.length; i++) {
    const r = rows[i];
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value) || 0;
    const p = parseFloat(r.querySelector('.pu-price').value) || 0;
    if(pid && q > 0) {
      items.push({product_id: pid, quantity: q, unit_price: p});
      subtotal += p * q;
    }
  }
  if(!items.length) return showAlert('請加入採購商品！');
  const d = { vendor_id: vendorId, is_invoice_purchase: isInvoiceMode, total_amount: subtotal, warehouse_id: document.getElementById('pu-wh') ? document.getElementById('pu-wh').value : null };
  try {
    if(editId) {
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      await sb.from('purchases').update(d).eq('id', editId);
    } else {
      d.purchase_no = 'PUR-' + Date.now();
      d.status = 'completed';
      const r = await sb.from('purchases').insert([d]).select().single();
      editId = r.data.id;
    }
    await sb.from('purchase_items').insert(items.map(function(i) { return Object.assign({}, i, {purchase_id: editId}); }));
    if(!isInvoiceMode && d.warehouse_id) {
      for(let i=0; i<items.length; i++) {
        const item = items[i];
        const existing = D.warehouseInv.find(function(w) { return w.warehouse_id === d.warehouse_id && w.product_id === item.product_id; });
        if(existing) await sb.from('warehouse_inventory').update({quantity: (existing.quantity || 0) + item.quantity}).eq('id', existing.id);
        else await sb.from('warehouse_inventory').insert([{warehouse_id: d.warehouse_id, product_id: item.product_id, quantity: item.quantity, safety_stock: 0}]);
        const prod = D.products.find(function(x) { return x.id === item.product_id; });
        if(prod) await sb.from('products').update({current_stock: (prod.current_stock || 0) + item.quantity}).eq('id', item.product_id);
      }
    }
    showAlert('採購已儲存！');
    window.closeModal();
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

async function delPur(id) {
  if(!confirm('確定刪除?')) return;
  try {
    await sb.from('purchase_items').delete().eq('purchase_id', id);
    await sb.from('purchases').delete().eq('id', id);
    await loadAll();
    render();
  } catch(e) {
    showAlert('失敗：' + e.message);
  }
}

function renderFinance(c) { c.innerHTML = '<div class="content-card"><h1 class="text-3xl font-bold">💰 收支與訂閱</h1><p class="mt-4 text-gray-500">第三段提供</p></div>'; }
function renderBanks(c) { c.innerHTML = '<div class="content-card"><h1 class="text-3xl font-bold">🏦 銀行帳戶</h1><p class="mt-4 text-gray-500">第三段提供</p></div>'; }
function renderSettings(c) { c.innerHTML = '<div class="content-card"><h1 class="text-3xl font-bold">⚙️ 通路與員工</h1><p class="mt-4 text-gray-500">第三段提供</p></div>'; }
