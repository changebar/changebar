<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>養芯健康 ERP</title>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body { font-family: 'Microsoft JhengHei', sans-serif; }
.hidden { display: none !important; }
.nav-active { background-color: #374151; font-weight: bold; border-left: 4px solid #3b82f6; }
.btn-touch { padding: 0.75rem 1rem; min-height: 44px; }
.input-field { padding: 0.75rem; font-size: 1rem; min-height: 44px; width: 100%; }
@media (max-width: 1024px) {
  .sidebar { position: fixed; top: 0; left: 0; z-index: 50; height: 100vh; transform: translateX(-100%); transition: transform 0.3s; width: 280px; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
  .main-content { padding: 0.75rem; padding-top: 4rem; width: 100%; }
  .mobile-menu-btn { display: flex !important; position: fixed; top: 0.75rem; left: 0.75rem; z-index: 60; background: rgba(59, 130, 246, 0.7); padding: 0.5rem; width: 36px; height: 36px; border-radius: 0.5rem; cursor: pointer; }
}
@media (min-width: 1025px) {
  .mobile-menu-btn { display: none !important; }
  .sidebar-overlay { display: none !important; }
  .sidebar { position: static; transform: none !important; width: 16rem; }
  .main-content { width: calc(100% - 16rem); padding: 2rem; }
}
</style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="login-view" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🏥 養芯健康</h1>
    <form class="space-y-4" onsubmit="return false;">
      <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="email" class="w-full px-4 py-3 border rounded-lg input-field"></div>
      <div><label class="block text-sm font-medium mb-1">密碼</label><input type="password" id="password" class="w-full px-4 py-3 border rounded-lg input-field"></div>
      <div class="flex items-center"><input type="checkbox" id="remember" class="w-4 h-4"><label for="remember" class="ml-2 text-sm">記住帳號</label></div>
      <button type="button" id="login-btn" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold btn-touch">登入系統</button>
    </form>
  </div>
</div>

<div id="main-system" class="hidden min-h-screen flex">
  <button id="menu-toggle-btn" class="mobile-menu-btn items-center justify-center hidden">
    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>
  <aside id="sidebar" class="sidebar w-64 bg-gray-800 text-white flex flex-col flex-shrink-0 transition-transform">
    <div class="p-4 text-xl font-bold border-b border-gray-700 text-center bg-gradient-to-r from-blue-600 to-purple-600 flex justify-between items-center">
      <span class="flex-1">養芯健康</span>
      <button id="sidebar-close-btn" class="md:hidden text-white p-2">✕</button>
    </div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm">
      <a href="#" data-view="boss" class="block py-3 px-4 rounded-lg hover:bg-gray-700 nav-active btn-touch">👑 老闆查閱</a>
      <div class="text-gray-400 text-xs mt-4 mb-2 px-4">業務前端</div>
      <a href="#" data-view="crm" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">👥 客戶管理</a>
      <a href="#" data-view="orders" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">📦 訂單出貨</a>
      <div class="text-gray-400 text-xs mt-4 mb-2 px-4">商品後勤</div>
      <a href="#" data-view="products" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">🏭 商品與BOM</a>
      <a href="#" data-view="warehouses" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">🏢 倉庫管理</a>
      <a href="#" data-view="inventory" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">📊 庫存盤點</a>
      <a href="#" data-view="purchases" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">🛒 採購入庫</a>
      <a href="#" data-view="vendors" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">🏢 廠商管理</a>
      <div class="text-gray-400 text-xs mt-4 mb-2 px-4">財務金流</div>
      <a href="#" data-view="finance" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">💰 收支與訂閱</a>
      <a href="#" data-view="banks" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">🏦 銀行帳戶</a>
      <a href="#" data-view="settings" class="block py-3 px-4 rounded-lg hover:bg-gray-700 btn-touch">⚙️ 通路與員工</a>
    </nav>
    <div class="p-3 border-t border-gray-700"><button id="logout-btn" class="w-full py-2 bg-red-600 rounded-lg text-sm btn-touch">登出</button></div>
  </aside>
  <main class="main-content flex-1 overflow-y-auto" id="main-content"></main>
</div>

<div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
    <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl"><h2 id="modal-title" class="text-xl font-bold">標題</h2><button id="modal-close-btn" class="text-2xl text-gray-500">&times;</button></div>
    <div class="p-4 overflow-y-auto flex-1" id="modal-content"></div>
    <div class="p-4 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-xl">
      <button id="modal-cancel-btn" class="px-4 py-2 bg-gray-300 rounded-lg btn-touch">取消</button>
      <button id="modal-save-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold btn-touch">儲存</button>
    </div>
  </div>
</div>
<div id="alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-xl p-6 text-center"><p id="alert-message" class="text-lg mb-4">訊息</p><button id="alert-ok-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg btn-touch">確定</button></div>
</div>

<script>
const SUPABASE_URL = 'https://flqdyljoxadhqsnbasax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscWR5bGpveGFkaHFzbmJhc2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzk1MTMsImV4cCI6MjA5NDYxNTUxM30.eSm6D0-T_qpdTY3JfLo9eLSjYgBa6w5Asv4DA5c_6Qk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let D = { products:[], windows:[], customers:[], tags:[], warehouses:[], bom:[], vendors:[], channels:[], payments:[], expenses:[], subs:[], banks:[], emps:[], expCats:[], orders:[], purchases:[], warehouseInv:[], customerTags:[] };
let editingId = null, currentView = 'boss', bossDateRange = { start: new Date().toISOString().slice(0,7), end: new Date().toISOString().slice(0,7) };

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if(sidebar.classList.contains('open')) {
    sidebar.classList.remove('open'); overlay.classList.remove('show'); setTimeout(()=>overlay.classList.add('hidden'), 300);
  } else {
    overlay.classList.remove('hidden'); void overlay.offsetWidth; sidebar.classList.add('open'); overlay.classList.add('show');
  }
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('menu-toggle-btn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-close-btn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-overlay').addEventListener('click', toggleSidebar);
  document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); switchView(a.dataset.view); if(window.innerWidth<=1024) toggleSidebar(); }));
});

function showAlert(msg) { document.getElementById('alert-message').textContent = msg; document.getElementById('alert-modal').classList.remove('hidden'); }
document.getElementById('alert-ok-btn').addEventListener('click', () => document.getElementById('alert-modal').classList.add('hidden'));
window.closeModal = function() { document.getElementById('modal-overlay').classList.add('hidden'); editingId = null; };
function openModal(title, html, onSave) {
  document.getElementById('modal-title').textContent = title; document.getElementById('modal-content').innerHTML = html; document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-save-btn').onclick = () => { onSave().then(()=>{window.closeModal(); loadAll(); render();}).catch(e=>showAlert('失敗：'+e.message)); };
  document.getElementById('modal-cancel-btn').onclick = window.closeModal;
  document.getElementById('modal-close-btn').onclick = window.closeModal;
}

document.getElementById('login-btn').addEventListener('click', () => {
  sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }).then(res => {
    if(res.error) showAlert(res.error.message);
    else { document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-system').classList.remove('hidden'); loadAll().then(()=>switchView('boss')); }
  });
});
document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(()=>location.reload()));

async function loadAll() {
  const map = { products:'products', windows:'contact_windows', customers:'customers', tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', channels:'sales_channels', payments:'payment_methods', expenses:'expenses', subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', expCats:'expense_categories', orders:'orders', purchases:'purchases', warehouseInv:'warehouse_inventory', customerTags:'customer_tags' };
  for(let k in map) { const r = await sb.from(map[k]).select('*'); D[k] = r.data || []; }
}
function switchView(v) { currentView = v; document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view===v)); render(); }
function render() {
  const m = document.getElementById('main-content'); m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else m.innerHTML = '<div class="content-card"><h1 class="text-3xl font-bold">開發中...</h1></div>';
}
function sortTable(id, idx) {
  const tbody = document.getElementById(id); const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b) => (a.cells[idx]?.textContent||'').localeCompare(b.cells[idx]?.textContent||'', 'zh-TW'));
  rows.forEach(r => tbody.appendChild(r));
}

function renderBoss(c) {
  const startY = parseInt(bossDateRange.start.split('-')[0]);
  const startM = parseInt(bossDateRange.start.split('-')[1]);
  const endY = parseInt(bossDateRange.end.split('-')[0]);
  const endM = parseInt(bossDateRange.end.split('-')[1]);
  
  const monthOrders = D.orders.filter(o => {
    const d = new Date(o.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  
  let rev = 0;
  for(let i=0; i<monthOrders.length; i++) rev += monthOrders[i].total_amount||0;
  
  const monthPurchases = D.purchases.filter(p => {
    const d = new Date(p.created_at);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let pur = 0;
  for(let i=0; i<monthPurchases.length; i++) pur += monthPurchases[i].total_amount||0;
  
  const monthExpenses = D.expenses.filter(e => {
    if(!e.payment_date) return false;
    const d = new Date(e.payment_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let exp = 0;
  for(let i=0; i<monthExpenses.length; i++) exp += monthExpenses[i].amount||0;
  
  const monthSubs = D.subs.filter(s => {
    if(!s.start_date) return false;
    const d = new Date(s.start_date);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (y > startY || (y === startY && m >= startM)) && (y < endY || (y === endY && m <= endM));
  });
  let sub = 0;
  for(let i=0; i<monthSubs.length; i++) sub += monthSubs[i].amount||0;
  
  let totalCash = 0;
  for(let i=0; i<D.banks.length; i++) totalCash += D.banks[i].balance||0;
  
  const monthlyProfit = rev - pur - exp - sub;
  
  const unreimbursedExpenses = D.expenses.filter(e => e.employee_id && !e.is_reimbursed);
  const unreimbursedByEmp = {};
  for(let i=0; i<unreimbursedExpenses.length; i++) {
    const e = unreimbursedExpenses[i];
    const emp = D.emps.find(x => x.id === e.employee_id);
    if(emp) {
      if(!unreimbursedByEmp[emp.name]) unreimbursedByEmp[emp.name] = { total: 0, items: [] };
      unreimbursedByEmp[emp.name].total += e.amount || 0;
      unreimbursedByEmp[emp.name].items.push(e);
    }
  }
  
  const inventoryByType = {};
  for(let i=0; i<D.products.length; i++) {
    const p = D.products[i];
    let totalQty = 0;
    const invs = D.warehouseInv.filter(inv => inv.product_id === p.id);
    for(let j=0; j<invs.length; j++) totalQty += invs[j].quantity||0;
    
    if(totalQty > 0) {
      if(!inventoryByType[p.type]) inventoryByType[p.type] = [];
      inventoryByType[p.type].push({
        type: p.type,
        name: p.name,
        sku: p.sku,
        quantity: totalQty,
        cost: p.cost_price || 0,
        value: totalQty * (p.cost_price || 0)
      });
    }
  }
  
  const inventoryAssets = {
    finished: { count: 0, value: 0 },
    semi: { count: 0, value: 0 },
    gift_box: { count: 0, value: 0 },
    outer_box: { count: 0, value: 0 }
  };
  
  let allItems = [];
  for(const type in inventoryByType) {
    allItems = allItems.concat(inventoryByType[type]);
  }
  
  for(let i=0; i<allItems.length; i++) {
    const item = allItems[i];
    if(inventoryAssets[item.type]) {
      inventoryAssets[item.type].count += item.quantity;
      inventoryAssets[item.type].value += item.value;
    }
  }
  
  let totalInventoryValue = 0;
  for(const type in inventoryAssets) {
    totalInventoryValue += inventoryAssets[type].value;
  }
  
  const channelStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const ch = D.channels.find(x => x.id===o.sales_channel_id);
    if(ch) {
      if(!channelStats[ch.name]) channelStats[ch.name] = {count:0, amount:0, commission:0};
      channelStats[ch.name].count++;
      channelStats[ch.name].amount += o.total_amount||0;
      channelStats[ch.name].commission += o.channel_commission||0;
    }
  }
  
  const paymentStats = {};
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    const pm = D.payments.find(x => x.id===o.payment_method_id);
    if(pm) {
      if(!paymentStats[pm.name]) paymentStats[pm.name] = {count:0, amount:0, commission:0};
      paymentStats[pm.name].count++;
      paymentStats[pm.name].amount += o.total_amount||0;
      paymentStats[pm.name].commission += o.payment_commission||0;
    }
  }
  
  let companyShipping = 0;
  let customerShipping = 0;
  for(let i=0; i<monthOrders.length; i++) {
    companyShipping += monthOrders[i].absorbed_shipping_fee || 0;
    customerShipping += monthOrders[i].customer_paid_shipping || 0;
  }
  
  let totalChannelCommission = 0;
  for(const ch in channelStats) totalChannelCommission += channelStats[ch].commission;
  
  let totalPaymentCommission = 0;
  for(const pm in paymentStats) totalPaymentCommission += paymentStats[pm].commission;
  
  const totalShippingCost = companyShipping;
  const totalOrderExpenses = totalChannelCommission + totalPaymentCommission + totalShippingCost;
  
  const subTag = D.tags.find(t => t.name.includes('訂閱'));
  let subCustomerCount = 0;
  if(subTag && D.customerTags) {
    const subTagIds = D.customerTags.filter(ct => ct.tag_id === subTag.id).map(ct => ct.customer_id);
    const uniqueIds = [...new Set(subTagIds)];
    subCustomerCount = uniqueIds.length;
  }

  let subMonthlyRevenue = 0;
  for(let i=0; i<monthOrders.length; i++) {
    const o = monthOrders[i];
    if(o.is_subscription && o.subscription_days > 0) {
      const dailyRevenue = (o.total_amount || 0) / o.subscription_days;
      subMonthlyRevenue += dailyRevenue * 30;
    }
  }

  const totalCustomers = D.customers.length;
  const monthOrderCount = monthOrders.length;

  let channelStatsHtml = '';
  for(const name in channelStats) {
    const stat = channelStats[name];
    channelStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!channelStatsHtml) channelStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let paymentStatsHtml = '';
  for(const name in paymentStats) {
    const stat = paymentStats[name];
    paymentStatsHtml += '<div class="flex justify-between"><span>'+name+'</span><span class="font-bold text-red-600">'+stat.commission.toLocaleString()+'</span></div>';
  }
  if(!paymentStatsHtml) paymentStatsHtml = '<div class="text-gray-400">無數據</div>';
  
  let unreimbursedHtml = '';
  for(const name in unreimbursedByEmp) {
    const data = unreimbursedByEmp[name];
    let itemsHtml = '';
    for(let i=0; i<data.items.length; i++) {
      const e = data.items[i];
      itemsHtml += '<div class="flex justify-between"><span>'+(e.description || '無描述')+' ('+e.payment_date+')</span><span>'+(e.amount||0).toLocaleString()+'</span></div>';
    }
    unreimbursedHtml += '<div class="border rounded-lg p-4"><div class="flex justify-between items-center mb-2"><span class="font-bold text-lg">'+name+'</span><span class="text-2xl font-bold text-orange-600">'+data.total.toLocaleString()+'</span></div><div class="text-sm text-gray-600 space-y-1">'+itemsHtml+'</div></div>';
  }
  if(!unreimbursedHtml) unreimbursedHtml = '<p class="text-gray-500">目前無待結帳代墊款項</p>';
  
  let inventoryDetailHtml = '';
  for(const type in inventoryByType) {
    const items = inventoryByType[type];
    let rowsHtml = '';
    for(let i=0; i<items.length; i++) {
      const item = items[i];
      rowsHtml += '<tr class="border-t"><td class="px-3 py-2">'+item.name+'</td><td class="px-3 py-2">'+(item.sku || '-')+'</td><td class="px-3 py-2 font-bold">'+item.quantity+'</td><td class="px-3 py-2">'+item.cost.toLocaleString()+'</td><td class="px-3 py-2 text-green-600 font-bold">'+item.value.toLocaleString()+'</td></tr>';
    }
    const typeName = {finished:'成品',semi:'半成品',gift_box:'禮盒',outer_box:'外箱子'}[type] || type;
    inventoryDetailHtml += '<div class="border rounded-lg p-3"><h5 class="font-bold text-sm mb-2">'+typeName+'</h5><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left text-xs">產品名稱</th><th class="px-3 py-2 text-left text-xs">SKU</th><th class="px-3 py-2 text-left text-xs">數量</th><th class="px-3 py-2 text-left text-xs">成本</th><th class="px-3 py-2 text-left text-xs">總價值</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
  }
  
  let banksHtml = '';
  for(let i=0; i<D.banks.length; i++) {
    const b = D.banks[i];
    banksHtml += '<div class="flex justify-between items-center p-3 bg-gray-50 rounded"><span class="font-medium">'+b.account_name+'</span><span class="font-bold text-green-600">'+(b.balance||0).toLocaleString()+'</span></div>';
  }

  c.innerHTML = '<div class="content-card">' +
    '<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">' +
    '<div><h1 class="text-3xl font-bold">👑 老闆查閱</h1><p class="text-sm text-gray-600 mt-1">查看期間：'+bossDateRange.start+' ~ '+bossDateRange.end+'</p></div>' +
    '<div class="flex flex-wrap gap-2 w-full md:w-auto">' +
    '<input type="month" value="'+bossDateRange.start+'" onchange="bossDateRange.start=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<span class="flex items-center text-gray-500">至</span>' +
    '<input type="month" value="'+bossDateRange.end+'" onchange="bossDateRange.end=this.value;render()" class="px-4 py-2 border rounded-lg shadow input-field md:w-auto">' +
    '<button onclick="downloadBossReport()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold btn-touch">📥 下載 Excel</button>' +
    '</div></div>' +
    
    '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">' +
    '<div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white"><p class="text-sm opacity-90">期間業績</p><p class="text-3xl font-bold mt-2">'+rev.toLocaleString()+'</p><p class="text-xs mt-2 opacity-75">訂單數：'+monthOrderCount+' 單</p></div>' +

function renderCustTable() {
  const kw = (document.getElementById('cust-search') ? document.getElementById('cust-search').value || '' : '').toLowerCase();
  const list = D.customers.filter(c => {
    const basicMatch = ((c.company_name||'')+(c.contact_person||'')+(c.phone||'')).toLowerCase().includes(kw);
    const custTags = (D.customerTags || []).filter(ct => ct.customer_id === c.id);
    let tagMatch = false;
    for(let i=0; i<custTags.length; i++) {
      const ct = custTags[i];
      const tag = D.tags.find(t => t.id === ct.tag_id);
      if(tag && tag.name.toLowerCase().includes(kw)) { tagMatch = true; break; }
    }
    return basicMatch || tagMatch;
  });
  
  let html = '';
  for(let i=0; i<list.length; i++) {
    const c = list[i];
    const win = D.windows.find(w => w.id===c.primary_contact_window_id);
    const custTags = (D.customerTags || []).filter(ct => ct.customer_id === c.id).map(ct => {
      const tag = D.tags.find(t => t.id === ct.tag_id);
      return tag ? '<span class="tag-'+tag.color+' px-2 py-1 rounded text-xs mr-1">'+tag.name+'</span>' : '';
    }).join('');

    html += '<tr class="hover:bg-gray-50"><td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full '+(c.type==='B2B'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800')+'">'+c.type+'</span></td><td class="px-4 py-3 font-medium">'+(c.company_name||c.contact_person)+'</td><td class="px-4 py-3 text-sm">'+c.contact_person+'<br><span class="text-gray-500">'+c.phone+'</span></td><td class="px-4 py-3 text-sm">'+(c.invoice_title||'-')+'<br><span class="text-gray-500">'+(c.tax_id||'-')+'</span></td><td class="px-4 py-3 text-sm">'+(win ? win.name : '-')+'</td><td class="px-4 py-3">'+(custTags || '<span class="text-gray-400">無</span>')+'</td><td class="px-4 py-3 whitespace-nowrap space-x-2"><button onclick="viewCustDetail(\''+c.id+'\')" class="text-blue-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">詳情</button><button onclick="openCustModal(\''+c.id+'\')" class="text-green-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">編輯</button><button onclick="delCust(\''+c.id+'\')" class="text-red-600 text-sm hover:underline btn-touch" style="min-height:auto; padding:0.25rem 0.5rem;">刪除</button></td></tr>';

function syncAddrContact() {
  const contact = document.getElementById('c-contact') ? document.getElementById('c-contact').value || '' : '';
  const phone = document.getElementById('c-phone') ? document.getElementById('c-phone').value || '' : '';
  const recvInputs = document.querySelectorAll('#addr-box .a-recv');
  const phoneInputs = document.querySelectorAll('#addr-box .a-phone');
  for(let i=0; i<recvInputs.length; i++) { if(!recvInputs[i].dataset.userEdited) recvInputs[i].value = contact; }
  for(let i=0; i<phoneInputs.length; i++) { if(!phoneInputs[i].dataset.userEdited) phoneInputs[i].value = phone; }
}

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value,
    company_name: document.getElementById('c-comp').value||null,
    contact_person: document.getElementById('c-contact').value,
    phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null,
    invoice_title: document.getElementById('c-title').value||null,
    tax_id: document.getElementById('c-tax').value||null,
    email: document.getElementById('c-email').value||null
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  try {
    let cid = id;
    if(id) await sb.from('customers').update(data).eq('id',id);
    else { const inserted = await sb.from('customers').insert([data]).select().single(); cid = inserted.data.id; }
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = [];
    const checkboxes = document.querySelectorAll('.c-tag-cb:checked');
    for(let i=0; i<checkboxes.length; i++) tagIds.push(checkboxes[i].value);
    if(tagIds.length) {
      const tagInserts = [];
      for(let i=0; i<tagIds.length; i++) tagInserts.push({customer_id:cid, tag_id:tagIds[i]});
      await sb.from('customer_tags').insert(tagInserts);
    }
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    const addrDivs = document.querySelectorAll('#addr-box > div');
    for(let i=0; i<addrDivs.length; i++) {
      const d = addrDivs[i];
      addrs.push({ customer_id:cid, address_type:d.querySelector('.a-type').value, recipient_name:d.querySelector('.a-recv').value, recipient_phone:d.querySelector('.a-phone').value, street:d.querySelector('.a-addr').value, is_default:d.querySelector('.a-def').checked });
    }
    if(addrs.length) await sb.from('customer_addresses').insert(addrs);
    showAlert('客戶已儲存！'); window.closeModal(); await loadAll(); render();

async function saveOrd() {
  const cid = document.getElementById('o-cust').value; const wid = document.getElementById('o-wh').value;
  if(!cid || !wid) return showAlert('請選擇客戶和倉庫');
  const items = []; let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => { const pid = r.querySelector('.o-prod').value; const q = parseInt(r.querySelector('.o-qty').value)||0; const p = parseFloat(r.querySelector('.o-price').value)||0; if(pid && q>0) { items.push({product_id:pid, quantity:q, unit_price:p}); sub += p*q; } });
  if(!items.length) return showAlert('請加入產品');
  const data = { customer_id:cid, warehouse_id:wid, total_amount:Math.round(sub), status:'shipped', order_no: editingId?D.orders.find(x=>x.id===editingId).order_no:'ORD-'+Date.now() };
  try {
    if(editingId) { await sb.from('orders').update(data).eq('id', editingId); await sb.from('order_items').delete().eq('order_id', editingId); }
    else { const r = await sb.from('orders').insert([data]).select().single(); editingId = r.data.id; }
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:editingId})));
    showAlert('儲存成功'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}

}
function addPurItem(prod, qty, price) {
  const box = document.getElementById('pu-items'); const div = document.createElement('div'); div.className = 'flex gap-2 items-end bg-gray-50 p-2 rounded';
  let opts = '<option value="">選擇</option>'; D.products.forEach(p => opts += '<option value="'+p.id+'" data-cost="'+p.cost_price+'" '+(prod&&prod.id===p.id?'selected':'')+'>'+p.name+'</option>');
  div.innerHTML = '<select class="pu-prod border rounded p-2 flex-1" onchange="if(this.value)this.parentElement.querySelector(\'.pu-price\').value=this.options[this.selectedIndex].dataset.cost;calcPur()">'+opts+'</select><input type="number" class="pu-qty border rounded p-2 w-20" value="'+(qty||1)+'" oninput="calcPur()"><input type="number" class="pu-price border rounded p-2 w-24" value="'+(price||0)+'" oninput="calcPur()"><button onclick="this.parentElement.remove();calcPur()" class="text-red-500">X</button>';
  box.appendChild(div);
}
function calcPur() { let sub=0; document.querySelectorAll('#pu-items > div').forEach(r => sub += (parseFloat(r.querySelector('.pu-price').value)||0)*(parseInt(r.querySelector('.pu-qty').value)||0)); document.getElementById('pu-total').textContent = sub.toLocaleString(); }
async function savePur() {
  const isInv = document.getElementById('pu-inv').value === 'true'; const vid = document.getElementById('pu-v').value; const wid = document.getElementById('pu-w')?document.getElementById('pu-w').value:null;
  const items = []; let sub = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => { const pid=r.querySelector('.pu-prod').value; const q=parseInt(r.querySelector('.pu-qty').value)||0; const p=parseFloat(r.querySelector('.pu-price').value)||0; if(pid&&q>0){items.push({product_id:pid,quantity:q,unit_price:p}); sub+=p*q;} });
  if(!items.length) return showAlert('請加入商品');
  const d = { vendor_id:vid, is_invoice_purchase:isInv, total_amount:sub, warehouse_id:wid };
  try {
    if(editingId) { await sb.from('purchases').update(d).eq('id', editingId); await sb.from('purchase_items').delete().eq('purchase_id', editingId); }
    else { d.purchase_no='PUR-'+Date.now(); d.status='completed'; const r=await sb.from('purchases').insert([d]).select().single(); editingId=r.data.id; }
    await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:editingId})));
    if(!isInv && wid) { for(let i of items) { const ex=D.warehouseInv.find(w=>w.warehouse_id===wid&&w.product_id===i.product_id); if(ex) await sb.from('warehouse_inventory').update({quantity:(ex.quantity||0)+i.quantity}).eq('id', ex.id); else await sb.from('warehouse_inventory').insert([{warehouse_id:wid, product_id:i.product_id, quantity:i.quantity}]); const pr=D.products.find(x=>x.id===i.product_id); if(pr) await sb.from('products').update({current_stock:(pr.current_stock||0)+i.quantity}).eq('id', i.product_id); } }
    showAlert('已儲存'); window.closeModal(); await loadAll(); render();
  } catch(e) { showAlert('失敗：'+e.message); }
}
async function delPur(id) { if(confirm('確定？')) { await sb.from('purchase_items').delete().eq('purchase_id', id); await sb.from('purchases').delete().eq('id', id); await loadAll(); render(); } }
