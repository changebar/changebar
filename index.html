let D = {

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('hidden');
}

function downloadExcel(filename, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(sheet => {
    const ws = XLSX.utils.json_to_sheet(sheet.data);
    XLSX.utils.book_append_sheet(wb, ws, sheet.name);
  });
  XLSX.writeFile(wb, filename);
}

function showAlert(msg) {
  document.getElementById('alert-message').textContent = msg;
  document.getElementById('alert-modal').classList.remove('hidden');
  return new Promise(r => { 
    const handler = () => { 
      document.getElementById('alert-modal').classList.add('hidden'); 
      document.getElementById('alert-ok-btn').removeEventListener('click', handler);
      r(); 
    };
    document.getElementById('alert-ok-btn').addEventListener('click', handler);
    const keyHandler = (e) => {
      if (e.key === 'Enter') { handler(); document.removeEventListener('keydown', keyHandler); }
    };
    document.addEventListener('keydown', keyHandler);
  });
}

function openModal(title, html, onSave, hideSave=false) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  const saveBtn = document.getElementById('modal-save-btn');
  const cancelBtn = document.getElementById('modal-cancel-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  
  if(hideSave) {
    saveBtn.classList.add('hidden');
  } else { 
    saveBtn.classList.remove('hidden'); 
    saveBtn.onclick = async () => {
      if(isSaving) return;
      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中...';
      try { await onSave(); } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存 (Enter)';
      }
    };
  }
  
  const closeModal = () => {
    document.getElementById('modal-overlay').classList.add('hidden');
    editingId = null;
    isSaving = false;
    if(saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '儲存 (Enter)'; }
  };
  
  cancelBtn.onclick = closeModal;
  closeBtn.onclick = closeModal;
  
  const escHandler = (e) => {
    if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escHandler); }
  };
  document.addEventListener('keydown', escHandler);
  
  if(!hideSave) {
    const enterHandler = (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('input')) {
        e.preventDefault();
        saveBtn.click();
        document.removeEventListener('keydown', enterHandler);
      }
    };
    document.addEventListener('keydown', enterHandler);
  }
}

function closeModal() { 
  document.getElementById('modal-overlay').classList.add('hidden'); 
  editingId = null; 
  isSaving = false;
}

document.getElementById('login-btn').addEventListener('click', () => {
  sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value }).then(res => {
    if (res.error) showAlert('登入失敗：' + res.error.message);
    else { 
      document.getElementById('login-view').classList.add('hidden'); 
      document.getElementById('main-system').classList.remove('hidden'); 
      loadAll().then(() => switchView('boss')); 
    }
  });
});

document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));

document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => { 
    e.preventDefault(); 
    switchView(a.dataset.view); 
    if(window.innerWidth <= 768) toggleSidebar();
  });
});

async function loadAll() {
  const map = {
    products:'products', windows:'contact_windows', customers:'customers', 
    tags:'tags', warehouses:'warehouses', bom:'bom_list', vendors:'vendors', 
    channels:'sales_channels', payments:'payment_methods', expenses:'expenses', 
    subs:'system_subscriptions', banks:'bank_accounts', emps:'employees', 
    locs:'warehouse_locations', expCats:'expense_categories', 
    orders:'orders', purchases:'purchases', warehouseInv:'warehouse_inventory'
  };
  await Promise.all(Object.keys(map).map(k => sb.from(map[k]).select('*').then(r => D[k] = r.data || [])));
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('nav-active', a.dataset.view === v));
  render();
}

function render() {
  const m = document.getElementById('main-content');
  m.innerHTML = '';
  if(currentView==='boss') renderBoss(m);
  else if(currentView==='crm') renderCRM(m);
  else if(currentView==='orders') renderOrders(m);
  else if(currentView==='products') renderProducts(m);
  else if(currentView==='warehouses') renderWarehouses(m);
  else if(currentView==='inventory') renderInventory(m);
  else if(currentView==='purchases') renderPurchases(m);
  else if(currentView==='vendors') renderVendors(m);
  else if(currentView==='finance') renderFinance(m);
  else if(currentView==='banks') renderBanks(m);
  else if(currentView==='settings') renderSettings(m);
}
  // ==================== 老闆查閱（修正指標邏輯 + 批量下載）====================
function renderBoss(c) {
  const [y, m] = bossMonth.split('-').map(Number);
  const rev = D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,o)=>s+(o.total_amount||0),0);
  const pur = D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,p)=>s+(p.total_amount||0),0);
  const exp = D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,e)=>s+(e.amount||0),0);
  const sub = D.subs.filter(s => { if(!s.start_date) return false; const d=new Date(s.start_date); return d.getFullYear()===y && d.getMonth()+1===m; }).reduce((s,x)=>s+(x.amount||0),0);
  const totalCash = D.banks.reduce((s,b)=>s+(b.balance||0),0);
  const monthlyProfit = rev - pur - exp - sub;
  const profitMargin = rev > 0 ? ((monthlyProfit / rev) * 100).toFixed(1) : 0;
  
  // 即將到期的訂閱（30天內）
  const now = new Date();
  const thirtyDaysLater = new Date(now.getTime() + 30*24*60*60*1000);
  const expiringSubs = D.subs.filter(s => {
    if(!s.end_date || s.is_active===false) return false;
    const d = new Date(s.end_date);
    return d >= now && d <= thirtyDaysLater;
  }).sort((a,b) => new Date(a.end_date) - new Date(b.end_date));

  // 計算訂閱客戶數（標籤有"訂閱"的客戶）
  const subTag = D.tags.find(t => t.name.includes('訂閱'));
  const subCustomerCount = subTag ? D.customers.filter(c => {
    // 這裡需要從 customer_tags 表關聯，簡化處理
    return true; // 實際需要查詢 customer_tags
  }).length : 0;

  // 計算訂閱平均月營收（換算成30天基準）
  let subMonthlyRevenue = 0;
  D.subs.filter(s => s.is_active !== false).forEach(s => {
    const days = s.end_date && s.start_date ? Math.ceil((new Date(s.end_date) - new Date(s.start_date)) / (1000*60*60*24)) : 30;
    const dailyRate = (s.amount || 0) / days;
    subMonthlyRevenue += dailyRate * 30;
  });

  c.innerHTML = `
    <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
      <h1 class="text-3xl font-bold">👑 老闆查閱</h1>
      <div class="flex gap-2 flex-wrap">
        <input type="month" value="${bossMonth}" onchange="bossMonth=this.value;render()" class="px-4 py-2 border rounded-lg shadow">
        <button onclick="openDownloadModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-bold">📥 下載單一報表</button>
        <button onclick="downloadAllReports()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-bold">📦 批量下載所有報表</button>
      </div>
    </div>
    
    ${expiringSubs.length > 0 ? `
    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-lg shadow mb-8">
      <h3 class="text-lg font-bold text-yellow-800 mb-2">⚠️ 即將到期的訂閱（30天內）</h3>
      <ul class="list-disc list-inside text-yellow-700">
        ${expiringSubs.map(s => {
          const daysLeft = Math.ceil((new Date(s.end_date) - now) / (1000*60*60*24));
          return `<li><b>${s.name}</b> - ${s.provider || '-'} (剩餘 ${daysLeft} 天，到期：${s.end_date}, 金額：$${(s.amount||0).toLocaleString()})</li>`;
        }).join('')}
      </ul>
    </div>
    ` : '<div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg shadow mb-8"><p class="text-green-800 font-bold">✅ 目前無即將到期的訂閱</p></div>'}
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-green-500 to-green-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月業績</p>
        <p class="text-3xl font-bold mt-2">$${rev.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">訂單數：${D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 單</p>
      </div>
      <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月採購</p>
        <p class="text-3xl font-bold mt-2">$${pur.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">採購單：${D.purchases.filter(p => { const d=new Date(p.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 單</p>
      </div>
      <div class="bg-gradient-to-br from-red-500 to-red-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月開銷(含訂閱)</p>
        <p class="text-3xl font-bold mt-2">$${(exp+sub).toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">費用筆數：${D.expenses.filter(e => { if(!e.payment_date) return false; const d=new Date(e.payment_date); return d.getFullYear()===y && d.getMonth()+1===m; }).length} 筆</p>
      </div>
      <div class="bg-gradient-to-br from-purple-500 to-purple-600 p-6 rounded-xl shadow-lg text-white">
        <p class="text-sm opacity-90">本月淨利</p>
        <p class="text-3xl font-bold mt-2">$${monthlyProfit.toLocaleString()}</p>
        <p class="text-xs mt-2 opacity-75">利潤率：${profitMargin}%</p>
      </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
      <h3 class="text-lg font-bold mb-4 text-gray-800">🏦 公司總資金狀態</h3>
      <p class="text-4xl font-bold text-orange-600 mb-6">現金總額：$${totalCash.toLocaleString()}</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${D.banks.map(b=>`<div class="p-4 bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg border"><p class="font-bold text-lg">${b.account_name}</p><p class="text-gray-500 text-sm">${b.bank_name} - ${b.account_number}</p><p class="text-2xl font-bold text-green-600 mt-2">$${(b.balance||0).toLocaleString()}</p></div>`).join('')}
      </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
      <h3 class="text-lg font-bold mb-4 text-gray-800">📊 營運指標</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 text-center">
        <div class="p-4 bg-blue-50 rounded-lg"><p class="text-2xl font-bold text-blue-600">${D.customers.length}</p><p class="text-gray-500 text-xs mt-1">總客戶數（累積）</p></div>
        <div class="p-4 bg-purple-50 rounded-lg"><p class="text-2xl font-bold text-purple-600">${subCustomerCount}</p><p class="text-gray-500 text-xs mt-1">訂閱客戶數</p></div>
        <div class="p-4 bg-green-50 rounded-lg"><p class="text-2xl font-bold text-green-600">$${Math.round(subMonthlyRevenue).toLocaleString()}</p><p class="text-gray-500 text-xs mt-1">訂閱月營收</p></div>
        <div class="p-4 bg-indigo-50 rounded-lg"><p class="text-2xl font-bold text-indigo-600">${D.orders.filter(o => { const d=new Date(o.created_at); return d.getFullYear()===y && d.getMonth()+1===m; }).length}</p><p class="text-gray-500 text-xs mt-1">本月出貨單</p></div>
        <div class="p-4 bg-yellow-50 rounded-lg"><p class="text-2xl font-bold text-yellow-600">${D.products.filter(p=>{const inv=D.warehouseInv.filter(i=>i.product_id===p.id);return inv.some(i=>{const w=D.warehouses.find(wh=>wh.id===i.warehouse_id);const safe=i.safety_stock||0;return (i.quantity||0)<safe && safe>0;});}).length}</p><p class="text-gray-500 text-xs mt-1">低庫存警示</p></div>
        <div class="p-4 bg-pink-50 rounded-lg"><p class="text-2xl font-bold text-pink-600">${D.products.length}</p><p class="text-gray-500 text-xs mt-1">總產品數</p></div>
      </div>
    </div>
  `;
}

// 批量下載所有報表
window.downloadAllReports = async function() {
  const start = document.querySelector('input[type="month"]')?.value || bossMonth;
  const [y, m] = start.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const endDate = `${start}-${lastDay}`;
  
  const reports = [
    {type: 'orders', name: '訂單出貨明細'},
    {type: 'purchases', name: '採購明細'},
    {type: 'customers', name: '客戶名單'},
    {type: 'finance', name: '收支與訂閱明細'},
    {type: 'profit', name: '業績利潤分析'}
  ];
  
  const wb = XLSX.utils.book_new();
  
  for(const report of reports) {
    const data = await getReportData(report.type, start + '-01', endDate);
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, report.name);
  }
  
  const filename = `養芯健康_完整報表_${start}.xlsx`;
  XLSX.writeFile(wb, filename);
  showAlert('所有報表已打包下載！');
};

async function getReportData(type, start, end) {
  const startDate = new Date(start);
  const endDate = new Date(end);
  endDate.setHours(23, 59, 59, 999);
  
  if(type === 'orders') {
    return D.orders.filter(o => { const d = new Date(o.created_at); return d >= startDate && d <= endDate; }).map(o => {
      const c = D.customers.find(x=>x.id===o.customer_id);
      const ch = D.channels.find(x=>x.id===o.sales_channel_id);
      const pm = D.payments.find(x=>x.id===o.payment_method_id);
      const b = D.banks.find(x=>x.id===o.bank_account_id);
      return { '訂單編號': o.order_no, '日期': new Date(o.created_at).toLocaleDateString('zh-TW'), '客戶': c?.company_name || c?.contact_person || '-', '總金額': o.total_amount, '發票號碼': o.invoice_no || '-', '銷售通路': ch?.name || '-', '付款方式': pm?.name || '-', '入帳帳戶': b?.account_name || '-' };
    });
  } else if(type === 'purchases') {
    return D.purchases.filter(p => { const d = new Date(p.created_at); return d >= startDate && d <= endDate; }).map(p => {
      const v = D.vendors.find(x=>x.id===p.vendor_id);
      const w = D.warehouses.find(x=>x.id===p.warehouse_id);
      return { '採購單號': p.purchase_no, '日期': new Date(p.created_at).toLocaleDateString('zh-TW'), '廠商': v?.name || '-', '總金額': p.total_amount, '類型': p.is_invoice_purchase ? '購買發票' : '一般採購', '入庫倉庫': w?.name || '-' };
    });
  } else if(type === 'customers') {
    return D.customers.map(c => {
      const win = D.windows.find(w=>w.id===c.primary_contact_window_id);
      return { '類型': c.type, '公司名稱': c.company_name || '-', '聯絡人': c.contact_person, '電話': c.phone, '統一編號': c.tax_id || '-', '聯繫窗口': win?.name || c.contact_window_name || '-' };
    });
  } else if(type === 'finance') {
    const expData = D.expenses.filter(e => { if(!e.payment_date) return false; const d = new Date(e.payment_date); return d >= startDate && d <= endDate; }).map(e => { const cat = D.expCats.find(c=>c.id===e.category_id); return { '日期': e.payment_date, '類別': cat?.name || '-', '金額': e.amount, '描述': e.description || '-' }; });
    const subData = D.subs.map(s => ({ '名稱': s.name, '供應商': s.provider || '-', '開始日期': s.start_date || '-', '結束日期': s.end_date || '-', '金額': s.amount }));
    return [...expData, ...subData];
  } else if(type === 'profit') {
    const orders = D.orders.filter(o => { const d = new Date(o.created_at); return d >= startDate && d <= endDate; });
    const purchases = D.purchases.filter(p => { const d = new Date(p.created_at); return d >= startDate && d <= endDate; });
    const expenses = D.expenses.filter(e => { if(!e.payment_date) return false; const d = new Date(e.payment_date); return d >= startDate && d <= endDate; });
    const subs = D.subs.filter(s => { if(!s.start_date) return false; const d = new Date(s.start_date); return d >= startDate && d <= endDate; });
    const totalRev = orders.reduce((s,o)=>s+(o.total_amount||0),0);
    const totalPur = purchases.reduce((s,p)=>s+(p.total_amount||0),0);
    const totalExp = expenses.reduce((s,e)=>s+(e.amount||0),0);
    const totalSub = subs.reduce((s,x)=>s+(x.amount||0),0);
    const profit = totalRev - totalPur - totalExp - totalSub;
    const margin = totalRev > 0 ? ((profit/totalRev)*100).toFixed(2) : 0;
    return [{ '期間': `${start} ~ ${end}`, '總業績': totalRev, '總採購金額': totalPur, '總開銷': totalExp + totalSub, '淨利': profit, '毛利率(%)': margin }];
  }
  return [];
}

      <select id="dl-type" class="w-full px-3 py-2 border rounded">

async function downloadReport() {
  const type = document.getElementById('dl-type').value;
  const start = document.getElementById('dl-start').value;
  const end = document.getElementById('dl-end').value;
  if(!start || !end) return showAlert('請選擇日期範圍！');
  
  const data = await getReportData(type, start, end);
  const filename = `養芯健康_${type}_${start}_${end}.xlsx`;
  downloadExcel(filename, [{name: getReportName(type), data}]);
  showAlert('報表已下載！');
  closeModal();
}

function getReportName(type) {
  const names = {
    'orders': '訂單明細',
    'purchases': '採購明細',
    'customers': '客戶名單',
    'finance': '收支明細',
    'profit': '利潤分析'
  };
  return names[type] || '報表';
}

// 同步聯絡人/電話到地址
window.syncAddrContact = function() {
  const contact = document.getElementById('c-contact')?.value || '';
  const phone = document.getElementById('c-phone')?.value || '';
  document.querySelectorAll('#addr-box .a-recv').forEach(input => {
    if(!input.dataset.userEdited) input.value = contact;
  });
  document.querySelectorAll('#addr-box .a-phone').forEach(input => {
    if(!input.dataset.userEdited) input.value = phone;
  });
};

window.toggleAddr = function(sel) {
  const div = sel.closest('.border');
  const isCvs = sel.value === 'cvs_711' || sel.value === 'cvs_family';
  if(div.querySelector('.a-street')) div.querySelector('.a-street').style.display = isCvs ? 'none' : 'block';
  if(div.querySelector('.a-cvs')) div.querySelector('.a-cvs').style.display = isCvs ? 'grid' : 'none';
};

async function saveCust() {
  const id = document.getElementById('c-id').value;
  const data = {
    type: document.getElementById('c-type').value, 
    company_name: document.getElementById('c-comp').value||null,
    tax_id: document.getElementById('c-tax').value||null, 
    invoice_title: document.getElementById('c-title').value||null,
    contact_person: document.getElementById('c-contact').value, 
    phone: document.getElementById('c-phone').value,
    contact_window_name: document.getElementById('c-winname').value||null, 
    email: document.getElementById('c-email').value||null,
    primary_contact_window_id: document.getElementById('c-win').value||null
  };
  if(!data.contact_person || !data.phone) return showAlert('聯絡人和電話必填！');
  
  try {
    let cid = id;
    if(id) {
      const {error} = await sb.from('customers').update(data).eq('id',id);
      if(error) throw error;
    } else {
      const {data:inserted, error} = await sb.from('customers').insert([data]).select().single();
      if(error) throw error;
      cid = inserted.id;
    }
    
    // 更新標籤
    await sb.from('customer_tags').delete().eq('customer_id', cid);
    const tagIds = Array.from(document.querySelectorAll('.c-tag-cb:checked')).map(cb=>cb.value);
    if(tagIds.length) {
      await sb.from('customer_tags').insert(tagIds.map(tid=>({customer_id:cid, tag_id:tid})));
    }
    
    // 更新地址
    await sb.from('customer_addresses').delete().eq('customer_id', cid);
    const addrs = [];
    document.querySelectorAll('#addr-box > div').forEach(d => {
      const addrData = { 
        customer_id:cid, 
        address_type:d.querySelector('.a-type').value, 
        recipient_name:d.querySelector('.a-recv').value, 
        recipient_phone:d.querySelector('.a-phone').value, 
        street:d.querySelector('.a-addr')?.value||'', 
        cvs_store_name:d.querySelector('.a-cvsname')?.value||'', 
        store_name:d.querySelector('.a-cvsname')?.value||'', 
        cvs_store_address:d.querySelector('.a-cvsaddr')?.value||'', 
        is_default:d.querySelector('.a-def').checked 
      };
      addrs.push(addrData);
    });
    if(addrs.length) {
      await sb.from('customer_addresses').insert(addrs);
    }
    
    showAlert('客戶已儲存！'); 
    closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

window.viewCustDetail = async function(id) {
  try {
    const {data:c, error} = await sb.from('customers').select('*, contact_windows(name), customer_addresses(*)').eq('id',id).single();
    if(error || !c) return showAlert('載入失敗');
    const win = D.windows.find(w=>w.id===c.primary_contact_window_id);
    const html = `<div class="space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><b>類型:</b> ${c.type}</div><div><b>窗口:</b> ${win?.name||c.contact_window_name||'-'}</div><div><b>公司:</b> ${c.company_name||'-'}</div><div><b>統編:</b> ${c.tax_id||'-'}</div><div><b>聯絡人:</b> ${c.contact_person}</div><div><b>電話:</b> ${c.phone}</div><div><b>Email:</b> ${c.email||'-'}</div></div><div class="border-t pt-3"><h3 class="font-bold mb-2">地址</h3>${(c.customer_addresses||[]).map(a=>`<div class="border p-3 rounded mb-2"><b>${a.address_type} ${a.is_default?'(預設)':''}</b><br>${a.recipient_name} ${a.recipient_phone}<br>${a.street||''} ${a.cvs_store_name||''} ${a.cvs_store_address||''}</div>`).join('')||'無'}</div></div>`;
    openModal('客戶詳情', html, null, true);
  } catch(e) {
    showAlert('載入失敗：'+e.message);
  }
};

window.delCust = async function(id) {
  if(!confirm('確定刪除？')) return;
  try {
    await sb.from('customer_addresses').delete().eq('customer_id',id);
    await sb.from('customer_tags').delete().eq('customer_id',id);
    await sb.from('customers').delete().eq('id',id);
    await loadAll(); 
    render();
  } catch(e) {
    showAlert('刪除失敗：'+e.message);
  }
};

function renderOrders(c) {

function renderOrdTable() {
  const [y,m] = (document.getElementById('ord-month')?.value||bossMonth).split('-').map(Number);
  const kw = (document.getElementById('ord-search')?.value||'').toLowerCase();
  const list = D.orders.filter(o => {
    const d = new Date(o.created_at);
    const matchMonth = d.getFullYear()===y && d.getMonth()+1===m;
    const cust = D.customers.find(c=>c.id===o.customer_id);
    const matchKw = !kw || (cust?.company_name||'').toLowerCase().includes(kw) || (cust?.contact_person||'').toLowerCase().includes(kw) || (o.invoice_no||'').toLowerCase().includes(kw);
    return matchMonth && matchKw;
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  
  document.getElementById('ord-tbody').innerHTML = list.map(o => {
    const c = D.customers.find(x=>x.id===o.customer_id);
    return `<tr class="hover:bg-gray-50 border-b"><td class="px-4 py-3 whitespace-nowrap">${new Date(o.created_at).toLocaleDateString()}</td><td class="px-4 py-3">${c?.company_name||c?.contact_person||'-'}</td><td class="px-4 py-3 font-bold">$${(o.total_amount||0).toLocaleString()}</td><td class="px-4 py-3 text-sm">${o.invoice_no||'無'}</td><td class="px-4 py-3 space-x-2 whitespace-nowrap"><button onclick="viewOrdDetail('${o.id}')" class="text-blue-600 text-sm hover:underline">詳情</button><button onclick="openOrdModal('${o.id}')" class="text-green-600 text-sm hover:underline">編輯</button><button onclick="delOrd('${o.id}')" class="text-red-600 text-sm hover:underline">刪除</button></td></tr>`;
  }).join('');
}

window.addOrdItem = function() {

  div.innerHTML = `<div class="flex-1 min-w-[150px]"><select class="o-prod w-full px-3 py-2 border rounded" onchange="if(this.value)this.parentElement.parentElement.querySelector('.o-price').value=this.options[this.selectedIndex].dataset.price;calcOrd()"><option value="">選擇產品</option>${D.products.map(p=>`<option value="${p.id}" data-price="${p.sell_price}">${p.name} ($${p.sell_price})</option>`).join('')}</select></div><div class="w-20"><input type="number" class="o-qty w-full px-3 py-2 border rounded" value="1" min="1" oninput="calcOrd()"></div><div class="w-28"><input type="number" class="o-price w-full px-3 py-2 border rounded" value="0" step="0.01" oninput="calcOrd()"></div><button type="button" onclick="this.parentElement.remove();calcOrd()" class="px-3 py-2 bg-red-100 text-red-600 rounded">X</button>`;
  box.appendChild(div);

window.calcOrd = function() {
  let sub = 0, totalCost = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.o-price').value)||0;
    const qty = parseInt(r.querySelector('.o-qty').value)||0;
    const prodId = r.querySelector('.o-prod').value;
    const prod = D.products.find(p=>p.id===prodId);
    sub += price * qty;
    if(prod) totalCost += (prod.cost_price||0) * qty;
  });
  document.getElementById('o-subtotal').textContent = sub.toLocaleString();
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0, invInfo = '';
  if(invType==='tax') { tax = Math.round(sub * 0.05); invInfo = `稅外加：商品 $${sub.toLocaleString()} + 5% 稅金 $${tax.toLocaleString()} = 客人需付 $${(sub+tax).toLocaleString()}`; document.getElementById('o-tax-row').style.display = 'block'; } 
  else if(invType==='has') { tax = 0; invInfo = `有發票：訂單價格即為含稅價 $${sub.toLocaleString()}`; document.getElementById('o-tax-row').style.display = 'block'; } 
  else { document.getElementById('o-tax-row').style.display = 'none'; }
  document.getElementById('o-tax').textContent = tax.toLocaleString();
  document.getElementById('o-inv-info').textContent = invInfo;
  const shipDisplay = shipType==='pay' ? ship : 0;
  document.getElementById('o-ship-display').textContent = shipDisplay.toLocaleString();
  document.getElementById('o-ship-row').style.display = ship > 0 ? 'block' : 'none';
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);
  const totalCommission = (sub * (channelRate / 100)) + (sub * (paymentRate / 100));
  document.getElementById('o-commission').textContent = totalCommission.toLocaleString();
  document.getElementById('o-commission-row').style.display = totalCommission > 0 ? 'block' : 'none';
  const total = sub + tax + shipDisplay;
  document.getElementById('o-total').textContent = total.toLocaleString();
  const profit = total - totalCost - (shipType==='free'?ship:0) - totalCommission;
  const margin = total > 0 ? ((profit/total)*100).toFixed(1) : 0;
  document.getElementById('o-profit').textContent = profit.toLocaleString();
  document.getElementById('o-margin').textContent = margin;
};

async function saveOrd() {
  const cid = document.getElementById('o-cust').value;
  if(!cid) return showAlert('請選擇客戶！');
  const items = []; let sub = 0;
  document.querySelectorAll('#o-items > div').forEach(r => {
    const pid = r.querySelector('.o-prod').value;
    const q = parseInt(r.querySelector('.o-qty').value)||0;
    const p = parseFloat(r.querySelector('.o-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); sub+=p*q; }
  });
  if(!items.length) return showAlert('請加入產品！');
  const ship = parseFloat(document.getElementById('o-ship').value)||0;
  const shipType = document.getElementById('o-ship-type').value;
  const invType = document.getElementById('o-inv-type').value;
  let tax = 0; if(invType==='tax') tax = Math.round(sub*0.05);
  const shipCharge = shipType==='pay'?ship:0;
  const total = sub + tax + shipCharge;
  const channelSelect = document.getElementById('o-channel');
  const paymentSelect = document.getElementById('o-payment');
  const channelRate = parseFloat(channelSelect.options[channelSelect.selectedIndex]?.dataset.rate || 0);
  const paymentRate = parseFloat(paymentSelect.options[paymentSelect.selectedIndex]?.dataset.rate || 0);
  const data = {
    customer_id:cid, total_amount:total, status:'shipped', order_no:'ORD-'+Date.now(),
    invoice_title:document.getElementById('o-inv-title').value||null, invoice_tax_id:document.getElementById('o-inv-tax').value||null,
    invoice_type:document.getElementById('o-inv-fmt').value, invoice_no:document.getElementById('o-inv-no').value||null,
    tax_handling:invType, tax_amount:tax, shipping_fee:ship, absorbed_shipping_fee:shipType==='free'?ship:0,
    bank_account_id:document.getElementById('o-bank').value||null,
    sales_channel_id:document.getElementById('o-channel').value||null,
    payment_method_id:document.getElementById('o-payment').value||null,
    channel_commission:sub*(channelRate/100), payment_commission:sub*(paymentRate/100),
    shipping_address_detail:JSON.stringify({recv:document.getElementById('o-recv').value, phone:document.getElementById('o-phone').value, addr:document.getElementById('o-addr').value})
  };
  try {
    if(editingId) {
      await sb.from('orders').update(data).eq('id', editingId);
      await sb.from('order_items').delete().eq('order_id', editingId);
    } else {
      const r = await sb.from('orders').insert([data]).select().single();
      editingId = r.data.id;
    }
    await sb.from('order_items').insert(items.map(i=>({...i, order_id:editingId})));
    showAlert('出貨單已儲存！'); 
    closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

window.showWhTab = function(whId) {
  document.querySelectorAll('.wh-tab').forEach(t => { t.className = t.className.replace('bg-blue-600 text-white','bg-gray-200 text-gray-700'); if(t.dataset.wh===whId) t.className = t.className.replace('bg-gray-200 text-gray-700','bg-blue-600 text-white'); });
  const wh = D.warehouses.find(w=>w.id===whId);
  const inv = D.warehouseInv.filter(i=>i.warehouse_id===whId);
  const container = document.getElementById('inv-content');
  
  let rows = D.products.map(p => {
    const wInv = inv.find(i=>i.product_id===p.id);

window.calcPur = function() {
  const isInvoiceMode = document.getElementById('pu-invoice-mode')?.value === 'true';
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const price = parseFloat(r.querySelector('.pu-price').value)||0;
    const qty = parseInt(r.querySelector('.pu-qty').value)||0;
    subtotal += price * qty;
  });
  
  if(isInvoiceMode) {
    // 購買發票模式：顯示商品總價、稅金、需付款（只付稅金）
    const tax = Math.round(subtotal * 0.05);
    document.getElementById('pu-subtotal').textContent = subtotal.toLocaleString();
    document.getElementById('pu-tax').textContent = tax.toLocaleString();
    document.getElementById('pu-total').textContent = tax.toLocaleString();
  } else {
    // 一般採購：輸入多少就是多少
    document.getElementById('pu-total').textContent = subtotal.toLocaleString();
  }
};

async function savePur() {
  const editId = document.getElementById('pu-edit-id')?.value;
  const vendorId = document.getElementById('pu-v').value;
  const isInvoiceMode = document.getElementById('pu-invoice-mode').value === 'true';
  const bankId = document.getElementById('pu-bank').value;
  
  // 收集商品明細
  const items = []; 
  let subtotal = 0;
  document.querySelectorAll('#pu-items > div').forEach(r => {
    const pid = r.querySelector('.pu-prod').value;
    const q = parseInt(r.querySelector('.pu-qty').value)||0;
    const p = parseFloat(r.querySelector('.pu-price').value)||0;
    if(pid && q>0) { items.push({product_id:pid,quantity:q,unit_price:p}); subtotal+=p*q; }
  });
  if(!items.length) return showAlert('請加入採購商品！');
  
  let d = {
    vendor_id: vendorId,
    bank_account_id: bankId||null,
    is_invoice_purchase: isInvoiceMode
  };
  
  if(isInvoiceMode) {
    // 購買發票：只記錄稅金
    const tax = Math.round(subtotal * 0.05);
    d.total_amount = tax;
    d.invoice_amount = tax;
  } else {
    // 一般採購
    d.total_amount = subtotal;
    d.invoice_amount = subtotal;
    d.invoice_no = document.getElementById('pu-inv-no')?.value||null;
    d.warehouse_id = document.getElementById('pu-wh')?.value||null;
  }
  
  try {
    if(editId) {
      // 編輯模式：先刪除舊的明細，再更新
      await sb.from('purchase_items').delete().eq('purchase_id', editId);
      const {error} = await sb.from('purchases').update(d).eq('id', editId);
      if(error) throw error;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:editId})));
    } else {
      // 新增模式
      d.purchase_no = 'PUR-'+Date.now();
      d.status = 'completed';
      const {data:r, error} = await sb.from('purchases').insert([d]).select().single();
      if(error) throw error;
      const purId = r.id;
      await sb.from('purchase_items').insert(items.map(i=>({...i, purchase_id:purId})));
      
      // 一般採購自動入庫
      if(!isInvoiceMode && d.warehouse_id) {
        for(const i of items) {
          const existing = D.warehouseInv.find(w=>w.warehouse_id===d.warehouse_id && w.product_id===i.product_id);
          if(existing) {
            await sb.from('warehouse_inventory').update({quantity: (existing.quantity||0) + i.quantity}).eq('id', existing.id);
          } else {
            await sb.from('warehouse_inventory').insert([{warehouse_id:d.warehouse_id, product_id:i.product_id, quantity:i.quantity, safety_stock:0}]);
          }
          const p = D.products.find(x=>x.id===i.product_id);
          if(p) await sb.from('products').update({current_stock: (p.current_stock||0) + i.quantity}).eq('id', i.product_id);
        }
      }
    }
    
    // 自動扣款
    if(bankId) {
      const b = D.banks.find(x=>x.id===bankId);
      if(b) await sb.from('bank_accounts').update({balance: (b.balance||0) - d.total_amount}).eq('id', bankId);
    }
    
    showAlert(isInvoiceMode?'購買發票已記錄！':'採購已入庫！'); 
    closeModal(); 
    await loadAll(); 
    render();
  } catch(e) { 
    showAlert('失敗：'+e.message); 
  }
}

function renderExpTable() {

    const d = new Date(e.payment_date);
    const cat = D.expCats.find(c=>c.id===e.category_id);
    return d.getFullYear()===y && d.getMonth()+1===m && (!kw || (cat?.name||'').toLowerCase().includes(kw) || (e.description||'').toLowerCase().includes(kw));
